门楼后的街巷继续延伸，晨光自街口斜射进来。主光为清晨的低角度金光，从街口的尽头逆射，照亮蒸笼的白汽、妖物们的毛发边缘与街面的反光；骑楼的阴影呈暖褐色。\n\n空气中弥漫着包子的热气与晨雾，前景众妖的毛发与早点摊的细节清晰，街市纵深虚化；暖金晨光、朱红灯笼与妖物们的多彩衣色交织，整体呈厚涂油画质感的东方妖市早茶，烟火气十足。","zmf_name":"妖市早茶","zmf_batch":23,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s01.webp","id":"ZS-075"},{"bv":"BV1oFpF6QEVk","scene":2,"series":"妖都浮生","title":"狮背远眺","pal":"红金撞色","who":"人物/妖","comp":"狮占左，城横贯","motion":"鬃毛风/旗/云","special":"巨白狮坐骑","note":"靠在狮背上等车，城在下面亮着","prompt_moss":"一名狐女倚白狮背上眺望城郭灯火。主光为暖光。","prompt_zmf":"横画幅中式幻想市井场景，画面右侧一位狐耳的少女慵懒地靠在一头巨大的白狮背上等车，白狮的鬃毛蓬松如雪，她的目光越过街道望向远处的城；城市的街道与建筑在她的下方连绵亮着灯。\n\n狐女的乌黑长发编成长辫，发辫间垂着红色的发绳与金饰，头顶竖着一对赤红的狐耳；她的神态慵懒，一手撑着狮背，一手托着腮，侧脸的轮廓在晨光中柔和。她身着宝蓝与乳白织锦的华服，衣料上金线的纹样华丽，腰间束着红色的锦带垂着长穗，身后露出一角蓬松的橙红狐尾。\n\n白狮的体型如小山：通体雪白的长毛蓬松，鬃毛如白色的浪披落颈后，它的双目温顺地半闭着，同样在等车；它的背上铺着红色的锦垫，锦垫的流苏垂落。街道上：早市的摊位摆满点心与货物，蒸笼的白汽升腾，几只小妖与行人往来；远处的城市沿山谷层层铺开，青瓦的屋顶与朱红的楼阁在晨光里连绵，街道的灯火尚未熄灭。主光为清晨的暖金阳光，从画面左上方照亮白狮的鬃毛、狐女的侧脸与城郭的屋顶；城市的阴影呈青蓝色。\n\n空气中弥漫着晨雾与蒸笼的白汽，前景狐女靠狮的姿态与白狮的鬃毛清晰，城郭层层虚化；雪白狮鬃、宝蓝织锦与暖金晨光三色交织，整体呈厚涂油画质感的东方狮背远眺，慵懒而鲜活。","zmf_name":"狮背远眺等车","zmf_batch":30,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s02.webp","id":"ZS-076"},{"bv":"BV1oFpF6QEVk","scene":3,"series":"妖都浮生","title":"凤羽展翅","pal":"红金撞色","who":"人物/妖","comp":"凤占左半对称展","motion":"羽层翻/金粉/雾","special":"百眼凤羽","note":"凤把翅膀开成一面粉墙","prompt_moss":"一只彩凤展翅如锦屏，一人侧立浅笑。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，庭院之中一只体型巨大的飞蛾妖正对着一位狐耳少女展开双翅：蛾翅完全铺开如一面粉彩的屏风，翅面占满画面的大半，少女扶着栏杆仰望，神情惊叹。\n\n巨蛾的双翅铺展如屏：翅面以米白为底，翅上绘着对称的巨型纹样——外圈为橙红与宝蓝相间的锦簇花纹，中圈为青绿色的枝叶纹，内圈靠近蛾身的部位晕着大片的海蓝与绯红，翅面的鳞粉在阳光下闪着细碎的珠光；翅缘垂着数条长长的尾突，尾突末端挂着绒球状的饰穗。蛾身为毛绒绒的圆柱体，米黄的绒毛蓬松，复眼大而圆，羽状的触角向两侧展开。\n\n右侧的少女乌黑长发编成发辫，发间系着红色的发绳与金饰，头顶竖着一对赤红色的狐耳；她身着宝蓝色织锦的广袖长裙，裙面上织满金银的纹样，红色的腰封垂着长穗；她双手扶着朱红的栏杆，上身微微前倾仰望巨蛾，嘴巴微张，神情惊叹。庭院的朱红栏杆与金色的雕花柱头沿画面下缘排开，栏杆外的绿树红墙虚化。背景为层叠的崖壁城郭与青灰的天空，崖壁上点缀着红色的幡旗与绿树。主光为明亮的白昼天光，从画面左上方照亮翅面的鳞粉珠光、少女的发辫与栏杆的朱红；蛾翅的边缘虚化保持屏风般的整体感。\n\n空气中漂浮着鳞粉与光尘，前景少女仰望的姿态与栏杆清晰，蛾翅铺展的屏风感完整；米白翅面、宝蓝织锦与橙红翅纹对撞，整体呈厚涂油画质感的东方巨蛾展翅，华丽而惊奇。","zmf_name":"巨蛾展翅如屏","zmf_batch":18,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s03.webp","id":"ZS-077"},{"bv":"BV1oFpF6QEVk","scene":4,"series":"妖都浮生","title":"崖边候车","pal":"红金撞色","who":"人物/妖","comp":"人物右，栏杆线","motion":"发带/云涌/远处灯球","special":"崖边站牌","note":"妖界公交站：云海、栏杆、等着的人","prompt_moss":"一名狐女倚栏杆眺崖下云海等车，站牌式构图。主光为暖光。","prompt_zmf":"横画幅中式幻想场景，画面右侧一位蓝色织金广袖裙装的少女倚着崖边木栏杆远眺，背身四分之三侧影入镜，占画面高度约七成，头顶上方悬挂着成串的干花与铃铛饰物。\n\n少女乌黑长发挽成双环发髻，头侧装饰一对赤红色的狐妖耳饰，发间编着多条红色发绳与金色链饰，垂落的发梢随山风轻扬。她身着青蓝色织金广袖长裙，衣缘滚着宝蓝与暖金的纹样，外罩一层白色透纱披帛，纱料边缘泛着细密的光泽；她双手交叠搭在栏杆上，身体微微前倾向远方眺望。\n\n深褐色的木栏杆沿着崖缘延伸，栏柱上挂着成串的风干花束与铜铃，铃下的流苏垂坠。前景的崖台上散落着几只陶罐。远景是铺满画面的云海：层叠的青金色云涛自脚下铺向天际，落日把天际染成暖金与橘红，远山没入焦外的紫金色雾霭，几座飞檐亭台的剪影浮在云缘。\n\n主光为落日的暖金侧逆光，从画面左前方勾亮她的发丝边缘、狐耳轮廓与纱料的透光；云海阴影呈青金色，暗部占约三成。空气中漂浮着金色的光尘与飘絮，前景栏杆木纹与干花清晰，远景云海层层没入焦外；暖金暮色与青蓝织锦对撞，整体呈厚涂油画质感的东方幻想云崖，宁静而悠远。","zmf_name":"云崖候车望霞","zmf_batch":2,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s04.webp","id":"ZS-078"},{"bv":"BV1oFpF6QEVk","scene":5,"series":"妖都浮生","title":"金翼当空","pal":"红金撞色","who":"动物","comp":"翼展横贯上半","motion":"翼影扫/人抬头/幡","special":"金翼巨妖","note":"车没来，先来了一个长金翅膀的","prompt_moss":"一只金翼巨妖掠过站台上空。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，画面中央一座城池的上空悬停着一只体型巨大的蜂形妖兽，它背后一对巨大的金色网状蜂翼完全展开，翼面占据画面的上半部；城中的街道上，一位狐耳少女仰头惊叹，来往的行人纷纷驻足。\n\n巨妖的躯体覆盖着金褐色的绒毛，腹部的环节纹理分明，它的复眼大而圆，弯曲的触角向前伸展，几条多节的蜂足蜷在腹下，足尖挂着成串的灯笼与幡旗；它背后的金色蜂翼为半透明的网状结构，翼面的网纹如细密的织锦，金色的翼脉在阳光下发光，翼展横贯画面的大半，翼面映出天空的蓝与城市的光。\n\n街道上，狐耳少女的乌黑长发编着红绳的发辫，头顶竖着赤红的狐耳；她身着青绿色织锦的广袖长裙，回身仰望巨妖，嘴巴微张，神情惊叹；她身前的街道上行人往来，摊位的幌子与彩旗飘展。城池的建筑为木构的骑楼与高塔，屋檐层层叠叠挂满红色的幡旗与灯笼。主光为明亮的白昼阳光，从画面上方漫射，照亮蜂翼的网状透光、绒毛的边缘与街道的彩色幡旗；建筑的阴影呈暖褐色。\n\n空气中弥漫着浮尘与鳞粉，前景少女仰望的姿态与街道的细节清晰，巨翼保持悬停的宏大气势；金色蜂翼、青绿织锦与朱红幡旗对撞，整体呈厚涂油画质感的东方金翼当空，惊叹而盛大。","zmf_name":"金翼巨妖当空","zmf_batch":29,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s05.webp","id":"ZS-079"},{"bv":"BV1oFpF6QEVk","scene":6,"series":"妖都浮生","title":"巨羽拂城","pal":"红金撞色","who":"无人物","comp":"羽占半屏","motion":"巨羽横扫/城灯","special":"山一样大的羽毛","note":"一片羽毛拂过整座城，像公交进站","prompt_moss":"一片山一样大的羽毛拂过整座城。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，一片巨大的金色羽翼机械正拂过一座云中的城池：羽翼的羽枝为鎏金的机械骨架与半透明的金膜构成，翼尖轻扫过城池的楼顶，城中的楼阁与云浪被翼风推开；画面的左侧，一座驮着金色雕像与仪仗的高台悬在云上，台上的司仪挥旗引导。\n\n巨羽的翼面占据画面的中央偏右：羽枝呈放射状层层排开，每一根羽枝都为鎏金的关节骨架连接着半透明的金色羽膜，羽膜的透光处泛着蜜色的光；羽翼的根部连接着一座机械的驱动机括，机括的齿轮与连杆清晰；翼尖拂过的位置，城中的云被犁出长长的弧线，云浪的泡沫翻卷。\n\n城池沿云崖而建：青瓦与朱红相间的楼阁层层叠叠，楼顶的旗幡与灯笼被翼风掀起翻卷；城下的云海如雪浪翻涌，云涛的受光面泛金。左侧的高台上，金色的神像与仪仗的幡旗林立，台上的司仪身着白衣挥动红旗。天空为澄澈的蓝，大朵的积云悬在翼顶之上。主光为明亮的暖金阳光，从画面右上方照亮羽膜的透光、机括的金枝与城池的屋顶；云海的阴影呈淡青色。\n\n空气中弥漫着被翼风掀起的云絮与光尘，前景羽枝的机械骨架与云浪的弧线清晰，城池与高台层层虚化；鎏金羽翼、朱红楼阁与青蓝云海对撞，整体呈厚涂油画质感的东方巨羽拂城，宏大而灵动。","zmf_name":"巨羽拂城","zmf_batch":39,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s06.webp","id":"ZS-080"},{"bv":"BV1oFpF6QEVk","scene":7,"series":"妖都浮生","title":"驿站息羽","pal":"红金撞色","who":"人物/妖","comp":"人物+兽居中","motion":"兽喘气/衣贴背/雾","special":"驿站、白兽","note":"跑完一程，人和兽一起在驿站喘","prompt_moss":"一人一兽在驿站台阶同歇喘息。主光为暖光。","prompt_zmf":"横画幅中式幻想市井场景，山道旁的驿站里，跑完一程的人和兽一起歇脚喘息：画面中央一头巨大的白鹿形坐骑伏在站台的木棚下喘气，骑手坐在棚边抹汗；旁边一只白胖的猪形妖兽拱着食槽，几只小妖在旁打杂，市集的背景喧腾。\n\n白鹿坐骑的体型如牛犊：通体覆盖乳白与浅褐相间的绒毛，鹿角为珊瑚状的金色枝杈，角上系着红色的缨结；它趴伏在站台的木板上，四肢摊开，舌头微吐喘气，眼睛温顺地半闭；它的鞍具还驮在背上，鞍袋敞开露出货物。旁边的猪形妖兽通体雪白，圆滚滚的身体上斑驳着泥点，它拱在石槽边吃食，尾巴卷成圈。骑手乌黑长发披散，衣着沾满尘土，他坐在棚柱边擦汗，身边的行囊敞开。\n\n驿站为木质的双层棚屋：朱红的立柱与青瓦的顶棚，棚下挂着灯笼与草料袋；站台的石板上散落着草料与水渍。背景的市集沿山道铺开：摊位的幌子、往来的行人与远处的山门牌坊连绵，夏日的绿树与红墙点缀。主光为明亮的白昼阳光，从画面上方漫射，照亮白鹿的绒毛边缘、棚屋的木纹与市集的色彩；棚下的阴影呈暖褐色。\n\n空气中弥漫着牲畜的草料香与市集的浮尘，前景人兽同歇的憨态清晰，背景市集虚化；乳白鹿身、朱红棚柱与青绿远山三色交织，整体呈厚涂油画质感的东方驿站息羽，鲜活而松弛。","zmf_name":"驿站息羽人兽同歇","zmf_batch":37,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s07.webp","id":"ZS-081"},{"bv":"BV1oFpF6QEVk","scene":8,"series":"妖都浮生","title":"角首停靠","pal":"红金撞色","who":"动物","comp":"兽首居中，站台右","motion":"角挑幡/雾/人群迎","special":"角首公交兽","note":"「公交」进站了——是一头长角的巨兽","prompt_moss":"一只长角巨兽抵站停靠，人群迎接。主光为暖光。","prompt_zmf":"横画幅中式幻想市井场景，画面中央一头体型巨大的长角蜗牛妖缓缓驶入站台：蜗牛的螺壳为蓝白红三色的彩绘巨壳，壳上驮着车厢与灯笼，壳口的车门开着，乘客正上下车；站台上的小妖与行人往来，白日的街道热闹。\n\n巨蜗牛的螺壳为巨大的螺旋状，壳面绘着宝蓝、乳白与朱红相间的彩绘纹样，壳面的彩绘如瓷器般光润，壳顶的尖角高高翘起；蜗牛的软体为乳白色，头部的两对触角一支长一支短，长触角的顶端生着圆鼓的眼睛，眼睫眨动的神态憨态可掬；它的腹足宽大，在路面上缓缓蠕动，腹足的边缘垂着帘状的光泽。壳上的车厢为木质的多层车厢，车窗里坐着乘客，车顶插着红旗与幡子，车厢的门开着，一位提篮的大婶正下车，另一位抱包袱的旅人正上车。\n\n站台的地面为青石板，站牌立在路旁；街道的两侧是木质的小楼与摊位，摊位上摆满货物，红灯笼与幡旗自檐下成串垂挂；街上的行人往来：挑担的货郎、牵孩子的妇人、蹲在路边吃包子的脚夫。背景的城门楼与远山清晰，天空湛蓝。主光为明亮的白昼阳光，从画面右上方照亮螺壳的彩绘、软体的质感与街道的市井色彩；街道的阴影呈暖褐色。\n\n空气中弥漫着市井的烟火气与浮尘，前景巨蜗牛的触角眼睛与上下车的乘客清晰，街道纵深虚化；彩绘螺壳、朱红灯笼与青石街道三色交织，整体呈厚涂油画质感的东方巨蜗进站，憨萌而热闹。","zmf_name":"巨蜗公交进站","zmf_batch":31,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s08.webp","id":"ZS-082"},{"bv":"BV1oFpF6QEVk","scene":9,"series":"妖都浮生","title":"毛毛虫专车","pal":"红金撞色","who":"动物","comp":"虫身横贯下缘，人群散点","motion":"千足蠕动/绒毛/旗","special":"毛毛虫公交","note":"妖界公交其实是条毛毛虫，全城排队上","prompt_moss":"一条白毛毛虫巨兽驮满乘客缓行过街。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，画面中央一条巨大的红色节肢毛毛虫状妖兽驮着一座铺满红毯的平台低空飞越城市，平台上立着乘客与堆叠的行李货箱，宛如妖界的公共飞车，街道上行人驻足仰望。\n\n巨虫的身体由十几节圆弧状的深红色甲节连接而成，每一节甲壳上都有金色的环纹与磨损的漆感，节间伸出粗壮的短足悬在空中交替迈步；虫头有一对弯曲的犄角和温和的圆眼，口边垂着金色的辔头缰绳，连接着驾驶位上一位红衣车夫。它背上的平台铺着正红色的长毯，毯上立着七八个乘客：挑担的货郎、抱包袱的妇人、倚栏看风景的书生，平台上还捆着层层叠叠的红色行李箱笼，边缘垂着流苏。\n\n城市为妖界山城：街道两侧是朱红立柱与青灰瓦顶的楼阁，红旗与红幌自楼顶铺展垂落，一座巨大的石拱桥横跨画面下方，桥上行人成列等候登车，桥头立着站牌与灯笼。背景为积雪覆盖的白色山峰与高处悬空的宫殿群，天空呈明亮的青白色。主光为清冷的雪天日光自上方漫射，照亮甲壳的受光弧面、红毯与街道的积雪；阴影呈蓝灰色。\n\n空气中漂浮着细雪与尘埃，前景巨虫的甲节纹理与红毯流苏清晰，远景雪山与宫殿没入焦外；正红、青灰与雪白三色对撞，整体呈厚涂油画质感的东方奇幻交通场景，荒诞而史诗。","zmf_name":"毛毛虫妖界专车","zmf_batch":5,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s09.webp","id":"ZS-083"},{"bv":"BV1oFpF6QEVk","scene":10,"series":"妖都浮生","title":"峡谷穿行","pal":"红金撞色","who":"无人物","comp":"兽车行于峡谷水道","motion":"水花/崖壁/旗","special":"峡谷航道","note":"专车沿峡谷水道穿行","prompt_moss":"专车沿峡谷水道疾行穿行。主光为暖光。","prompt_zmf":"横画幅中式幻想街景，平视略仰机位。画面中一条通体雪白的巨型毛虫状瑞兽自左向右穿过石铺街道，兽身横贯画面中部，兽背驮着一座朱红的抬轿；画面右后方矗立一座高耸的铜红巨塔。\n\n瑞兽的绒毛为乳白色长毛，蓬松分层，光下透出绒尖的金边；身侧排列着数十对短腿，短腿移动时毛丛被压出凹痕，腹部贴近地面投下大片阴影；兽首圆钝，黑色的圆眼与柔软的须毛清晰，口鼻处的绒毛沾着细碎的尘土。\n\n兽背上铺着红底金纹的鞍毯，鞍上架着一座朱红木轿，轿身雕花，轿顶覆黑瓦，四角悬着流苏；轿边坐着两三个极小的执缰者，穿青灰短衣；兽身两侧的行人绕行避让，摊贩的木架与挑担被推到街边。\n\n街道两侧为中式木构铺面：黑瓦檐、赭红木柱、成串的红灯笼与白底黑字的布幌；右后方那座巨塔为铜红色的层叠结构，塔身由一圈圈横向的肋状构件堆叠而成，表面泛着金属的哑光，塔尖隐入画面上缘之外。主光为白昼的暖阳，自画面左上方斜射，照亮兽背的白毛绒尖、轿顶瓦面与巨塔的肋状凸起，投下短促的阴影；街面的石板受光发亮，巷道深处留下冷灰的暗部。\n\n空气中漂浮着被阳光点亮的浮尘，前景石板上散落着几片落叶，远景街市与巨塔底部没入焦外；乳白、铜红与赭金三色对撞，整体呈厚涂油画质感的东方驮兽街行，热闹而奇诡。","zmf_name":"峡谷穿行","zmf_batch":42,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s10.webp","id":"ZS-084"},{"bv":"BV1oFpF6QEVk","scene":11,"series":"妖都浮生","title":"兽群让道","pal":"红金撞色","who":"动物","comp":"群像散点","motion":"群兽转头/尘起","special":"街口礼让","note":"连妖界开车也要礼让行人","prompt_moss":"兽群在街口让道给行人。主光为暖光。","prompt_zmf":"横画幅中式幻想市井大场景，妖界的车马也要礼让行人：画面中央一只巨大的蟹形妖兽驮着满背的楼阁招牌缓缓横行，它的行进方向的前方，几位行人慢悠悠地过街，蟹妖停车让道，街道两侧的摊位与行人围观。\n\n蟹形妖兽的甲壳为深蓝与青绿色，甲壳上驮着三层高的木质楼阁，楼阁的檐角挂着幌子与灯笼，楼阁的窗口探出几位乘客的脑袋张望；蟹妖的八条腿如柱子般在街道上横行，两只大螯一只举着一面书字的木牌，一只夹着一根指挥的小旗；它的眼睛支在长柄上转动，观察着前方的行人。\n\n被礼让的行人们神态各异：一位挑着菜担的老汉慢悠悠地过街，两个孩童蹲在路中央看蟹妖的腿，一位红衣的少女牵着妹妹的手避到路边，他们的神态悠闲，显然见惯不怪。街道两侧的摊位摆满蔬果与杂物，摊主们探身围观；街道的远景处，另一只驮着货箱的巨大甲虫妖兽正沿街驶来，它的背上也挂着红灯笼。主光为明亮的白昼天光，从画面上方漫射，照亮蟹妖的甲壳、楼阁的彩绘与行人的衣料；街道的阴影呈暖褐色。\n\n空气中弥漫着市井的浮尘，前景蟹妖的甲壳纹理与让道的行人清晰，街道纵深虚化；青蓝甲壳、朱红楼阁与暖褐街道三色交织，整体呈厚涂油画质感的东方妖界让道，诙谐而鲜活。","zmf_name":"妖界车让行人","zmf_batch":25,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s11.webp","id":"ZS-085"},{"bv":"BV1oFpF6QEVk","scene":12,"series":"妖都浮生","title":"水畔小憩","pal":"红金撞色","who":"人物群","comp":"人物右下，兽车背景","motion":"水纹/苇/远处车灯","special":"水畔站台","note":"等车间隙在水边坐一会儿","prompt_moss":"两人坐水畔等车间隙歇脚。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，画面中一条巨大的白色鲸骨状生物骨架横贯全画，骨架上缠绕着藤蔓与帆布，被改造成一处依水而建的奇幻集市，两位白衣女子在水边忙碌。\n\n巨鲸般的骨架呈乳白色，肋骨如巨大的穹顶拱廊沿画面自左向右排开，骨架表面爬满青绿色的藤蔓与簇状的贝壳珊瑚，骨架之间用木架、绳网与红蓝帆布搭起层层叠叠的棚屋与摊位，帆布被风吹得鼓起。骨架上方还盘踞着一段覆满海藻的巨大残躯，圆形的孔洞透出后面的天光。水岸边的两位女子皆着月白与朱红相间的古装：一位弯腰在青绿色的浅水中整理网具，另一位蹲在岸边的石阶上分拣成堆的红白色鲜花，花摊上摆满陶罐与花篮。\n\n集市各处分布着小小的人影：摊主、挑夫与提篮的行人，木栈道沿水岸蜿蜒。背景的水面泛着青绿色的波光，倒映着骨架与帆布，右侧远处隐约可见白墙黑瓦的民居与树木。主光为明亮的白昼天光自上方漫射，照亮骨架的受光面、水面波纹与人物的白衣，骨架的阴影投在水岸，暗部呈青灰色。\n\n空气中漂浮着水汽与飞絮，前景水波与花摊清晰，骨架深处与远景民居没入焦外；乳白、青绿与朱红点缀三色交织，整体呈厚涂油画质感的东方巨兽遗骸集市，童话般宏大而充满生活气。","zmf_name":"鲸骨集市","zmf_batch":3,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s12.webp","id":"ZS-086"},{"bv":"BV1oFpF6QEVk","scene":13,"series":"妖都浮生","title":"鲸背码头","pal":"红金撞色","who":"无人物","comp":"鲸背平台横贯","motion":"鲸喷气/人上下/旗","special":"活体码头","note":"码头建在活鲸背上，上下客有条不紊","prompt_moss":"一座活鲸背码头上下客，鲸喷气。主光为暖光。","prompt_zmf":"横画幅中式幻想市井大场景，一座码头的栈桥搭在一条活鲸的背上：鲸背上的木质码头挂着红灯笼与幌子，上下客的行人络绎不绝，码头的下方鲸身入水，鲸首昂起，一位红裙织锦的少女立在码头的另一端。\n\n活鲸的躯体庞大如岛：鲸身为宝蓝与青灰相间的鳞质皮肤，皮肤上覆着珊瑚与贝壳的附着物，鲸首的吻部宽厚，蓝色的眼睛温和，鲸背宽阔平坦，正好承载整座码头；鲸背的码头为朱红与木色相间的多层结构：木栈桥自岸上搭上鲸背，栈桥的桥面为木板，桥上行人上下：提篮的、扛货的、牵孩子的，络绎不绝；码头上的商铺挂着红灯笼与幌子，幌子上写着茶与饭的字样，一位掌勺的厨子探身招呼客人。\n\n红裙少女立在码头的另一端：她乌黑长发垂落，发间的金饰与红绳鲜亮，她身着正红织金的华服，肩头的白纱披帛被海风扬起，她扶着栏杆望向鲸首的方向，神情悠然。背景的海面为青绿色，海浪拍打着鲸身的边缘泛起白沫；远处的雪山与白云相接，天空湛蓝。主光为明亮的白昼阳光，从画面左上方照亮鲸身的鳞质、码头的人影与少女的织锦；海面的阴影呈青蓝色。\n\n空气中弥漫着海风的水汽与市井的烟火，前景栈桥上的行人与鲸首的温顺神情清晰，码头上下客的动线热闹有序；宝蓝鲸身、朱红码头与正红织锦少女三色交织，整体呈厚涂油画质感的东方鲸背码头，恢弘而充满生活气。","zmf_name":"鲸背码头上下客","zmf_batch":32,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s13.webp","id":"ZS-087"},{"bv":"BV1oFpF6QEVk","scene":14,"series":"妖都浮生","title":"长桥卧波","pal":"红金撞色","who":"无人物","comp":"巨兽卧成桥","motion":"水波/兽鳞/人渡","special":"兽身桥","note":"过河不用修桥，兽卧下来就是桥","prompt_moss":"一头巨兽卧下来让行人过河当桥。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，一条青灰色的巨兽卧在碧绿的河面上充当桥梁：它的脊背宽厚平整，背上搭建着一座带帆布顶棚的木质茶棚，行人自兽首方向鱼贯走向兽尾，两岸是青山与村落。\n\n巨兽的体型如小山：皮肤为青灰与赭石相间的疙瘩状鳞甲，甲片上覆着苔藓与水草，背脊隆起处露出几排骨质的甲板，兽首伏在水中，半闭的眼睛温顺，嘴巴微张吐着水泡；它的四肢沉在水下，身躯把河面分成上下两段，泄流的水在兽身两侧打着旋。兽背的茶棚为四根竹柱撑起的米白色帆布顶棚，棚下摆着两张茶桌，几位行人挑着担、提着篮自兽首向兽尾走，一位店小二在棚下擦桌。\n\n河水碧绿如玉，倒映着青山与巨兽的影子，几只竹筏自远处的河面划过，筏上渔人戴着斗笠。两岸的青山陡峭苍翠，山脚下散落着白墙黑瓦的村落与红色的幡旗，右侧岸边的码头上堆着货物。主光为明亮的白昼天光，从画面上方漫射，照亮巨兽鳞甲的受光面、茶棚的帆布与行人的衣料；山体的阴影呈青绿色。\n\n空气中弥漫着河面的水汽与薄雾，前景巨兽的鳞甲疙瘩与背上的行人清晰，远山与村落没入焦外；青灰、碧绿与朱红点缀三色交织，整体呈厚涂油画质感的东方巨兽为桥奇观，恢弘而充满生活气。","zmf_name":"巨兽为桥","zmf_batch":11,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s14.webp","id":"ZS-088"},{"bv":"BV1oFpF6QEVk","scene":15,"series":"妖都浮生","title":"水道漂移","pal":"红金撞色","who":"无人物","comp":"水道斜贯","motion":"滑行水痕/浪/两岸倒退","special":"水上漂移","note":"专车走水道，一路漂移过弯","prompt_moss":"专车走水道一路漂移过弯。主光为暖光。","prompt_zmf":"横画幅中式幻想水道场景，一组蓝色的鳞甲水妖拉着一艘龙首快船在水道里漂移过弯：数只水妖的躯体半沉水中并排拉纤，船身倾斜切过弯道，浪花四溅，船首的白衣人撑篙稳住方向，两岸的水乡灯火倒映。\n\n水妖为青蓝色的鳞甲躯体，每一只都生着宽扁的鳍肢与蜷曲的尾，它们的鳞甲在浪花里泛着水光，鳍肢划水的水花自船舷两侧喷溅成扇形；它们拉纤的缆绳绷得笔直，绳身上挂着水珠。龙首快船的船首为一尊昂起的青龙木雕，龙口的缨络鲜红；船身挂着红色的灯笼与幡旗，船首的白衣人乌黑长发束起，双手撑着长篙，身体后仰压着弯道的离心力，神情专注；船尾还站着两位提灯的侍者。\n\n弯道的水面被船身切出一道白色的弧形浪痕，浪痕的边缘翻卷着泡沫；两岸的水乡挂满红灯笼与木质的水榭，岸边的石阶上泊着小船，暖黄的灯火倒映在水里被浪揉碎。远处的桥楼与水榭沿河排开，夜色初临，天际泛着蓝紫。主光为两岸的暖橙灯火与水面的青蓝反光交织，照亮水妖的鳞甲、浪花的透光与白衣人的侧脸；水面的暗部呈深青色。\n\n空气中弥漫着浓重的水雾与飞沫，前景水妖的鳞甲与浪花清晰，弯道的动势完整；青蓝鳞甲、朱红灯影与暖橙灯火三色交织，整体呈厚涂油画质感的东方水道漂移，动感十足。","zmf_name":"水道漂移过弯","zmf_batch":22,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s15.webp","id":"ZS-089"},{"bv":"BV1oFpF6QEVk","scene":16,"series":"妖都浮生","title":"站台道别","pal":"红金撞色","who":"人物群","comp":"人物右，车窗内回应","motion":"手挥/车动/尘","special":"字幕","note":"上车前最后一记挥手","prompt_moss":"站台上有人向车窗内的妖女挥手道别。主光为暖光。","prompt_zmf":"横画幅中式幻想站台场景，巨兽站台的木栈道上，一位红发的少女正向即将启程的巨兽车挥手道别：她的身后，一头白色的长毛巨兽正驮着车厢缓缓起步，车上的乘客探身回望；站台的木板上散落着货物与行李，一位白发的老人拄杖目送。\n\n少女的乌黑长发垂落腰际，发间系着红色的发带与金饰，头顶竖着一对赤红的狐耳；她的红发在站台的灯下鲜明。她身着水蓝色织金的广袖华服，衣料上织满银金的纹样，肩头的白色纱披帛被车行的罡风掀得飞扬；她的右臂高高扬起挥手，左手的袖口被风扯向车行的方向，她的眼神追随着车上的回望者，笑意与不舍交织。\n\n白色巨兽的躯体覆盖着奶白与棕褐相间的长毛，毛色如云如绒，它的头部圆润憨态，背上的车厢为朱红与木色相间的多层车厢，车厢的窗口挤满回望的乘客；巨兽起步时踏起的尘土与木板屑飞扬。站台为深色的木板栈道，栈道的边上堆着成捆的行李与货箱，站牌的木杆上挂着灯笼；一位白发的老人拄杖站在栈道的另一端目送，他的身旁蹲着一只小兽。背景的站台为木构的双层站楼，站楼的灯笼与幌子层层，更远处是峭壁上的城郭灯火。主光为站台的暖橙灯火与巨兽车灯的白光交织，照亮少女的挥臂、巨兽的绒毛与栈道的木纹；站台的暗部呈蓝紫色，占约三成。\n\n空气中弥漫着车行扬起的尘土与站台的灯晕，前景挥手的少女与起步的巨兽清晰，站楼与峭壁的城郭层层虚化；水蓝织金、赤红狐耳与暖橙灯火对撞，整体呈厚涂油画质感的东方站台道别，温情而惆怅。","zmf_name":"站台最后一记挥手","zmf_batch":34,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s16.webp","id":"ZS-090"},{"bv":"BV1oFpF6QEVk","scene":17,"series":"妖都浮生","title":"林间穿行","pal":"红金撞色","who":"动物","comp":"斜线疾速","motion":"枝叶掠/尘/车身晃","special":"林间快线","note":"末班车抄林间近道","prompt_moss":"一辆多足兽车在林间疾行。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，俯瞰视角：一只巨大的毛茸茸蜂形妖兽驮着满背的货物与轿厢在山城的林间低空穿行，蜂翅的残影模糊，下方是层叠的山城与白色的瀑布，它抄的是林间的近道。\n\n蜂形妖兽的躯体覆盖着金褐色与深棕相间的绒毛，绒毛浓密蓬松，腹部的纹路呈金黄的环节状；它的头部生着两只圆大的复眼与弯曲的触角，细长的蜂足蜷在腹下，两对半透明的翅在高速扇动中只留下模糊的残影与嗡嗡的气流；它背上捆着层层叠叠的货物：红色的轿厢、鼓鼓的麻袋、成捆的锦缎与笼中的家禽，货物用红绳十字捆扎，轿厢的窗帘半掀。\n\n它飞掠的山城依山而建：青灰色的屋顶、朱红的楼阁与悬空的栈道沿山谷铺开，一道白色的瀑布自山崖跌落谷底，谷底的河水泛着青绿；两侧的密林苍翠，林冠的树冠层层起伏。远景的山体上覆着红色的林带与裸露的岩壁，更远处的城郭挂在山腰。主光为明亮的白昼天光，从画面上方漫射，照亮蜂妖的绒毛边缘、货物的红轿与林冠的受光面；山谷的阴影呈青绿色。\n\n空气中弥漫着气流卷起的落叶与浮尘，前景蜂妖的绒毛与捆扎的货物清晰，下方山城与瀑布层层虚化；金褐、朱红与苍绿三色交织，整体呈厚涂油画质感的东方蜂车穿林，奇幻而灵动。","zmf_name":"蜂车穿林","zmf_batch":14,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s17.webp","id":"ZS-091"},{"bv":"BV1oFpF6QEVk","scene":18,"series":"妖都浮生","title":"凤栖站台","pal":"红金撞色","who":"动物","comp":"凤占上半","motion":"羽收/雾散/灯串","special":"凤也搭车","note":"凤也来搭公交，站在顶棚上","prompt_moss":"一只彩凤栖上站台顶棚等车。主光为暖光。","prompt_zmf":"横画幅中式幻想市井场景，一只体型巨大的白蓝色花纹凤鸟落在妖界公交站的顶棚上休息，凤尾垂到站台边缘，站台下的木棚里几位小妖乘客抬头观望，背景为雪山与城郭。\n\n巨凤的躯体覆盖着乳白与宝蓝相间的鳞羽，羽片层层分明，羽缘泛着淡金的光泽；它的尾羽自顶棚垂落，长长的尾羽带着蓝金相间的眼状斑纹，随风轻轻摆动；凤首生有金色的冠羽与飘垂的白色翎须，眼睛温和地半闭着，一副歇脚的悠然姿态；它的爪子紧扣顶棚的横梁，把木棚压得微微下弯。\n\n站台的木棚为朱红的立柱与青灰的瓦顶，棚下挂着站牌与成串的红灯笼；棚内的乘客有提篮的兔耳小妖、背包的狐面少年与打盹的老者，有的抬头望凤，有的淡定等待。站台外的街道上散落着积雪与货物摊位。背景为高耸的蓝白色雪山，山腰间挂着白墙黑瓦的村落与朱红的塔楼，天空湛蓝，几缕薄云。主光为明亮的雪后日光自上方漫射，照亮凤羽的受光面、雪地的反光与棚顶的红柱；阴影呈蓝灰色。\n\n空气中漂浮着细雪与光尘，前景凤爪与棚檐清晰，远景雪山层层虚化；乳白、宝蓝与朱红点缀三色交织，整体呈厚涂油画质感的东方巨凤歇脚奇观，温馨而宏大。","zmf_name":"凤栖公交站台","zmf_batch":9,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s18.webp","id":"ZS-092"},{"bv":"BV1oFpF6QEVk","scene":19,"series":"妖都浮生","title":"锦鳞游弋","pal":"红金撞色","who":"动物","comp":"鱼身横贯","motion":"鳞光/楼灯/水纹","special":"鱼背楼阁","note":"鱼背上的楼跟着水波轻轻晃","prompt_moss":"一条锦鳞巨鱼驮楼游弋，楼在鱼背晃动。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，低角度仰视。画面中央一条巨大的白鳞巨鱼自左向右横贯画面，鱼身驮着一座朱红的楼阁，鱼腹贴近下方的人群，鱼身占画面高度约六成。\n\n巨鱼的鳞片为乳白与浅青，鳞缘泛着珠光，鱼鳍薄而半透，边缘呈羽状散开；鱼头钝圆，鳃盖处的褶皱层叠，鱼眼黑亮，口缘的须膜随水汽轻摆；鱼背的楼阁为朱红的木构，覆黑瓦，檐下挂着红灯笼，栏杆上坐着极小的身影。\n\n画面的下方是一座石砌的长堤，堤上密布着极小的行人身影，衣着青、白、红，正仰头张望；堤边的木桩与缆绳清晰，堤外的水面泛着碎金的光，长堤向画面右侧延伸成一道弧。\n\n背景是黑黢黢的崖壁与层叠的屋檐，崖壁的岩层横向排开，屋檐与红幡自崖间探出；远处的水面没入深青的雾里。主光为斜射的暖金阳光，自画面右上方照亮鱼背的鳞片与楼阁的瓦面，鳞缘透出珠光，鱼鳍的边缘被逆光穿透；崖壁与水面的暗部呈深青，占画面约四成。\n\n空气中弥漫着水汽与浮尘，前景的行人与木桩清晰，远景的崖壁虚化；乳白、朱红与深青三色对撞，整体呈厚涂油画质感的东方锦鳞游弋，奇诡而恢弘。","zmf_name":"锦鳞游弋","zmf_batch":44,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s19.webp","id":"ZS-093"},{"bv":"BV1oFpF6QEVk","scene":20,"series":"妖都浮生","title":"龙脊远影","pal":"红金撞色","who":"动物","comp":"斜线远去构图","motion":"红绸/云裂/远影","special":"龙形远影","note":"龙形巨兽绝尘而去，红绸挂在云上","prompt_moss":"一条龙形巨兽绝尘远去，红绸挂在云上。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，一条白色的龙形巨兽驮着红绸自云海上绝尘而去：巨兽的躯体如巨龙与飞鲸的结合，通体覆盖着白色的羽状鳞甲，它的背脊上铺着红色的绸带与一座小亭，它的尾迹在云海上划出一道金色的光痕。\n\n巨兽的躯体蜿蜒如龙：通体的鳞羽为乳白与淡青相间，鳞羽如凤羽般层层分明，羽缘在阳光下透亮；它的龙首生着一对金色的角冠与飘逸的白须，龙目回望来路；它的背脊上铺着一条长长的正红色绸带，红绸自龙首一路铺到龙尾，绸带上还架着一座小小的金顶凉亭，亭中的乘客凭栏远眺；巨兽的躯体掠过云海，云涛被它的游姿犁开一道金色的沟壑。\n\n云海的浪涛如雪山的群峰，云涛的受光面泛着熔金，背光面呈淡紫灰；巨兽的尾迹在云海上留下一条发光的航道，航道的金色光屑缓缓消散。背景的天空为深邃的蓝，星斗在天顶隐约，云海的边缘与天空的金红线相接。主光为天顶的星光与云海的金光交织，照亮巨兽的鳞羽、红绸的饱和色与云涛的受光面；云海的暗部呈紫灰色。\n\n空气中弥漫着云絮与尾迹的金屑，前景巨兽游去的躯体与背上的红绸凉亭清晰，尾迹的金色航道延向远方；乳白鳞羽、正红绸带与熔金云海对撞，整体呈厚涂油画质感的东方龙脊远影，恢弘而怅然。","zmf_name":"龙形巨兽绝尘去","zmf_batch":35,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s20.webp","id":"ZS-094"},{"bv":"BV1oFpF6QEVk","scene":21,"series":"妖都浮生","title":"挥手作别","pal":"红金撞色","who":"POV","comp":"POV 手前景，人物车窗内","motion":"击掌/车动/发丝","special":"字幕","note":"POV 击掌送别，一句下次见","prompt_moss":"第一人称视角与车上妖女击掌作别。主光为暖光。","prompt_zmf":"横画幅中式幻想宴棚场景，第一人称视角：画面左下方一只手掌自画外伸入，正与画面中央的华服女子隔空击掌送别，女子笑容明媚地扬起手掌迎向那只手，宴棚的彩带与灯笼环绕四周。\n\n女子乌黑长发挽成繁复的高髻，发间簪着金凤簪与红色的绢花，鬓边垂着珠链；她身着红绿金三色织锦的华服，衣身上金线织出凤凰的羽纹，肩头披着红色的披帛，她自铺满锦垫的坐榻上起身半探，扬起的右臂伸向那只迎面而来的手掌，两人掌心即将相触，她眉眼弯成月牙，笑得灿烂，露出细白的牙齿。\n\n第一人称的手自画面左下伸入，手掌向上迎着她的手掌，手背上能看到衣袖的织金纹边。宴棚的顶上垂挂下成百上千条的彩带与细纱幔：银白色、水蓝色与淡金色的纱带如瀑布般自棚顶垂落，风一吹便轻轻荡漾；棚柱上缠着红色的绸带，棚下悬着一盏盏彩绘的灯笼。背景的街市灯火连绵，更远处是层叠的楼阁轮廓。主光为宴棚灯火的暖橙光与纱带的透光交织，照亮女子扬起的脸、织锦的金线与彩带的透明层次；棚内的暗部呈暖褐色。\n\n空气中弥漫着彩带的飘絮与光尘，前景两只即将相击的手掌清晰，背景宴棚层层虚化；正红织锦、银蓝纱带与暖橙灯火三色交织，整体呈厚涂油画质感的东方击掌送别，鲜活而温热。","zmf_name":"击掌送别","zmf_batch":17,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s21.webp","id":"ZS-095"},{"bv":"BV1oFpF6QEVk","scene":22,"series":"妖都浮生","title":"夜航收束","pal":"妖夜橙","who":"无人物","comp":"大远景航船收束","motion":"船灯/浪/星","special":"夜航巨舟","note":"夜航巨舟把灯留在水面上，收束","prompt_moss":"一艘夜航巨舟收束画面，灯留水面。主光为暖光。","prompt_zmf":"横画幅中式幻想夜航场景，收束的构图：一艘巨大的木构夜航船泊在星海之上，船的甲板上一位白裙的女子正在起舞，她的舞姿舒展，船桅上的灯笼串与旗幡在星光下明灭，船舷的朱红绸带垂入星海。\n\n夜航船的甲板为深色的木质，甲板的边缘挂着朱红的绸带与成串的灯笼，灯笼的暖光在星海里映出小小的光晕；船桅高耸，桅杆上的帆已收起，帆桁上挂着一排白色的旗幡与灯串，旗幡在夜风中轻轻翻卷；甲板的中央，白裙的女子正在起舞：她的乌黑长发飞扬，白裙的裙摆旋开，她的一手扬向夜空，一手拈着一只小小的灯盏，舞姿如展翅的白鹤。\n\n船下的星海为深蓝的夜色，星海的星光与船上的灯火交相辉映；船舷外的海面倒映着船身的灯火与星空，倒影被细浪揉碎。背景的夜空为深邃的蓝黑，繁星满天，银河自画面的顶端斜挂而下，银河的星尘如金粉洒落。主光为甲板灯笼的暖橙光与星海的银蓝星光交织，照亮起舞的白裙、船桅的剪影与绸带的翻卷；夜空的暗部呈深蓝黑，占约四成。\n\n空气中弥漫着星尘与夜海的雾气，前景起舞的白裙与甲板的灯串清晰，星海与银河层层铺展；白裙舞姿、朱红绸带与星河夜色对撞，整体呈厚涂油画质感的东方夜航收束，静谧而梦幻。","zmf_name":"夜航巨舟收束","zmf_batch":33,"run":true,"image":"../images/scenes/BV1oFpF6QEVk/s22.webp","id":"ZS-096"},{"bv":"BV1quYm67E14","scene":0,"series":"妖都浮生","title":"初入妖都","pal":"妖夜橙","who":"人物/妖","comp":"人物左 1/3，灯火城门背景","motion":"人流/灯笼串/红绸/狐尾","special":"妖都城门、字幕","note":"狐女站在妖都门口感叹好热闹，身后万妖入城","prompt_moss":"一名狐女立于妖都城门口回望，身后万妖入城灯火通明。主光为暖光。","prompt_zmf":"横画幅中式幻想夜市场景，平视中景。画面中央偏左一位狐耳少女侧身而立，回眸看向画外，身后一条巨大的赤红尾巴自腰后甩出，占画面高度约七成；她的右侧是层叠的妖市与石雕兽像。\n\n她为圆润的鹅蛋脸，眉间一点红钿，眼尾上挑，眼瞳琥珀色，唇色朱红；乌黑长发挽成双鬟，两侧插着红绒花与金步摇，头顶一对赤红狐耳竖起，耳缘的绒毛清晰。\n\n她身着蓝底金纹的交领长袍，领缘与袖口镶着朱红织锦，外罩一层半透明的月白纱衣，纱料的下摆被夜风掀起；腰束红带，垂着长绦；右手抬起贴在胸口。\n\n背景为妖市的街巷：朱红的牌楼、层叠的灯笼、攒动的人影与妖影，暖橙的灯光连成一片；画面右侧立着灰白的石狮与石兽，石面被灯光照出颗粒；街巷深处没入暖褐色的光雾。主光为街市的暖橙灯火，自右后方逆射，勾出狐耳的绒毛金边与纱衣的透光；面部由前方的柔光补亮，暗部呈深蓝。\n\n空气中浮着灯火的暖尘与细小光点，前景的尾巴与衣袖清晰，背景街市虚化；暖橙、宝蓝与正红撞色，整体呈厚涂油画质感的东方妖都初入，喧闹而魅惑。","zmf_name":"初入妖都","zmf_batch":49,"run":true,"image":"../images/scenes/BV1quYm67E14/s00.webp","id":"ZS-097"},{"bv":"BV1quYm67E14","scene":1,"series":"妖都浮生","title":"蛙面掌柜","pal":"红金撞色","who":"动物","comp":"居中特写，灶汽背景","motion":"汤面热气/围裙/鼓腮","special":"蛙面掌柜、大汤锅","note":"蛙面掌柜端上一锅热汤，笑得见牙不见眼","prompt_moss":"一名蛙面大汉捧大汤碗招呼来客，笑得见牙不见眼。主光为暖光。","prompt_zmf":"横画幅中式幻想市井场景，画面中央一位蛙面掌柜双手端着一只巨大的汤锅热气腾腾地递上，咧嘴笑得见牙不见眼；右侧一位狐妖少女低头看着锅中的热汤面，人妖相对，画面温馨热闹。\n\n蛙面掌柜为一只直立行走的巨大青蛙：翠绿色的皮肤光滑带疣，金色的圆眼睛弯成两道缝，宽大的嘴咧到耳根露出白牙，喉囊微微鼓起；他头戴一顶黑色的瓜皮小帽，身着藏青色的粗布短褂与围裙，肩上搭着一条洗得发白的汗巾，粗短的手臂稳稳端着锅沿，红色腰带垂着流苏。\n\n锅中的汤面热气升腾：乳白色的浓汤里卧着金黄的荷包蛋、翠绿的葱花与成缕的面条，热气扭曲了他身后的景物。右侧的狐妖少女乌黑长发编着红绳发辫，头顶一对赤红狐耳，身着蓝白织锦的襦裙，双手拢在袖中微微俯身看汤，神情期待。背景为喧闹的集市：成排的红色幡旗与彩灯自街道上空垂挂，摊位上摆满货物，行人的身影在暖光中往来，远处天光明亮。主光为白昼的暖调天光与锅中热气的暖白漫射，照亮掌柜的皮肤纹理、少女的侧脸与汤面的油光；阴影呈暖褐色。\n\n空气中弥漫着热汤的白汽与浮尘，前景锅沿与汤面的细节清晰，背景集市没入焦外；翠绿、正红与暖白三色交织，整体呈厚涂油画质感的东方市井喜剧场景，热气腾腾的生活气。","zmf_name":"蛙掌柜上汤面","zmf_batch":7,"run":true,"image":"../images/scenes/BV1quYm67E14/s01.webp","id":"ZS-098"},{"bv":"BV1quYm67E14","scene":2,"series":"妖都浮生","title":"灯巷同行","pal":"妖夜橙","who":"人物/妖","comp":"人物左，巷纵深右","motion":"灯笼流光/同行背影/幡","special":"灯笼长巷","note":"和猫妖并肩钻进灯巷，像逛庙会","prompt_moss":"一名狐女与猫妖并肩钻进灯巷闲逛。主光为暖光。","prompt_zmf":"横画幅中式幻想市集场景，画面左侧一位蓝衣狐女与两只小妖并肩钻进灯巷：狐女的背影与蓬松的橙红狐尾在前景，两只小妖——鹿角的少年与圆脸的鼠妖——仰头看着街边摊位，像逛庙会一样热闹。\n\n狐女乌黑长发编成长辫垂至腰际，发辫间编着红绳与金饰，头顶竖着一对赤红的狐耳；她身着宝蓝与月白织锦的宽袖长袍，腰间束红腰封，腰后的橙红色狐尾蓬松垂落，占了前景的一角。鹿角少年头顶生着细长的鹿角，穿米色的短打，背着小布包；鼠妖圆耳圆眼，穿着灰褐的坎肩，它们两个凑在摊位前指指点点。\n\n街道两侧是青绿瓦顶的楼阁，檐下挂满金色的饰件、白色的灯笼与幌子；街边的摊位摆着小食与玩具，摊主在吆喝；一只巨大的蓝白色鲤鱼雕塑自街边的商铺墙上探出，鱼鳞的青蓝色片片分明；街市尽头的人潮往来，暖光融融。主光为白昼的暖金阳光，从画面右上方照亮瓦顶的金饰、狐尾的绒毛与小妖的衣料；街道的阴影呈暖褐色。\n\n空气中弥漫着浮尘与叫卖的热气，前景狐女的背影与两只小妖的鲜活表情清晰，街市纵深虚化；宝蓝织锦、鎏金饰件与青绿瓦顶三色交织，整体呈厚涂油画质感的东方灯巷同行，鲜活而热闹。","zmf_name":"灯巷同行","zmf_batch":21,"run":true,"image":"../images/scenes/BV1quYm67E14/s02.webp","id":"ZS-099"},{"bv":"BV1quYm67E14","scene":3,"series":"妖都浮生","title":"桥上打招","pal":"妖夜橙","who":"人物/妖","comp":"人物居中，桥弧线","motion":"桥下水光/狐尾/对岸人影","special":"多孔石桥","note":"过桥时被熟人喊住，回头挥手","prompt_moss":"一名狐女过桥被熟人叫住回头挥手。主光为暖光。","prompt_zmf":"横画幅中式幻想市集场景，画面中央一位蓝白织锦裙装的狐妖少女站在石桥桥头，回身面向镜头挥手打招呼，全身入镜，笑容明媚。\n\n少女头顶竖着一对棕褐色的狐耳，耳缘乳白；乌黑长发编成发辫盘在脑后，鬓边垂着金饰。她身着宝蓝与月白相间的织锦襦裙，领缘与袖口滚金边，腰间束正红色宽腰封并垂下长长的金色流苏，裙摆上织满金蓝缠枝纹样；她右手高高扬起挥手，左手提着裙摆，腰后一条蓬松的橙红色狐尾微微摆动。\n\n她身后的桥头连接着热闹的妖都集市：左侧桥下是青绿色的水面，水边系着乌篷船；右侧与背景挤满鳞次栉比的木质店铺，挂着红白蓝三色的幌子与成排的红灯笼，白色的巨型鲤鱼雕塑与牌楼高悬，街上挤满了赶集的小小行人身影与几只毛茸茸的白色狐犬。远处店铺没入焦外的暖金色光雾。\n\n主光为明亮的白昼天光，从画面右上方斜射，照亮她的面部、裙面织金纹样与狐尾的毛绒边缘；店铺的阴影落在街道深处，暗部呈暖褐色。空气中漂浮着细小的尘埃，前景裙摆与栏杆清晰，背景街市层层虚化；宝蓝、正红与暖金三色撞色，整体呈厚涂油画质感的东方幻想市集，鲜活而热闹。","zmf_name":"桥头挥手","zmf_batch":3,"run":true,"image":"../images/scenes/BV1quYm67E14/s03.webp","id":"ZS-100"},{"bv":"BV1quYm67E14","scene":4,"series":"妖都浮生","title":"鱼市喧腾","pal":"红金撞色","who":"动物","comp":"满屏摊位群像","motion":"鱼尾拍水/秤杆/人挤人","special":"鱼妖集市","note":"鱼妖的摊子把水都搅沸了","prompt_moss":"鱼妖们在集市翻腾售卖，水面被搅沸。主光为暖光。","prompt_zmf":"横画幅中式幻想市井大场景，一座建在水上的鱼市喧腾热闹：鱼妖的摊子把水都搅沸了，水獭形的鱼贩举着大鱼叫卖，木架的白鱼雕塑探出水面，青绿瓦顶的楼阁沿水而建，一位蓝衣的少女坐在船头看市。\n\n鱼市的摊位沿水而建：木架的摊台上摆满鲜鱼与虾蟹，最大的一条白色鱼形雕塑自水中跃起，鱼身的鳞片刻画生动，鱼口张开喷着水花；一只水獭形的胖鱼贩直立在水中的木台上，双手举着一条大鱼，张着嘴吆喝，它的皮毛湿漉漉的泛光；周围的摊贩与顾客挤挤挨挨：称鱼的、砍价的、提篮的，市声鼎沸。\n\n水面的波纹被鱼市搅得沸腾：浪花拍打着木架的桩脚，水花溅上摊台的鱼身；青绿瓦顶的楼阁沿水岸层层叠起，楼阁的飞檐挂着幌子与灯笼，水上的小船穿梭送客。前景右下，一位蓝衣织锦的少女坐在画舫的船头，她乌黑长发垂落，发间生着赤红的狐耳，她托着腮看鱼市的喧腾，神情悠闲。主光为明亮的白昼阳光，从画面上方漫射，照亮鱼贩的水毛、鱼鳞的银光与楼阁的彩绘；水面的阴影呈青绿色。\n\n空气中弥漫着鱼市的腥甜水汽与喧腾的浪花，前景水獭鱼贩的吆喝与跃起的白鱼雕塑清晰，楼阁与水岸层层虚化；青绿瓦顶、银白鱼光与朱红幌子三色交织，整体呈厚涂油画质感的东方鱼市喧腾，鲜活鼎沸。","zmf_name":"鱼市喧腾水沸","zmf_batch":32,"run":true,"image":"../images/scenes/BV1quYm67E14/s04.webp","id":"ZS-101"},{"bv":"BV1quYm67E14","scene":5,"series":"妖都浮生","title":"桥头片刻","pal":"妖夜橙","who":"人物/妖","comp":"人物右，水面灯影","motion":"水纹碎灯/发丝/远处桨声","special":"水市灯影","note":"倚栏看水，一句独白道破主题","prompt_moss":"一名狐女倚桥栏看水上灯影，垂眸浅笑。主光为暖光。","prompt_zmf":"横画幅中式幻想布市场景，画面中央一位白衣古装女子在布摊前与一只巨大的蓝白色鹤形妖相对而立，鹤妖正低头配合她比对布料，两侧前景各有一位观望的人物。\n\n白衣女子乌黑长发垂腰，发间点缀白色花饰；她身着月白色宽袖长裙，肩头披着蓝金织锦的半臂，双手正托起一匹靛蓝色的织锦布料，比在鹤妖的颈前；布料的缎面上织满银白色的暗纹。鹤妖形似巨大的仙鹤，颈羽呈宝蓝与乳白相间，羽缘泛着金属般的光泽，黄色的喙微张，圆圆的眼睛温和地俯视着她。\n\n左侧前景是一位背对镜头的黑发人物，发间系着赤红色发带，头侧露出一点赤红狐耳，正望向布摊；右侧前景一位蓝衣人倚着摊架。布摊上堆满成卷的绫罗绸缎与针线笸箩，摊架四周挂满垂落的布匹与成串的红灯笼、杏黄幌子，层层叠叠的织物铺满画面两侧。背景的店铺深处没入虚化的暖金色光雾。\n\n主光为白昼的明亮天光自上方漫射，照亮布面的缎面反光、鹤羽的受光边缘与人物白衣；店铺阴影呈暖褐色。空气中漂浮着织物纤维与浮尘，前景悬挂的布幔大幅虚化形成画框；靛蓝、月白与正红织锦三色交织，整体呈厚涂油画质感的东方幻想布市，富丽而鲜活。","zmf_name":"布市鹤妖量衣","zmf_batch":5,"run":true,"image":"../images/scenes/BV1quYm67E14/s05.webp","id":"ZS-102"},{"bv":"BV1quYm67E14","scene":6,"series":"妖都浮生","title":"满城灯火","pal":"妖夜橙","who":"人物群","comp":"大远景，人物右下","motion":"灯川流动/幡/雾","special":"灯河、楼群","note":"整座妖都的灯像河一样淌","prompt_moss":"一名妖女立于高处俯瞰整座妖都的灯河。主光为暖光。","prompt_zmf":"横画幅中式幻想夜景大场景，画面左侧一位白发狐耳的少女扶着城楼的栏杆俯瞰满城：整座妖都的灯火像河流一样在街道间流淌，灯河自城中心向外蔓延，少女的长发与披帛被夜风扬起。\n\n少女乌黑长发垂落及腰，发间的红绳与金饰随夜风轻晃，头顶竖着一对赤红的狐耳；她身着宝蓝与乳白织锦的广袖华服，衣料上金线的纹样华丽，腰后的橙红狐尾蓬松；她双手扶着城楼的栏杆，上身微微前倾俯瞰城池，长发的发梢与披帛向身后飘展。\n\n满城的灯火如河：街道的灯火自城中心的塔楼向外流淌，灯河的主干沿中轴的街道铺开，支流岔入每一条小巷，灯河的暖橙色与街道的青瓦屋顶交错，灯河的边缘点缀着成串的红灯笼与金色的饰件；城中的塔楼挂着巨大的幡旗，幡旗上金色的字样在灯河中若隐若现。城楼的前景栏杆为朱红的雕花木栏，栏柱上挂着两盏红灯笼。主光为满城灯河的暖橙自发光，自下方照亮少女的背影轮廓、狐尾的绒毛与栏杆的雕花；夜空的暗部呈深蓝黑，占约四成。\n\n空气中弥漫着灯河的光晕与夜雾，前景俯瞰的背影与栏杆的雕花清晰，灯河的远端虚化成光斑的河流；暖橙灯河、宝蓝织金与深蓝夜空对撞，整体呈厚涂油画质感的东方妖都灯河，璀璨而盛大。","zmf_name":"妖都灯火如河","zmf_batch":27,"run":true,"image":"../images/scenes/BV1quYm67E14/s06.webp","id":"ZS-103"},{"bv":"BV1quYm67E14","scene":7,"series":"妖都浮生","title":"月妖扑灯","pal":"妖夜橙","who":"动物","comp":"巨蛾展翅占上半","motion":"翅粉洒落/翅拍/灯焰摇","special":"巨蛾妖、翅上月纹","note":"巨蛾妖扑灯，翅上驮着一轮月纹","prompt_moss":"一只巨蛾妖扑向灯楼，翅膀有月纹。主光为暖光。","prompt_zmf":"横画幅中式幻想夜市场景，一只体型巨大的飞蛾妖悬在灯市上空，正扑向街心最大的一盏灯：它的双翅完全展开占据画面上半部，翅面中央驮着一轮发光的满月纹样，画面下方的街道人潮涌动。\n\n巨蛾的翅膀为巨大的双对翅：翅面以月白色为底，绘着宝蓝与朱红相间的流云纹样，翅面的中央一轮乳白色的满月纹发光柔和，月纹四周环绕着淡金色的光晕；翅缘垂着数条长长的尾突，尾突末端膨大成灯芯状的光球；蛾身覆盖着乳白色的绒毛，羽状的触角向后弯曲，复眼映着灯火。它前倾扑向灯火，翅缘扫过的气流吹动了街道上的幡旗。\n\n街道为夜晚的上元灯市：两侧的木质楼阁挂满成排的暖橙灯笼与红白布幌，街心立着一座大灯架，架上最大的那盏灯正是巨蛾扑向的目标，灯火被蛾翼的气流吹得摇曳；街上人潮涌动，画面右下角一位红发少女举着糖葫芦仰头看蛾，摊主的幌子与货担散布街道。主光为灯海的暖橙自发光与蛾翅月纹的冷白光，冷暖交织照亮蛾翼的纹样、人群的顶面与楼阁的飞檐；夜空的暗部呈深蓝黑，占约四成。\n\n空气中弥漫着灯火的光尘与蛾翼扬起的鳞粉，前景少女的仰望与糖葫芦清晰，蛾翅的纹样整体清晰而边缘虚化；月白、宝蓝朱红花纹与暖橙灯海对撞，整体呈厚涂油画质感的东方月蛾扑灯奇观，梦幻而热闹。","zmf_name":"月蛾扑灯","zmf_batch":11,"run":true,"image":"../images/scenes/BV1quYm67E14/s07.webp","id":"ZS-104"},{"bv":"BV1quYm67E14","scene":8,"series":"妖都浮生","title":"狮驼迎面","pal":"妖夜橙","who":"动物","comp":"狮头占左上，人物右","motion":"鬃毛/楼檐铃/糖串","special":"楼里长出的狮头","note":"楼角探出一颗狮子头，冲她憨笑","prompt_moss":"一只狮子头从楼角探出来冲她憨笑。主光为暖光。","prompt_zmf":"横画幅中式幻想夜市场景，画面左上一只体型巨大的绒毛狮子头从木楼的檐角探出，咧嘴憨笑俯视街道，狮头占画面上方约三分之一；右下方一位红发狐妖少女举着糖葫芦回望狮头，两人一妖对视。\n\n巨狮的鬃毛呈浅棕与乳黄相间的蓬松长毛，一根根分明，圆大的琥珀色眼睛弯成月牙，咧开的嘴里露出圆润的牙齿，表情憨厚喜悦；它的前爪搭在雕花的檐角上，把瓦片压得微微下陷。少女乌黑长发间编着红绳发辫，头顶竖着一对赤红色狐耳，身着蓝白织锦的短袄长裙，右手举着一串鲜红的糖葫芦，回头的侧脸带着笑意。\n\n街道为夜晚的上元灯市：两侧的木质茶楼与店铺挤满画面，挂着成排的暖橙灯笼、红蓝布幌与金色饰件；左侧近景一位戴斗笠的摊主举着长竹竿，竿头挑着一面白色的幌子，摊台上铺满糕点与金色糖画；街上挤满小小的行人身影，灯火自街道深处层层铺开，没入焦外的暖橙光雾。\n\n主光为满街灯笼的暖橙自发光，从下方与两侧照亮狮头的绒毛边缘、少女的侧脸与摊主的衣料，绒毛透出金色边缘光；夜空与楼影的暗部呈蓝黑色，占约三成。空气中漂浮着火星与光尘，前景竹竿与幌子清晰锐利，背景街市层层虚化；暖橙、绒黄与蓝黑夜色对撞，整体呈厚涂油画质感的东方上元夜市，温馨而奇妙。","zmf_name":"狮头探楼","zmf_batch":4,"run":true,"image":"../images/scenes/BV1quYm67E14/s08.webp","id":"ZS-105"},{"bv":"BV1quYm67E14","scene":9,"series":"妖都浮生","title":"提灯登楼","pal":"妖夜橙","who":"人物/妖","comp":"人物右，灯河左","motion":"灯焰/衣摆/城灯明灭","special":"高处灯楼","note":"提灯登楼，把整座万妖之城收进眼底","prompt_moss":"一名狐女提灯登楼远眺整座万妖之城。主光为暖光。","prompt_zmf":"横画幅中式幻想夜景场景，画面中央一位蓝白织锦华服的狐女提着灯登上城楼的高台，她一手举着糖葫芦串，回身俯瞰：脚下的万妖之城灯火如星海铺满整幅画面，她的橙红狐尾与长发随夜风扬起，占画面的右侧。\n\n狐女乌黑长发披落及腰，发间的金饰与红绳鲜亮，头顶竖着一对赤红的狐耳；她回眸的眼神明亮，唇边带着笑意。她身着宝蓝与乳白织金的广袖华服：衣料上金线的团纹华丽，红色的腰封垂着长穗，宽大的裙摆铺在城楼的台面上；她的右手举着一串鲜红的糖葫芦，左手提着一盏点亮的白纱灯，灯的暖光映亮她的下颌；她身后橙红色的狐尾蓬松扬起，尾尖的乳白绒毛在灯下透亮。\n\n脚下的妖都灯火如星海：街巷的灯河沿中轴铺展，河灯与街灯连成金色的脉络，成百上千盏灯笼自楼阁的檐下点亮，灯河的支流岔入每条深巷；城中的拱桥与河面映着灯火，浮空的岛屿与悬桥在高处的夜色里连成灯桥。她倚着的城楼栏杆为朱红的雕花木栏，栏头挂着两盏红灯笼。主光为城楼的暖橙灯火，自下方照亮狐女的背影轮廓、狐尾的绒毛边缘与栏杆的雕花；夜空的暗部呈深蓝黑，占约三成。\n\n空气中弥漫着灯河的光晕与夜雾，前景提灯的狐女与倚栏的姿态清晰，妖都的灯海层层虚化至天际；宝蓝织金、橙红狐尾与金色灯海对撞，整体呈厚涂油画质感的东方提灯登楼，璀璨而鲜活。","zmf_name":"提灯登楼瞰妖都","zmf_batch":39,"run":true,"image":"../images/scenes/BV1quYm67E14/s09.webp","id":"ZS-106"},{"bv":"BV12Puz6LEAB","scene":0,"series":"九霄神游","title":"天梯独行","pal":"仙金蓝","who":"人物","comp":"中心纵深，天梯居中","motion":"云海翻/流星划/衣摆","special":"登天天梯","note":"红衣背影沿天梯走向云端宫城","prompt_moss":"一条宽阔的白色玉阶从画面底部中央笔直延伸至画面上方深处的中式宫殿群，标准一点透视。台阶两侧对称排列多层递减的平台，每层平台边缘有白玉栏杆和灯笼柱，栏杆柱头有云纹雕饰。台阶上零星散布着微小的石雕。一名身穿深红色交领长袍的人背对观者站在台阶最底端中央，黑发束起，发梢随风向左飘动，身体微微前倾呈向上行走的姿态，人物约占画面高度的十分之一。深蓝色天空中一颗拖着白色尾迹的流星自左上方划向右下。台阶两侧的层叠平台之间涌起大团乳金色的厚积云，云被上方光照亮成蜜金色，云底部则沉入阴影。远处台阶尽头的宫殿有朱红色墙面、黑色琉璃瓦飞檐和鎏金宝顶。画面上缘的天空是清澈的湛蓝色。厚涂油画质感，笔触厚重如刮刀堆叠，云层如颜料流动，色彩以暖金、奶白、深红与湛蓝构成，暗部集中在云层底部与台阶侧面。","prompt_zmf":"横画幅中式仙域大场景，正面对称的大纵深构图。画面中央一条宽阔天梯自下缘直上，尽头没入云端的金色宫门；梯面中央一位红衣人的背影，占画面高度约两成。\n\n天梯的阶面由青蓝琉璃砖铺成，砖缝泛着细金的光；两侧白石栏板与望柱层层退远，望柱头上摆着青铜香炉与灯盏，栏外的石雕瑞兽守着阶沿。\n\n红衣人的深红袍摆垂到阶面，被风掀开一角；长发挽起，发间只一支素簪；背影单薄笔直，影子斜压在前一级台阶上。\n\n梯的两侧是翻涌的云海，云涛自阶沿涌起，受光面乳白浅粉，暗部淡金灰紫；云深处浮着层叠宫城，檐角与金顶探出云面；天空为深青蓝，右上斜过一颗拖着白亮尾迹的彗星，云团被余晖染成橙红与粉。主光为宫门方向的暖金与天顶落日余光，逆射照亮阶面琉璃与栏板边缘，红衣人被勾出一道亮边；云海暗部呈灰紫。\n\n空气中弥漫云絮与光尘，前景栏板清晰，宫门与云海层层虚化；青蓝、深红与暖金对撞，整体呈厚涂油画质感的天梯独行，孤高而壮阔。","zmf_name":"天梯独行","zmf_batch":47,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s00.webp","id":"ZS-107"},{"bv":"BV12Puz6LEAB","scene":1,"series":"九霄神游","title":"海市庭院","pal":"仙金蓝","who":"无人物","comp":"横铺全景","motion":"水面金波/花瓣落/楼影","special":"水上宫城庭院","note":"水上宫城庭院，落花铺金海","prompt_moss":"对称构图的仙宫庭院场景，视角略微俯视。画面左右两侧对称排列着朱红立柱、黑瓦飞檐、鎏金宝顶的中式宫殿建筑，檐角翘起，斗拱彩绘。巨大的青绿色古松从左右两侧的宫殿后探出，虬曲的枝干横过画面上方，深绿色的针叶与红色的花枝交织。白玉地面从画面底部延伸至中央，如镜面反射天光与建筑倒影，地面和石缝间铺满深红色花瓣，几片花瓣悬停在空中。庭院中央的远处有四五个穿青色、白色、米色、红色古装长袍的微小身影，人物约占画面高度的十五分之一。他们的身后一缕暖金色的光束从云层缝隙射下。天空是金色与乳白交织的厚积云，被上方光照亮。画面左下角有一个穿深青色长袍的人背影，走在花瓣铺满的小径上。厚涂油画质感，笔触厚重，色彩以暖金、朱红、青绿、白玉与深蓝构成，暗部集中在两侧建筑底部的阴影中。","prompt_zmf":"横画幅中式仙域庭院，平视中景。画面中段是一座临水的宫城庭院，朱红的廊柱与金黄的歇山顶自两侧向纵深排开，地面的浅水铺成一面镜；庭院深处站着两三个极小的身影。\n\n庭院的地面为深色的石砖，覆着一层薄水，水面映出檐角与柱影；水面上浮着成片的花瓣与落叶，颜色偏红金。\n\n两侧的殿宇为重檐歇山，覆盖金黄琉璃瓦，檐下斗拱层叠，梁枋绘着青绿的彩画；廊柱为正红，柱础为白石；廊下挂着成串的红灯笼，灯下垂着长穗；庭院的尽头是一座三开间的门楼，门内的光暖而深。\n\n背景为远处的海面与云层：海面泛着金，云层被夕光染成浅粉与乳白；庭院的边缘栽着成排的树，树冠深绿，枝叶间漏下细碎的光。主光为左前方的低位暖阳，斜射入庭院，照亮柱身、瓦面与水面的反光，把花瓣染成金红；廊下的阴影呈深青灰。\n\n空气中弥漫着水汽与浮动的花瓣，前景的水面与花瓣清晰，深处的门楼与海面虚化；金黄、朱红与深青交织，整体呈厚涂油画质感的东方海市庭院，华贵而空寂。","zmf_name":"海市庭院","zmf_batch":49,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s01.webp","id":"ZS-108"},{"bv":"BV12Puz6LEAB","scene":2,"series":"九霄神游","title":"仙舟泊岸","pal":"仙金蓝","who":"无人物","comp":"大景，舟楼居中","motion":"红帆幔鼓/云涌","special":"红帆仙舟、云港","note":"红帆仙舟泊在云港，帆幔层叠","prompt_moss":"一艘巨型多层结构的中国仙舟在云海之上航行，占据画面中央至上方的大半区域。舟身有至少四层递减的楼阁结构，每层都有朱红色墙面、金色雕花窗棂、黑色琉璃瓦飞檐和鎏金宝顶。巨大的白色与红色绸帆自桅杆鼓风展开，绸面上有暗纹。船首装饰着鎏金的龙首雕塑，龙须与龙角细节清晰。船舷两侧挂有红色灯笼串与彩绸。舟身下方大团乳金色的厚积云翻涌，云层底部有阴影。数个穿白色长袍的微小人影立于舟身下方的白石平台上仰望。深蓝色的天空在仙舟上方。厚涂油画质感，建筑细节密度极高——瓦当、斗拱、栏杆、窗棂、彩绸均清晰可辨。色彩以暖金、朱红、钴蓝与奶白构成。","prompt_zmf":"横画幅中式幻想大场景，一艘多层楼阁的巨型仙舟泊在云港的码头：舟身如一座横置的宫殿，朱红的船舷与金色的雕花窗棂华丽，主桅的红帆与层叠的白帆幔展开，帆影与云交融；云港的白玉栈道上，几位迎客的行人驻足仰望。\n\n仙舟的舟身庞大：船舷为朱红与金色相间的多层楼阁结构，每一层的飞檐与雕花窗棂精致，船首的鎏金龙首昂起，龙口的缨络垂落；主帆为正红色的织锦巨帆，帆面上金线的龙纹在光下流转，主帆之后，层叠的米白色帆幔如云翼般展开，帆幔的边缘垂着流苏；舟身的幡旗与红灯笼成串，旗影翻卷。\n\n云港的栈道为白玉铺就，栈道的栏杆与柱头的鎏金饰件精致，栈上几位长袍的行人驻足仰望仙舟，他们的身影在巨舟的尺度下极小；栈道尽头的小亭立在云缘。云海铺满画面的下半部：云涛如雪浪堆叠，受光面泛金；背景的天空为澄澈的蓝，大朵的积云自仙舟的帆后铺向天际。主光为明亮的暖金阳光，从画面右上方照亮红帆的织锦反光、舟身的金饰与云海的受光面；云海的阴影呈淡青色。\n\n空气中弥漫着云絮与帆幔的飘带，前景栈道的人物与仙舟的船首清晰，帆幔的层次铺满上半部；正红巨帆、鎏金楼阁与金白云海对撞，整体呈厚涂油画质感的东方仙舟泊岸，恢弘而华美。","zmf_name":"红帆仙舟泊云港","zmf_batch":39,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s02.webp","id":"ZS-109"},{"bv":"BV12Puz6LEAB","scene":3,"series":"九霄神游","title":"挥帚扫云","pal":"仙金蓝","who":"人物","comp":"人物右上，云海平铺","motion":"帚过云痕/落叶卷/袍带","special":"扫云帚","note":"仙人在天上挥帚扫云，扫出金痕","prompt_moss":"一名白发年长仙人站在宽阔的白玉平台上，身体微微前倾，双手握一把长柄棕毛扫帚，正在扫拢地面上散落的深红色花瓣。他的白色长袍极为宽大，袍身有蓝色与朱红色的宽条纹装饰，袍尾拖曳在身后铺满地面，与散落的花瓣混在一起。他的白发极长，与白袍融合在一起向身后延展。画面右侧一株巨大的青绿古松从嶙峋的褐金色岩壁上横生探出，树冠伸入画面上方，松针密集。远处几座金顶仙阁浮于云海之上。左侧天空挂着一弯细月。湛蓝的天空占画面上部，白云被暖光染成金色。白玉地面如镜面反射天光，与散落的红花瓣交织。厚涂油画质感，笔触极为厚重，云与袍都像颜料刮刀堆叠，色彩以暖金、朱红、青绿、白玉与深蓝构成，暗部集中在松树树冠的深青绿中。","prompt_zmf":"横画幅中式仙域场景，平视中景。画面中央一位白衣仙人侧身立于白玉台面，双手握着一把长柄的大扫帚，正把台面上堆积的红叶与花瓣向前扫开；扫地扬起的花叶在台面上拖出一条红蓝交织的长痕，占画面宽度约四成。\n\n仙人为清瘦的老者，须发皆白，长髯垂至胸前，头戴一顶小冠，眉眼低垂专注；他的头微侧，视线落在帚尖前方的花叶堆上。\n\n他身着米白与淡金相间的宽袖道袍，袍面有暗纹，袖口与下摆滚青蓝的缘边，外披一层半透明的白纱；衣摆被风与动作带起，扫帚的竹柄泛着温润的浅褐，帚头的枝条散开成扇形，正压住一堆深红的花瓣。\n\n台面为汉白玉的方砖，砖缝被磨得发亮，散落的花瓣在受光处呈朱红与橙黄；画面右侧一段虬曲的古树枝干自画面上缘垂下，枝叶间挂着红果；左侧远处是金瓦的殿顶与廊柱，台下翻涌着云海，云涛的受光面为乳白，暗部为浅金与青灰，尽头的天空透出一轮昏白的日轮。主光为高位偏右的逆光，自云海方向射来，把仙人的轮廓、帚头的枝条与飞散的花瓣勾成亮边，衣摆的白纱透出暖光；台面与云海的阴影呈青灰蓝。\n\n空气中弥漫着被扫起的细碎花瓣与浮尘，前景的帚头与花痕清晰，远处的殿顶与云海虚化；米白、朱红与青蓝三色交织，整体呈厚涂油画质感的东方挥帚扫云，清旷而从容。","zmf_name":"挥帚扫云","zmf_batch":45,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s03.webp","id":"ZS-110"},{"bv":"BV12Puz6LEAB","scene":4,"series":"九霄神游","title":"舒袖迎风","pal":"仙金蓝","who":"人物","comp":"居中人像，双袖展开","motion":"双袖/红裙摆/落花","special":"黄裙红抹胸","note":"黄衣仙娥张开双袖，闭眼迎风","prompt_moss":"一名身穿米白色广袖仙裙的年轻女子站在云海之上，双臂向两侧完全展开，双目轻闭，头微微后仰，神情陶醉。她的黑发盘成发髻，插着花形发簪和垂坠耳饰。裙子是齐胸制式，胸前有珊瑚红与金线刺绣的抹胸，腰间系着带珠串的红色腰封，宽大的白色纱袖向两侧完全展开，袖口透过光线可见纤细的织物纹理。右上方伸入一枝红色花枝，几片花瓣悬停空中。背景为湛蓝天空与暖金色的云海，云被左侧来的暖光染成奶油色。人物占画面约六成高。写实风格，色彩以奶白、蜜金、珊瑚红与深蓝构成。","prompt_zmf":"横画幅中式仙侠场景，画面中央一位黄白纱裙的仙娥立于云海之上，双臂向两侧完全张开舒展广袖，头微微后仰，双眼轻闭，正迎着罡风舒袖起舞，全身入镜。\n\n仙娥乌黑长发盘成古典发髻，鬓边垂着金色流苏步摇与耳坠，发饰在风中轻晃；她双眼轻闭，下颌微扬，神情沉醉而舒展。她身着鹅黄色与乳白相间的多层纱裙：最外层是宽大如翼的广袖纱幔，被高空罡风向两侧完全吹开，如鹤翼般铺展占据画面中部；内层是正红色的织金抹胸与束腰，腰带上垂着金色的佩饰，裙裾层层翻卷，纱料边缘半透明，被风吹得猎猎作响。\n\n她脚下是铺满画面的金色云海，云涛受光面呈暖金色，背光面呈淡紫灰色；画面右上角一枝盛开的粉红樱花自画外斜垂入画，几片红色花瓣飘落在她身侧的空中。主光为低角度的暖金阳光，从画面右侧照亮她的面颊、纱幔的透光与云海的受光边缘，纱料被逆光打透，泛起金色的光晕；暗部呈紫灰色，柔和过渡。\n\n空气中飘着樱花瓣与金色光尘，前景舒展的纱袖边缘清晰而带有运动感，远处云海没入焦外；暖金、鹅黄与正红三色交织，整体呈厚涂油画质感的东方云端舞者，轻盈而华美。","zmf_name":"云海舒袖迎风","zmf_batch":5,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s04.webp","id":"ZS-111"},{"bv":"BV12Puz6LEAB","scene":5,"series":"九霄神游","title":"羽扇轻摇","pal":"仙金蓝","who":"人物","comp":"居中偏右特写","motion":"羽扇/金箔浮/发丝","special":"白羽扇、金箔","note":"蓝衣仙娥执羽扇坐金箔堆，云上闲居","prompt_moss":"一名蓝金色刺绣外衫的年轻女子跪坐于仙宫水池边的白石台阶上，双手捧着一只白鹤，白鹤展翅，颈部弯向她的掌心。她黑发盘起，垂眸注视鹤群。她身旁的水池里有莲花和荷叶，水面反射金色与红色的宫殿倒影。背景是鎏金立柱与朱红宫墙，几座石雕仙人立在水池边缘。水中还有一只白鹤游过。她穿米白与蓝金刺绣的长裙，腰间系红色丝带。主光为右上方的暖金色日光，水面反射金色光斑。人物占画面右侧约五成。","prompt_zmf":"横画幅中式仙侠生活场景，画面中央一位蓝衣的仙娥坐在堆积如山的金箔堆上，手中的白色羽扇轻轻摇着，一只白鹤落在她的臂弯边相伴；金箔的池畔波光粼粼，背景是朱红立柱与金色的宫城。\n\n仙娥乌黑长发挽成低髻，发间垂着金色的步摇与珍珠流苏；她的侧脸恬静，眼睑低垂，唇色淡红，神情闲适。她身着宝蓝色织金的广袖华服：衣身上织满金色的团花纹样，肩头披着红白相间的披帛，披帛的一角垂入金箔的池中；她半坐半倚在金箔堆上，手中的羽扇半开，扇面的白色羽毛根根分明，扇柄缠着金丝。\n\n金箔堆如起伏的丘陵，箔面的金色波光粼粼，每一片金箔都如鱼鳞般反射着阳光；一只白鹤立在池畔的浅水中梳理羽毛，另一只白鹤自画面左上飞过，翅影掠过水面；池畔的红柱上缠着金色的绸带，柱顶的宝珠发光。背景的宫城金顶辉煌，朱红的立柱与金顶的殿宇沿池排开，宫城的倒影落在金箔的池面上。主光为明亮的暖金阳光，从画面右上方照亮金箔的波光、蓝衣的金线与羽扇的白羽；池面的暗部呈金褐色。\n\n空气中弥漫着金箔的碎光与羽絮，前景羽扇与白鹤的互动清晰，宫城与金箔池层层虚化；宝蓝织金、鎏金箔池与白羽扇三色交织，整体呈厚涂油画质感的东方羽扇轻摇，闲适而华贵。","zmf_name":"羽扇轻摇金箔居","zmf_batch":29,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s05.webp","id":"ZS-112"},{"bv":"BV12Puz6LEAB","scene":6,"series":"九霄神游","title":"晒书云台","pal":"仙金蓝","who":"人物群","comp":"人物左，字画纷飞右","motion":"纸页纷飞/袖拂/云走","special":"晒书卷、飞页","note":"云台上晒书，字画页漫天飞","prompt_moss":"一名身穿蓝底红绿花卉刺绣宽袖外衫的年轻女子坐在云上海平台上，面前铺开一张巨大的宣纸卷轴，纸上写满黑色毛笔字。她头戴金色花形发簪与垂坠耳饰，低头阅读，唇带笑意。身后有其他穿古装的人影虚化。天空中纸片与卷轴随风飘散，其中一张巨大的白纸悬在半空。背景是湛蓝天空与白云，上方有飞檐的一角。她的手边有一个铜制香炉和毛笔。主光为明亮的日光自上方照来。","prompt_zmf":"横画幅中式仙侠生活场景，云台上的一位华服女子正在翻晒书页：她乌黑长发垂落，发间的金饰在阳光下闪烁，她双手捧着一张写满字迹的书页迎风展开，书页的金字在阳光下清晰；她的四周，无数书页在半空中随风飞舞，云台之下是翻涌的云海。\n\n女子乌黑长发挽成古典的发髻，发间的金饰华丽；她的侧脸恬美，眼睑低垂看着手中的书页，唇角带着浅笑。她身着彩色织锦的宽袖华服：衣料上织满红蓝金相间的花卉纹样，肩头的披帛自肩后扬起；她双手捧着一张泛黄的书页，书页上的毛笔字迹在阳光下清晰，纸页的边缘微卷；她的身旁的云台上，成摞的书册与卷轴摊开晾晒，书页被风一页页掀起。\n\n半空中的书页漫天飞舞：数十张书页在风中翻飞，纸页的白与字迹的金黑交错，飞舞的书页层次远近分明；云台为木质的平台，台沿的雕花与悬挂的书夹精致。背景的天空湛蓝，云海在台下的远处翻涌，几座浮空的宫殿自云隙探出。主光为明亮的暖金阳光，自画面右上方照亮书页的字迹、她的织锦与飞舞的纸页；云海的阴影呈淡青色。\n\n空气中弥漫着纸页的飘絮与墨香的光尘，前景捧书页的双手与漫天飞舞的书页清晰，云海与浮宫虚化；彩色织锦、泛黄书页与湛蓝天空对撞，整体呈厚涂油画质感的东方云台晒书，明媚而雅致。","zmf_name":"云台晒书页漫天","zmf_batch":35,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s06.webp","id":"ZS-113"},{"bv":"BV12Puz6LEAB","scene":7,"series":"九霄神游","title":"临卷低吟","pal":"红金撞色","who":"人物","comp":"特写，金饰背景","motion":"卷轴展开/发丝/光斑","special":"金饰少年","note":"金饰少年捧卷细读，睫毛垂影","prompt_moss":"一名身穿深蓝底金纹宽袖长袍的年轻男子坐在云上海平台的边缘，手中捧着一卷打开的青绿色星图，卷上有金色纹样。他黑发半束，发簪固定，几缕碎发垂在脸侧，目光低垂看图。背景是虚化的云上仙市——金色灯串、红色幡旗、蓝白石阶。他身后有鎏金柱与飞檐。主光为左侧暖金色侧光，照亮他的面部轮廓与袍面纹理，暗部为深蓝与暖褐。","prompt_zmf":"横画幅中式古典人像特写，画面中央一位金饰少年捧着一卷展开的书卷细读，他乌黑长发束成半披的发式，发间的金饰与红色的绳结点缀，他垂着的长睫毛在眼下投出细密的阴影，神情沉静。\n\n少年的乌黑长发半束半披，发间插着一支白玉簪，簪尾垂着红色的绳结与金色的流苏；他的侧脸清俊，鼻梁高挺，长而密的睫毛在眼下投出扇形的阴影，唇色红润微抿，神情专注。他身着墨绿与金色织锦的宽袖华服：衣料的锦缎上织满金色的团花纹样，领缘与袖口滚着米白的毛边，肩头的披帛堆在臂弯；他的双手捧着一卷展开的书卷，卷面的字迹与插画清晰，他的目光落在卷上的某一处。\n\n背景为暖金色的虚化：金色灯串的光斑层层铺开，灯笼的暖橙与金色饰件的光点交织成 bokeh 的光海，光海中隐约可见市集的人影与摊位的轮廓。主光为暖金的自然光，自画面右上方照亮他的侧脸、发饰的金光与书卷的纸面；少年的衣料暗部呈墨绿与金色。\n\n空气中漂浮着金色的光斑与浮尘，前景捧卷的手部与垂睫的侧影清晰，背景光海大幅虚化；墨绿金锦、白玉发簪与暖金光海三色交织，整体呈厚涂油画质感的东方少年捧卷，沉静而华贵。","zmf_name":"金饰少年捧卷","zmf_batch":28,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s07.webp","id":"ZS-114"},{"bv":"BV12Puz6LEAB","scene":8,"series":"九霄神游","title":"御剑穿瀑","pal":"仙金蓝","who":"人物","comp":"斜线飞行构图","motion":"瀑水分流/衣带后掠/云开","special":"御剑、穿瀑","note":"白衣御剑穿瀑而过，一分为二的水幕","prompt_moss":"一名身穿深青与金色宽袖长袍的年轻男子坐于云上宫殿的白玉台阶上，手中捧着一册翻开的书卷，另一手执毛笔正在书写。他身后有鎏金柱头与红灯笼串，远景是虚化的云上仙市与走动的人影。他黑发半束，簪着银色发簪，面部被左侧来的暖光部分照亮，右侧没入阴影。他面前铺着宣纸，旁边有一个铜制笔洗和砚台。","prompt_zmf":"横画幅中式仙侠场景，画面中央一位白衣的御剑者足踏长剑，自一道倾天巨瀑的正面穿瀑而过，瀑布的水幕在他身前一分为二，被剑气分开的水流如两幅白绸向两侧卷开，他的长裙长袖在身后铺展成数米长的彩带。\n\n御剑者的乌黑长发高束成马尾，发梢被瀑布的水雾打湿；他身着月白色的广袖长裙式长袍，腰间束着深青色的腰带，腰带上悬着玉佩；他侧身立于剑上，一手扶着剑柄，剑身斜指前方，一手向后舒展保持平衡；他的裙摆与两条广袖在穿瀑的气流中向后铺展，白色的衣料与水雾交融，衣缘的淡青与宝蓝的衬里在翻卷处露出色彩。\n\n巨瀑自画面上方的崖顶整体倾泻，水流如巨大的白绸垂落，被他的剑气从中分开：两股分开的水流向左右两侧卷成弧形的浪墙，浪墙的边缘翻卷着白色的泡沫，瀑布的轰鸣化作漫天的水雾；他穿过的洞口边缘还挂着未散的水珠与水膜，水膜在他身后缓缓合拢。云海在瀑布的下方铺开，云涛的白与浪的白连成一片。主光为清透的蓝白天光，从画面上方照亮水幕的半透明质感、他的白衣与衣料的衬里色彩；瀑布两侧的崖壁暗部呈青灰色。\n\n空气中弥漫着浓重的水雾与飞沫，前景人物的御剑姿态与分开的水幕清晰，瀑布保持整体的倾泻气势；月白、青蓝水幕与淡青衬里三色交织，整体呈厚涂油画质感的东方御剑穿瀑，飘逸而勇决。","zmf_name":"御剑穿瀑","zmf_batch":17,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s08.webp","id":"ZS-115"},{"bv":"BV12Puz6LEAB","scene":9,"series":"九霄神游","title":"灯下翻卷","pal":"红金撞色","who":"人物","comp":"中景，灯串背景","motion":"卷页翻/灯焰/发丝","special":"画舫灯串","note":"画舫灯下翻看长卷","prompt_moss":"仙宫台阶的俯瞰特写：白玉台阶自画面右下向左上延伸，每级台阶的白玉面铺满散落的深红色花瓣，花瓣间夹杂着少量金色叶子。台阶两侧的白玉栏板有云纹浮雕。左侧远处的台阶边缘有一个穿深色衣袍的微小身影在扫花瓣。主光为左侧的暖金色阳光，在台阶上形成明暗交替的条纹。","prompt_zmf":"横画幅中式古典场景，画面中央一位蓝金织锦华服的女子坐在云舫的长案前翻看一卷长卷，她的双手正把长卷展开，卷面上的字画随展开的弧度铺陈；云舫的上方，云层裂开一道天窗，天光把整座云上城池照亮。\n\n女子乌黑长发垂落，发间簪着金色的花钗与红色的绢花，鬓边的碎发被天光映亮；她低垂眼帘，长睫毛清晰，唇色朱红，神情专注而恬静。她身着宝蓝与金色织锦的宽袖华服：外衫的织锦上金线绣着缠枝纹样，领缘与袖口滚着正红色的边，红色的腰封垂着长穗，裙摆铺展在长案边；她的右手按着卷轴的一端，左手轻轻推展卷面，动作轻柔。\n\n长案为朱红的木案，案上摆着文房器物与果盘；案旁的窗棂雕花精致。云舫悬在云海之上：舷外的云海铺满画面的下部，云上城池的楼阁群在天窗的光下层次分明，城中的悬桥与灯火连绵，天光自云窗的裂隙洒下形成光柱。主光为天窗的天光与画舫灯火的暖光交织，照亮她的侧脸、织锦的金线与卷面的字画；舫内暗部呈红褐色。\n\n空气中弥漫着云絮与光尘，前景翻卷的长卷与专注的神态清晰，云上城池虚化成层次的光海；宝蓝织金、乳白天光与朱红点缀三色交织，整体呈厚涂油画质感的东方云舫翻卷，恬静而华贵。","zmf_name":"云舫灯下翻长卷","zmf_batch":33,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s09.webp","id":"ZS-116"},{"bv":"BV12Puz6LEAB","scene":10,"series":"九霄神游","title":"醉卧云锦","pal":"红金撞色","who":"人物","comp":"横陈特写","motion":"锦缎起伏/花瓣落/呼吸级起伏","special":"云锦醉卧","note":"粉衣醉卧云锦，花瓣自肩头滑落","prompt_moss":"一名年轻女子坐在仙宫雕花木窗边，窗外是白云与蓝天。她穿蓝底红绿花卉刺绣的宽袖外衫，黑发盘起插金色花簪，垂眸对着一面铜镜整理鬓发，左手执一把木梳。她的面前铺着一张宣纸，纸上有墨迹。窗外云海流动，远处隐约有仙阁轮廓。主光为窗外自照的日光，照亮她的侧面。","prompt_zmf":"横画幅中式古典人像场景，俯拍视角：一位粉衣的女子醉卧在铺满云锦与花瓣的水面上，她双目轻闭，神情安然如睡，粉色的花瓣自她的肩头滑落，水面倒映着她沉睡的容颜与铺展的云锦。\n\n女子的乌黑长发铺满水面，发丝在水里散开如墨色的绸；她双目轻阖，睫毛低垂，唇色朱红，脸颊的白皙在水中透着粉润；她身着粉金色与青绿色相间的薄纱裙，纱料的透光如凝脂，裙摆的纱层在水里铺展成云锦的花纹，红色的花瓣自她的肩头滑落，落在水面上随波轻漾；她的双手交叠放在胸前，指尖沾着水珠，一只玉镯滑落至腕间。\n\n水面的质感清透：水色的青蓝与云锦的金粉交错，水下的云石与游鱼隐约可见；几尾红色的锦鲤自她的裙摆边游过，鱼尾搅碎了水面的静；她的身侧漂着一枝红梅的花枝，枝头的花瓣落在水面。主光为柔和的暖金阳光，自上方透过水面照亮她的容颜、纱裙的透光与水色的清透；水面的反光把她的轮廓镶上金边。\n\n空气中弥漫着花瓣与水面的光斑，俯拍的构图完整呈现醉卧的容颜与铺展的云锦；粉金纱裙、青绿水色与红瓣点缀三色交织，整体呈厚涂油画质感的东方醉卧云锦，安然如梦。","zmf_name":"醉卧云锦花瓣落","zmf_batch":36,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s10.webp","id":"ZS-117"},{"bv":"BV12Puz6LEAB","scene":11,"series":"九霄神游","title":"抚剑坐崖","pal":"仙金蓝","who":"人物","comp":"三分，剑横膝上","motion":"云奔/长发/剑穗","special":"膝上横剑","note":"白衣抱剑坐崖，长发与云同色","prompt_moss":"一名身穿深蓝底金纹宽袖长袍的年轻男子站在云上仙市的长街中，面向左侧的一间金色门面店铺，手中握着一卷蓝色封面的书。他黑发半束，侧脸被右侧来的暖光照亮。街道两侧有鎏金柱头、红色幡旗、灯笼串，远处虚化的行人走动。地面是白石板，缝隙间有金色光斑。","prompt_zmf":"横画幅中式仙侠人像场景，画面中央一位白衣的长发女子抱剑坐在云海的崖沿上，她乌黑的长发与身后的云海同色交融，怀中的长剑横陈膝上，残阳的光把她的白衣染成暖金。\n\n女子的乌黑长发披落腰际，长发被残阳染成金褐色，发梢与身后的云层几乎融为一体；她低垂眼帘，望着怀中的长剑，神情沉静略带倦意，唇色淡红。她身着月白色织金的宽袖长袍，衣料的皱褶在光下柔和，肩头披着一条青蓝色的织锦披帛，披帛上绣着白色的星纹；长剑横陈在她的膝上，剑鞘为深色，剑柄的缠绳与剑镡清晰，她的双手交叠搭在剑鞘上。\n\n她坐着的崖沿为白玉与白石相间的平台，平台的边缘层叠如阶梯，崖下是铺满画面的云海，云涛的金色受光面与紫灰的背光面交错；远处的云海尽头，一点橙红色的落日悬在天际，落日的光柱把云层染成暖金色。主光为低角度的残阳金光，从画面左侧照亮她的侧脸、白衣的皱褶与剑鞘的质感；云海的暗部呈紫灰色。\n\n空气中弥漫着云絮与残阳的光尘，前景抱剑的姿态与垂落的长发清晰，云海与落日虚化；月白衣袍、金褐长发与紫灰云海三色交织，整体呈厚涂油画质感的东方抱剑坐崖，沉静而苍茫。","zmf_name":"抱剑坐崖","zmf_batch":25,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s11.webp","id":"ZS-118"},{"bv":"BV12Puz6LEAB","scene":12,"series":"九霄神游","title":"金环云眼","pal":"仙金蓝","who":"无人物","comp":"居中环奇观","motion":"环内云旋/塔影","special":"云之瞳环","note":"云海卷成一只巨大的金色眼睛","prompt_moss":"一名白发的年长仙人坐在云上平台的书案前，左手执一卷古书，右手执毛笔正在批注。他面前有砚台、笔洗和几卷竹简。他白发白须，穿深青与米白相间的宽袖长袍。背景是虚化的云上宫殿与绿瓦屋顶，一盏红灯笼挂在檐角。主光为左侧的暖光照亮书案与他的侧脸。","prompt_zmf":"横画幅中式幻想奇观大场景，云海卷成一只巨大的金色眼睛：云环的金色瞳孔中盘着星云的旋涡，环外的云海翻涌如浪，环下的大道上，一位白衣人背身独步走向环眼，大道的两侧与远方，朱红的宫城连绵铺展。\n\n云眼巨大：金色的环为云絮凝成的眼眶，眶内的星云旋涡自中心向外盘旋，旋涡的臂带着星光的蓝与金红的焰色，旋涡的中心为深邃的星核；环的外缘撕出金色的云纱，云纱如睫毛般垂落。环下的大道为白玉的长道，道面平整如镜，映着云眼的倒影；白衣人独行的背影在大道的中段，他的广袖与发梢被风吹起，步态从容。\n\n大道的两侧与远方，宫城连绵：朱红的殿宇、金顶的楼阁与白玉的栏杆沿大道铺向天际，宫殿的飞檐上挂满灯笼与幡旗，远处的宫城没入云海的雾霭中；大道的下缘，云海的浪涛拍打着道沿，云浪的白沫翻卷。主光为云眼星云的自发光与白昼的金光交织，照亮云环的金边、大道的白玉与宫城的金顶；云眼的旋涡深蓝，暗部呈深蓝紫。\n\n空气中弥漫着云絮与星尘，前景独行的背影与大道的倒影清晰，云眼保持完整的环形旋涡动势；金色云眼、星云旋涡与朱红宫城对撞，整体呈厚涂油画质感的东方金环云眼，超现实而恢弘。","zmf_name":"金环云眼悬宫城","zmf_batch":31,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s12.webp","id":"ZS-119"},{"bv":"BV12Puz6LEAB","scene":13,"series":"九霄神游","title":"亭台望轮","pal":"仙金蓝","who":"人物","comp":"人物左，轮右","motion":"轮辐缓转/红绸/云","special":"巨型金轮法器","note":"仙亭之上仰望缓缓转动的金轮","prompt_moss":"两名身穿古装的年轻女子在云上平台的白玉栏杆边对坐，中间的石桌上放着一副棋盘和棋子罐。左边的女子穿蓝底红绿刺绣的外衫，右边的穿白色宽袖长裙。她们中间放着棋盘，棋局正在进行。主光为明亮的日光，背景云海与远处的仙阁虚化。","prompt_zmf":"横画幅中式幻想奇观场景，画面下方一座白玉的仙亭之中，一位白衣的女子凭栏仰望：她的头顶上空，一条巨大的织锦云绸横贯天际，绸缎的末端卷动着一个缓缓转动的金色巨轮，金轮的辐条间流转着云絮与光。\n\n仙亭的白玉栏杆沿云台铺展，亭顶的宝珠与檐角的铜铃精致；白衣女子乌黑长发垂落腰际，发间簪着素色的玉簪，她身着月白色的广袖长裙，肩头的青蓝色披帛被高空的罡风吹起，她扶着栏杆仰头望向金轮，神情惊叹而虔诚。\n\n金色的巨轮悬在天际：轮身由云絮与金色的光带凝成，轮辐之间流转着雪白的云絮与金红的焰纹，巨轮缓缓转动，转动的轨迹在云层上犁出环形的沟壑；轮的边缘垂落数条白色的云绦，云绦如流苏般在风中摆动。织锦的云绸为宝蓝底色上织着鎏金的龙纹与红色的流云，绸面自画面左上铺展到右侧的殿宇之间，绸面的褶皱如山峦起伏。背景的云海铺满画面下半部，云涛受光面泛金。主光为明亮的暖金阳光与金轮的自发光交织，照亮云绸的金纹、她的白衣与云海的受光面；云绸的背光面呈青蓝色。\n\n空气中弥漫着云絮与金色的光屑，前景凭栏仰望的女子与白玉栏杆清晰，金轮保持转动的整体动势、轮辐虚化；鎏金云绸、月白纱裙与焰色金轮对撞，整体呈厚涂油画质感的东方亭台望轮，华美而神圣。","zmf_name":"仙亭仰望转金轮","zmf_batch":37,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s13.webp","id":"ZS-120"},{"bv":"BV12Puz6LEAB","scene":14,"series":"九霄神游","title":"万灯辇驾","pal":"红金撞色","who":"人物","comp":"灯轮居右占半","motion":"灯焰齐燃/辇饰转/衣飞","special":"万灯轮辇","note":"万盏灯组成的车轮辇驾缓缓转过","prompt_moss":"一尊巨大的金色法轮悬浮在云海之上，法轮有多个环形辐条和鎏金纹样，中心为一座小型白玉佛塔。法轮下方是金色与乳白交织的云海，远处有仙阁轮廓。一名穿红白长袍的女子站在法轮下方的平台上仰望。主光为法轮自身散发的暗金光晕。","prompt_zmf":"横画幅中式幻想大场景，画面中央一座巨大的环形车轮状辇驾悬在半空：车轮的每一根金色辐条之间都吊着一盏灯笼与一个乘人的吊篮，车轮缓缓转动，下方是红瓦连绵的城楼群与翻涌的云海，右下角一位黑衣人的背影立于高台仰望。\n\n巨轮的轮毂与辐条为鎏金的金属质感，辐条间悬挂着成百上千盏暖橙色的灯笼，灯串沿轮缘连成光环；部分辐条末端吊着朱红色的乘篮，篮中人影隐约；轮心是一座多层金顶的塔台，塔台上飘着白色的旗幡。巨轮的下半部分沉入云海，云涛自轮缘漫过，被灯光染成暖金色。\n\n下方的城楼群沿山势铺开：红瓦的飞檐层层叠叠，街道的灯火点点，城墙的轮廓在暮色中厚重。右下角的高台边缘，黑衣人的背影剪影凭栏仰望巨轮，衣摆与发梢被高空的罡风扬起。背景的天空为青蓝与暖金交界的黄昏，几缕金色的云带横过天际。主光为巨轮万灯的自发光与黄昏天光，照亮轮辐的金色、灯笼的光晕与城楼的受光瓦面；暗部呈蓝黑色，占约四成。\n\n空气中弥漫着灯火的光尘与云雾，前景巨轮的辐条与吊篮细节清晰，下方城群与云海没入焦外；熔金、朱红与青蓝对撞，整体呈厚涂油画质感的东方万灯巨轮奇观，恢弘而梦幻。","zmf_name":"万灯辇驾","zmf_batch":9,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s14.webp","id":"ZS-121"},{"bv":"BV12Puz6LEAB","scene":15,"series":"九霄神游","title":"丹炉喷薄","pal":"红金撞色","who":"无人物","comp":"鼎居中，火柱冲天","motion":"双火柱喷薄/鼎纹/云烧","special":"喷火丹鼎","note":"丹鼎朝天喷出双股火柱","prompt_moss":"一座云上仙宫的喷泉广场：中央一座鎏金丹炉喷出高耸的金色火柱，火光在云中形成大片光晕。广场两侧有白玉栏杆和石雕仙人。一名穿红白长袍的人立于广场边缘仰望。主光为丹炉喷出的金色火光。","prompt_zmf":"横画幅中式神话炼丹奇观，画面中央一座巨大的青铜丹鼎悬在云台之上，鼎底朝天喷出两股笔直的火焰柱，火柱自鼎底冲天而上贯穿云层；鼎座为一圈环形的朱红法坛，坛上火焰的涡流环绕。\n\n丹鼎的鼎身为青金色，鼎腹的浮雕纹样繁复，鼎耳如双龙攀附，鼎身的表面映着火光泛着赤金；鼎底的两股火焰柱如双龙升天，火焰的根部为炽白，中段为熔金，顶端散成漫天的火星与金红色的云焰；火柱把周围的云层烧出两个巨大的洞，洞缘的云被染成橙金色。鼎座为环形的朱红法坛，坛面的符文发光，坛缘的火焰涡流环绕着坛身旋转，坛上的小小人影执礼而立。\n\n法坛的四周，云海铺满画面的下半部，云涛自坛缘向四周铺展，云层的受光面被火光染成金红；远景的天空为湛蓝与火红交界，几座悬空的殿宇轮廓在云隙间浮现。主光为双火柱的自发光，自画面中央辐射，照亮鼎身的浮雕、法坛的符文与云层的受光面；云海的暗部呈深红褐。\n\n空气中弥漫着火星与灼热的云雾，前景法坛的符文与人影清晰，双火柱保持笔直冲天的动势、顶端虚化；熔金火柱、青金丹鼎与朱红法坛对撞，整体呈厚涂油画质感的东方丹炉喷薄，恢弘而炽烈。","zmf_name":"丹炉喷薄双火柱","zmf_batch":22,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s15.webp","id":"ZS-122"},{"bv":"BV12Puz6LEAB","scene":16,"series":"九霄神游","title":"水车云镇","pal":"仙金蓝","who":"人物","comp":"水车占左，人物右下","motion":"巨轮水车转/水花/镇灯火","special":"云上水车镇","note":"云上的小镇靠巨型水车运转","prompt_moss":"一座云上水车城镇：巨大的木质水车轮在建筑旁缓缓转动，水花溅起。建筑有朱红墙面与青瓦屋顶。一名穿红白长袍的人站在水车旁仰望。主光为明亮的日光。","prompt_zmf":"横画幅中式幻想大场景，云海之上的一座小镇依靠一座巨大的红色水车轮运转：车轮自左侧的楼阁间升起，轮缘喷涌出金色的水花，画面右侧一位白衣黑长马尾的女子背身俯瞰全镇，构图开阔。\n\n巨大的水车轮为暗红色的轮辐结构，轮缘的每一个水斗都盛满水，转到高处倾泻而下，金色的水流在阳光下划出弧线，砸进下方的引水渠，溅起大片白色的水雾与虹光；轮轴与支架为包浆的深色木构，缠绕着红色的绳结与幡旗。小镇沿云缘层叠而建：红瓦的楼阁、白玉的栏杆与朱红的桥梁在楼群间穿行，几条悬空的引水渠把水送向各处，水渠边挂着成串的红灯笼。\n\n右侧前景，白衣女子背身立于崖边的平台上，乌黑的长马尾垂落腰际，发梢被水雾打湿微卷；她身着月白广袖长裙，肩头披着淡青色的纱帛，双手扶着栏杆俯瞰小镇，身形安静。背景的云海铺满画面下半部，远处蓝天澄澈，几座金顶的塔楼自云中探出。主光为明亮的暖金阳光，从画面左上方照亮水花的虹彩、楼阁的受光瓦面与她的白衣；阴影呈淡青色。\n\n空气中弥漫着水雾与虹光微粒，前景水车的轮辐与水流清晰，远处小镇与云海层层虚化；暗红、暖金与月白三色交织，整体呈厚涂油画质感的东方云上水镇，鲜活而壮丽。","zmf_name":"水车云镇","zmf_batch":11,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s16.webp","id":"ZS-123"},{"bv":"BV12Puz6LEAB","scene":17,"series":"九霄神游","title":"青鳞出渊","pal":"仙金蓝","who":"动物","comp":"鱼跃弧线居中","motion":"水花爆开/鳞光/云散","special":"巨鱼跃海","note":"青鳞巨鱼跃出云海，城郭为底","prompt_moss":"青鳞巨鱼自云海中跃出水面，鱼身呈蓝青色带金纹，水花四溅。一条较小的鱼伴随跃出。背景是虚化的云上城郭与暖色天空。主光为日光自右上。","prompt_zmf":"横画幅中式仙域奇观大场景，高空俯视。画面中央一条青鳞巨鱼自一道湍急的水渠中腾跃而起，鱼身弯成弧线，水花向两侧炸开；水渠自画面上缘直贯下方，两侧是白石的长桥与层叠的殿宇。\n\n巨鱼的鳞片为青绿与乳白相间，鳞缘泛着珠光的白边，背部深、腹部浅，鱼鳍薄而半透、边缘呈羽状；鱼首钝圆，鳃盖的褶皱层叠，跃起时口缘张开，水珠自鳞面滚落成串。\n\n水渠的两岸各起一座汉白玉的拱桥，桥面铺方石，红色立柱与石栏沿桥身排开，桥洞下是深蓝的急流与翻卷的白沫；桥的中央是一座白石的圆顶亭阁，亭身的立柱与檐口被阳光照亮，阁下有水帘层叠垂落。\n\n远景为层叠的宫城与雪白的山崖，殿宇的金顶与朱柱沿岸排开，山崖的石壁被云雾截断，云海在低处铺展成片；画面的右下角有一条细小的廊桥，桥上散着极小的行人身影。主光为高位的暖金阳光，自画面右上方洒落，照亮鱼背的鳞片、桥面的白玉与水花的飞沫，水面在逆光里泛着金；崖壁的暗部呈青灰。\n\n空气中弥漫着水汽与飞散的水沫，前景的鱼身与水花清晰，远处的宫城与山崖虚化；青绿、白玉与暖金三色交织，整体呈厚涂油画质感的东方青鳞出渊，浩大而灵动。","zmf_name":"青鳞出渊","zmf_batch":46,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s17.webp","id":"ZS-124"},{"bv":"BV12Puz6LEAB","scene":18,"series":"九霄神游","title":"鲸跃翻浪","pal":"仙金蓝","who":"动物","comp":"鲸占右半","motion":"浪墙碎裂/水沫/鳞光","special":"腾空鲸跃","note":"巨鲸翻腾，浪墙随势立起","prompt_moss":"一头蓝白色的巨鲸从云海中跃起，鲸身弯成弧线，水花自鲸身飞溅。背景是云上城郭的暖色屋顶。主光为日光。","prompt_zmf":"横画幅中式幻想大场景，一头巨鲸自海面翻腾跃起，庞大的躯体弓成一道弧线，浪墙随着它的动势立起如山，鲸背上还驮着一座云中的楼阁城郭，成群的海鸥绕着鲸身飞翔。\n\n巨鲸的躯体为青蓝色与乳白相间的鳞甲，甲片层层分明，鳞缘泛着水光与金色的阳光反射；它的腹部乳白，胸鳍舒展，尾鳍扬起拍打着立起的浪墙，溅起漫天白色的水花与泡沫；它的眼眸温和，大张的口中喷出白色的雾气。鲸背上的城郭为白墙金顶的楼阁群，沿鲸脊层层排布，楼阁间飘着红色的幡旗，最高处的塔楼直入云端。\n\n立起的浪墙呈半透明的青绿色，浪壁的弧面被阳光照透，浪尖翻卷着白色的泡沫花；海面自浪墙向四周铺开，波光粼粼。背景为晴朗的天空：大朵的积云悬在天际，云隙间斜射下金色的光柱，远处海天相接处隐约可见更多的岛城轮廓。主光为明亮的暖金阳光，从画面右上方照亮鲸鳞的受光弧面、浪墙的透光与城郭的金顶；浪墙背光面呈青灰蓝。\n\n空气中弥漫着水花与海雾，前景鲸鳞与浪花的细节清晰，远处海天虚化；青蓝、乳白与熔金三色交织，整体呈厚涂油画质感的东方巨鲸跃海奇观，磅礴而华美。","zmf_name":"鲸跃翻浪","zmf_batch":14,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s18.webp","id":"ZS-125"},{"bv":"BV12Puz6LEAB","scene":19,"series":"九霄神游","title":"金水拖痕","pal":"仙金蓝","who":"无人物","comp":"满屏水面纹理","motion":"金色水痕拉伸/日光","special":"金色水路","note":"日光下金色水路拖出长长的痕","prompt_moss":"金色水面的纹理特写：阳光自上方照射，水面上有金色与白色的颜料笔触拉出长长的痕迹，笔触之间有深蓝的水色。无人物。暖色调。","prompt_zmf":"横画幅中式幻想大场景，落日时分一条金色的水路在云海的水面上拖出长长的痕迹：水路的金色波光自画面右下的落日处铺向左下的远方，一道弯曲的水痕如绸带般蜿蜒，一位红衣的小小身影立于水路的中段，远处的水面上还有一叶扁舟与一座金顶的宫殿。\n\n金色的水路为落日反光的航迹：水面的波纹把落日的金光揉成万点跳动的碎金，碎金的密集处形成一条自落日延伸的水路，水路的边缘与青蓝色的水面交融；水路的中段弯曲处，红衣的身影立于一块露出水面的礁石上，他的剪影小而清晰，衣摆在风中轻扬。\n\n远处的落日半悬在水天相接处，日轮的金红把低空的云染成熔金色；画面的右上角，一座朱红立柱与金顶的宫殿自水中拔起，宫殿的白玉台阶探入水里，台阶的倒影在金色的水面上揉碎。主光为落日的熔金逆光，自画面右上照亮水路的碎金波光、宫殿的剪影边缘与红衣的点睛之色；水面的暗部呈青蓝色，占约三成。\n\n空气中安静无尘，只有落日金光的光斑在水面上跳动，前景金水拖痕的弧线与红衣的剪影清晰，落日与宫殿虚化成金红的光海；熔金水路、青蓝水面与一点红衣对撞，整体呈厚涂油画质感的东方金水拖痕，辽阔而宁静。","zmf_name":"金水拖痕落日航","zmf_batch":38,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s19.webp","id":"ZS-126"},{"bv":"BV12Puz6LEAB","scene":20,"series":"九霄神游","title":"幽谷仙灯","pal":"红金撞色","who":"无人物","comp":"谷底灯城俯瞰","motion":"灯河流动/瀑柱/雾","special":"谷中灯城、三瀑垂","note":"俯瞰幽谷中的灯城，三瀑垂帘","prompt_moss":"俯瞰视角的幽谷仙灯城：谷底密集的灯火如星河，三道白瀑自崖壁垂入谷底，瀑布下有水池。谷壁上散布建筑与绿树。主光为谷底灯火的自发光与瀑布的白光。","prompt_zmf":"横画幅中式幻想大场景，俯瞰构图：幽深的环形山谷底部亮着一座灯城，三道银白的瀑布自谷壁垂帘而下，谷口的白玉观景台上，一位白裙披帛的女子背身仰望谷中的灯城。\n\n环形山谷的谷底为一片灯城：朱红与金色相间的楼阁沿谷底层层排开，成千上万盏灯火把谷底照成一片暖色的光海，灯火沿着谷底的环道连成圈层；三道银白的瀑布自谷壁的不同方位垂帘而下，瀑布如三幅白色的绸缎垂挂，瀑布的落点在谷底激起白色的水雾，水雾被灯火染成暖色。\n\n谷口的白玉观景台自画面下缘探入，一位乌黑长发披帛的白裙女子背身立于台沿，她的白色广袖裙与披帛被谷风掀起，她双手扶着白玉的栏杆俯瞰灯城，身影在宏大的谷城中显得纤细。谷壁的岩体为青灰与暗红相间，岩壁的栈道上挂着灯笼串，灯光沿栈道蜿蜒；谷口的天空为深蓝与金红交界，几缕云横过天际。主光为谷底灯城的暖金光，自下方照亮观景台的白玉、女子的背影轮廓与瀑布的银白；谷壁的暗部呈青黑，占约四成。\n\n空气中弥漫着谷底的灯火光晕与瀑雾，前景仰望的背影与白玉栏杆清晰，三瀑垂帘的动势完整；暖金灯城、银白三瀑与青黑谷壁对撞，整体呈厚涂油画质感的东方幽谷仙灯，深邃而盛大。","zmf_name":"幽谷仙灯三瀑","zmf_batch":24,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s20.webp","id":"ZS-127"},{"bv":"BV12Puz6LEAB","scene":21,"series":"九霄神游","title":"群仙观瀑","pal":"仙金蓝","who":"人物群","comp":"横列群像，瀑居中","motion":"瀑落/袍动/云漫","special":"观瀑群仙","note":"众仙列队观瀑，衣色如谱","prompt_moss":"两名仙人在云台上下棋，白玉棋盘放在两人之间，棋子黑白分明。她们穿白蓝配色与红金配色的宽袖长袍。背景是虚化的云上宫殿。主光为柔和日光。","prompt_zmf":"横画幅中式神话大场景，云海之上众仙列队观瀑：画面中央一位身着正红织金华服的主仙立于云台最前，扬手指示着天际；她的身后，数十位衣色各异的仙人在云台上列成半弧，天际垂落数道金色的天瀑，白鸟成群绕瀑飞翔。\n\n主仙乌黑长发垂落及地，发间缀着金饰；她的正红织金广袖华服铺展开来，红色的裙裾自云台铺展垂入云海，金线的纹样华贵，她一手扬起指向天瀑，一手负后，侧脸仰望，仪态雍容。列队的仙人们衣色如谱：月白、青碧、鹅黄、绛紫的广袖长袍依次排开，他们或拄杖、或抱剑、或拢袖，都仰望天瀑，神情肃穆；队列的两端，两位青绿与墨色长袍的仙者身形最高。\n\n天际的瀑布为画面的背景主体：数道金色的天瀑自高处的云层垂落，瀑身为流动的金白光柱，瀑布的根部在云海上砸出白金色的水雾光冠；成群的白鸟绕着瀑身盘旋，鸟群的翅影在光柱间穿梭如雪片。云海铺满画面的下半部，云涛的受光面泛金，主仙脚下的云台探出云海。主光为天瀑的金白光柱自上方辐射，照亮主仙的红裙、列队仙人的衣色与云海的受光面；云海的阴影呈淡紫灰。\n\n空气中弥漫着瀑雾与金色的光尘，前景主仙的扬手与红裙铺展清晰，天瀑与鸟群保持整体的磅礴气势；熔金天瀑、正红主仙与多彩仙衣对撞，整体呈厚涂油画质感的东方群仙观瀑，恢弘而圣洁。","zmf_name":"群仙观瀑","zmf_batch":19,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s21.webp","id":"ZS-128"},{"bv":"BV12Puz6LEAB","scene":22,"series":"九霄神游","title":"云上织机","pal":"仙金蓝","who":"人物群","comp":"人物右，织机横贯","motion":"霞线穿梭/机杼声/纱起","special":"织云机","note":"仙娥在云上织霞，梭子引出红霞","prompt_moss":"一条白玉长桥自画面左下延伸至右上的云中宫城，桥面有栏杆，一名穿深色长袍的人独行其上。桥下方云海翻涌。主光为暖金侧光。","prompt_zmf":"横画幅中式仙侠场景，云海之上的巨大织机正织出一匹横贯画面的红白锦缎：锦缎自画面左侧的织机延伸到右侧的云台，两位仙娥在右侧云台上抱着线梭与布轴，左侧一位仙娥拉线，远处还有一位踩着织机的踏板。\n\n织成的锦缎宽如屋宇，缎面为正红与乳白相间的宽条纹，条纹间织着金色的云纹，缎面在阳光下泛着绸缎的流光，边缘垂着细密的金色流苏；锦缎的中段微微下垂，像一座横跨云海的绸桥。右侧云台上，一位乌黑长发的仙娥怀里抱着一只雕花的木线梭，梭上缠着金线，另一位绿裙仙娥正俯身整理布轴；她们身旁立着高大的木质织机，机架上缠满红线与金线，木轮与踏板的结构清晰。画面左侧远处的云台上，一位白衣仙娥正扬臂拉起一根长长的红线，红线在空中划出弧线。一块巨大的宝蓝色织锦自右侧的机架上垂直垂下，垂入云海。\n\n背景为湛蓝的天空与大朵的积云，两根白玉的高柱自云海中拔起，柱顶的金饰发光；右侧还有一座雕花的金色高塔探入画面。主光为明亮的暖金天光，自画面左上方照亮锦缎的流光、人物的衣料与云海的受光面；云海阴影呈淡青色。\n\n空气中漂浮着线头与光尘，前景锦缎的织纹与线梭清晰，远处的云海与高柱没入焦外；正红、乳白与湛蓝对撞，金色点缀，整体呈厚涂油画质感的东方云上织霞场景，明媚而宏大。","zmf_name":"云上织霞","zmf_batch":8,"run":true,"image":"../images/scenes/BV12Puz6LEAB/s22.webp","id":"ZS-129"},{"bv":"BV12Puz6LEAB","scene":23,"series":"九霄神游","title":"石柱碑林","pal":"仙金蓝","who":"无人物","comp":"石柱群纵深","motion":"云绕柱/雾","special":"云中古柱群","note":"云海中矗立古石柱群，如碑林","prompt_moss":"仙娥坐于云上织机前织霞，梭子引出红色的霞线。她穿蓝白配色的宽袖长袍，垂眸专注。织机为木质结构。背景是虚化的云上宫城。主光为柔和日光。","prompt_zmf":"横画幅中式仙侠场景，画面为云上的一条白玉长廊沿山势延伸，朱红瓦顶的长廊占满画面上半部，廊柱之间生长着巨大的古树，一位黑衣人的小小背影在长廊深处独行，透视纵深强烈。\n\n长廊的白玉廊柱一根根排开，柱础为雕花的铜座，座上摆着青铜香炉，炉中青烟袅袅；廊顶是朱红色的瓦檐与彩绘的枋梁，檐角向天空翘起。廊柱之间，几株巨大的古树自崖畔生长，虬曲的枝干探入廊下，树冠的红叶铺满廊顶的空隙，红叶随风飘落，铺满廊道湿润的白玉地面，花瓣与落叶散落在台阶两侧。\n\n长廊的尽头，一位黑衣人背着行囊的小小背影正沿廊道向远处走去，衣摆被山风吹起，他的身影在廊柱的光影间忽明忽暗。廊道外侧是翻涌的云海，云涛自崖下漫起，几缕云丝漫过廊沿。主光为自长廊尽头逆射的暖金天光，逆光勾亮红叶的透光、廊柱的边缘与黑衣人的轮廓，廊内地面映着 面中央一头通体雪白的巨狮昂首巡行在山巅的云道上，狮首生着一对金色的角冠，它的身旁一位持拂尘的仙人随行，两者身后，天空的云层旋出一个巨大的旋涡天窗。\n\n白狮的躯体雄伟如小山，通体的长毛为乳白与淡金相间，鬃毛自颈后披落如云浪，毛尖泛着金色的光；它的狮首宽阔，金色的角冠自额前向后弯曲，琥珀色的眼睛平静地望向前方的山道，狮口微合，步态从容威严；它的四肢踏在云道之上，爪下的云被踩出凹陷又缓缓回弹。随行的仙人身着月白的广袖道袍，发髻高挽，一手执着一柄白色的拂尘，拂尘的丝线随风飘展，他随行在白狮的颈侧，步态轻盈。\n\n他们行走的山道为山巅的一道石脊，石脊的两侧是翻涌的云海，云涛如浪；四周的山体露出青黑色的岩峰与金红的秋林。背景的天空自上而下由深蓝渐变至暖金，云层在高处旋出一个巨大的旋涡天窗，天窗的旋臂带着金红色的云焰，天窗的中央透出深蓝的星空。主光为天窗的星光与山巅的暖金阳光交织，照亮白狮的鬃毛、仙人的道袍与云道的受光面；云海的阴影呈淡紫色。\n\n空气中弥漫着云絮与金色的光尘，前景白狮的鬃毛与仙人的拂尘清晰，天窗的旋涡保持完整的环形动势；雪白狮身、金角冠与焰色天窗对撞，整体呈厚涂油画质感的东方白狮巡山，威严而神圣。","zmf_name":"白狮巡山","zmf_batch":19,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s03.webp","id":"ZS-140"},{"bv":"BV1Nf416yEoQ","scene":4,"series":"九霄神游","title":"金环绕塔","pal":"仙金蓝","who":"无人物","comp":"环带纵绕塔身","motion":"金环如绸绕塔飞舞/女立阶下仰望","special":"绕塔金环带","note":"金环如绸带绕塔飞旋，仙娥在阶下仰望","prompt_moss":"金环如绸带绕塔飞旋，一名仙娥在阶下仰望。主光为金环的暖光。","prompt_zmf":"横画幅中式仙侠场景，画面中央一座白玉高塔直入天际，数条金红色的光带如绸带般环绕塔身飞旋，光带在塔周围盘旋成巨大的螺旋；画面下方一位白红裙装的女子仰望飞旋的光带。\n\n白玉高塔的塔身为一层层的玉色塔檐，檐角挂着铜铃，塔顶的宝刹没入高处的云层；环绕塔身的金红色光带为流动的能量绸缎质感，每一条都拖着炽亮的核心与半透明的光尾，光带相互缠绕盘旋，在塔的中段甩出巨大的弧线，光尾散落细碎的火星，把夜空映成暖金色。\n\n画面右下方，一位乌黑长发挽成双髻的女子侧身仰望，她身着月白色广袖裙与朱红色的束胸腰带，肩头披帛垂落，双手交叠在身前，仰头的侧脸被光带照亮，神情惊叹。她身后是白色的石阶与栏板，石阶两侧点着灯笼。背景为深蓝的夜空与稀疏的星斗，塔基周围有淡淡的雾气。主光为光带的自发光，从塔身向四周辐射，照亮女子的仰面、石阶与雾气，光带的炽亮核心过曝泛白；暗部呈深蓝色，占约四成。\n\n空气中弥漫着火星与光尘，前景人物的仰望姿态与石阶栏杆清晰，塔顶与光带外缘没入焦外；熔金、正红与深蓝对撞，整体呈厚涂油画质感的东方塔光奇观，神圣而灵动。","zmf_name":"金环绕塔","zmf_batch":7,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s04.webp","id":"ZS-141"},{"bv":"BV1Nf416yEoQ","scene":5,"series":"九霄神游","title":"蓝鹤开屏","pal":"红金撞色","who":"动物","comp":"鹤居右占半","motion":"尾羽层叠开/雾","special":"蓝鹤尾屏","note":"蓝鹤尾羽开屏，蓝白金三色","prompt_moss":"一只蓝鹤展开尾羽如屏，羽有蓝白金三层。主光为日光。","prompt_zmf":"横画幅中式幻想场景，平视近景。画面中央偏右一只巨大的青蓝仙鹤展开双翼，翼展几乎占满画面宽度，颈项高抬；它的左侧一位白衣女子仰头伸手扶着鹤颈，右下方一位白衣男子仰面托着鹤的腿与红绳。\n\n仙鹤的头顶有一点朱红，颈羽为深墨蓝，翼羽自青灰渐次转为雪白，羽缘绽开成扇形，翅下的绒毛蓬松；鹤腿细长，绑着红色的绳结，绳上垂着流苏；它的喙尖微张，眼周的黑羽如描过的眼线。\n\n女子身着米白的交领长裙，肩头披一层浅金的纱，腰间束青绿的带，长发垂落背脊；男子的白衣为宽袖的对襟，腰带束得紧，仰头时颈线绷直；两人的动作一上一下，把鹤身夹在中间。\n\n背景为一座金顶的殿宇，殿脊与檐角层叠，廊柱与栏杆沿台基排开；画面的上方垂落一挂细密的水帘，水线自画面上缘直落，在光里碎成白亮的光点。主光为右后方的暖金阳光，斜射而来，穿透鹤翼的羽片，羽缘透出金白的亮边；水帘在逆光里化成一片光尘，殿顶的瓦面受光温暖。\n\n空气中弥漫着水雾与飞散的羽屑，前景的鹤翼与红绳清晰，远景的殿宇与水帘虚化；青蓝、雪白与暖金三色交织，整体呈厚涂油画质感的东方蓝鹤开屏，庄重而华美。","zmf_name":"蓝鹤开屏","zmf_batch":45,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s05.webp","id":"ZS-142"},{"bv":"BV1Nf416yEoQ","scene":6,"series":"九霄神游","title":"金焰环山","pal":"红金撞色","who":"无人物","comp":"环形火焰居中","motion":"火环旋/瀑/云烧","special":"环形火瀑","note":"山间张开一圈环形火瀑","prompt_moss":"一座环形火瀑在山间张开，火光自环形壁面向中心聚合。主光为火焰的自发光。","prompt_zmf":"横画幅中式神话大场景，山谷之中一圈环形火瀑轰然张开：金色的火焰自环形山脊向内倾泻，形成一个巨大的圆形火环，火环中央的山岩上立着一位绿裙黑发的身影，火环两侧各有一位白衣人物仰望。\n\n环形火瀑的金色火焰如液态的光，自环形山脊的每一处裂口同时向中心喷涌，火焰的内缘炽白、外缘熔金，火星如雨般洒向环心；火环之下，山体的岩层被映成透亮的橙金色，岩缝间流淌着熔金的细流。环心处，一位乌黑长发垂腰的绿裙身影背对镜头静立，裙摆与长发被热浪掀起翻卷，她正对火环张开双臂。左侧的白衣女子提着裙摆仰头，长发飞舞；右侧的白衣男子拄着一盏方灯，灯火在焰光前显得微弱。\n\n山谷的岩壁为深褐与焦黑的层叠结构，壁上垂挂着凝固的熔岩钟乳；谷底的溪水反射着火光。主光为火环的自发光，从环心向四周辐射，照亮三位人物的轮廓边缘、岩壁的受光面与翻卷的火星；火环之外的岩壁暗部呈焦黑，占约四成。\n\n空气中弥漫着浓重的火星、热浪扭曲与烟尘，前景人物的衣缘与火雨清晰，环形火瀑的顶部没入焦外仍保持完整的圆；熔金、焦黑与月白对撞，整体呈厚涂油画质感的东方火环神话奇观，壮阔而神圣。","zmf_name":"金焰环山","zmf_batch":9,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s06.webp","id":"ZS-143"},{"bv":"BV1Nf416yEoQ","scene":7,"series":"九霄神游","title":"云蟒听琴","pal":"仙金蓝","who":"动物","comp":"蟒占上半，人右下","motion":"鳞光/琴波/雾","special":"听琴巨蟒","note":"巨蟒盘在山头听琴，琴声让它低下了头","prompt_moss":"一条蓝鳞巨蟒盘踞山头，一名仙娥抚琴，蟒低头听琴。主光为柔和光。","prompt_zmf":"横画幅中式幻想场景，画面右侧一条白金色的巨龙盘踞在溪谷岩石间，龙身蜿蜒占据了画面右半部分与中景，龙首低垂，俯向左侧一位正在抚琴的白衣女子，作聆听状。\n\n巨龙的鳞片呈乳白与淡金色，层层分明，鳞缘泛着湿润的光泽；龙须细长飘逸，龙角后掠，双目低垂神情温驯，龙爪搭在岩石上。白衣女子坐在龙首旁的一块青灰色巨岩上，乌黑长发垂落，发间簪着素色发饰；她身着月白交领广袖裙，腰束青绿色长裙与白色纱帛，双手在身前的古琴上轻拨，琴身木色温润。\n\n岩石下方是奔流的溪水与小型瀑布，水流撞在青石上碎成白色的水花，水雾漫起。背景为大面积虚化的山壁与垂落的藤蔓，岩壁上金色的阳光斑驳洒落。主光为自画面上方漫射的暖调天光，照亮龙鳞的受光面与女子的白衣，鳞片边缘透出金色轮廓光；水雾将暗部染成青灰色。\n\n空气中弥漫着水汽微粒与浮尘，前景水流大幅虚化，远景山壁没入焦外；乳白、淡金与青灰三色交织，整体呈厚涂油画质感的东方灵兽幻想，静谧而圣洁。","zmf_name":"云龙听琴","zmf_batch":3,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s07.webp","id":"ZS-144"},{"bv":"BV1Nf416yEoQ","scene":8,"series":"九霄神游","title":"回眸一笑","pal":"红金撞色","who":"人物","comp":"特写，手入前景","motion":"发丝/璎珞/裙摆","special":"POV 伸手","note":"回眸一笑，手已经伸到观者面前","prompt_moss":"一名少女回眸伸手向观者，面带微笑，手中似有光。主光为暖光。","prompt_zmf":"横画幅中式古典人像场景，第一人称互动视角：画面中央一位华服金饰的少女回眸一笑，她的一只手自画面下方伸出，指尖伸向观者，似在邀约；她的身后，白纱的宫幔与金色的廊柱环绕，云海的暖光洒满画面。\n\n少女乌黑长发垂落腰际，发间的金饰与红蓝的绢花层叠，耳畔的长流苏耳坠随她的回眸轻晃；她回眸的笑颜明媚，双眼弯成月牙，露出细白的牙齿，脸颊晕着红润。她身着米白织金的抹胸华服：衣料上织着青绿与正红的花卉纹样，肩头的披帛为青蓝与红金相间的织锦，披帛的一角垂落；她的一只手自画面下缘伸向观者，指尖微翘似在相邀，另一只手提着裙摆。\n\n她身后的背景：白色的纱幔与金色的廊柱环绕成回廊，回廊外是云海的暖光，云海的受光面泛着金白；她身侧还立着一位背身的金衣侍女，侍女的发髻高挽。主光为暖金的日光，从画面左前方照亮她的回眸笑颜、织金的纹样与伸出的指尖；纱幔的暗部呈暖褐色。\n\n空气中弥漫着金色的光尘与纱絮，前景伸向观者的指尖与回眸的笑颜清晰，回廊与云海虚化；米白织金、彩色披帛与暖金日光三色交织，整体呈厚涂油画质感的东方回眸相邀，明媚而亲昵。","zmf_name":"回眸一笑手相邀","zmf_batch":35,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s08.webp","id":"ZS-145"},{"bv":"BV1Nf416yEoQ","scene":9,"series":"九霄神游","title":"垂帘听瀑","pal":"仙金蓝","who":"人物群","comp":"帘占上半","motion":"珠帘摇/瀑光/纱","special":"珠帘、瀑光","note":"坐珠帘后听瀑，帘把光筛成碎金","prompt_moss":"几名仙娥坐于珠帘后听瀑，帘将光筛成碎金。主光为帘后透光。","prompt_zmf":"横画幅中式仙侠场景，一座金色帘幕的大厅内，两位古装人物相对而坐：左侧一位月白衣袍的仙人手扶帘索，右侧一位红黑金织锦华服的少女跪坐在锦垫上，头顶的金色珠帘把透进的天光筛成满室碎金。\n\n金色的珠帘自大厅的穹顶垂落，帘珠颗颗分明，串珠的丝线在光下如流金；天光透过帘幕的缝隙洒下，在空气里碎成千万点金色的光尘，光尘落在少女的华服上闪烁。少女乌黑长发垂落腰际，发间的金饰与珠链层层；她身着红黑金三色织锦的重工华服，衣料上的金线龙纹与云纹繁复，白色的纱袖堆在腕间；她跪坐的姿态端庄，微微侧首听帘外的瀑声。\n\n左侧的仙人乌黑长发束冠，月白的道袍广袖垂落，他一手托着帘索侧身而立，神情肃穆。大厅之外，瀑布的水声透过帘幕隐隐传来，帘外隐约可见白瀑的银白水影与青绿的崖壁。主光为透过珠帘的天光，把整室染成金色的碎光，照亮少女华服的金线、仙人的白衣与珠帘的串珠；厅内的暗部呈金褐色。\n\n空气中弥漫着碎金的光尘与帘幕的流苏，前景珠帘的串珠与两人相对的构图清晰，帘外的瀑影朦胧；金色珠帘、红黑织锦与月白道袍对撞，整体呈厚涂油画质感的东方垂帘听瀑，华贵而静谧。","zmf_name":"垂帘听瀑碎金光","zmf_batch":37,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s09.webp","id":"ZS-146"},{"bv":"BV1Nf416yEoQ","scene":10,"series":"九霄神游","title":"红衣踏浪","pal":"仙金蓝","who":"人物","comp":"居中，浪占下半","motion":"浪花/衣带/飞红","special":"踏浪凌波","note":"红衣踏浪，裙摆扫起一路水花","prompt_moss":"一名红衣女子踏浪而行，裙摆扫起一路水花。主光为日光。","prompt_zmf":"横画幅中式仙侠场景，画面中央一位身着米白与红金相间长裙的女子赤足踏在云海的浪面上，裙摆扫起一路的水花，她回眸浅笑，身后的白纱幔与水花一同飞展，背景是白玉柱与纱幔环绕的云上宫台。\n\n女子乌黑长发披落腰际，长发被海风扬起横过肩头；她回眸的笑意明媚，眼尾弯起，唇色红润。她身着米白色的抹胸长裙，裙身上织着正红与宝蓝相间的缠枝纹样，裙摆极长，自腰间向身后铺展；她赤着的双足踏在浪面，每一步都踩碎一朵浪花，水花自她的脚边溅起成扇形，水珠在阳光下亮如碎钻；她身后的大幅白纱与披帛随海风扬起，与溅起的水花交织成一片。\n\n云海的浪面如熔金的水镜，浪尖的白沫被阳光照透；她身后的云台上立着白玉的立柱，柱间的白色纱幔层层垂落，纱幔被风鼓起如帆；云台的另一侧可见金色的宝顶与朱红的殿檐。天空为澄澈的蓝，大朵的积云悬在远处。主光为明亮的暖金阳光，从画面右上方照亮浪花的透光、她回眸的笑颜与纱幔的层次；浪面的阴影呈淡青色。\n\n空气中弥漫着水雾与纱絮，前景踏浪的足尖与溅起的水花清晰，纱幔与宫台层层虚化；米白红裙、熔金浪面与白纱幔三色交织，整体呈厚涂油画质感的东方红裙踏浪，轻盈而明媚。","zmf_name":"红裙踏浪","zmf_batch":22,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s10.webp","id":"ZS-147"},{"bv":"BV1Nf416yEoQ","scene":11,"series":"九霄神游","title":"云中宫阙","pal":"仙金蓝","who":"无人物","comp":"宫阙群竖贯","motion":"云绕/瀑/旗","special":"层叠云宫","note":"宫阙一层层堆进云里","prompt_moss":"层叠云宫自下而上堆入云层，宫与云交替。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，仰视构图：一座巨大的云龙盘踞在画面上半部的天空中，云龙的躯体如雪山般的云团堆叠，鳞甲的云块泛着金光；云海的下方，宫阙一层层堆进云里，云台上仙娥往来如织。\n\n云龙的躯体占据了画面的上半部：它的鳞甲由无数团巨大的云块堆叠而成，每一片云鳞都泛着金白色的受光边，云龙的脊背高耸如山，龙首自画面右上探出，金色的龙眼与飘扬的龙须清晰，龙爪自云中探出搭在云脊上；云龙的身躯半隐半现于翻涌的金白云海中。\n\n云海的下方，宫阙层层堆叠入云：白玉的台基、朱红与金色相间的殿宇、悬空的栈桥与阶梯自画面下缘向云中层层升高，每一层宫殿都只露出飞檐与金顶，更高处的宫殿没入云中只余轮廓；云台的阶前，数位仙娥提着食盒、捧着卷轴往来，她们的衣色有红、白、青，身影纤细。主光为高角度的暖金天光，照亮云龙鳞甲的受光边、宫阙的金顶与云台的阶面；云隙的阴影呈青金色。\n\n空气中弥漫着金色的云絮与浮尘，前景云台的仙娥与阶梯清晰，云龙与宫阙保持整体的堆叠气势、细部虚化；金白、朱红与青金云影交织，整体呈厚涂油画质感的东方云中宫阙，恢弘而缥缈。","zmf_name":"云中宫阙","zmf_batch":16,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s11.webp","id":"ZS-148"},{"bv":"BV1Nf416yEoQ","scene":12,"series":"九霄神游","title":"临瀑抚龙","pal":"仙金蓝","who":"人物群","comp":"龙首占下半","motion":"龙鳞/瀑/须飘","special":"瀑边白龙","note":"瀑下抚白龙首，龙目安详","prompt_moss":"一名仙娥在瀑边抚摸白龙之首，龙目安详。主光为瀑光。","prompt_zmf":"横画幅中式神话场景，画面中央一头通体雪白的巨龙温顺地垂首，龙目安详半阖；一位白衣的男子捧着金钵在龙首旁喂食，一位红裙的少女立于龙首的另一侧俯身轻抚龙鳞，龙身的雪白鳞甲与朱红的宫城相映。\n\n白龙的龙首宽阔温润：通体的鳞甲为乳白色，鳞片的边缘泛着淡金，龙角为半透明的玉色向后弯曲，龙须自颌下飘垂；它的龙目半阖，眼睫低垂，神情安详如卧佛；它的龙躯自画面右侧盘旋而下，部分龙身隐入云中。白衣男子乌黑长发束冠，身着月白色宽袖道袍，双手捧着一只金色的钵盂，钵中盛着发光的露水，他俯身把钵递向龙的吻边。红裙少女乌黑长发垂腰，发间缀着金饰，她身着正红织金的广袖华服，她立在龙首的旁侧，一只手掌轻轻贴在龙首的额上，神情温柔。\n\n背景为朱红与金色相间的宫城：金顶的楼阁沿瀑布的崖壁层层排开，瀑布自崖顶倾泻，水帘的银白与龙身的雪白相映；宫城的雕花栏杆上停着白色的仙鹤。主光为明亮的暖金阳光，自画面上方照亮龙鳞的受光面、两人的衣料与瀑布的水帘；龙身的阴影呈淡青色。\n\n空气中弥漫着瀑雾与光尘，前景龙首的鳞甲、喂食的钵盂与红裙的手掌清晰，宫城与瀑布层层虚化；雪白龙身、正红织金与金顶宫城对撞，整体呈厚涂油画质感的东方瀑下抚龙，圣洁而温馨。","zmf_name":"瀑下抚龙","zmf_batch":32,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s12.webp","id":"ZS-149"},{"bv":"BV1Nf416yEoQ","scene":13,"series":"九霄神游","title":"濯足清波","pal":"仙金蓝","who":"人物","comp":"人物居中，波光满屏","motion":"水纹/足尖涟漪/发丝","special":"清波濯足","note":"濯足清波，回眸一笑生波","prompt_moss":"一名女子坐水畔濯足回眸浅笑，水面波光粼粼。主光为日光。","prompt_zmf":"横画幅中式宫廷水景，平视近景。画面中央偏左一位女子侧坐在白石台沿，双脚垂入水中轻晃，头微低看向水面，占画面高度约六成；她的右后方坐着一位男子，着玄青长袍，侧身看向她。\n\n女子为鹅蛋脸，肤色白皙，眼尾上挑，眼波微垂，唇色淡红，额间一枚细小的花钿；乌黑长发松散地挽起，发间只簪一支素银步摇，大量碎发垂落肩头，被水面的反光衬出细亮的边缘。\n\n她上身着月白的薄纱长衫，衣料极薄，肩背与手臂的轮廓自纱下透出，袖口与水相接处浸成深色；腰间系一条朱红的软绸长带，带尾垂到水面，浸湿后贴在石沿上；下身的长裙铺在白石上，裙缘沉入水中，随波微微散开。\n\n台沿为洁白的汉白玉，边缘雕着缠枝莲纹，台面被水光照得发亮；她的右后方立着一排白石廊柱，柱间的栏杆与柱头雕饰清晰，柱外的水面上浮着一层薄雾；白色的花瓣自上方零星飘落，落在水面与石面。主光为水面的反射光与侧后方的柔光，自下方补亮她的脸颊与纱衣，皮肤呈现柔润的次表面散射；男子的身形大半沉在暗部，呈青灰。\n\n空气中悬浮着细小的水汽与飘落的花瓣，前景的水波与纱料边缘清晰，后方的廊柱与水雾虚化；月白、朱红与汉白玉的冷白三色交织，整体呈厚涂油画质感的东方濯足清波，清透而慵懒。","zmf_name":"濯足清波","zmf_batch":43,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s13.webp","id":"ZS-150"},{"bv":"BV1Nf416yEoQ","scene":14,"series":"九霄神游","title":"手探云帘","pal":"仙金蓝","who":"人物","comp":"手入前景，云海门外","motion":"云帘流动/纱/手部特写","special":"帐内望云","note":"帐后一伸手，拨开的不是帘是云","prompt_moss":"一名仙娥自帐后伸手拨开云帘，帐外云海。主光为帐内暖光。","prompt_zmf":"横画幅中式仙侠场景，第一人称视角：画面中央一只手自画外伸入，正掀开一道半透明的白色纱帐，纱帐之后是洞开的窗景——蓝天白云与白玉栏杆的露台；画面右侧一位金衣华服的女子回眸望向掀帘的手。\n\n伸入画面的手自画面左下方探出，五指轻柔地捏起纱帐的一角，纱帐为织着暗纹的白色透纱，被掀起的部位拉开一道弧形的缝隙，纱料的褶皱在指间堆叠；透过缝隙，窗外的大朵积云近在咫尺，云层的受光面雪白，底部泛着淡青，白玉栏杆的露台自云中伸出，栏杆的望柱头上雕着云纹。\n\n右侧的女子乌黑长发挽成高髻，插着金色的凤簪与绢花；她身着金白相间的织锦广袖华服，衣料上织满金色的云凤纹样，肩头的披帛垂落身侧；她侧身回眸，目光望向掀帘的手，神情含着三分讶异七分笑意。她身后的窗台上摆着一盆盛开的白莲。主光为明亮的白昼天光，自窗外的云海方向漫射进来，照亮纱帐的透光纹理、女子的金衣与云层的受光面；帐内的暗部呈暖褐色。\n\n空气中漂浮着纱帐的纤维与窗外的云絮，前景掀帘的手指与纱褶清晰，窗外云海与露台明亮开阔；乳白、暖金与天蓝三色交织，整体呈厚涂油画质感的东方探帘瞬间，轻盈而华丽。","zmf_name":"手探云帘","zmf_batch":15,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s14.webp","id":"ZS-151"},{"bv":"BV1Nf416yEoQ","scene":15,"series":"九霄神游","title":"暖阳展卷","pal":"红金撞色","who":"人物","comp":"特写，书卷前景","motion":"卷页/尘埃光斑/发丝","special":"日光展卷","note":"日光里展卷，笑得毫无防备","prompt_moss":"一名少女坐日光里展卷微笑，尘埃光斑围绕。主光为日光。","prompt_zmf":"横画幅中式仙侠生活场景，云上阁楼的书案前，一位盛装华服的古装女子闭着眼睛微笑，一只黄色的小雀停在她的指尖，她面前的书案上摊开一卷书册，身后是翻涌的白云与宫殿一角。\n\n女子乌黑长发挽成繁复的高髻，发间插着金钗与朱红色的绢花，鬓边垂着细软的碎发；她闭眼浅笑，睫毛低垂，鼻梁秀挺，唇色红润，神情放松而明媚。她身着层叠的华服：最外是金白色织锦的广袖衫，衣料上织满淡红与宝蓝的花卉纹样，肩头的披帛垂落案沿，领口的立缘滚着红色的细边。她的右手小指轻翘，黄色的小雀站在她的指节上歪头看她，雀羽的绒毛在光下透亮。\n\n书案上摊开的书册页面上有手写的字迹与批注，案角压着镇纸，旁边放着一只青瓷茶盏与摊开的锦盒；案前的云台上晾晒着几匹锦缎。背景为云海翻涌，云中露出朱红立柱与金顶的宫殿一角，白色的云雾自廊下漫过。主光为明亮的暖金阳光，从画面左上方照亮她的侧脸、锦缎的织纹与小雀的绒羽；云海阴影呈淡青色。\n\n空气中漂浮着金色的光尘与柳絮，前景指雀互动与书卷字迹清晰，背景云海宫殿虚化；金白、朱红与淡青三色交织，整体呈厚涂油画质感的东方云上读书日常，温暖惬意。","zmf_name":"暖阳展卷","zmf_batch":11,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s15.webp","id":"ZS-152"},{"bv":"BV1Nf416yEoQ","scene":16,"series":"九霄神游","title":"熔金巨炉","pal":"红金撞色","who":"人物群","comp":"炉占上半","motion":"金浆沸腾/火星/雾","special":"熔金天炉","note":"天空像一座熔金巨炉，人小如尘","prompt_moss":"众人仰望一座悬浮的熔金巨炉，炉口喷出金色火柱。主光为炉火的自发光。","prompt_zmf":"横画幅中式神话大场景，天空中悬浮着一座巨大的黑色圆炉，炉底向下倾泻出熔金色的岩浆瀑布，浇灌在下方燃烧的山体上，金色熔流沿山石奔淌发光，前景的台阶上有两位白衣人物仰望。\n\n巨炉为青铜黑色的半球形炉体，炉身布满焦灼的龟裂纹与暗红的火纹，炉口的金边雕着饕餮纹，炉底豁开一道巨大的裂口，熔金色的岩浆如瀑布般轰然泻下，砸在下方的山体上溅起金色的火雨；熔流所过之处，山石被烧成透亮的橙金色，岩缝间流淌着发光的金线，火星漫天飞舞。炉身周围的空气被炙烤得扭曲。\n\n前景的石阶上，一位身着白衣红裙的女子提着一盏方形灯笼立定仰望，裙摆被热浪掀起翻卷；右侧一位白衣男子捧着玉盘躬身避让，盘中器物反光。台阶边缘散落着倾倒的鼎器与卷起的红绸。远景是暗红色的宫城轮廓在火光中若隐若现。主光为熔金岩浆的自发光，自上方与右侧照亮人物的衣料边缘、台阶的石面与漫天火星；暗部呈焦黑与深红，占约四成。\n\n空气中弥漫着浓重的火星、热浪扭曲与烟尘，前景人物的衣缘与灯笼清晰，远景宫城没入焦外的红色光雾；熔金、焦黑与月白对撞，整体呈厚涂油画质感的东方神话炼狱场景，庄严而震撼。","zmf_name":"熔金天炉","zmf_batch":6,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s16.webp","id":"ZS-153"},{"bv":"BV1Nf416yEoQ","scene":17,"series":"九霄神游","title":"对镜整妆","pal":"红金撞色","who":"人物群","comp":"双人对称","motion":"披帛/鬓发/镜光","special":"双人对镜","note":"出嫁前互为对方整妆，红金满室","prompt_moss":"两名仙娥互为对方整妆，红金满室。主光为暖光。","prompt_zmf":"横画幅中式婚俗场景，洞房的烛光下，两位女子互为对方整理出嫁的妆容：跪坐的红裙少女双手执着金钗，为面前对镜的白衣姐姐插簪整妆，她的神情温柔认真；白衣的姐姐闭目受妆，唇边噙着笑，烛泪的火光把两人染成暖金。\n\n红裙少女乌黑长发垂落双肩，发间缠着红色的绒花；她身着正红织金的抹胸襦裙，外罩白色的透纱广袖，纱袖上绣着金线的并蒂莲纹；她的双手捏着一支凤凰金钗，正轻轻插入姐姐的发髻，指尖的力度轻柔。白衣的姐姐乌黑长发挽成出嫁的髻，髻上已簪着数支金饰与红色的花；她身着月白色的织金嫁衣，领缘滚着正红的边，她闭目受妆，长睫毛低垂，唇角含笑，脸颊晕着薄红。\n\n两人中间的铜镜立于红木的镜架上，镜面映出两人相视的倒影；妆台摆着首饰盒、胭脂盒与散落的珠钗，一只烛台立在妆台的角落，烛泪垂落成串。背景为婚房的朱红帐幔与金色的喜字屏风，帐幔的流苏垂坠。主光为烛台的暖橙光，自侧方照亮两人的面部、金钗的反光与纱衣的透光；婚房的暗部呈暗红与金褐。\n\n空气中弥漫着烛烟与花粉的暖雾，前景插簪的手部与铜镜的倒影清晰，婚房的陈设虚化；正红织金、月白嫁衣与烛光暖金三色交织，整体呈厚涂油画质感的东方出嫁整妆，温情而华美。","zmf_name":"出嫁前对镜整妆","zmf_batch":41,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s17.webp","id":"ZS-154"},{"bv":"BV1Nf416yEoQ","scene":18,"series":"九霄神游","title":"白练当空","pal":"红金撞色","who":"人物","comp":"居中，白练十字展开","motion":"白练/红绳/旗幡","special":"红绳白练","note":"白练当空展开，红绳自腕间垂落","prompt_moss":"一名白衣女子双臂展开白练当空，红绳自腕垂落。主光为日光。","prompt_zmf":"横画幅中式舞剑场景，画面中央一位白衣的舞剑女子立于殿前的水面上，她的白纱长袖当空展开如两条白练，一手高擎长剑直指天空，腕间的红绳自袖口垂落，殿前的金柱与红幡作幕。\n\n女子乌黑长发束成古典的高髻，发间簪着素色的花饰；她舞剑的姿态舒展，双腿呈弓步立于浅水之上，水面的涟漪自她的脚下荡开；她身着月白色的多层纱裙，纱裙的裙摆与广袖在舞动的气流中向两侧完全展开，白纱如练当空铺陈，纱料的边缘半透明；她的红腰带垂着长长的红绳自腕间垂落水中，红与白对比鲜明；她高擎的长剑为青灰的剑身，剑尖直指天际。\n\n殿前的广场上，朱红的立柱与金色的殿顶自她的身后立起，殿前的石阶上铺着红色的毯，毯上散落着花瓣与兵器的架；两侧的石阶上摆着橙红的果篮与兵器架。背景的天空为暖金色，殿宇的重檐金顶在光下璀璨。主光为明亮的暖金阳光，从画面上方照亮白纱的透光、她舞剑的姿态与剑身的寒光；纱料的阴影呈淡金色。\n\n空气中弥漫着水面的湿气与飘落的花瓣，前景白练铺展的纱裙与高擎的长剑清晰，殿前的背景层次分明；月白纱裙、正红绳带与朱红金柱对撞，整体呈厚涂油画质感的东方白练舞剑，英气而华美。","zmf_name":"白练当空舞剑","zmf_batch":34,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s18.webp","id":"ZS-155"},{"bv":"BV1Nf416yEoQ","scene":19,"series":"九霄神游","title":"云锦慵卧","pal":"红金撞色","who":"人物","comp":"横陈特写","motion":"锦缎/发丝/光斑","special":"云锦卧姿","note":"云锦上慵卧，抬手挡一挡阳光","prompt_moss":"一名女子卧于云锦抬手遮光，光斑洒在她身上。主光为暖光。","prompt_zmf":"横画幅中式仙侠人像场景，画面中央一位乌黑长发的女子慵卧在云锦铺成的软榻上，她抬起一只手臂横在额前遮挡刺目的阳光，双眼轻阖，长发如墨色的绸缎在云锦上铺展成扇形。\n\n女子乌黑长发铺满整个榻面，发丝的弧线如墨绸铺展；她仰面的侧脸清丽，鼻梁秀挺，长睫毛投出柔和的阴影，红润的唇微张，神情慵懒惬意。她身着乳白色的织金抹胸纱裙，纱裙的裙身上织着青绿与正红相间的缠枝纹样，纱料透如蝉翼，一层层堆在榻上；她抬起的 手臂横在额前，指间的银镯在阳光下闪光，另一只手舒展在身侧，指尖沾着一片云絮。\n\n云锦的软榻为白色与金色的云絮凝成，云榻的边缘与天上的云海连成一片，榻沿垂落的纱幔被罡风掀向一侧；头顶的纱帐半透，阳光透过纱帐洒下金色的光斑。背景的天空为饱和的湛蓝，大朵的积云悬在远处。主光为刺目而明亮的正午阳光，从画面上方照下，被她抬起的臂弯挡出一小片阴影，照亮纱裙的透光、发丝的高光与云榻的白色；云海的阴影呈淡青色。\n\n空气中弥漫着云絮与金色的光尘，前景慵卧的姿态与遮挡阳光的手臂清晰，云海与蓝天虚化；乳白纱裙、墨色长发与湛蓝天空对撞，整体呈厚涂油画质感的东方云锦慵卧，慵懒而明媚。","zmf_name":"云锦慵卧","zmf_batch":29,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s19.webp","id":"ZS-156"},{"bv":"BV1Nf416yEoQ","scene":20,"series":"九霄神游","title":"月下分杯","pal":"红金撞色","who":"人物群","comp":"双人对坐，巨月右","motion":"酒光/月晕/萤火","special":"巨月石桌","note":"巨月下对坐分一杯酒，萤火作陪","prompt_moss":"两名仙娥月下石桌旁互递杯盏，萤火围绕。巨月在右侧。主光为月与萤光。","prompt_zmf":"横画幅中式幻想夜景场景，一轮巨大的满月悬于天际，月下的崖石书案旁，两位古装女子对坐分一杯酒：左侧一位身着红金织锦华服的女子斜倚案边执杯递酒，右侧一位白衣女子伸手接杯，两人之间飘着点点萤火。\n\n左侧女子乌黑长发挽成高髻，插着金色的步摇与绢花；她身着正红与乳白织金的广袖华服，肩头的披帛垂落案沿，她斜倚在铺着锦垫的崖石上，一手执着一只白玉小杯递向对面，眉眼含笑。右侧的白衣女子乌黑长发披落，发间只簪一支素簪，她跪坐在案对面，广袖的袖口挽起，双手伸出接杯，神情温柔期待。案上摆着一只青铜酒壶与两碟果子，一卷摊开的册页压在案角。\n\n崖石的旁边斜出一株秋树，枝头挂着红色的叶片与一盏小小的灯笼，灯笼的暖光摇曳；数点萤火自花丛间浮起，飘在两人之间。背景的满月占据了画面上半部的中央，月亮的环形山清晰，月轮的边缘透出乳白的光晕；月亮下方是暗青色的山影与浮云。主光为满月的银白月光与灯笼的暖橙光交织，照亮两位女子的面部、织锦的反光与玉杯的温润；暗部呈深蓝青色，占约四成。\n\n空气中漂浮着萤火与薄雾，前景人物递杯接杯的手部细节清晰，背景月轮与山影虚化；熔金、正红与深蓝对撞，整体呈厚涂油画质感的东方月下对饮，静谧而情意绵长。","zmf_name":"月下分杯","zmf_batch":10,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s20.webp","id":"ZS-157"},{"bv":"BV1Nf416yEoQ","scene":21,"series":"九霄神游","title":"瀑畔闲卧","pal":"仙金蓝","who":"人物","comp":"横陈中景","motion":"瀑雾/云/发丝","special":"瀑畔云堆","note":"卧在瀑边云堆上，把天当成帐","prompt_moss":"一名女子卧于瀑畔云堆看天，姿态慵懒。主光为瀑雾漫射。","prompt_zmf":"横画幅中式仙侠场景，画面中央一位白衣红纹裙的女子慵懒地斜卧在瀑布边的云堆上，上半身微起，右手举着一只青瓷茶杯正接过画面左侧一只递来的手，神情闲适，侧脸带着笑意。\n\n女子乌黑长发铺散在云堆上，发间垂着银饰；她身着乳白色的广袖长裙，裙面上绘着淡红色的水墨纹样，裙摆铺满整个前景的云台，领口微敞露出锁骨，腰间系着淡红色的宽腰带。递茶的手自画面左上方伸入，持着一只白瓷小盏，盏中茶汤冒着袅袅的热气。\n\n她斜卧的云堆洁白蓬松，云丝被她的裙摆压出柔软的凹陷；云台边缘之外是倾泻而下的巨大云瀑，如银河倒挂垂入云海。背景为层叠的仙宫建筑群：金瓦的塔楼与朱红的殿宇沿云缘层层排开，最高处的楼宇直入天际，檐角的铜铃在光下闪烁。主光为明亮的暖金天光，从画面右上方照亮云瀑的受光面、她的白衣与茶盏的热气；云海阴影呈淡青色。\n\n空气中漂浮着云絮与水汽微粒，前景裙摆的褶皱与茶杯清晰，背景宫群没入焦外；乳白、暖金与朱红点缀三色交织，整体呈厚涂油画质感的东方仙宫日常，惬意而华贵。","zmf_name":"瀑畔闲卧接茶","zmf_batch":5,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s21.webp","id":"ZS-158"},{"bv":"BV1Nf416yEoQ","scene":22,"series":"九霄神游","title":"提灯过廊","pal":"红金撞色","who":"人物群","comp":"纵队纵深，灯串","motion":"灯焰/列队/纱幔","special":"灯廊列队","note":"提灯的长队走过夜廊，像一场出巡","prompt_moss":"一群仙娥提灯列队走过长廊。主光为灯串的自发光。","prompt_zmf":"横画幅中式夜景仪式场景，一条提灯的长队走过夜色中的长廊：队伍最前方的少女提着一盏点亮的六角纱灯，她身后的长队次第提灯，长廊的朱红立柱与白纱帐幔沿纵深排开，像一场华美的出巡。\n\n领队的少女乌黑长发挽成古典的高髻，发间垂着金色的步摇；她身着乳白色织金抹胸的广袖长裙，裙面上绣着红金相间的缠枝纹样，肩头的宽袖纱幔垂落如瀑，纱面上织着金色的纹样；她提灯的手指白皙，纱灯的暖光自内透出，映亮她的胸襟与下颌；她的神情沉静，目光望向廊道的深处。\n\n她的身后，长队次第展开：每一位提灯的侍女都身着相似的白裙，裙色由近及远渐次变化——白、青、蓝，她们手中的灯次第点亮，灯队如一条流动的光河沿长廊蜿蜒；长廊的立柱为朱红色，柱间的白纱帐幔垂落，纱幔被夜风轻轻掀起；廊外的夜空中，一株开满白花的树枝探入画面。地面为水磨的石板，映着灯队的倒影。主光为长队纱灯的暖黄自发光，自队伍向廊道两侧漫射，照亮领队少女的织金裙、白纱帐幔与朱红立柱；廊外的夜色呈深蓝紫。\n\n空气中弥漫着灯晕与纱帐的飘絮，前景领队的少女与纱灯清晰，灯队长队沿纵深层层虚化；乳白织金、朱红立柱与暖黄灯河三色交织，整体呈厚涂油画质感的东方提灯出巡，华美而庄重。","zmf_name":"提灯长队过夜廊","zmf_batch":31,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s22.webp","id":"ZS-159"},{"bv":"BV1Nf416yEoQ","scene":23,"series":"九霄神游","title":"白鹿亲昵","pal":"红金撞色","who":"动物","comp":"人鹿同框特写","motion":"鹿角绒/发丝/呼吸","special":"白鹿贴面","note":"白鹿低头贴面，鹿角上还挂着愿签","prompt_moss":"一只白鹿低头与少女贴面，鹿角挂愿签。主光为暖光。","prompt_zmf":"横画幅中式幻想场景，平视近景。画面中央偏右一头巨大的白鹿低头贴近一位女子的面颊，鹿角自画面上缘展开，占画面高度的七成；画面左下角另有一位白衣人伸手抚着鹿的鼻吻。\n\n白鹿的皮毛为雪白，颈侧的毛丛蓬松，鹿角为暗金与浅褐，角的枝杈上挂着成串的纸质愿签与细红绳；鹿眼温润，睫毛长而密，鼻端为淡粉，鼻息在光里可见。\n\n女子身着朱红与月白相间的长裙，肩头披着绣花的披帛，头上戴着由白花与绿叶编成的花冠；她微微仰头贴近鹿的面颊，右手扶着鹿角的下缘；左下角的白衣人盘坐着，一手托着鹿的下颌，衣袖垂落在地。\n\n背景为一片葱郁的林地，树冠在上方合拢，枝叶间垂下成串的彩色绸带与铃铛；树干粗壮，树皮纹理清晰，林间散着光斑；远处有石阶与矮墙的轮廓，没入树影。主光为穿过树冠的日光，自画面右上方斜射，照亮鹿背的绒毛、女子的面颊与花冠，勾出金色的边缘光；树荫的暗部呈青绿。\n\n空气中漂浮着被阳光点亮的浮尘与飘落的花瓣，前景的鹿角与愿签清晰，背景的树影层层虚化；雪白、朱红与青绿三色交织，整体呈厚涂油画质感的东方白鹿亲昵，温柔而灵秀。","zmf_name":"白鹿亲昵","zmf_batch":44,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s23.webp","id":"ZS-160"},{"bv":"BV1Nf416yEoQ","scene":24,"series":"九霄神游","title":"仙鹿引路","pal":"红金撞色","who":"人物群","comp":"多人多兽同框","motion":"鹿饮水纹/神兽/月晕","special":"仙鹿群、月下泉","note":"月下泉边喂鹿，神兽排队等","prompt_moss":"一名少女喂仙鹿，身后神兽列队，月下泉水。主光为月光与灯。","prompt_zmf":"横画幅中式神话场景，月下的泉水边一位白衣仙人执杖而立，一位红裙的少女俯身在泉边喂鹿，几只金角的神鹿排成一列在泉边饮水，泉水与满月交映，背景为金顶的宫城与红色的枫树。\n\n白衣仙人乌黑长发束冠，身着月白色的宽袖道袍，衣缘滚着金线，他执着一根龙头杖静立泉边，神情温和地注视着饮水的神鹿。红裙少女乌黑长发垂落，发间簪着金饰与红绳，她身着宝蓝与正红织锦的华服，裙摆铺在泉边的石上，她俯身伸出双手，掌心里托着食物喂向领头的神鹿；领头的神鹿通体雪白，鹿角为金色，鹿眼温柔地望着她的掌心，它身后的几只神鹿排成一列等待，鹿角的金色一只比一只耀眼。\n\n泉水清亮如镜，水面倒映着满月与神鹿的影子，涟漪自鹿唇饮水处荡开；泉边的石上散落着红色的枫叶与金色的桂花。背景的宫城为金顶的重檐楼阁，朱红的立柱在月色下深沉；一株红枫自画面右上探出，枫叶透亮。主光为满月的银白月光与宫城灯火的暖金光交织，照亮仙鹿的白毛、少女的织锦与泉水的波光；宫城的暗部呈深蓝紫色。\n\n空气中弥漫着月光的水雾与飘落的枫叶，前景喂鹿的手部与神鹿的金角清晰，满月与宫城构图饱满；雪白神鹿、红裙织锦与银白月轮对撞，整体呈厚涂油画质感的东方仙鹿引路，圣洁而温馨。","zmf_name":"仙鹿引路月下泉","zmf_batch":27,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s24.webp","id":"ZS-161"},{"bv":"BV1Nf416yEoQ","scene":25,"series":"九霄神游","title":"灯河结绳","pal":"红金撞色","who":"人物","comp":"人物居中，火树上","motion":"光丝/火星/水反光","special":"可结绳的光","note":"把灯河的光丝捞起来结成绳","prompt_moss":"一名少女坐灯河边把光丝结成绳，火树在身后。主光为光丝的自发光。","prompt_zmf":"横画幅中式幻想场景，火红的天空下，一片开满红花的山谷坡地上，几位白衣人物正把灯河里捞起的光丝结成绳：画面中央的白衣女子跪坐在花丛中，双手把一束发光的金色光丝打成结，身前的白瓷盆里盘着满满一盆光丝绳。\n\n中央女子乌黑长发垂落，发间缀着白色花饰；她身着月白色广袖裙，领缘与袖口滚着淡红色的边，裙摆铺在花丛中；她双手把数根发光的金色丝线拧成一股，光丝的炽亮核心泛着暖白的光，丝线的光映亮她的下颌与指尖，盆中的光丝如一盆活的光，微微蜿蜒蠕动。\n\n她左侧一位白衣人高高扬起一根长竿，竿头挑着一段结好的光丝绳，绳身横过画面上空，如一道金色的虹桥；更远处另一位白衣人俯身从灯河中捞起光丝。山谷的坡地上开满深红色的花朵，花丛间散落着巨大的莲叶状织物与红色的绸带；天空为灼热的火红色，云层如燃烧的絮团翻卷。主光为天空的火红光与光丝的自发光，从上方与中心照亮人物的白衣、花海与光丝的炽亮核心；暗部呈暗红色，占约三成。\n\n空气中弥漫着金色的火星与花粉，前景光丝的炽亮细节与瓷盆清晰，远景花坡与火云没入焦外；火红、熔金与月白对撞，整体呈厚涂油画质感的东方灯河幻想，炽烈而梦幻。","zmf_name":"灯河结绳","zmf_batch":8,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s25.webp","id":"ZS-162"},{"bv":"BV1Nf416yEoQ","scene":26,"series":"九霄神游","title":"树下对坐","pal":"红金撞色","who":"人物群","comp":"双人+巨树竖贯","motion":"花瓣/果光/纱","special":"白树垂纱","note":"白树下对坐，纱幔从枝头垂下来","prompt_moss":"两人白树下对坐分食红果，纱幔垂落。主光为暖光。","prompt_zmf":"横画幅中式幻想林苑场景，平视近景。画面中央偏右一株巨大的老树盘踞画面，树干虬曲中空，枝头覆满白粉色的花；树下三人席地而坐：左侧白衣男子伸手递出一枚鲜红的果，右侧红衣女子含笑伸手去接，两人之间还有一位女子侧身倚在树根边。\n\n白衣男子侧脸清峻，长发束起，眉目温和，唇色偏淡；红衣女子为鹅蛋脸，眼尾上挑，唇色正红，发间插着金步摇与珠串，笑时眼弯；倚树的女子披着青蓝的衣袍，长发松松挽起，唇角带笑。\n\n男子的白衣为宽袖的纱袍，肩背处透出内里的月白衬衣，衣摆铺在地面；红衣女子身着朱红与米白相间的长裙，裙面绣着金线的花枝，外面罩一层薄纱，纱面在膝上堆成柔软的褶；地面铺着深蓝与正红的织毯，毯边散着花瓣与果核。\n\n背景为层叠的白石栏杆与花枝，栏杆后隐约可见殿宇的檐角与朱柱，白粉的花簇把画面填满，几缕纱幔自枝头垂落；远景的殿宇与花树没入柔光里。主光为穿过花枝的暖阳，自左上方斜射，在三人身上落下斑驳的光斑，勾出白纱的透光与红裙的高光；树荫的暗部呈暖褐。\n\n空气中漂浮着被阳光点亮的花粉与落瓣，前景的果实与手指清晰，背景的花枝虚化；雪白、朱红与青蓝三色交织，整体呈厚涂油画质感的东方树下对坐，温柔而闲适。","zmf_name":"树下对坐","zmf_batch":46,"run":true,"image":"../images/scenes/BV1Nf416yEoQ/s26.webp","id":"ZS-163"},{"bv":"BV1Nf416yEoQ","scene":27,"series":"九霄神游","title":"花阶同行","pal":"仙金蓝","who":"人物群","comp":"阶居中，巨树左","motion":"花瓣雨/云涌/红裙","special":"花阶云门","note":"花阶尽头是云中宫门，二人同行","prompt_moss":"两人沿花阶上行走向云中宫门，花瓣雨落。主光为日光。","prompt_zmf":"横画幅中式仙侠场景，俯瞰一条白玉的花阶自画面下缘延伸向上，花阶的尽头是一座云中的朱红宫门：两位女子正沿花阶拾级同行——左侧一位红裙的女子提裙先行，右侧一位白衣的女子执伞相伴；花阶的两旁开满粉白的花树，云海在阶下翻涌。\n\n红裙女子乌黑长发垂落腰际，发间垂着金色的流苏步摇；她身着正红织金的长裙，裙摆的长纱拖曳在阶面上，她提裙拾级，回眸与同伴说话，侧脸含笑。白衣女子乌黑长发挽起，身着月白色的广袖长裙，她撑着一把素色的油纸伞与红裙女子并肩，伞沿微微倾向同伴；两人的身影在花阶上投下淡淡的影子。\n\n花阶的白玉阶面洁白，阶沿的栏杆雕刻着云纹，阶旁的花树开满粉白的花朵：花枝自阶沿斜出，花瓣飘落在阶面上铺了薄薄一层；阶的尽头，一座朱红的宫门立于云端的平台上，宫门的重檐与金顶在花树的掩映中庄严。阶下的云海如棉山铺满画面的两侧与下部，云涛受光面泛金。主光为明亮的暖金阳光，自画面上方照亮花阶的白玉、花树的繁花与两人的衣色；云海的阴影呈淡青色。\n\n空气中弥漫着花瓣与云絮，前景同行二人的姿态与阶面落花清晰，宫门与云海层层递进；白玉花阶、正红长裙与粉白花树三色交织，整体呈厚涂油画质感的东方花阶同行， 为浪花的白色高光。","prompt_zmf":"横画幅中式幻想奇观场景，浮世绘质感的巨浪与天门对峙：画面中央上方一座鎏金的天门殿宇悬在半空，殿门洞开，一股蓝绿色的巨浪自门内如巨手般探出抓来，浪涛翻卷成爪形，与门外的金色云浪对撞。\n\n巨浪的门内部分呈深邃的蓝绿色，浪身如一只摊开的巨手，五道浪指张开，指尖卷起白色的泡沫花，浪的根部自门洞内涌出，连绵不断；浪身的水面映着金色的天光，水珠飞溅成雾。门外的云浪为熔金色，一层层金色云涛向天门涌去，与蓝浪在半空相撞，撞出漫天白金交错的水云碎沫。\n\n鎏金的天门殿宇为多层重檐的构架，殿身的金顶与朱红的门框在浪涛之上发光，门洞深处的天光炽白；天门两侧的城郭沿云崖排开，朱红的殿宇与白玉的阶梯层层向下延伸，阶梯上的小小行人影驻足仰望巨浪。画面下方的云海翻涌，几道金色的光带自云中升起。主光为天门内外的金白天光，自上方照亮浪涛的受光面、城郭的金顶与云海的浪脊；蓝浪的背光面呈深青色。\n\n空气中弥漫着水雾与金色的云絮，前景浪指的泡沫与云涛卷曲清晰，天门保持完整的悬空轮廓；蓝绿、熔金与朱红三色对撞，整体呈厚涂油画质感的东方门吞巨浪奇观，浮世绘式的磅礴。","zmf_name":"金门吞巨浪","zmf_batch":15,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s02.webp","id":"ZS-167"},{"bv":"BV1Qw8E6UEym","scene":3,"series":"九霄神游","title":"金风螺旋","pal":"仙金蓝","who":"无人物","comp":"居中螺旋奇观","motion":"风暴螺旋/金尘","special":"金色风暴眼","note":"云海卷成金色螺旋风暴眼","prompt_moss":"云海卷成金色螺旋风暴眼，中心收缩至一点。无人物。主光为螺旋边缘的金色高光。","prompt_zmf":"横画幅中式幻想奇观大场景，俯瞰视角：一片金色的云海卷成一个巨大的螺旋风暴，风暴的旋臂自四周向中心收拢，风暴眼的中央露出深蓝的洞口；环形云城环绕着风暴眼的底部，云城的朱红楼阁沿环排开。\n\n金色螺旋的风暴占据了画面的中央：旋臂的云层为熔金与橙白相间，每一道旋臂都带着流动的纹理自外向内盘旋，旋臂的边缘撕出丝絮状的云纱；风暴眼的中央为深邃的湛蓝洞口，洞口的边缘卷着金白色的云环，环心像一只俯视大地的眼睛。风暴的下缘与环形云城相接：云城的朱红殿宇与白玉的环道沿环排开，环道上的人影小如尘点，环城的灯串连成金色的一圈。\n\n环形云城之外，云海自环城的边缘向四周铺展，云海的受光面泛金，背光面呈淡紫灰；画面的远景为天际的金红交界与几缕横过的云带。主光为明亮的暖金阳光，自画面上方照亮旋臂的受光卷曲、云城的朱红与环道的白玉；风暴眼的洞口深蓝，暗部呈深蓝灰。\n\n空气中弥漫着云絮与金色的光尘，前景环城的楼阁与环道清晰，螺旋风暴保持完整的旋绕动势、涡心虚化；熔金旋臂、朱红云城与深蓝涡心对撞，整体呈厚涂油画质感的东方金风螺旋，壮阔而瑰丽。","zmf_name":"金风螺旋风暴眼","zmf_batch":22,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s03.webp","id":"ZS-168"},{"bv":"BV1Qw8E6UEym","scene":4,"series":"九霄神游","title":"倒悬之城","pal":"仙金蓝","who":"无人物","comp":"颠倒城市奇观","motion":"瀑布向上垂落/城体倒映","special":"倒悬城市","note":"一座城倒悬在天上，瀑布往天上流","prompt_moss":"一座中国城池倒悬在天上，瀑布自城池底面向上流回天空，建筑群倒转。主光为瀑布的白色透光。","prompt_zmf":"横画幅中式幻想奇观大场景，一座红岩之城倒悬在天上：城市的楼阁与崖壁自天空的顶端向下生长，城中的瀑布逆流而上，往天上流淌，瀑布的水幕在倒悬的崖壁间层层跌落又升起，红岩与白瀑交织成奇观。\n\n倒悬之城的崖体为赭红色与金红色相间的层叠岩壁，岩壁如巨大的屏风自画面顶端垂下，岩壁上生长着倒悬的城郭：朱红的楼阁、白墙的栈道与金顶的塔楼倒挂在岩壁之上，楼阁的飞檐朝下，檐角的铃铛向上响动；城中数条银白的瀑布逆流而上，水流自谷底向天空奔流，瀑布的倒挂在岩壁间折出层层的水幕，水幕在阳光下透出彩虹的微光。\n\n瀑布的倒流在岩壁间激起漫天的水珠与雾气，雾气向上飘散凝成倒悬的云朵；岩壁的下缘，倒悬的城门与栈道连接着下方正常世界的边缘，一道白色的水流桥横跨两个世界。下方正常的天地里，深蓝的海面波涛起伏，海面上还有一座正常矗立的金顶小亭。主光为高角度的明亮天光，自画面顶端照亮倒悬岩壁的红岩肌理、瀑布的透光与云朵的银白；倒悬之城的阴影投向天空，画面的边缘暗部呈深蓝。\n\n空气中弥漫着漫天的水珠与雾气，前景逆流的瀑布水幕清晰，倒悬之城保持完整的倒挂结构；赭红岩城、银白逆瀑与深蓝海天对撞，整体呈厚涂油画质感的东方倒悬之城，超现实而震撼。","zmf_name":"倒悬之城瀑上天","zmf_batch":29,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s04.webp","id":"ZS-169"},{"bv":"BV1Qw8E6UEym","scene":5,"series":"九霄神游","title":"天宫罗盘","pal":"仙金蓝","who":"无人物","comp":"正俯瞰法阵","motion":"罗盘纹旋转/塔尖光","special":"金纹罗盘法阵","note":"自正上方俯瞰金纹罗盘，塔立圆心","prompt_moss":"俯瞰视角的一座金色罗盘法阵，中央立一座白玉塔，法阵有环形金纹自中心向外辐射。主光为塔尖的冷白光。","prompt_zmf":"横画幅中式幻想奇观大场景，正上方俯瞰：一座巨大的金色罗盘浮在云海之上，罗盘的盘面布满金红的纹路与符文，罗盘的圆心立着一座多层金顶的塔，塔尖自罗盘的中央拔起；罗盘的四周，云海如奶白的浪涛环绕，云海的边缘点缀着几座小型的殿宇。\n\n罗盘的盘面巨大：外环为鎏金的环带，环带上刻满符文与星宿的图案，环带的边缘垂着金色的流苏与红绸；内环的盘面为朱红与金色相间的同心圆纹路，纹路间镶嵌着宝石的星点，盘面的纹路如星辰的轨迹旋转；圆心的塔为多层金顶的楼阁塔，塔身的每层都挂着风铃与灯饰，塔尖的金刹直指天空。\n\n罗盘的四周云海翻涌：云涛如奶白的浪海，浪涛的受光面泛着金，浪谷呈淡紫灰；几座白墙金顶的小殿浮在云海的边缘，殿宇的倒影落在云面上。罗盘的下方，一道金色的光柱自罗盘的中心向云海投射，光柱的根部炸开金色的光屑。主光为罗盘的金色自发光与天光交织，自盘面向四周辐射，照亮盘面的纹路、塔身的金顶与云海的浪涛；罗盘的背光缘呈暗金色。\n\n空气中弥漫着金色的符文光屑与云絮，俯瞰的构图完整呈现罗盘的同心纹路，云海环绕的浪涛层次分明；鎏金罗盘、朱红符纹与奶白云海对撞，整体呈厚涂油画质感的东方天宫罗盘，庄严而神秘。","zmf_name":"天宫罗盘俯瞰","zmf_batch":35,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s05.webp","id":"ZS-170"},{"bv":"BV1Qw8E6UEym","scene":6,"series":"九霄神游","title":"伞山倒悬","pal":"仙金蓝","who":"无人物","comp":"倒置山体","motion":"伞面雨珠/瀑柱","special":"倒生的巨型伞山","note":"山是倒着长的伞，伞骨上挂着雨瀑","prompt_moss":"一座倒生的巨型伞状山体，伞骨向外辐射，伞缘垂下雨瀑。主光为伞面的漫射光。","prompt_zmf":"横画幅中式幻想奇观大场景，一座山谷中的山体倒着生长：山上的巨型油纸伞全部伞口朝下倒悬生长，层层叠叠的红伞与白伞如倒挂的花树，伞骨之间垂挂着数条雨瀑，雨水沿伞骨汇入崖下的水府。\n\n倒悬的伞山占据了画面的上半部：最大的一把巨伞直径横贯画面，伞面为米白色，伞骨呈放射状的金褐色，伞面的中央坠着一枚红色的伞帽；巨伞之下，数十把稍小的红伞、白伞沿着倒垂的山体层层排开，伞口朝下如倒挂的花钟；每一把伞的伞骨尖端都垂着一条细细的雨瀑，水流沿伞骨的边缘汇成银白色的水线，自高空垂落，在伞群的下方织成一片雨帘。\n\n崖下的水府为幽深的水面，水面上泊着一叶小小的乌篷船，船上一点渔火；崖壁的岩体为暗红与青灰相间，岩缝间生长着红色的藤蔓与花簇，几座红柱的亭台自崖壁上悬出，亭台的飞檐上滴着伞山落下的雨水。背景的瀑布自更高的崖顶整体倾泻，如一幅白色的绸缎垂满画面右侧。主光为清透的白昼天光，从画面左上方照亮伞面的米白、伞骨的金褐与雨瀑的银白；崖壁与水府的暗部呈青黑色，占约四成。\n\n空气中弥漫着细密的雨丝与水雾，前景伞骨与垂落的水线清晰，倒悬伞群保持整体的层次气势；米白、赤红与银白雨瀑三色交织，整体呈厚涂油画质感的东方倒悬伞山，超现实而华美。","zmf_name":"伞山倒悬雨瀑","zmf_batch":17,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s06.webp","id":"ZS-171"},{"bv":"BV1Qw8E6UEym","scene":7,"series":"九霄神游","title":"龙卧受拜","pal":"仙金蓝","who":"动物","comp":"龙贯上半，人群下缘一线","motion":"龙鳞流光/须飘/人群衣动","special":"山脊巨龙","note":"金鳞巨龙盘卧山脊受万民遥拜","prompt_moss":"一条金鳞巨龙盘卧于山脊之上，龙首朝右，山下有人群遥拜。龙鳞有金属质感的高光。主光为日光。","prompt_zmf":"横画幅中式神话大场景，一头金鳞的巨龙盘卧在山脊之上受万民遥拜：龙躯如山峦般横贯画面，鳞甲为鎏金与青绿相间的巨大鳞片，山脊上挂满红叶与祈愿的红绸；山脚下的崖边，一队红衣的朝拜者捧着贡品行礼，队伍的仪仗沿山道排开。\n\n巨龙的龙首自画面左侧的山脊昂起：龙首的鳞甲为鎏金的巨片，角如古木苍劲，龙须自颌下垂落如金色的瀑，龙目半阖，神情威严而安详；龙躯沿山脊蜿蜒向右侧延展，龙背的鳞甲上竟生长着整片红色的枫林与一座红墙金顶的山寺，寺庙的檐角挂满红灯笼；龙爪如山岩般搭在脊线上。\n\n山脚的崖边，朝拜的队伍沿山道排开：为首的红衣官员捧着金色的贡盘，身后的仪仗执幡执扇，幡旗的红与金沿山道蜿蜒；队伍的身旁，白色的仙鹤引颈相伴，松树的枝干虬曲探出崖边。背景的天空为淡金与青蓝的交界，云海在山脚翻涌。主光为明亮的暖金阳光，从画面上方照亮龙鳞的鎏金受光面、红叶的透光与朝拜队伍的仪仗；龙身的背光面呈青铜色。\n\n空气中弥漫着山岚与飘落的红叶，前景朝拜的队伍与仙鹤清晰，巨龙保持盘卧山脊的雄伟体量；鎏金龙鳞、赤红枫林与青蓝天空对撞，整体呈厚涂油画质感的东方龙卧受拜，威严而神圣。","zmf_name":"金鳞巨龙受万拜","zmf_batch":39,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s07.webp","id":"ZS-172"},{"bv":"BV1Qw8E6UEym","scene":8,"series":"九霄神游","title":"火树蟠龙","pal":"红金撞色","who":"无人物","comp":"火树居中竖贯","motion":"火舌攀枝/蟠龙绕树/火星","special":"燃烧神树、绕树龙","note":"神树烧成火炬，一条龙绕树盘升","prompt_moss":"一棵燃烧的神树居中竖贯画面，火焰自枝干向上升腾，一条蟠龙绕树盘升。主光为火焰的自发光。","prompt_zmf":"横画幅中式神话奇观场景，画面中央一棵巨大的神树燃烧成火炬：树身的枝干如龙躯盘旋而上，一条火龙绕着树身盘升，火焰的金红自树根蔓延至树冠，树冠的花叶如燃烧的红霞；火树的下方，白色的云海托着一座圆形的祭坛。\n\n神树的树干粗壮扭曲，黑色的树皮纹理间透出内部燃烧的金红；火焰自树根的祭坛升起，沿树干盘旋而上，火焰的形态如一条火龙：龙首自树冠探出，龙身的焰鳞层层分明，焰爪抓着树干的节疤攀爬；树冠的枝头开着大朵的金红色火焰莲花，焰花的花瓣透亮如琉璃，花心的火种炽白；火星与焰羽自树冠漫天飞散，把周围的云层映成金红。\n\n树下的祭坛为白色的圆形石台，坛面的符文发光，坛缘的火焰向内卷曲；云海在祭坛的四周铺展，云涛的白与焰树的红金对撞。背景的天空为饱和的湛蓝，大朵的积云悬在火树的两侧，云的受光面被映成金红。主光为火树的自发光，自画面中央辐射，照亮焰瓣的透光、树干的炭纹与云海的受光缘；火树之外的天空保持湛蓝的冷调。\n\n空气中弥漫着火星与焰羽，前景祭坛的符文与盘升的火龙动势完整，树冠的焰花清晰；熔金焰树、湛蓝天空与白色云海对撞，整体呈厚涂油画质感的东方火树蟠龙，炽烈而神圣。","zmf_name":"火树蟠龙绕柱升","zmf_batch":38,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s08.webp","id":"ZS-173"},{"bv":"BV1Qw8E6UEym","scene":9,"series":"九霄神游","title":"流星火雨","pal":"红金撞色","who":"无人物","comp":"斜线火雨满屏","motion":"火流星坠落/尾焰/城郭灯火","special":"火流星雨","note":"火流星拖着尾焰砸向仙城","prompt_moss":"火流星群自画面右上向左下坠落，每颗流星拖着橙红色尾焰。远处仙城灯火在下方。主光为流星尾焰的自发光。","prompt_zmf":"横画幅中式神话奇观大场景，漫天的火流星自天穹倾泻而下：数十颗火流星拖着长长的焰尾自画面的右上向左下坠落，焰尾的红金色彩贯满整个天空，流星雨的下方，一座白玉台上的仙人们仰头仰望，台下的仙城灯火连绵。\n\n火流星的群体铺满天空：每一颗流星都拖着炽亮的焰尾，焰尾的颜色自红金到橙白渐变，流星的轨迹相互交错，如漫天的火雨倾盆；最大的一颗流星自画面的顶端坠落，焰尾的长度横贯半幅画面，焰头的火球炽白刺目。天空的底色为深蓝与暗红交织，云层被流星的光染成橙红与金白的条带，云层的裂隙透出星空。\n\n流星雨的下方，一座白玉的观星台自画面的下缘探出：台上的仙人们或执卷、或指点、或合十仰望，他们的衣袍颜色各异，白玉的栏杆与金色的柱头华丽；台下的仙城灯火连绵，城中的楼阁与街市延向远方，城中的灯火与天上的流星雨上下辉映。主光为流星群的焰光，自天空辐射，照亮白玉台面、仙人的衣袍轮廓与云层的条带；地平线的暗部呈深蓝黑，占约四成。\n\n空气中弥漫着焰光的灼热感与星尘，前景白玉台的仙人群像与仰望的姿态清晰，流星雨保持倾泻的整体动势；红金焰尾、白玉仙台与深蓝夜空对撞，整体呈厚涂油画质感的东方流星火雨，磅礴而震撼。","zmf_name":"流星火雨砸仙城","zmf_batch":28,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s09.webp","id":"ZS-174"},{"bv":"BV1Qw8E6UEym","scene":10,"series":"九霄神游","title":"天河倾世","pal":"红金撞色","who":"人物群","comp":"金瀑纵贯，二人下缘","motion":"天河倾泻/伞面雨点/雾","special":"倒挂天河","note":"天河从天上倒挂下来，人间二人撑伞仰看","prompt_moss":"一条天河自画面上方倾泻而下，下方两人撑伞仰望。天河的水柱纵贯画面中央。主光为天河的白光。","prompt_zmf":"横画幅中式神话大场景，一条巨大的天河自天穹垂直倒挂而下：河身为金红与橙白交织的灼亮光柱，河水砸落人间掀起白色的云浪，云浪之下是依山而建的山城，画面下缘的山道上，两位撑伞的行人仰头仰望着天河。\n\n天河的水体为熔金与赤红交织的液态光，河身自画面顶端的云层垂落，河面翻卷着灼亮的浪花，河身的边缘蒸发着金红色的雾气，雾气在河的两侧升腾成对称的云柱；天河砸落的底部掀起一圈巨大的白色云浪，云浪如海啸般向四周的山城推去，浪壁的弧面被河光照透。\n\n山城沿山谷的两侧层叠而建：青灰的瓦顶、朱红的楼阁与金色的塔尖沿山坡铺开，山间的瀑布群自楼阁间跌落，汇入谷底的河流；谷底的河面上映着天河的金红倒影，碎成万点。前景的山道上，两位撑伞的行人并肩仰头：一位撑着油纸伞身着青灰长袍，一位撑着红伞身着暗红衣裙，他们的身形在天河的尺度下极小，伞面被河风吹得微微变形。主光为天河的金红自发光，自画面中央辐射，照亮山城的受光坡面、伞面的颜色与两位行人的仰面轮廓；山谷与云浪的暗部呈青灰蓝。\n\n空气中弥漫着灼热的水汽与金红色的云雾，前景撑伞仰看的两人与伞面清晰，天河保持垂落的整体动势、顶端虚化；熔金天河、青灰山城与红蓝伞面对撞，整体呈厚涂油画质感的东方天河倾世，磅礴而震撼。","zmf_name":"天河倾世","zmf_batch":20,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s10.webp","id":"ZS-175"},{"bv":"BV1Qw8E6UEym","scene":11,"series":"九霄神游","title":"金廊回眸","pal":"仙金蓝","who":"人物","comp":"竖屏人像，廊柱纵深","motion":"披帛/珠帘/发丝","special":"鎏金廊柱","note":"金柱长廊深处一记回眸","prompt_moss":"金柱长廊中一名白衣仙娥侧身回眸。廊柱鎏金，两侧有珠帘。她占画面中央偏右。主光为廊内暖金光。","prompt_zmf":"横画幅中式古典人像场景，对称纵深构图：一条金柱林立的长廊自画面下缘延伸向深处，长廊的两侧立满鎏金的柱镜与垂落的琉璃灯，长廊的中段一位华服少女侧身回眸，裙摆铺展在长廊的地面上。\n\n少女乌黑长发垂落腰际，发间簪着金色的发饰与红色的绢花；她回眸的侧脸清丽，眼波流转，唇色朱红，神情慵懒中带着惊鸿一瞥的意味。她身着乳白色织金的抹胸长裙，外罩一条彩色的广袖大氅：大氅自她的肩头铺展开来，氅面上织着宝蓝、正红与鎏金相间的云纹，氅摆铺满长廊的地面如流彩的河；她的一只手扶着身侧的鎏金柱镜，姿态娴雅。\n\n长廊的两侧对称立满鎏金的柱镜：每一根立柱上都嵌着一面椭圆形的鎏金镜框，镜框的雕花繁复，镜面映着长廊深处的灯火；柱顶垂下一盏盏琉璃的吊灯，琉璃灯的光自长廊的深处排成一列光点，纵深感强烈。长廊的地面为暗红色的木地板，地毯的绒面沿中轴铺开。主光为琉璃吊灯的暖金光，自长廊的深处向近处递减，照亮她的回眸侧脸、氅面的织金与鎏金柱镜的反光；长廊的尽头暗部呈深褐色。\n\n空气中弥漫着金粉与灯晕，前景回眸的侧脸与大氅的铺展清晰，长廊的纵深层层递进；鎏金柱镜、彩色大氅与暖金灯光交织，整体呈厚涂油画质感的东方金廊回眸，华丽而幽深。","zmf_name":"金柱长廊回眸","zmf_batch":27,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s11.webp","id":"ZS-176"},{"bv":"BV1Qw8E6UEym","scene":12,"series":"九霄神游","title":"舟坠天河","pal":"仙金蓝","who":"人物群","comp":"俯冲视角，瀑占满屏","motion":"瀑水飞溅/舟起伏/衣飞","special":"瀑顶俯冲","note":"小舟从天河之巅俯冲，第一视角刺激感","prompt_moss":"一叶小舟自金色瀑布之巅俯冲而下，舟上一人扬臂。瀑布占满画面。主光为瀑水的高光。","prompt_zmf":"横画幅中式幻想奇观场景，第一视角的惊险瞬间：一叶小舟正自天河瀑布的顶端俯冲而下，舟头翘起，舟上一位白衣红蓝披帛的女子向后仰身抓稳船舷，头顶的天河如金色的巨瀑倾泻，与她的落点只差数尺。\n\n天河的瀑布自画面上方的悬崖口倾泻而下，瀑布的水流为熔金色，如融化的黄金翻滚咆哮，水流砸落的位置掀起巨大的白色浪冠，浪冠的碎沫飞溅成环；瀑布两侧的崖壁为暗红色的岩体，崖顶的树冠被水雾打湿。小舟为深褐色的乌篷船，船身已倾斜成俯冲的角度，女子乌黑长发向后狂舞，她身着月白色广袖裙，肩后的红蓝织锦披帛被气流掀成两面旗，她一手死死抓住船舷，另一手护住头侧，神情惊而不乱。\n\n下方的接水面为深蓝色的静水，瀑布砸落激起的环形浪圈层层扩散，静水面上漂浮着几盏红色的小灯船，灯光在浪圈里明明灭灭。主光为瀑布的金色自发光，自上方照亮女子仰起的脸、披帛的透光与浪冠的白沫；四周的水面与崖壁暗部呈深蓝黑，占约四成。\n\n空气中弥漫着浓重的水雾与飞沫，前景小舟的倾斜与女子抓舷的手清晰，天河瀑布保持整体的倾泻动势、顶端虚化；熔金、深蓝与红蓝披帛对撞，整体呈厚涂油画质感的东方舟坠天河奇观，惊险而壮丽。","zmf_name":"舟坠天河","zmf_batch":16,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s12.webp","id":"ZS-177"},{"bv":"BV1Qw8E6UEym","scene":13,"series":"九霄神游","title":"贵妃倚柱","pal":"红金撞色","who":"人物","comp":"竖屏人像特写","motion":"披帛/璎珞/睫毛","special":"蓝金锦衣","note":"蓝金锦衣贵妃倚柱，一记慵懒眼波","prompt_moss":"蓝金锦衣贵妃倚鎏金柱侧身回眸，直视观者。她穿蓝底金纹长裙，璎珞垂胸。主光为右侧暖金光。","prompt_zmf":"横画幅中式宫宴人像场景，画面中央一位身着蓝金锦衣的贵妃斜倚在朱红的立柱旁，一手轻抬拢在胸前，回眸抛来慵懒的一记眼波，她头顶悬着一排巨大的青铜编钟，编钟间的光带如水母般垂落。\n\n贵妃乌黑长发挽成高髻，发间簪着金凤簪与红色的绢花，耳垂坠着长款的金流苏耳饰；她的眼波慵懒上挑，眼尾的红晕与朱唇相映，神情妩媚中带着倦意。她身着宝蓝色织金的广袖华服：衣身满织金色的团凤纹样，肩头披着红色的纱质披帛与金色的锦缎半臂，金色的束胸腰封上垂着流苏，裙摆层层铺展；她斜倚柱身，身体的重心全交给立柱，姿态慵懒。\n\n头顶的青铜编钟巨大古朴：钟身为青绿色，钟身的浮雕纹样与钟口的钟乳清晰，编钟自横梁上成排悬下；钟间的空隙垂落数条半透明的光带，光带如水母的伞盖般轻轻漂浮，散发着幽蓝的微光。背景为宫宴的长廊：朱红的立柱与白玉的栏杆沿纵深排开，廊外的天光从柱间透入。主光为廊外的暖金日光，自画面左侧照亮她的面部、织金的纹样与立柱的朱红；编钟与廊道的暗部呈青铜色。\n\n空气中弥漫着光带的幽蓝微光与浮尘，前景贵妃倚柱的姿态与眼波清晰，编钟与长廊层层虚化；宝蓝织金、朱红立柱与青铜编钟三色交织，整体呈厚涂油画质感的东方贵妃倚柱，华贵而慵懒。","zmf_name":"贵妃倚柱慵眼","zmf_batch":19,"run":true,"image":"../images/scenes/BV1Qw8E6UEym/s13.webp","id":"ZS-178"},{"bv":"BV1Qw8E6UEym","scene"
