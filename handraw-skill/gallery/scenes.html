anatomy, natural skin, realistic hands. Satin sheen controlled, matte brocade, translucent gauze sleeves — not glossy plastic. Vertical composition. Cool, elegant composition.","prompt_zmf":"横画幅中式古典人像场景，画面中央一位华服的少女立于开满白色小花的汀洲上回首，她的回眸清丽，乌黑长发铺散，白色的绒花自她的衣袖垂落，身后的古城墙与墩台在暮色里沉静。\n\n少女乌黑长发挽成垂坠的古典髻，发髻上插着白色的绒花与金饰，几缕碎发被风拂过颊边；她回首的眼神温柔，眼尾微挑，唇色朱红微启似要说话。她身着米白色织金的立领华服：衣料的缎面上织着暗色的缠枝纹样，领缘与袖口滚着宝蓝色的织锦边，腰间束着正红色的锦带，锦带的穗子垂落裙侧；她的裙摆铺展在花洲上，白色的绒花自她的袖口与裙摆垂坠如雪。\n\n汀洲的花洲为白色的花海：细碎的白色小花铺满洲岸，花丛间点缀着几枝红色的果穗；她身后的古城墙为青灰的砖石砌成，墙头的墩台与旗帜在暮色中沉静，城墙的门洞透出暖黄的灯光。天空为暮色的青蓝，一弯淡淡的月挂在城墙的上方。主光为清冷的暮光与城门灯火的暖黄交织，照亮她的回眸侧脸、华服的织金与绒花的白；城墙的阴影呈青灰蓝。\n\n空气中弥漫着花洲的芬芳与暮色，前景回首的神态与垂落的绒花清晰，城墙与花洲虚化；米白织金、宝蓝锦边与青灰城墙对撞，整体呈厚涂油画质感的东方汀洲回首，古典而温柔。","zmf_name":"汀洲回首花满衣","zmf_batch":41,"run":true,"image":"../images/scenes/BV1NAHP6VE6x/s03.webp","id":"ZS-262"},{"bv":"BV1esJ263EX3","scene":0,"series":"灵动仙姿","title":"珠帘捧机","pal":"红金撞色","who":"人物","comp":"人物居中占约七成，碎水晶前景框景","motion":"珍珠流苏步摇/发丝/指尖点屏/水晶碎面反光","special":"戏中戏构图：显示器屏幕框+碎水晶前景、珍珠流苏步摇、金殿蓝空背景","note":"画中画：外层是显示器与木桌，内层是壁纸世界","prompt_moss":"金衣少女自碎水晶裂窗后捧金色手机低头点按，珍珠流苏步摇，红调眼妆，金殿蓝空背景。主光为暖金。","prompt_zmf":"横画幅中式幻想人物中景，平视。画面中央一位女子侧身而立，双手捧着一块透出微光的小方匣，头微低看向掌心；她的两侧垂落着成串的珠帘，帘线自画面上缘垂到腰际。\n\n她为鹅蛋脸，眉眼细长，眼尾上挑，唇色朱红；乌黑长发自顶心垂落，发间缀着细小的珠饰，两侧垂着长流苏。\n\n她身着月白与淡金相间的宽袖长袍，领缘绣着细密的缠枝纹，袖口垂到手腕以下；外层罩着一层极薄的纱，纱面被珠帘的光点映出细碎的高光；腰间束着浅金的软带。\n\n背景为深蓝的夜色，散着星点与光斑；珠帘的珠子半透，折射出蓝白的光；她的身后隐约有木构廊柱与窗棂的轮廓，全部没入暗部。主光为掌中小方匣透出的冷白微光，自下方照亮她的下颌、手指与衣料的褶皱；轮廓由背后的暖金余光勾出，暗部占画面约五成。\n\n空气中浮着细小的光尘，前景的珠帘与手指清晰，背景的木构虚化；月白、淡金与深蓝交织，整体呈厚涂油画质感的东方人物中景，静谧而幽微。","zmf_name":"珠帘捧匣","zmf_batch":49,"run":true,"image":"../images/scenes/BV1esJ263EX3/s00.webp","id":"ZS-263"},{"bv":"BV1esJ263EX3","scene":2,"series":"灵动仙姿","title":"一指星河锁屏","pal":"红金撞色","who":"人物","comp":"锁屏 UI + 人物居中偏左占约七成","motion":"指尖星河光球旋转/光尘环绕/发丝/披帛","special":"金边手机锁屏、时钟 11:53 10/15 18°、蓝金龙纹抹胸裙、题字「一指星河」与文案「指尖轻抬，万千星辉为你流转」","note":"","prompt_moss":"蓝金龙纹抹胸裙女子指尖托星河光球，锁屏时钟与题字「一指星河」叠加，长发扬右。主光为星河暖金。","prompt_zmf":"横画幅中式幻想人像特写，画面中央一位华服的女子侧身而立，她的食指轻轻上挑，指尖挑起一圈旋转的星河光环：光环的金蓝色星尘环绕她的指尖流转，星尘的光点洒落她的肩头，她的回眸眼神清冷而慵懒。\n\n女子乌黑长发披落，长发被星环的风掀起飘向一侧，发间的金饰与珠链闪烁；她的侧脸清丽，眼尾上挑，回眸的眼神慵懒而傲然，唇色朱红。她身着宝蓝与金红相间的织锦华服：衣料的织锦上金线的龙纹与星纹交织，肩头的白纱披帛被星环的风掀成流动的纱浪，纱料自她的肩头向画面右侧铺展；她挑起星环的食指纤细，指甲上染着金色的甲油，星环绕指旋转。\n\n星河的光环为半透明的星尘带：环身的星点有大有小，大的星点拖着细细的光尾，星尘的颜色自金蓝到紫粉渐变，环带的旋转带着流动的模糊；光环之外，几缕金色的星河丝带自画面顶端垂落飘荡。背景的天空为深蓝与暗红交界的星云，星云的纹理如大理石的花纹。主光为星环的星尘自发光，自她的指尖辐射，照亮她的侧脸轮廓、织金的纹样与纱浪的边缘；背景星云的暗部呈深蓝紫。\n\n空气中弥漫着星尘与流光，前景挑起星环的指尖与流转的星尘清晰，星河丝带飘荡；宝蓝织金、星尘光环与深蓝星云对撞，整体呈厚涂油画质感的东方一指星河，慵懒而璀璨。","zmf_name":"一指挑起星河环","zmf_batch":40,"run":true,"image":"../images/scenes/BV1esJ263EX3/s02.webp","id":"ZS-264"},{"bv":"BV1TtJQ6yECg","scene":0,"series":"幽都渡世","title":"阴差提灯","pal":"冥暗红","who":"人物","comp":"剪影居左，桥与城横贯","motion":"灯焰/红云翻涌/远处阴差列队行","special":"灯杖、城墙剪影、熔岩天","note":"剪影主导构图","prompt_moss":"一名阴差提灯杖立于桥头剪影，熔岩色天幕下城墙横贯远景，远处有阴差队列行进。主光为熔岩红。","prompt_zmf":"横画幅中式冥界场景，平视中景。画面中央偏左一位高帽的阴差背身而立，右手提着一盏纸灯，衣摆垂到地面；身前是一条向纵深收窄的峡谷，两侧崖壁被火光照成暗红。\n\n阴差几乎全为剪影：宽檐高帽、垂落的袍袖、直挺的肩背；提灯的手骨节分明，灯光自下照出袍面的暗纹与鞋尖。\n\n他身着深黑官袍，腰间束着暗红的带，袍角被谷风吹起一角；纸灯为白纸糊成，骨架清晰，灯面映着暖光。\n\n峡谷两壁为层叠岩层，红色火光自崖缝间渗出，把崖面照成暗红与炭黑；远处谷道上排着一列提灯的队伍，灯火连成虚线；谷顶横着一道石桥，桥身轮廓压在画面上缘。主光为纸灯与远处火光的暖橙，自下方与前方照亮袍角、手部与谷道石面；其余部分沉在深黑里，暗部约占画面六成。\n\n空气中弥漫着烟气与浮尘，前景的灯与袍角清晰，远处的队伍与石桥虚化；暗红、墨黑与暖橙对撞，整体呈厚涂油画质感的东方阴差提灯，沉郁而肃杀。","zmf_name":"阴差提灯","zmf_batch":48,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s00.webp","id":"ZS-265"},{"bv":"BV1TtJQ6yECg","scene":1,"series":"幽都渡世","title":"幽都火门","pal":"冥暗红","who":"无人物","comp":"对称纵深，门占中","motion":"门内瀑布状火光倾泻/黑舟渡/雾","special":"倒悬火瀑城门、渡舟","note":"对称构图","prompt_moss":"幽都城门内一道火瀑倾泻而下，黑舟渡水，对称一点透视。主光为火瀑自发光。","prompt_zmf":"横画幅中式暗黑幻想大场景，对称构图：画面中央一座多层重檐的幽都城门横贯画面，门身为暗黑的重楼结构，正中央的门洞中喷涌出一道巨大的火瀑，火瀑垂直落入门前的水面，激起冲天的白汽。\n\n幽都的城门为层叠的黑色重楼：一重重的飞檐自门洞向上堆叠，檐角的轮廓在火光中呈暗红色的剪影，门楼的两侧对称延伸出绵长的城墙与角楼，城墙上的灯火点点；门洞高大深邃，门洞内为炽亮的橙红色火瀑，火焰如液态的光自门内倾泻，火瀑的下沿没入门前的水面，激起大片白色的蒸汽与水雾，蒸汽升腾包裹住门楼的下半部。\n\n门前的水面为暗色的平湖，湖面倒映着火瀑的红光与城门的剪影，倒影被细浪揉碎；湖面上泊着一艘黑色的小船，船上一点渔火；湖岸的两侧各立着一盏石灯，灯焰的暖光微小而坚定。天空为绛红与暗紫交界的暮色，厚重的云层压向城门的两侧。主光为门洞火瀑的橙红自发光，自画面中央对称辐射，照亮城门的剪影轮廓、水面的倒影与两侧的石灯；城门与天空的暗部呈暗红与墨黑，占约五成。\n\n空气中弥漫着火瀑的烟尘与水汽，前景水面倒影与石灯清晰，火瀑保持垂直倾泻的对称动势；橙红火瀑、墨黑重楼与绛红天空对撞，整体呈厚涂油画质感的东方幽都火门，肃穆而震撼。","zmf_name":"幽都火门","zmf_batch":25,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s01.webp","id":"ZS-266"},{"bv":"BV1TtJQ6yECg","scene":2,"series":"幽都渡世","title":"幽谷悬钟","pal":"冥暗红","who":"无人物","comp":"大景，钟悬中央","motion":"钟微摆/雾漫/火星飘","special":"悬空巨钟、崖壁城郭","note":"奇观大景","prompt_moss":"一只巨钟悬于两崖之间铁链上，谷底有幽都城郭灯火微明。主光为暖光。","prompt_zmf":"横画幅中式暗黑幻想大场景，对称构图：一座巨大的青铜古钟悬在幽暗峡谷的正中央上空，钟口朝下，钟体被四条粗大的铁链吊在画面顶端的横梁上，峡谷底部的正中坐落着一座黑瓦大殿。\n\n古钟的钟身为青黑色，钟腹布满绿色的铜锈与模糊的铭文带，钟口边缘铸着一圈饕餮纹，钟体在雾中显得庞大而沉重；铁链的每一环都清晰可辨，链条没入画面顶部的黑暗中。谷底的殿宇为重檐黑瓦的木构大殿，殿前的广场空无一人，殿门紧闭，檐角的铜铃静止。两侧的峡谷崖壁陡峭高耸，崖壁上开凿着层层叠叠的小小窑洞与悬空栈道，栈道与崖壁上点缀着成百上千盏暖橙色的灯火，如星海般沿崖壁铺开。\n\n峡谷中弥漫着乳白色的浓雾，雾气在钟底与殿宇之间缓缓流动，几缕雾丝缠绕钟身。远处峡谷的尽头透出一片暖红色的微光。主光为崖壁灯海的暖橙自发光与峡谷顶部漏下的青白天光，冷暖在雾中交融；钟体的暗面呈青黑色，暗部占约五成。\n\n空气中弥漫着浓重的雾气与悬浮的尘埃，前景钟体的铜锈纹理清晰，崖壁的灯海没入焦外化作光斑；青黑、暖橙与乳白雾色三色交织，整体呈厚涂油画质感的东方悬钟奇观，幽深而庄严。","zmf_name":"幽谷悬钟","zmf_batch":7,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s02.webp","id":"ZS-267"},{"bv":"BV1TtJQ6yECg","scene":3,"series":"幽都渡世","title":"火海巨鼎","pal":"冥暗红","who":"人物","comp":"大景小人居右","motion":"鼎内熔浆翻/火雨/衣摆","special":"熔岩巨鼎","note":"大景小人","prompt_moss":"一座熔岩巨鼎浮于火海之上，一名行者剪影立于鼎侧仰望。主光为熔岩光。","prompt_zmf":"横画幅中式暗黑幻想大场景，大景小人的构图：幽暗的大殿中央一只巨大的青铜巨鼎，鼎中金色的火海沸腾翻涌，鼎边的地面一位蓝衣人的小小身影仰望巨鼎，鼎下的大地布满发光的火纹。\n\n巨鼎的鼎身为暗青铜色，鼎腹上布满饕餮纹与云雷纹的浮雕，鼎耳如兽首般立在鼎沿两侧，鼎足粗壮如柱；鼎中的火海为熔金色，金色的火浪自鼎沿翻涌而出，火星与金色的火雨自鼎中喷薄，鼎口升腾起滚滚的金色烟雾，烟雾在大殿的穹顶下盘旋。鼎下的圆形台基上刻着一圈圈发光的火纹符阵，符阵的光自鼎足向外辐射，一圈圈亮度递减。\n\n蓝衣人的身影立于台基的边缘，玄蓝色的长袍与黑发在鼎光的映衬下轮廓分明，他仰头的姿态在巨鼎的尺度下显得渺小。背景的大殿幽暗深邃：两侧的廊柱与帷幕层层没入黑暗，殿顶的藻井隐约可见；殿外的天光自高窗透入一线。主光为鼎中火海的金色自发光，自画面中央辐射，照亮鼎身的浮雕、符阵的光纹与蓝衣人的轮廓；殿内的暗部呈焦黑与深褐，占约五成。\n\n空气中弥漫着金色的火星与浓烟，前景鼎身的浮雕与符阵清晰，大殿纵深层层虚化；熔金火海、青铜鼎身与幽暗大殿对撞，整体呈厚涂油画质感的东方巨鼎炼火，庄严而压迫。","zmf_name":"火海巨鼎","zmf_batch":20,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s03.webp","id":"ZS-268"},{"bv":"BV1TtJQ6yECg","scene":4,"series":"幽都渡世","title":"纸钱落川","pal":"冥暗红","who":"无人物","comp":"峡谷纵深","motion":"纸钱如雪片纷落/青灰云走","special":"纸钱雨","note":"纸钱是主要运动介质","prompt_moss":"金色纸钱如雪片漫天飘落铺满幽冥峡谷河床，青灰天光。主光为漫射光。","prompt_zmf":"横画幅中式暗黑幻想大场景，纸钱如川流席卷峡谷：成千上万张米黄色的纸币汇成一条流动的纸川，纸川沿峡谷的谷底奔涌，川流的上方，纸币在半空中盘旋成雾，峡谷两侧的岩壁幽暗高耸，谷底的黑瓦殿宇剪影肃立。\n\n纸川为主体：纸币层层叠叠汇成川流，川流的表面如水波般起伏，纸币的边缘翻卷着白色的浪沫，川流的中央隆起一道纸浪的脊线，脊线上的纸币被风卷起半空，旋转成雾状的纸云；纸川的流向自画面的深处向近处奔涌，奔涌的动势如江河决堤。峡谷的两侧崖壁为暗青黑色的层叠岩体，崖壁的栈道与残破的殿宇剪影肃立，殿宇的黑瓦轮廓在天光下分明。\n\n谷底的黑瓦殿宇为多重的重檐结构，殿前的石阶上立着两盏石灯，灯焰的暖光微小；殿宇的背后，一道青白色的天光自云层的裂隙漏下，照亮纸川远端的雾气。主光为谷顶漏下的青白冷光，穿透纸雾投下斑驳的光柱，照亮纸川的起伏层次与殿宇的剪影；峡谷的暗部呈青黑与暗褐，占约五成。\n\n空气中弥漫着纸屑与阴冷的雾气，前景纸川的奔涌与纸币的翻卷清晰，殿宇剪影肃穆；米黄纸川、青黑峡谷与冷白天光对撞，整体呈厚涂油画质感的东方纸钱落川，苍凉而磅礴。","zmf_name":"纸钱落川","zmf_batch":33,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s04.webp","id":"ZS-269"},{"bv":"BV1TtJQ6yECg","scene":5,"series":"幽都渡世","title":"纸钱风暴","pal":"冥暗红","who":"无人物","comp":"满屏纷飞","motion":"纸钱漩涡扑面","special":"纸钱风暴","note":"风暴段：密度更高","prompt_moss":"金色纸钱形成漩涡扑面而来充满画面。主光为纸钱的金色。","prompt_zmf":"横画幅中式暗黑幻想大场景，一场密度极高的纸钱风暴席卷整条峡谷：成千上万张米黄色的纸币在峡谷中横飞旋舞，纸浪如潮水般扑面而来，几乎吞没画面，谷底的殿宇在纸浪的缝隙里隐约可见。\n\n纸钱风暴的密度极高：纸币在画面中层层叠叠，近处的纸币巨大而清晰，纸面上印着模糊的文字与圆孔，纸币的边缘被风撕裂出毛边；中景的纸币成群结队地翻卷，形成数道纸浪的波峰，波峰的走向自画面左下向右上倾斜，如海啸的浪墙；远处的纸币密成一片米黄色的雾，把谷底的天空遮蔽。纸浪的缝隙里，峡谷的暗青色崖壁与一座黑瓦殿宇的轮廓隐约可见，殿前的两盏孤灯在纸浪中明灭。\n\n谷底的地面上积着厚厚的纸钱层，纸钱的边角在风中此起彼伏地翻动；几条暗红色的绳索自画面上方垂落，绳索上原本系着的纸幡已被风暴扯得七零八落。主光为自谷顶漏下的青白冷光，穿过纸浪的缝隙投下斑驳的光柱，照亮纸币的翻飞层次；纸浪的背光面与峡谷暗部呈青黑与暗褐，占约五成。\n\n空气中弥漫着纸屑与阴冷的雾，前景扑面而来的纸币清晰锐利，纸浪深处虚化成雾；米黄纸浪与青黑峡谷对撞，整体呈厚涂油画质感的东方纸钱风暴，压抑而磅礴。","zmf_name":"纸钱风暴","zmf_batch":21,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s05.webp","id":"ZS-270"},{"bv":"BV1TtJQ6yECg","scene":6,"series":"幽都渡世","title":"纸钱峡谷","pal":"冥暗红","who":"无人物","comp":"纵深纵列","motion":"纸钱漫天/雾","special":"纸钱","note":"同族场景变体","prompt_moss":"金色纸钱铺满幽冥峡谷河床并在空中缓飘，崖壁高耸。主光为漫射光。","prompt_zmf":"横画幅中式暗黑幻想大场景，峡谷中的纸钱风暴变体：巨大的纸幡与纸币如浪潮自峡谷的深处扑面而来，纸浪的高度盖过峡谷的半壁，纸面的暗纹与圆孔清晰，谷底的道路被纸浪掩埋。\n\n纸浪的主体为巨大的暗黄色纸幡：每一张纸幡都有门板大小，纸面上印着褪色的符文与圆孔，纸幡在风中翻卷，边缘撕裂成絮；纸幡的浪潮自峡谷的深处涌来，浪潮的弧面如海啸的浪墙，浪墙的顶端卷着无数小纸币的旋涡，旋涡的纸屑漫天飞舞；浪墙的破口处，几面残破的红旗挂在绳索上挣扎飘动。\n\n峡谷的崖壁为青黑色的层叠岩体，崖壁上的栈道与悬空的殿宇被纸浪半掩，殿宇的飞檐自纸浪的缝隙探出；谷底的道路上积着厚厚的纸层，纸层里露出几盏熄灭的灯笼。远处的谷道尽头，一道青白色的天光自云隙漏下，照亮纸浪的背面，纸浪的边缘在逆光中透亮。主光为谷顶漏下的青白冷光，穿透纸浪的缝隙形成光柱，照亮纸幡的翻卷层次；纸浪的暗部与峡谷呈青黑与暗褐，占约五成。\n\n空气中弥漫着纸屑与阴冷的雾，前景扑面的纸幡纹理清晰，纸浪深处虚化成雾；暗黄纸浪与青黑峡谷对撞，整体呈厚涂油画质感的东方纸钱峡谷，压抑而磅礴。","zmf_name":"纸钱峡谷变体","zmf_batch":26,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s06.webp","id":"ZS-271"},{"bv":"BV1TtJQ6yECg","scene":7,"series":"幽都渡世","title":"纸雨同行","pal":"冥暗红","who":"人物群","comp":"大景小人居中下","motion":"纸钱落/两人缓行","special":"纸钱雨","note":"大景小人","prompt_moss":"两个剪影小人牵手走在纸钱纷落的谷底。主光为漫射光。","prompt_zmf":"横画幅中式暗黑幻想大场景，大景小人的构图：幽暗的峡谷谷底，两位身穿黑衣的身影并肩行走在铺满纸钱的谷道上，漫天的纸币如雨自画面上方纷飞而下，纸雨的涡流填满整个峡谷。\n\n两位黑衣人的身影很小，位于画面中央偏下的谷道上，一人提着灯，一人背着行囊，并肩而行，他们的衣摆被纸雨的风掀起；谷道为青灰色的石板路，路面上铺满了一层厚厚的米黄色纸钱，纸钱的边角被风卷起。\n\n漫天的纸雨是画面的主体：成千上万张米黄色的纸币自画面顶端的黑暗中飘落，纸币在半空中旋转、翻飞，中央偏上处一道龙卷状的纸风涡旋而起，把成群的纸币卷成螺旋的柱状，纸涡的边缘散开如花瓣；纸雨的密度自上而下渐稀，落在地面上的纸钱层层叠叠铺满整条谷道，向谷道的深处延伸。峡谷的崖壁为暗青黑色的层叠岩体，崖壁上隐约可见悬空的栈道与一点孤灯的光。远处的谷道尽头，一座暗色的殿宇轮廓没入纸雨的深处。主光为自谷顶漏下的青白冷光，照亮纸币飘落的层次与两位行人的背影轮廓；峡谷与纸雨的暗部呈青黑与暗褐，占约五成。\n\n空气中弥漫着纸屑与阴冷的雾气，前景谷道上的纸钱与行人的背影清晰，纸雨的涡流保持整体的旋绕动势；米黄纸雨与青黑峡谷对撞，整体呈厚涂油画质感的东方纸雨冥途，苍凉而诡谲。","zmf_name":"纸雨同行","zmf_batch":17,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s07.webp","id":"ZS-272"},{"bv":"BV1TtJQ6yECg","scene":8,"series":"幽都渡世","title":"幽海立浪","pal":"冥暗红","who":"人物","comp":"大景小人，浪占上半","motion":"青灰巨浪壁立翻卷/雾","special":"百米浪墙","note":"奇观大景","prompt_moss":"一面百米高的青灰浪墙在两崖间壁立翻卷，岸上有一人剪影仰望。主光为浪顶漫射。","prompt_zmf":"横画幅中式暗黑幻想大场景，奇观构图：幽暗的黑色海面上，一道青蓝色的巨浪如山岳般立起，浪身卷曲成弧形的浪墙，浪墙下方的山道上，一位提着灯笼的小小人影沿路独行，画面充满压迫感的静谧。\n\n立起的巨浪占据了画面的中央偏右：浪身为半透明的青蓝色，浪壁的弧面上布满流动的水纹与白色的泡沫纹路，浪尖翻卷着白色的浪花，浪的高度远超两侧的黑色山崖；浪壁的透光处泛着月色的青白，浪的内侧卷着深蓝色的水影，浪底与海面相接处溅起漫天的水雾。\n\n山道沿画面的左下延伸向远方：石板路的路面湿润，倒映着路灯与浪墙的青光；独行者的身影极小，斗篷与提灯的剪影清晰，他的灯光在青蓝色的画面里是唯一的暖色。两侧的黑色山崖高耸，崖壁的肌理隐约可见，崖顶的天际透出一线暗金色的暮光。主光为浪墙的月色青光与路灯的暖黄光对撞，照亮浪壁的水纹层次与行人的剪影；崖体与海面的暗部呈墨黑，占约六成。\n\n空气中弥漫着浓重的水雾与浪沫，前景石板路的倒影与提灯的行人清晰，浪墙保持立起的整体压迫感；青蓝浪墙、墨黑天地与一点暖黄灯影对撞，整体呈厚涂油画质感的东方幽海立浪，静谧而震撼。","zmf_name":"幽海立浪","zmf_batch":24,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s08.webp","id":"ZS-273"},{"bv":"BV1TtJQ6yECg","scene":9,"series":"幽都渡世","title":"月门望幽都","pal":"冥暗红","who":"无人物","comp":"圆门框景","motion":"门内粉雾涌/灯影","special":"圆形月门","note":"框景构图","prompt_moss":"一座圆形月门框住门内粉红雾气与幽都楼阁灯火。主光为门内暖光。","prompt_zmf":"横画幅中式暗黑幻想大场景，框景构图：画面中央一座巨大的圆形石月门，门洞如一轮圆月，透过门洞望见门内的幽都全境——火光中的水城、拱桥与层叠的殿宇；月门的石壁厚重古朴，门前的石板路与两侧的石灯肃穆。\n\n月门的石壁为青黑色的巨石，门沿的雕纹被岁月磨圆，门洞的边缘挂着一层暗红色的苔痕；透过门洞的圆，幽都的全景如一幅画：门内的河道泛着暗红的火光倒影，一座多孔的石拱桥横跨河面，桥后是层层升高的黑瓦殿宇，殿宇的灯火成串，远处的殿群沿水岸铺展，天空被火光染成绛红与暗紫的渐变；门洞的圆框把这一切框成一幅画。\n\n月门前的石板路自画面下缘延伸至门洞，路面的石板湿润，倒映着门内的红光；路的两侧各立着一盏兽首石灯，兽口吐出的灯焰在风中摇曳；门洞的两侧，黑色的高墙与廊柱框住画面，墙头的轮廓在暗色中分明。主光为门内幽都的绛红火光，自门洞的中心辐射，照亮石门内缘的苔痕、石板路的湿润反光与两侧石灯的焰心；月门外围的暗部呈墨黑，占约五成。\n\n空气中弥漫着冥途的雾气与远火的烟，前景月门的石纹与石灯清晰，门内幽都的景深层层虚化；绛红幽都、青黑月门与暖红河光对撞，整体呈厚涂油画质感的东方月门望幽都，框景幽深而庄严。","zmf_name":"月门框景望幽都","zmf_batch":40,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s09.webp","id":"ZS-274"},{"bv":"BV1TtJQ6yECg","scene":10,"series":"幽都渡世","title":"奈何桥上","pal":"冥暗红","who":"人物群","comp":"对称大拱桥纵深","motion":"桥下火光/人影鱼贯/雾","special":"奈何桥","note":"对称纵深","prompt_moss":"一座石拱桥横跨火河，一列人影鱼贯过桥，桥拱倒影于暗水。主光为桥下火光。","prompt_zmf":"横画幅中式暗黑幻想大场景，对称纵深构图：一座巨大的石拱桥横跨画面的中央，桥身的中央桥洞透出对岸的火光，桥的尽头是一座灯火通明的大殿，桥的两侧石栏上挂着成排的灯笼，桥下的河水映着火光。\n\n石拱桥的桥身为青灰色的巨石砌成，桥面的石板路自画面的下缘笔直延伸向桥顶，桥身的中央桥洞为半圆的拱形，桥洞的对岸透出炽烈的橙红光，光把桥洞的内壁映成火焰的颜色；桥洞的上方，殿宇的重檐剪影层叠，殿前的旗幡成排。桥的两侧石栏对称：石栏的望柱头上各挂着一盏方形石灯，石灯的火光沿桥的两侧排成两列，光列的透视纵深感强烈；桥下的河水暗流涌动，河面的倒影把桥洞的火光揉成流动的红。\n\n殿宇的剪影为多层重檐的黑瓦殿宇，殿身的轮廓在对称的中轴上庄严；桥的两端各立着一座石雕的灯亭，灯亭的飞檐精致。背景的天空为暗青色，云层的边缘透出殿后火海的微光。主光为桥洞对岸的炽红光与石灯的暖黄光交织，自画面中央纵深辐射，照亮桥身的石纹、石栏的灯列与河面的倒影；桥体与天空的暗部呈青黑，占约五成。\n\n空气中弥漫着火光的烟尘与水汽，前景石灯的灯列与桥面的石板清晰，对称的纵深层层递进至殿宇；炽红桥洞、青灰石桥与暗青天幕对撞，整体呈厚涂油画质感的东方奈何桥，对称而幽深。","zmf_name":"奈何桥对称纵深","zmf_batch":32,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s10.webp","id":"ZS-275"},{"bv":"BV1TtJQ6yECg","scene":11,"series":"幽都渡世","title":"轮回转盘","pal":"冥暗红","who":"无人物","comp":"居中悬浮","motion":"盘面轮转/光斑/雾","special":"发光轮回盘","note":"居中奇观","prompt_moss":"一座发光的轮回巨盘悬于暗色水面之上自转，辐条辐射暗金光。主光为盘面自发光。","prompt_zmf":"横画幅中式暗黑幻想奇观，居中对称构图：幽暗的巨殿中央矗立着一座巨大的圆形转盘，转盘如一座立体的轮回法轮，盘面的辐条与轮齿间燃烧着金色的火光，转盘的四周环绕着层层的黑色看台与石柱。\n\n转盘的直径横贯画面的中央：盘面的中心为一根粗大的轴柱，轴柱向四周辐射出十二条粗壮的辐条，辐条的末端连接着轮缘的轮齿；每一根辐条之间都燃烧着金色的火焰，火焰自轮心向轮缘流淌，把盘面照成熔金色；轮缘的轮齿间镶嵌着发光的符文，符文的金字在火光中明灭。转盘缓缓转动，转动中带起细小的火星环绕盘身。\n\n转盘的四周为层层的黑色看台：看台如环形的阶梯环绕转盘，看台上的石柱与帷幕的剪影重重叠叠，看台的边缘点缀着几盏孤灯，灯焰在黑暗中如豆；看台的高处，几位黑袍的身影倚栏俯瞰转盘，身影小如尘点。殿顶的黑暗中垂下几条粗大的锁链，锁链连着转盘的轴柱。主光为转盘的金色自发光，自画面中央辐射，照亮看台的轮廓、石柱的边缘与锁链的链环；殿内的暗部呈焦黑与暗红，占约六成。\n\n空气中弥漫着火光升腾的烟尘与火星，前景转盘的辐条与火焰清晰，看台层层虚化；熔金转盘、焦黑看台与暗红天幕对撞，整体呈厚涂油画质感的东方轮回转盘，庄严而诡秘。","zmf_name":"轮回转盘","zmf_batch":27,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s11.webp","id":"ZS-276"},{"bv":"BV1TtJQ6yECg","scene":12,"series":"幽都渡世","title":"火树金桥","pal":"冥暗红","who":"无人物","comp":"横贯对称","motion":"火树光瀑/桥下波光","special":"火树、金桥","note":"对称奇观","prompt_moss":"一株燃烧的金树横跨石桥，枝干如火焰脉络，光瀑自枝缘垂落水面。主光为火树自发光。","prompt_zmf":"横画幅中式暗黑幻想大场景，对称构图：一条巨大的金白色瀑布自两座暗色崖壁之间整体倾泻，瀑布的正下方横着一座金色的石桥，桥面的石板湿润如镜，映着瀑身的金光；桥的中心，一位黑袍人背身独立，面向瀑布的深处。\n\n瀑布自两崖之间的山口整体垂落：瀑身的水流为熔金色，水流的表面如流动的金绸，瀑布砸落潭中激起的水雾为金白色，水雾升腾包裹住桥的远端；瀑布的两侧崖壁为暗红与焦黑相间的岩体，岩壁上隐约可见凿出的洞窟与栈道，岩缝间的红色灌木垂落。\n\n金色的石桥横贯画面的下半部：桥面的石板被水雾打湿，石板的接缝里映着瀑光的金色；桥栏的望柱头上各挂着一盏暗色的灯笼，灯笼的火光微小。桥的中心，黑袍人的背身剪影独立，他的袍摆与长发被瀑风掀起，他的身形在巨大的瀑布尺度下极小。主光为瀑布的熔金自发光，自画面中央辐射，照亮桥面的湿润反光、崖壁的岩纹与黑袍人的轮廓；桥外与天空的暗部呈焦黑与暗青，占约五成。\n\n空气中弥漫着浓重的水雾与谷风，前景桥面的石纹与黑袍的剪影清晰，瀑布的整体倾泻动势磅礴；熔金瀑布、金色石桥与暗色崖壁对撞，整体呈厚涂油画质感的东方火瀑金桥，对称而苍茫。","zmf_name":"火瀑金桥对称","zmf_batch":41,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s12.webp","id":"ZS-277"},{"bv":"BV1TtJQ6yECg","scene":13,"series":"幽都渡世","title":"帘后幽坐","pal":"冥暗红","who":"无人物","comp":"对称帘瀑","motion":"水帘垂落/雾","special":"水帘、山影佛坐","note":"对称构图","prompt_moss":"白色水帘如帷幔对称垂落，帘后隐约可见一尊趺坐的山影。主光为水帘透光。","prompt_zmf":"横画幅中式暗黑幻想场景，对称构图：一幅巨大的朱红色帷幔自画面顶部垂直垂落，占据画面上半部的中央，帷幔下摆撕裂成飘动的碎条；帷幔之下的暗殿中央，一位官服人物的黑色剪影端坐于高台之上，正对镜头。\n\n坐者身形端正如钟，宽袍大袖铺展在台面上，头戴官帽，帽翅向两侧平伸，整个人物为纯黑剪影，只有衣缘与帽翅的轮廓被殿内的火光染上一线暗红。他面前的地面湿润如墨镜，倒映着帷幔的红色与殿顶垂落的点点烛光。\n\n殿的两侧与远景是层层跌落的暗色楼阁与廊柱，成千上万的灯烛如星海般点亮，暖橙色的光点铺满整个背景空间，远处楼阁的剪影层层没入黑暗的虚化中。帷幔的后方透出一片更亮的红光，仿佛殿心有一炉巨大的火。主光为满殿烛火的自发光，从四面八方漫射，帷幔被红光染成浓烈的绛红与焦褐；暗部呈焦黑，占约五成，火星在空气中缓缓上浮。\n\n前景地面倒影清晰，中景帷幔的织物纹理与撕裂边缘锐利，远景灯海没入焦外化作圆形光斑；绛红、焦黑与烛金三色主导，对称庄严，整体呈厚涂油画质感的东方冥殿幻想，幽深而威压。","zmf_name":"帘后幽坐","zmf_batch":4,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s13.webp","id":"ZS-278"},{"bv":"BV1TtJQ6yECg","scene":14,"series":"幽都渡世","title":"鹤立花川","pal":"冥暗红","who":"动物","comp":"鹤居中，花海横铺","motion":"红瓣飘/鹤羽轻抖/水面纹","special":"白鹤、彼岸花海","note":"一点白对满川红","prompt_moss":"一只白鹤单足独立于无边彼岸花海中央回首理羽。主光为天顶微光。","prompt_zmf":"横画幅中式暗黑幻想场景，极简构图：一只通体雪白的长尾鹤独立在暗红色的花川水面上，一点白对满川红，鹤的身影居于画面中央偏右，水面倒映着它的白影与漫川的红色花影。\n\n白鹤的通体羽毛为乳白色，颈羽细腻如丝，头顶立着一撮白色的冠羽，长喙为青灰色，末端尖锐；它的尾羽极长，数根白色的长羽向后拖曳延伸，几乎横过半个画面，羽尖微微下垂触到水面；它的双腿细长，一前一后站在浅水中，姿态孤傲。它的头微微回转，黄色的眼瞳平静地望向画面左侧。\n\n花川的水面平缓如镜，红色的花海沿水岸铺满画面的四周：暗红色的花朵层层叠叠，花粉与红色的雾气弥漫在低空，把整个天地染成绛红色；远处的花川深处隐约可见几座暗色的亭塔剪影与灰白色的崖壁，崖壁的肌理在红雾中若隐若现。主光为弥漫的暗红环境光，无明显方向，白鹤的羽毛自发光般突出于红色的画面，羽缘泛着冷白的银光；暗部呈绛红与暗褐，占约六成。\n\n空气中弥漫着红色的花雾与飘絮，前景白鹤的长尾羽与水面倒影清晰，远景亭塔没入焦外；绛红满幅与一点雪白对撞，整体呈厚涂油画质感的东方鹤立花川，孤高而神秘。","zmf_name":"鹤立花川","zmf_batch":13,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s14.webp","id":"ZS-279"},{"bv":"BV1TtJQ6yECg","scene":15,"series":"幽都渡世","title":"锁链吊炉","pal":"冥暗红","who":"无人物","comp":"居中悬吊","motion":"粗链晃/白雾喷涌/火星","special":"巨锁链、吊炉","note":"居中奇观","prompt_moss":"一口巨炉被粗铁锁链悬吊于暗色穹顶，白雾自炉口猛烈喷出。主光为炉口火光。","prompt_zmf":"横画幅中式暗黑幻想奇观，居中对称构图：两条粗大的青铜锁链自画面顶端垂直垂下，锁链的末端吊着一座巨大的圆形火炉，炉中喷涌出的白色蒸汽如爆炸般向四周炸开，炉下的熔岩火海映红洞窟的岩壁。\n\n锁链的每一环都如磨盘般巨大，链环的青铜锈迹与铆钉清晰，两条锁链自洞顶的黑暗中垂落，吊着炉身的两侧；火炉为青铜的圆鼎形，炉身的浮雕纹样被火光照亮，炉口朝天，炉中喷出的蒸汽呈爆炸的球状向四周炸开，蒸汽的根部为橙红色的火光，中段翻卷成白色的浓雾，雾球的边缘撕成丝絮状向洞窟的四周弥漫。\n\n炉下的熔岩火海为橙红色，火海的液态光沿洞窟的地面流淌，地面石缝间的熔岩细流如血管般蔓延发光；洞窟的两侧各架着一座木桥，桥栏的朱红漆色在火光下鲜艳，桥上的石灯亮着微光。洞窟的岩壁为层叠的暗色岩体，岩壁上的栈道与洞龛隐约可见，几盏孤灯点缀在岩壁的高处。主光为炉中喷薄的火光与熔岩的红光，自画面中央辐射，照亮锁链的链环、蒸汽的球状层次与岩壁的肌理；洞窟的边缘暗部呈焦黑，占约五成。\n\n空气中弥漫着浓重的蒸汽与火星，前景锁链的链环与蒸汽的爆裂感清晰，火海与岩壁的纵深感强烈；橙红火海、青铜锁链与白色蒸汽对撞，整体呈厚涂油画质感的东方锁链吊炉，压抑而震撼。","zmf_name":"锁链吊炉","zmf_batch":28,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s15.webp","id":"ZS-280"},{"bv":"BV1TtJQ6yECg","scene":16,"series":"幽都渡世","title":"熔岩地脉","pal":"冥暗红","who":"无人物","comp":"满屏纹理","motion":"熔浆脉动/黑烟升","special":"熔岩裂纹","note":"纹理大景","prompt_moss":"暗红色熔岩裂纹在黑色火山岩表面交错如叶脉，黑烟自裂缝升起。主光为熔岩自发光。","prompt_zmf":"横画幅中式暗黑幻想大场景，无人物：一座暗红色的山脉自内部透出光，熔岩的地脉如发光的树根与河流，在黑色的山体表面蔓延分叉，山的底部与远处的殿宇剪影被火光笼罩。\n\n地脉的主干自画面中央的山顶迸发，如一条炽亮的橙金色光河沿山脊向下奔流，在流淌中分叉成千百条细小的支脉，每一条支脉都在黑色的岩层间蜿蜒发光，如同大地的血管；支脉的末梢最亮，把周围的岩石烧成透亮的红橙色，远离地脉的岩体则沉入焦黑的暗色。山体的皲裂肌理清晰，裂缝的深处透出岩浆的红光。\n\n山脚下是一片暗色的平原，平原上矗立着几座黑色多层檐的殿宇与塔楼剪影，殿宇的窗洞里透出微弱的橙光；天空为绛红与暗紫交界的暮色，浓烟状的云缓缓翻卷，火星随风飘散。主光为地脉的熔金自发光，从画面的中央向四周辐射，照亮岩层的皲裂边缘与殿宇的轮廓；画面边缘的暗部呈焦黑，占约五成。\n\n空气中弥漫着烟尘与飘落的火星，前景地脉支脉的光纹清晰，远景殿群与天空没入焦外的红雾；熔金、焦黑与绛红三色主导，整体呈厚涂油画质感的东方地脉奇观，炽烈而苍茫。","zmf_name":"熔岩地脉","zmf_batch":12,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s16.webp","id":"ZS-281"},{"bv":"BV1TtJQ6yECg","scene":17,"series":"幽都渡世","title":"判官录籍","pal":"冥暗红","who":"人物/妖","comp":"侧俯案特写","motion":"笔走/烛焰/纸页","special":"牛头判官、生死簿","note":"人物特写","prompt_moss":"一名牛头判官伏在巨大生死簿案前执笔疾书，烛光照亮鼻梁与簿页。主光为烛光。","prompt_zmf":"横画幅中式暗黑幻想人像特写，画面中央一位马首人身的判官伏在案前录籍：他的马首低垂，马鬃披落，身披蓝甲红袍，前蹄握着一方金印，正郑重地在案上的卷册落下印记；他的四周是火光中的殿堂与堆积的案卷。\n\n判官的马首为深褐色，鬃毛自颈后披落如黑色的瀑，鬃间编着红色的绳结与铜环；他的马眼低垂，神情肃穆专注，口鼻的轮廓在火光下立体；他身披的甲胄为蓝底金纹的札甲，肩甲与护臂的甲片层层，红色的披帛自肩头垂落拖地；他的前蹄关节如手般灵活，稳稳握着一方铜铸的金印，印底的红印泥在卷册上留下鲜红的印记。\n\n案上的卷册摊开，册页上密密的墨字与朱批清晰；案角堆着成捆的案卷与几枚备用的金印，一枚朱红的印泥盒敞着盖。背景的殿堂为火光中的暗色空间：铜柱上缠着红绸，成排的灯架燃着火把，火把的光把殿堂染成橙红与暗金；殿顶的藻井隐入黑暗。主光为殿内火把的暖橙光，自右侧照亮判官的甲胄金纹、马鬃的层次与卷册的字迹；殿堂深处暗部呈焦黑与暗红，占约四成。\n\n空气中弥漫着火把的烟与尘，前景金印落册的动作与甲胄细节清晰，殿堂纵深虚化；蓝甲红袍、青铜金印与火光殿堂对撞，整体呈厚涂油画质感的东方判官录籍，庄严而诡谲。","zmf_name":"马首判官录籍","zmf_batch":38,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s17.webp","id":"ZS-282"},{"bv":"BV1TtJQ6yECg","scene":18,"series":"幽都渡世","title":"石鬼负城","pal":"冥暗红","who":"无人物","comp":"巨像居中，城在背上","motion":"雾绕/城灯火","special":"石化巨鬼、背上城郭","note":"奇观大景","prompt_moss":"一尊巨大石化恶鬼跪伏于地，整座城郭建在它的背上，灯火发光。主光为城郭灯火。","prompt_zmf":"横画幅中式荒原奇观大场景，平视略仰。画面中央一尊巨大的石龟状巨像匍匐在荒原上，龟背驮着一座层叠的宫殿群，龟首低垂，一只前爪踏在画面右下，爪尖的巨甲张得很开。\n\n巨像的壳面由嶙峋的黑灰岩石堆成，岩缝间长着枯草与苔，壳缘的岩块层层叠压；龟首的皮肉与岩石的质地混在一起，眼窝深陷，嘴角的石纹像皱纹；前爪的趾甲为灰白，趾缝间嵌着沙。\n\n龟背上的宫殿为重檐的楼阁，覆暗红的瓦，檐下立着成排的朱红小柱与廊桥，殿前的平台上垂着经幡；宫殿的屋顶与巨像的岩背融为一体，像从石头里长出来。\n\n背景为一片灰粉的雾原，雾气中隐约立着更多的石像与残塔，轮廓一层层淡去；画面前景的左下是一排木质的桩柱与栏杆，桩头的绳索垂着，提示着一条临水的栈道。主光为低角度的暖粉天光，自画面右后方照来，勾出龟背岩块的棱与宫殿的檐口，逆光把雾原染成粉尘般的玫瑰色；巨像的正面沉在阴影里，暗部呈冷灰紫。\n\n空气中弥漫着浓重的粉尘与雾霭，前景的桩柱清晰，远景的石像层层虚化；灰黑、暗红与灰粉三色交织，整体呈厚涂油画质感的东方石鬼负城，苍茫而诡异。","zmf_name":"石鬼负城","zmf_batch":44,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s18.webp","id":"ZS-283"},{"bv":"BV1TtJQ6yECg","scene":19,"series":"幽都渡世","title":"判官提灯","pal":"冥暗红","who":"人物","comp":"人物居中，幡字竖读","motion":"幡飘/灯焰/袖摆","special":"幽都渡世字幡","note":"人物行走","prompt_moss":"一名白衣判官提灯执幡行走，幡面写有竖排文字。主光为灯笼暖光。","prompt_zmf":"横画幅中式暗黑幻想人像场景，画面中央一位白袍高冠的判官提着灯笼行走：他的白袍宽大如云，袍摆被冥风掀起翻卷，他一手提着亮着暖光的六角灯笼，一手拄着一面高悬的白色幡牌，幡牌上的墨字清晰；他的身后，一条白色的长绸自天际横扫而过，冥途的远方是燃烧的火原与成排的牌坊。\n\n判官的高冠为白色的纸帽，帽身的墨字清晰；他的面容隐在冠檐的阴影下，只露出收敛的唇与下颌，神情不悲不喜。他的白袍为层叠的素白绸缎，袍面上隐约的暗纹在光下流动，腰间束着深色的绦带；他提灯的手臂抬起，灯笼的暖黄光自内透出，照亮他的衣缘与脚下的冥途；另一手拄着的幡牌高及头顶，牌面的墨字竖排。\n\n他身后的白色长绸自画面顶端的黑暗横扫而下，绸带的弧线如极光掠过，绸面的透光泛着冷白；冥途的两侧燃烧着大片暗红色的火原，火原的火苗低伏如赤色的麦浪，火原的尽头矗立着成排的青黑色牌坊与石灯，灯焰点点。主光为灯笼的暖黄光与火原的暗红光交织，照亮判官的白袍层次、幡牌的字迹与脚下的路；冥途的远方与天空的暗部呈墨青与焦黑，占约五成。\n\n空气中弥漫着火原的烟尘与冥途的雾气，前景判官提灯的姿态与幡牌的字迹清晰，火原与牌坊虚化；素白袍、暖黄灯笼与暗红火原对撞，整体呈厚涂油画质感的东方判官提灯，幽深而庄严。","zmf_name":"判官提灯行冥途","zmf_batch":39,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s19.webp","id":"ZS-284"},{"bv":"BV1TtJQ6yECg","scene":20,"series":"幽都渡世","title":"花原孤灯","pal":"冥暗红","who":"无人物","comp":"一点灯居中，花海四方","motion":"灯焰不动/红雾漫/花瓣落","special":"孤灯、彼岸花原","note":"极简构图","prompt_moss":"一盏孤灯立于无边彼岸花原的正中央，红雾缓漫，花瓣零星飘落。主光为孤灯自发光。","prompt_zmf":"横画幅中式暗黑幻想场景，极简对称构图：一片暗红色的花原之上，一条青灰色的石板长路笔直延伸向远方一扇发光的门形巨构，一位提着灯笼的小小人影正沿路独行，画面庄重而空旷。\n\n石板路的路面湿润，倒映着天光与两旁的红色花海；路的两侧长满齐腰深的暗红色花朵，花海如红色的潮水铺满整个画面下部，花丛间散落着几盏熄灭的旧灯笼。独行者身披斗篷，右手提着一盏暖黄的方灯，灯光在他脚边投下小小的光晕，他的身影在宏大的场景中显得极小。\n\n路的尽头是一扇竖直长方形的门形巨构，门框为暗色的石质，门洞内透出炽白偏暖的强光，光把门前的石阶染成金色；门的上方与四周是层叠的暗色重檐楼阁剪影，沿山谷两壁排开，轮廓在火红的天幕下层层收缩。天空为绛红与暗金交界的暮色，云层厚重。主光为门洞的强光与行者灯笼的暖光，一点一大遥相呼应；花原与楼阁的暗部呈暗红与焦黑，占约五成。\n\n空气中弥漫着红色的花瓣与薄雾，前景石板路面的倒影与花丛清晰，远方门构保持完整的发光轮廓、细节虚化；暗红、焦黑与门洞的白光对撞，整体呈厚涂油画质感的东方冥途独行，孤寂而神圣。","zmf_name":"花原孤灯","zmf_batch":11,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s20.webp","id":"ZS-285"},{"bv":"BV1TtJQ6yECg","scene":21,"series":"幽都渡世","title":"火涡环城","pal":"冥暗红","who":"无人物","comp":"漩涡环抱孤城","motion":"熔岩涡旋/城中灯火","special":"熔岩漩涡","note":"居中奇观","prompt_moss":"一座熔岩漩涡环绕着一座孤城，城在涡眼中灯火通明。主光为熔岩自发光。","prompt_zmf":"横画幅中式暗黑幻想大场景，居中构图：一片彼岸花的红色花原之上，天空中一个巨大的火红色漩涡缓缓旋转，漩涡的涡尾横扫过半个天穹，涡心的正下方，一座黑瓦石殿的殿门透出暖白的光，殿前石阶的两排立柱上灯笼成行。\n\n火涡的涡体为炽烈的红色与暗红交织：涡的旋臂自画面左侧卷向右侧，横扫过整个天穹的上半部，旋臂的边缘撕出千万点红色的花瓣与火星，花瓣如红雨般洒向花原；涡心的云层最深最亮，像一颗燃烧的心脏。涡的正下方，黑瓦石殿的剪影庄严，殿门洞开，门内的暖白光是画面中唯一的静色；殿前白石阶的两侧，成排的立柱灯笼自近向远延伸，灯焰微小而坚定。\n\n花原的彼岸花铺满画面的下部：红色的花茎与花冠在风中伏动，花海的红与涡的红连成一体；花原的边缘露出灰白的滩石与蜿蜒的溪流。背景的天穹为暗青与绛红交界，云层的裂隙透出幽暗。主光为火涡的红金自发光与殿门的暖白光对撞，照亮花冠的透光、殿门的轮廓与立柱灯笼的灯列；涡外的天幕暗部呈墨黑与暗青，占约五成。\n\n空气中弥漫着红色的花瓣与火星，前景花海的花冠与石阶灯列清晰，火涡保持旋转的整体动势、涡心虚化；绛红火涡、暖白殿门与暗青花原对撞，整体呈厚涂油画质感的东方火涡环城，诡谲而庄严。","zmf_name":"火涡环抱殿门","zmf_batch":37,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s21.webp","id":"ZS-286"},{"bv":"BV1TtJQ6yECg","scene":22,"series":"幽都渡世","title":"火涡推近","pal":"冥暗红","who":"无人物","comp":"同上推近构图","motion":"同 s21","special":"同 s21","note":"s21 的推近变体，运动规则同上","prompt_moss":"熔岩涡旋推近构图，涡壁占满更多画面，城郭灯火更突出。主光为熔岩自发光。","prompt_zmf":"横画幅中式暗黑幻想大场景，画面中央一座黑瓦大殿被一圈巨大的花红色漩涡笼罩：漩涡由漫天的红色花瓣汇成，自天空的左侧旋入、自右侧旋出，花瓣如雨在大殿的四周飘落，殿前的花原上开满彼岸花。\n\n花涡自画面左上方旋入，涡身的直径横贯半个画面：涡的外缘为暗红色，越向涡心越亮，涡心的花瓣被高速旋转搅成炽亮的红金色，花瓣沿涡壁层层飞旋，涡的尾部自画面右侧甩出，甩出的花瓣如流星雨般洒向大殿的屋顶；几片最大的花瓣飘落在殿前的石阶上。\n\n大殿为黑瓦重檐的中式殿宇，殿身呈暗色剪影，殿门前的白石台阶两侧竖立着数面白色的幡旗，幡旗在涡流的罡风中猎猎翻卷；殿前的花原上，彼岸花的花海铺满画面的下半部，红色的花茎与花冠层层如潮，花海一直延伸到画面的左右边缘。背景的天空为暗青与绛红交界，涡流的暗部把天空染成深沉的红黑色。主光为花涡涡心的红金自发光，自上方照亮大殿的檐角轮廓、幡旗的白色与花海的花冠；暗部呈绛红与焦黑，占约五成。\n\n空气中弥漫着浓密的花瓣与红雾，前景花海的花冠与石阶清晰，花涡保持旋绕的整体动势、涡心虚化；炽红花瓣、黑瓦殿宇与暗青天空对撞，整体呈厚涂油画质感的东方花涡吞殿，诡谲而壮丽。","zmf_name":"花涡吞殿","zmf_batch":18,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s22.webp","id":"ZS-287"},{"bv":"BV1TtJQ6yECg","scene":23,"series":"幽都渡世","title":"龙脊暗桥","pal":"冥暗红","who":"人物群","comp":"龙脊桥横贯黑水","motion":"黑水纹/桥上人影/雾","special":"龙脊形桥","note":"大景小人","prompt_moss":"一座龙脊形长桥横跨暗色地下河，一列剪影行人鱼贯过桥。主光为暗水微光。","prompt_zmf":"横画幅中式暗黑幻想大场景，仰视低机位。画面中央一副巨大的龙骨横跨在黑水之上：脊骨自画面下缘的中部拱起，一串椎骨与肋骨向上延伸，最终没入画面中上方一座石砌的门楼；骨桥的规模吞没整个画面，水面上只有一叶极小的舟。\n\n龙骨的骨质呈灰白与褐黑，骨节的接缝处积着水渍与苔痕，椎骨两侧的肋骨向外张开如梳齿，骨尖悬在水面之上；脊柱的顶端渐渐没入石门的阴影里，石门的门楣与门柱为深灰的糙石，砖缝间填着暗红的苔。\n\n黑水铺满画面下半部，水面被骨影切成数道，水波在骨的周围翻出白色浪沫，浪尖被远处的天色染成暗红；骨桥左侧的水面上漂着一叶小舟，舟上立着一个极小的人影，手中的竹篙斜插入水。\n\n画面上方为翻涌的云层：云心透出橙红的雷光，云涛的边缘呈暗紫与炭黑，云层向骨桥的两侧压下来，把石门围在正中。主光为高空云隙间的橙红光，自上方逆射，照亮龙骨的脊背、水面的浪尖与石门的门楣，骨的受光面泛着湿冷的高光；水面的暗部呈墨黑带一点血红，占画面约五成。\n\n空气中弥漫着水汽与雾霭，骨的缝隙与远处的水面没入雾中，小舟与篙影清晰；橙红、墨黑与灰白三色对撞，整体呈厚涂油画质感的东方龙脊暗桥，苍凉而压迫。","zmf_name":"龙脊暗桥","zmf_batch":43,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s23.webp","id":"ZS-288"},{"bv":"BV1TtJQ6yECg","scene":24,"series":"幽都渡世","title":"灯楼暗河","pal":"冥暗红","who":"无人物","comp":"飞檐占上，暗河居下","motion":"巨幡飘/灯影落水/河雾","special":"灯楼飞檐、巨幡","note":"上下分层构图","prompt_moss":"灯楼飞檐自画面上方悬出，巨幡垂落暗河上，灯影碎裂水面。主光为灯楼自发光。","prompt_zmf":"横画幅中式暗黑幻想大场景，上下分层的构图：暗河的水面之上悬着一座巨大的灯楼，灯楼的千盏灯自楼体的每一层垂下与点亮，灯楼的重檐倒悬着巨大的青铜铃与灯牌；暗河的水面幽深，河面上的小船提灯缓行，灯楼的光与暗河的黑上下分明。\n\n灯楼的楼体为多层重檐的黑色木构：每一层的檐下都挂着成排的灯笼，灯笼的红光沿楼体的轮廓勾出灯火的轮廓线；楼体的中央门洞为拱形，门洞内透出炽亮的暖白光，光自门洞倾泻而下，照亮门前的水面；楼体的两侧垂着两条粗大的锁链，锁链的末端吊着巨大的青铜铃与幡牌，幡牌上的文字在灯光中隐约。\n\n暗河的水面幽深如墨：河面倒映着灯楼千盏灯的光点，倒影在水中连成灯火的星河；河面上的小船为黑色的乌篷船，船上的一盏提灯是船上唯一的暖色，船夫摇橹的身影安静。背景的岩壁为暗色的洞穴岩体，岩壁上的栈道与灯串沿洞壁蜿蜒。主光为灯楼的千盏暖灯与门洞的白光，自上方照亮水面、小船与岩壁的栈道；暗河的边缘与洞顶的暗部呈墨黑，占约五成。\n\n空气中弥漫着灯火的光晕与河面的雾气，前景灯楼的重檐与垂落的锁链清晰，上下分层的构图使灯楼悬浮于暗河之上；千盏暖灯、墨色暗河与青黑岩壁对撞，整体呈厚涂油画质感的东方灯楼暗河，幽深而辉煌。","zmf_name":"灯楼暗河上下分层","zmf_batch":36,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s24.webp","id":"ZS-289"},{"bv":"BV1TtJQ6yECg","scene":25,"series":"幽都渡世","title":"白骨列阵","pal":"冥暗红","who":"人物群","comp":"纵深队列，桥贯火谷","motion":"齐步行进/火光/尘","special":"白骨军团、火谷长桥","note":"大场景群像","prompt_moss":"一支白骨军团列阵齐步行进在火谷长桥上，骨白剪影连成一线。主光为熔岩光。","prompt_zmf":"横画幅中式暗黑幻想大场景，一座由白骨堆砌的巨桥自画面的近景延伸向远方的门楼：巨桥的桥身由无数白骨列阵堆成，桥栏的白骨如仪仗排列，桥的尽头是一座黑瓦的门楼，门楼的门洞透出暖白的光；桥下的岩壁间，两位黑衣人的身影立于前景的石台上仰望巨桥。\n\n白骨巨桥的桥身庞大：桥面由成千上万根白骨横向排列铺成，白骨的排列如仪仗的阵仗，桥栏的白骨柱头如獠牙般林立，桥身的骨架结构如巨兽的肋骨；巨桥自画面的左下向右上延伸，桥身的透视纵深强烈。桥的尽头，黑瓦的门楼庄严，门楼的飞檐层叠，门洞的白光自门内透出，光把门前的桥面照亮。\n\n前景的石台上，两位黑衣人的背影并肩而立，他们的斗篷与黑发被谷风掀起，仰头仰望巨桥的列阵；岩壁的暗红色岩体自画面的两侧高耸，岩壁的栈道上挂着灯笼串，灯笼的暖光点点。背景的天空为暗金与绛红交界的暮色，云层的边缘透出火光的微光。主光为门楼的暖白光与暮色的金红光交织，照亮白骨的排列层次、桥身的骨架结构与黑衣人的背影轮廓；岩壁与桥身的暗部呈暗红与焦黑，占约四成。\n\n空气中弥漫着谷底的雾气与飘尘，前景黑衣人的背影与石台的轮廓清晰，白骨巨桥保持列阵的整齐气势；雪白骨阵、暗红岩壁与暖白门光对撞，整体呈厚涂油画质感的东方白骨列阵，苍凉而震撼。","zmf_name":"白骨巨桥列阵","zmf_batch":34,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s25.webp","id":"ZS-290"},{"bv":"BV1TtJQ6yECg","scene":26,"series":"幽都渡世","title":"幽都全景","pal":"冥暗红","who":"无人物","comp":"大远景俯瞰收束","motion":"全城灯火/熔岩天光/雾","special":"幽都全城","note":"收束大景","prompt_moss":"俯瞰整座幽都城郭大远景：万千灯火在熔岩峡谷中发光，熔岩河穿城，红雾升腾。主光为全城自发光。","prompt_zmf":"横画幅中式暗黑幻想大场景，高角度俯瞰一座沉在环形巨谷底部的幽都：环形的城市灯火如岩浆般沿谷底铺开一圈，城市正中央是一座多重檐的黑色大殿剪影，画面右下角的前景处，一位黑衣人立于崖边俯瞰全城。\n\n谷底的幽都呈同心圆结构：一圈圈的环形街道上灯火密如繁星，橙红色的光点沿环道连成多条光带，环环相扣向中心收拢；中央的大殿为黑色多重檐的层叠楼阁剪影，殿顶的轮廓在火光映衬的天幕下清晰。谷壁陡峭暗红，壁上的洞穴与栈道点点着火，数条暗红色的瀑布状光流自谷壁垂落谷底，如熔岩之河。谷口的天空翻涌着暗红色的云，云层的裂隙透出暗金的光。\n\n右下角前景的崖台上，黑衣人的背影剪影立于崖缘，宽袍的下摆被谷风掀起，他俯身眺望谷底的灯城，身形在宏大的城市尺度下显得渺小。主光为谷底灯城与谷壁火流的自发光，暖红色的光自下而上染红雾气，天空的暗云被映成绛红；暗部呈焦黑与暗红，占约五成。\n\n空气中弥漫着浓重的烟尘与火星，前景崖台与黑衣人剪影清晰，谷底灯海层层虚化成光斑；暗红、焦黑与橙金三色主导，整体呈厚涂油画质感的东方幽都俯瞰，肃穆而震撼。","zmf_name":"幽都全景","zmf_batch":8,"run":true,"image":"../images/scenes/BV1TtJQ6yECg/s26.webp","id":"ZS-291"},{"bv":"BV12w8d65ELw","scene":0,"series":"尘世长卷","title":"老屋备祭","pal":"暮色青橙","who":"人物群","comp":"三分横构图，供桌前景","motion":"烛焰/香烟缓升/人手动作/幡动","special":"供桌、蜡烛、徽派老屋","note":"写实质感；暮光","prompt_moss":"徽派老屋暮色中父亲在供桌前摆放祭品，男孩立于桌旁，红烛燃烧香烟缓升。主光为烛光。","prompt_zmf":"横画幅中式写实室内场景，平视中景。画面中一位女子立于旧木案前俯身整理祭品，占画面高度约五成；两侧是斑驳的木墙与窗棂。\n\n女子为鹅蛋脸，眉目清淡，唇色自然；乌黑长发松松挽起，几缕垂在颈侧，神情专注，视线落在案面的碗碟上。\n\n她身着蓝白交领布衫与深色长裙，衣料有洗旧后的褶痕与磨白的布边，袖口挽到小臂；双手在案上摆正碗碟与纸包。\n\n旧木案上摆着几只白瓷碗、酒壶、切开的糕点与捆扎的纸包；背后木墙挂着竹篮与旧挂历，墙角的木柜漆色剥落；窗外透进暮色，窗框在墙上投下长影；地面是磨损的青砖，砖缝积尘。主光为窗外的低角度暮光，自左侧斜射，照亮女子的侧脸、衣袖与案面器物；室内暗部呈暖褐，明暗过渡柔和。\n\n空气中浮尘可见，前案的瓷碗与纸包清晰，后墙的挂件虚化；蓝白、暖褐与暮金交织，整体呈厚涂油画质感的写实中式室内，安静而带烟火气。","zmf_name":"老屋备祭","zmf_batch":47,"run":true,"image":"../images/scenes/BV12w8d65ELw/s00.webp","id":"ZS-292"},{"bv":"BV12w8d65ELw","scene":1,"series":"尘世长卷","title":"火盆教祭","pal":"暮色青橙","who":"人物群","comp":"双人特写，火盆居中","motion":"火苗蹿起/纸灰飞/面部火光","special":"火盆、纸钱","note":"双人特写，火光是主光","prompt_moss":"夜色庭院祖母教孙儿将纸钱送入火盆，火光自下照亮两张脸。主光为火光。","prompt_zmf":"横画幅中式生活纪实场景，画面右侧一位盘着银发的老妇人蹲在火盆前，画面中央一个穿棉袄的男孩俯身凑近火盆，两人都面朝画面左下方的火光，双人中近景入镜。\n\n老妇人银灰色的头发向后梳理，面部皱纹清晰，神情温和专注，身着暗红色粗布棉袄，手腕戴一只碧绿色玉镯；她的手正探向火盆，将手中的纸钱送入火中。男孩约莫七八岁，圆脸短发，穿青灰色棉袄，双手举着一沓黄纸凑向火光，火光映亮他的脸。两人之间的黑色火盆里橙红的火焰正在燃起，纸钱的边缘烧成透亮的橙色，几点火星向上飞起。\n\n背景为暮色中的徽派老街：白墙灰瓦的民居层层排开，马头墙的轮廓在青蓝色的天光下清晰，巷子深处隐约可见几个模糊的人影与一扇暗红的木门。主光为火盆的暖橙自发光，从画面左下方照亮两人的面部、手部与衣料的受光面，皮肤呈温暖的次表面散射；环境为暮色青蓝，暗部呈蓝黑，占约四成。\n\n空气中漂浮着上升的火星与薄烟，前景火盆与纸钱的燃烧边缘清晰锐利，背景老街没入焦外；暖橙与青蓝暮色对撞，整体呈写实摄影质感的东方人文纪实，温情而庄重，带自然的景深过渡。","zmf_name":"老街火盆祭","zmf_batch":2,"run":true,"image":"../images/scenes/BV12w8d65ELw/s01.webp","id":"ZS-293"},{"bv":"BV12w8d65ELw","scene":2,"series":"尘世长卷","title":"小女许愿","pal":"暮色青橙","who":"人物","comp":"居中特写，人群虚化","motion":"香头红点/烟火虚化/发丝/睫毛","special":"线香、夜 crowd","note":"特写","prompt_moss":"一名女孩双手合掌执香闭眼许愿，背景夜市灯火虚化。主光为香火微光。","prompt_zmf":"横画幅中式人文纪实特写，夜晚的河灯集会上，一位扎着丸子头的小女孩双手合十低头许愿，她的面前立着几支点燃的线香，香头的火点在夜色里明亮，背景是虚化的人群与点点灯火。\n\n小女孩的丸子头有些凌乱，几缕发丝被夜风吹起横过脸颊；她闭着双眼，睫毛低垂，神情虔诚认真，抿着的嘴唇微微动，似在心里默念愿望。她穿着洗旧的浅灰色短袖，袖口挽起，双手合十举在胸前，指缝间夹着三支点燃的线香，香头的火点如三颗小星，香的灰烬垂着将断未断的香灰。\n\n她身前的石桌上摆着一碗清水与几碟供品；背景的河灯集会人影攒动：虚化的人群或蹲或坐，成片的河灯与香火在虚化中连成暖橙色的光斑海，几盏放出的河灯在远处的水面上漂着。主光为香火与周围河灯的暖橙光，自下方照亮她的脸庞、合十的双手与香头的火点；夜色与人群的暗部呈蓝黑色，占约五成。\n\n空气中弥漫着香烟与夜雾，前景合十的双手、香火与虔诚的侧脸清晰，背景人群大幅虚化；暖橙香火与蓝黑夜色对撞，整体呈写实摄影质感的东方小女许愿，虔诚而温情。","zmf_name":"小女许愿","zmf_batch":24,"run":true,"image":"../images/scenes/BV12w8d65ELw/s02.webp","id":"ZS-294"},{"bv":"BV12w8d65ELw","scene":4,"series":"尘世长卷","title":"幻入幽都","pal":"冥暗红","who":"无人物","comp":"对称纵深幻境","motion":"彼岸花摇/楼阁灯火/雾","special":"彼岸花河、幽都楼阁","note":"现实转幻境的奇观段","prompt_moss":"彼岸花河尽头的灯火幽都楼阁群，雾气漂移，对称纵深。主光为楼阁灯火。","prompt_zmf":"横画幅中式暗黑幻想大场景，现实与幻境的交界：一片彼岸花的红海中央，一座幽都的园林自幻境中浮现——朱红的楼阁与拱桥浮在花海之上，楼阁的灯火与花海的红连成一片，光斑如萤火弥漫在半空。\n\n彼岸花的红海铺满画面的下半部：红色的花茎与花冠层层如潮，花海的质感浓烈如绒毯，花海的缝隙间透出暗色的水面，水面倒映着幻境的楼阁；楼阁为朱红与金色相间的中式园林建筑：重檐的亭台、九曲的拱桥与白玉的栏杆浮在花海之上，楼阁的灯火自窗棂透出，桥上的宫灯成串。\n\n幻境与现实的交界为弥漫的光斑：半空中漂浮着无数红色的光点与金色的萤火，光斑如尘埃般在楼阁与花海之间浮动，光斑的密度自幻境的深处向现实递减；远处的楼阁深处透出一座更高的大殿轮廓。背景的天空为暗蓝与金红的交界，星点稀疏。主光为楼阁的暖金灯火与彼岸花海的红光交织，照亮花冠的透光、楼阁的飞檐与浮动的光斑；花海的暗部呈暗红与墨色。\n\n空气中弥漫着花海的雾气与浮动光斑，前景彼岸花的花冠清晰，幻境楼阁保持浮在花海上的整体感；朱红幻境楼阁、红色花海与暗蓝夜色对撞，整体呈厚涂油画质感的东方幻入幽都，诡谲而瑰丽。","zmf_name":"幻入幽都彼岸花海","zmf_batch":30,"run":true,"image":"../images/scenes/BV12w8d65ELw/s04.webp","id":"ZS-295"},{"bv":"BV12w8d65ELw","scene":5,"series":"尘世长卷","title":"金箔入宅","pal":"红金撞色","who":"人物群","comp":"室内全景，金箔满屏","motion":"金箔漫天飘旋/灯火/人仰头","special":"金箔雨、客厅","note":"虚实交融段","prompt_moss":"客厅内金箔纸钱如发光雪片漫天飘旋，一家人围桌仰望。主光为室内灯与金箔。","prompt_zmf":"横画幅中式奇幻生活场景，虚实交融：夜晚的老宅堂屋里，一家人围桌吃着晚饭，堂屋的天花板上破开一道金色的光洞，成群的金箔鱼群自光洞中游入，鱼群的金光洒满堂屋，桌边的人们抬头仰望，神情惊叹。\n\n金箔鱼群自天花的光洞涌入：每一尾鱼都由金色的光箔凝成，鱼身的鳞片如金箔片片分明，鱼群在堂屋的半空中游弋盘旋，鱼尾摆动时洒下金色的光屑；最大的一尾金鱼自光洞探入半个身子，鱼须与鱼鳍的细节在金光下清晰。光洞的边缘为古旧的木梁与雕花的藻井，藻井的彩绘在金光下艳丽。\n\n堂屋的一家人围桌而坐：老爷爷执着筷子仰头张望，奶奶端着碗愣在半空，年轻的妇人抱着孩子仰脸，孩子的手指着最大的那尾金鱼；桌上的饭菜还冒着热气，油灯的暖光与鱼群的金光交融。堂屋的陈设古朴：八仙桌、条案、墙上挂着字画与老照片，墙角的条凳上摞着碗。背景的老宅天井里，夜色深沉，院墙的瓦檐轮廓清晰。主光为鱼群的金色自发光与油灯的暖黄光交织，照亮一家人的仰望面庞、鱼群的鳞光与堂屋的木构；天井的夜色呈深蓝黑，占约四成。\n\n空气中弥漫着金色的光屑与饭菜的热气，前景仰望的一家神态与金箔鱼群清晰，堂屋的陈设层次分明；金色鱼群、暖黄灯火与深蓝夜色对撞，整体呈厚涂油画质感的东方金箔入宅，奇幻而温情。","zmf_name":"金箔鱼群入宅","zmf_batch":29,"run":true,"image":"../images/scenes/BV12w8d65ELw/s05.webp","id":"ZS-296"},{"bv":"BV12w8d65ELw","scene":6,"series":"尘世长卷","title":"望远思故","pal":"暮色青橙","who":"人物","comp":"特写，背景画与花","motion":"金箔浮空/尘埃光斑/烛光/窗外微光","special":"遗像墙、金箔","note":"老人特写","prompt_moss":"一位老妇人独坐桌旁望远，身后墙上老画框与浮空金箔。主光为烛光。","prompt_zmf":"横画幅中式人文纪实特写，画面中央一位白发苍苍的老人坐在老屋的木窗边望远，他的眼神悠远温和，嘴角带着一丝浅淡的笑意；窗外的秋叶化作金色的蝶片飞进屋里，绕着老人的白发飞舞。\n\n老人的白发稀疏而柔软，根根分明地立在头上，脸上的皱纹如刀刻的年轮：额头的横纹、眼角的鱼尾纹与嘴边的法令纹都清晰；他的眼神望向窗外，眼白泛着岁月的浑浊，瞳孔里映着窗外的天光；他身着洗旧的深灰色布衫，肩头搭着一条深色的围巾。\n\n金色的叶子自窗外的树上飞进屋里：叶子如金箔的蝶片，在半空中旋转飘舞，有的落在老人的肩头，有的停在他的臂弯；木窗的红漆窗棂剥落，窗格的糊纸泛黄。老屋的窗台上摆着剥了一半的橘子与一只粗瓷茶杯；窗外的院落里，一株红枫的枝叶探向窗口，红色与金色的叶层交错。主光为午后的暖金阳光，自窗外斜射，照亮老人的白发、皱纹的沟壑与飞舞的金叶；屋内的暗部呈深褐与暖红。\n\n空气中弥漫着金叶的飘舞与老屋的尘香，前景老人的面容纹理与飞舞的金叶清晰，窗外的院子虚化；暖金阳光、白发与红叶金蝶交织，整体呈写实摄影质感的东方老人望远，温情而悠远。","zmf_name":"老屋望远金叶飞","zmf_batch":41,"run":true,"image":"../images/scenes/BV12w8d65ELw/s06.webp","id":"ZS-297"},{"bv":"BV12w8d65ELw","scene":7,"series":"尘世长卷","title":"万家莲灯","pal":"红金撞色","who":"无人物","comp":"大远景俯瞰收束","motion":"全城灯火/河灯漂移/雾","special":"河灯、万家灯火","note":"收束大景","prompt_moss":"俯瞰全城夜景：万家灯火与河灯之流蜿蜒穿过街道，雾气升腾。主光为全城灯火。","prompt_zmf":"横画幅中式夜景大远景，俯瞰机位。画面自下而上由河道、屋脊与远山叠成三层，满城的暖红灯点铺满画面；左侧近景是挑出河面的木构楼阁，右侧为黑瓦飞檐的殿顶。\n\n前景左侧的楼阁为两层木构，白墙被灯光染成暖粉，二层的木栏杆与窗棂挂着成串的红灯笼，檐下的木梯斜倚；右侧的殿顶覆黑瓦，脊上装饰着吻兽，瓦面反射出零散的灯光，瓦楞的起伏清晰可辨。\n\n画面中部的河道横贯，河面漂满莲花形的河灯，灯芯的暖光在水面拖出竖直的倒影，河岸的石阶上散落着更多灯盏；街道与桥面上密布极小的行人身影，男女老幼提灯而行，衣色为青、白、红三色。\n\n远景的山坡上密布着屋舍与灯点，灯点自山脚漫至山腰，最远处的山脊上一道火柱冲天而起，火光把云层染成橙红，火星向四周飘散；山体的轮廓没入烟雾。主光为满城灯火的暖橙自发光与山脊火柱的强光，自画面中上部照亮屋顶瓦面与河面波纹；夜空为深蓝，屋脊的背光面呈冷蓝黑，暗部约占三成。\n\n空气中弥漫着灯节的烟雾与飞散的孔明灯，光点在焦外化成圆斑，前景楼阁的灯笼清晰，远景山城层层虚化；暖橙、正红与深蓝对撞，整体呈厚涂油画质感的东方万家莲灯，盛大而温暖。","zmf_name":"万家莲灯","zmf_batch":42,"run":true,"image":"../images/scenes/BV12w8d65ELw/s07.webp","id":"ZS-298"},{"bv":"BV1NxbD68EYE","scene":0,"series":"尘世长卷","title":"纵马金原","pal":"仙金蓝","who":"人物","comp":"人物居中，金色草原横铺","motion":"马鬃/披帛/草浪/阳光","special":"白马、金原日落","note":"白衣纵马过金原，披帛拉出长线","prompt_moss":"一名白衣骑手纵马疾驰过金色草原，披帛横飞，红唇。主光为日光。","prompt_zmf":"横画幅中式古风旷野，平视中景。画面中央一位白衣女子骑白马自左向右疾驰，长发与披帛向后横飞，占画面高度约六成；草原铺满金黄的草浪，地平线在远处压成一细线。\n\n女子侧脸清丽，眉形细长，眼尾上挑，唇色正红；乌黑长发被风扯成长线，发间束着银色的发带，几缕贴在马颈旁。\n\n她身着月白与湛蓝相间的长袍，衣袖宽大，被风鼓成帆状；外披一件绣金的薄纱披帛，帛面自肩后拉出数丈长的弧线，末端在光里透亮；腰束银带，马鞍搭着绣花的鞍毯。\n\n白马四蹄腾空，鬃毛扬起，马具的铜饰反着光；草穗被马蹄压出倒伏的痕迹，近处草浪清晰，远处被风吹成一片流动的金；天边浮着薄云与初升的日轮。主光为低角度的暖金阳光，自画面右后方逆射，照亮发丝、披帛边缘与草穗的绒尖，勾出一整圈金边；马腹与人物正面的暗部呈冷灰蓝。\n\n空气中浮着被风卷起的草屑与光尘，前景草穗虚化，远景地平线没入光雾；暖金、月白与湛蓝三色对撞，整体呈厚涂油画质感的东方纵马金原，辽阔而飒爽。","zmf_name":"纵马金原","zmf_batch":48,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s00.webp","id":"ZS-299"},{"bv":"BV1NxbD68EYE","scene":1,"series":"尘世长卷","title":"秋水定情","pal":"仙金蓝","who":"人物群","comp":"双人对角，红树框顶","motion":"水面纹/红叶落/指尖水光","special":"红树、字幕后置","note":"秋水红树下二人相对，指尖将触","prompt_moss":"秋水红树下两人隔水相对而卧指尖将触。主光为暖光。","prompt_zmf":"横画幅中式夜景人物双人构图，平视近景。画面中央两人伏在暗色的地面上相对而卧，各伸出一手，指尖相距寸许；左为蓝袍男子，右为浅粉长裙的女子，两人的身体构成一条斜向的对角线，占画面高度约六成。\n\n男子面容清俊，眉形平直，眼尾略垂，看向对方的眼神柔和，发髻以素簪束起；女子为鹅蛋脸，眼尾上挑，唇色淡红，鬓边贴一枚金色花钿，乌黑长发散落在地面上铺开。\n\n男子身着靛蓝的宽袖长袍，袖口滚银灰的缘边，衣料在地面上压出褶皱；女子身着浅粉与月白相间的薄纱长裙，肩头披一层透明的纱，纱面被地面压出细密的折痕，袖口垂落，露出纤细的手腕。\n\n画面的上方横着一段虬曲的红花枝，深红的花簇自画面上缘垂下，花瓣零落；背景为深蓝的夜色，远处的山脊线隐在暗处，几点暖橙的灯火在焦外化成光斑。主光为极暗的环境光与左侧一线暖光，自男子一侧斜射，照亮两人相触的指尖、女子的侧脸与纱面的高光；暗部占画面约六成。\n\n空气中漂浮着零星的落花与细小的光尘，前景的指尖与衣料褶皱清晰，背景的山脊与灯火虚化；靛蓝、浅粉与深红三色对撞，整体呈厚涂油画质感的东方秋水定情，克制而缠绵。","zmf_name":"秋水定情","zmf_batch":45,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s01.webp","id":"ZS-300"},{"bv":"BV1NxbD68EYE","scene":2,"series":"尘世长卷","title":"画舫琵琶","pal":"红金撞色","who":"人物","comp":"居中人像，荷塘背景","motion":"琴弦/水波/纱幔/荷叶","special":"琵琶、画舫","note":"画舫纱幔里抱琵琶，螺髻珠钗","prompt_moss":"画舫纱幔中一名女子抱琵琶弹奏，荷塘背景。主光为暖光。","prompt_zmf":"横画幅中式古典场景，画面中央一位乌黑螺髻、满头珠钗的古装女子坐在画舫的锦垫上怀抱琵琶，微低头拨弦，画舫的纱幔半掩，舫外是金莲花池与水上的宫城。\n\n女子的乌黑长发挽成精致的螺髻，髻上插满金钗、珠花与点翠的步摇，珠链自鬓边垂落；她低垂眼帘，长睫毛在眼下投出柔和的阴影，红唇微抿，神情恬静专注。她身着乳白与浅金相间的织锦襦裙，肩头的纱衫半透明，纱上绣着淡粉的花枝，宽大的袖口堆在腕边；她怀抱一面木色的琵琶，琴身的漆面温润，她的右手执拨，左手按弦，拨子弹弦的动作停在半途。\n\n画舫的内舱铺着锦缎的软垫，舱口的纱幔为米白与青蓝相间的织锦，纱幔被风掀起一角；舷窗之外是金莲花盛开的池塘：莲叶田田，金色的莲花与游鱼清晰可见，池水对岸是白墙金顶的宫城与朱红的廊桥，宫城的倒影在池水中揉碎。主光为明亮的暖金阳光，自舫外的池塘方向照进舱内，照亮她的侧脸、琵琶的漆面与纱幔的透光；舱内的暗部呈暖褐色。\n\n空气中漂浮着莲花的花粉与纱幔的纤维，前景抱琵琶的手部与螺髻珠钗清晰，舫外的池景与宫城虚化；乳白织锦、鎏金珠钗与金莲池色三色交织，整体呈厚涂油画质感的东方画舫琵琶，恬静而华美。","zmf_name":"画舫琵琶","zmf_batch":19,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s02.webp","id":"ZS-301"},{"bv":"BV1NxbD68EYE","scene":3,"series":"尘世长卷","title":"红伞过桥","pal":"仙金蓝","who":"人物","comp":"桥弧线，人物居中","motion":"伞旋/裙摆/水中云影","special":"红伞、蓝花树","note":"红伞过桥，桥下流云，一句传说开场","prompt_moss":"一名红衣女子执红伞行过石拱桥，蓝花树为背景。主光为日光。","prompt_zmf":"横画幅中式古风场景，中景平视。画面中央偏右一位年轻女子背身立于木拱桥的弧顶，右手撑着一把朱红的油纸伞，伞面斜压向左上方；她的身体侧转回眸，黑发与红裙被风带起。\n\n她乌黑长发垂至腰际，发间系着朱红的缎带，缎带的两端在身后飘展；侧脸线条清秀，鼻梁高挺，下颌线干净，垂落的碎发扫过颈侧。\n\n她上身着月白的露背短衫，后背大片肌肤暴露在日光下，脊线的浅凹与肩胛的起伏清晰，颈后系着细细的白绳；下身为正红的束腰长裙，裙腰高束，红裙的下摆散开成扇，压住桥面的木纹，裙侧开衩处露出小腿。\n\n桥为原木色的拱桥，桥面的木板被磨得发亮，栏杆低矮；桥下与四周铺满蓝紫色的花海，花穗密集成片，一直漫到画面边缘的竹林，竹林后隐约立着白墙的院舍。主光为斜射的暖金阳光，自画面左上方穿过竹叶与伞面，在花海上洒下成片金色的光斑，也在她的发丝与红裙边缘勾出亮边。\n\n空气中漂浮着被逆光点亮的浮尘与细碎的花粉，前景的花穗虚化，桥身的木纹清晰；蓝紫花海、正红长裙与月白短衫三色撞色，整体呈厚涂油画质感的东方红伞过桥，明媚而静好。","zmf_name":"红伞过桥","zmf_batch":43,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s03.webp","id":"ZS-302"},{"bv":"BV1NxbD68EYE","scene":4,"series":"尘世长卷","title":"夕阳论剑","pal":"仙金蓝","who":"人物群","comp":"双人对称，日悬中","motion":"剑尖微颤/云跑/衣袂","special":"夕阳对剑","note":"夕阳下双剑相指，像切磋更像闲谈","prompt_moss":"夕阳下两人持剑对指相峙而笑。主光为夕阳逆光。","prompt_zmf":"横画幅中式武侠场景，画面中央两位剑客在夕阳的海天之巅相对：左侧一位青袍的剑客背身静立，剑已归鞘；右侧一位白羽华服的剑客横剑相指，剑尖遥指对方，姿态像切磋更像闲谈；夕阳的云海在他们身后铺开，云彩如燃烧的金红锦缎。\n\n青袍剑客的乌黑长发束成高髻，他的青袍在夕阳下呈深青的剪影感，袍摆被海风掀起；他静立的姿态沉稳，双手拢在袖中，剑挂在腰间。白羽剑客的乌黑长发飞扬，几缕发丝横过面部；她身着乳白与金红相间的多层纱裙华服，纱裙的裙摆被海风掀起如浪，她的双手横持一柄长剑，剑尖遥指青袍剑客的方向，她的姿态松而不懈，唇角带着笑意，眼神灼灼。\n\n两人脚下的海天之巅为礁石的顶部，礁石的边缘下是翻涌的海浪；夕阳的云海铺满天穹：大朵的积云被落日照成金红与粉紫的锦缎，云层的层次如燃烧的绸缎，落日的金光自云层的裂隙放射出光柱。主光为落日的逆光金红，自画面左后方照亮两人的轮廓光、剑身的反光与云海的燃烧感；海面的暗部呈青灰蓝。\n\n空气中弥漫着海风的水汽与云霞，前景双剑相指的对峙姿态清晰，夕阳云海的燃烧感完整；青袍剪影、白羽华服与金红云霞对撞，整体呈厚涂油画质感的东方夕阳论剑，潇洒而豪迈。","zmf_name":"夕阳双剑论义","zmf_batch":34,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s04.webp","id":"ZS-303"},{"bv":"BV1NxbD68EYE","scene":5,"series":"尘世长卷","title":"背剑离城","pal":"仙金蓝","who":"人物","comp":"背影右，红旗城列队左","motion":"披发/红旗列/水光","special":"千面红旗、离城","note":"背剑人离城，身后千面红旗渐远","prompt_moss":"一名黑袍剑客背剑离城，身后千面红旗渐远。主光为暖光。","prompt_zmf":"横画幅中式油画质感武侠场景，画面中央一位背剑的侠客背身立于雪原之上，他手中的长剑拄地，身后是一片渐远的红旗军阵与雪色的大地；他乌黑的长发与彩绘的披风被朔风吹起，油画的笔触厚重如戈壁的风沙。\n\n侠客乌黑长发披落腰际，发丝与彩绘的披风在朔风中向后横飞；他身着青蓝与赭红、墨色相间的多层战袍，衣料的织锦与皮革的拼接厚重，袍摆的裙裾在雪地上拖出长长的痕迹；他的右手拄着一柄长剑，剑尖入雪，剑柄的红穗低垂；他背身的姿态孤绝，头颅微微侧转，回望身后的军阵。\n\n身后的雪原上，千面红旗的军阵渐远：红旗的阵列沿地平线排开成一道红色的墙，旗帜在风中猎猎，军阵的士兵剪影如蚁；雪原的地面为米白与浅金交织的冻土，雪的表面被风吹出流沙的纹理。背景的天空为油画般厚重的积云：金白与青灰的云层堆叠，云隙间透出天光。主光为低角度的暖金阳光，自军阵的方向逆射，照亮披风的织纹边缘、雪原的起伏与红旗的透光；雪地的阴影呈青灰蓝。\n\n空气中弥漫着风沙与雪粒，前景侠客的背影、拄地的长剑与飞扬的披风清晰，红旗军阵渐远虚化；彩绘披风、雪原米白与千面红旗对撞，整体呈厚涂油画质感的东方背剑离城，孤绝而壮阔。","zmf_name":"背剑离城千旗远","zmf_batch":40,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s05.webp","id":"ZS-304"},{"bv":"BV1NxbD68EYE","scene":6,"series":"尘世长卷","title":"夜泊灯筏","pal":"妖夜橙","who":"无人物","comp":"横铺夜景","motion":"灯筏光斑/竹影/月色水纹","special":"水上灯市","note":"夜色水城灯筏连绵，竹影婆娑","prompt_moss":"夜色水城灯筏连绵，竹影婆娑。主光为灯串。","prompt_zmf":"横画幅中式水乡夜景大场景，夜色的水城里灯筏连绵：水面上一排排挂着灯笼的灯筏首尾相连，竹影在水岸婆娑，一位白衣人正独自走过水中央的小石桥，满月悬在楼宇之上。\n\n灯筏为竹排扎成的水上平台，每一筏上都搭着小小的竹亭，亭里点着一盏暖黄的灯；灯筏自画面的近处沿水面向远方连绵成列，灯筏的灯火在水中拉出一条条金色的光带，光带随水波轻轻摇曳。水城的岸边：青竹丛的竹影婆娑，竹叶的剪影映在灯笼的光晕里；竹丛间露出一角红楼，楼上的窗子里透出暖光，檐下挂着红灯笼。\n\n水中央的小石桥为青石砌的拱桥，一位白衣人正独自走过桥顶，他的身影纤细安静，桥的倒影与灯筏的倒影在水中交融；水面还漂着几盏放走的莲花河灯，灯影点点。背景的满月悬在楼宇之上，月色的银白与灯火的暖橙交融；更远处的楼阁轮廓在夜色中层层淡去。主光为灯筏与灯笼的暖橙自发光，自水面与两岸包裹画面，照亮白衣人的背影、竹影的层次与水面的光带；夜空与水的暗部呈蓝紫色，占约四成。\n\n空气中弥漫着水汽与灯晕，前景石桥的白衣背影与灯筏的灯火清晰，水城纵深层层虚化；暖橙灯筏、青绿竹影与银白满月三色交织，整体呈厚涂油画质感的东方夜泊灯筏，静谧而幽深。","zmf_name":"夜泊灯筏竹影","zmf_batch":32,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s06.webp","id":"ZS-305"},{"bv":"BV1NxbD68EYE","scene":7,"series":"尘世长卷","title":"雾谷行军","pal":"仙金蓝","who":"人物群","comp":"剪影纵列，雾漫谷","motion":"雾流/旌旗/队列行进","special":"雾谷大军","note":"大军在雾谷列阵前行，旗影如林","prompt_moss":"大军在雾谷列阵前行，旌旗如林。主光为漫射光。","prompt_zmf":"横画幅中式战争史诗大场景，青蓝色的雾谷中一支大军列阵前行：队伍的中央，一位身披黑色斗篷的将领背影立于阵前的土丘上，他的四周，成千上万的士兵举着长矛与旌旗列成方阵，旗影如林在雾中层层铺开。\n\n将领的黑色斗篷宽大如翼，斗篷的下摆被谷风高高掀起，他的身形在阵前的土丘上如一座黑色的雕像，压迫感十足；他的身后，大军方阵沿谷底铺开：士兵的长矛如林直立，旌旗的红黑两色在雾中若隐若现，旗面的布纹被风撕扯出猎猎的动感。\n\n雾谷的两壁陡峭高耸，青蓝色的岩体在雾中若隐若现；谷底的行军道路泥泞，士兵的脚印与车辙纵横。雾气在阵列的脚下流动，雾的浓度自前景向远景递增，队伍的尾部没入雾中只见旗尖。背景的天光自谷顶的雾层透下，形成几道青白色的光柱，照亮阵前的将领与近处的旗阵。主光为谷顶的冷调天光，青蓝色的雾与旗影冷暖对映；画面的暗部呈墨青色，占约五成。\n\n空气中弥漫着浓重的谷雾与尘土，前景将领的背影与近处的旗矛清晰，大军方阵层层虚化入雾；墨青雾谷、黑色斗篷与红旗旗影对撞，整体呈厚涂油画质感的东方雾谷行军，肃杀而恢弘。","zmf_name":"雾谷行军","zmf_batch":38,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s07.webp","id":"ZS-306"},{"bv":"BV1NxbD68EYE","scene":8,"series":"尘世长卷","title":"纸伞悬空","pal":"仙金蓝","who":"无人物","comp":"伞阵悬空，一点红居中","motion":"白伞微旋/红伞一点/雾","special":"悬空纸伞阵","note":"满谷白伞悬空，唯一点红伞居中","prompt_moss":"满谷白伞悬空，唯一点红伞居中。主光为漫射光。","prompt_zmf":"横画幅中式幻想大场景，高角度俯拍：一片山谷的水面上，数十柄白色的油纸伞悬空漂浮，伞面朝上如一朵朵白色的莲，唯有一柄正红色的伞居于画面中央，红伞下的红衣人在水面撑伞而行，画面的四周是青灰色的石岸。\n\n白伞的数量众多：每一柄白伞都撑开悬浮在水面上，伞面的米白色在日光下透亮，伞骨的放射纹路清晰，伞面上还积着几滴水珠；白伞疏密有致地散布，伞与伞之间的水面倒映着伞影。正红的伞居中：红伞的伞面为饱和的赤红色，伞骨下的红衣人只露出伞下的裙摆与足尖，她撑着伞在水面缓缓行走，水面的涟漪自她的足下荡开，红伞在满目的白伞中如一点朱砂。\n\n水面的水色为青蓝与浅碧相间，水底的青石纹理透过水面可见，水面上漂浮着几片落伞的红叶与白色的花瓣；四周的青灰色石岸环绕，岸边的石缝里生着青苔与蕨草，岸上的石阶被水浸湿。主光为明亮的白昼天光，从画面上方漫射，照亮白伞的透光、红伞的饱和色与水面的清亮；水岸的阴影呈青灰色。\n\n空气中安静无尘，前景红伞与白伞的伞骨纹路清晰，四周的白伞阵列层层铺展；满幅米白伞阵与中央一点赤红对撞，整体呈厚涂油画质感的东方纸伞悬空，极简而惊艳。","zmf_name":"纸伞悬空一点红","zmf_batch":23,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s08.webp","id":"ZS-307"},{"bv":"BV1NxbD68EYE","scene":9,"series":"尘世长卷","title":"火树银城","pal":"红金撞色","who":"无人物","comp":"火树占左，城居右","motion":"火树光瀑/花瓣卷/檐铃","special":"燃烧的巨树","note":"巨树烧成火瀑，银城在其下","prompt_moss":"一棵巨树烧成火瀑，银城在其下。主光为火光。","prompt_zmf":"横画幅中式幻想大场景，画面中央一棵巨树通体燃烧成金色的火瀑，树冠的花叶如火如霞，树下的银白色城郭铺满画面，一位白衣人自画面下方的白玉栏杆前仰望火树。\n\n巨树的树干粗壮如塔，深褐色的树皮纹理皲裂，自树干向上，枝干燃成金色的火瀑：火焰如液态的金沿着每一根枝干流淌垂落，树冠的叶片化作金红色透亮的叶子，成千上万片在半空中飘飞，如一场金红色的叶雨；火光把树冠周围的空气烤出扭曲的热浪，火星与光屑漫天飞舞。\n\n树下的城郭为银白色调：白玉的城墙与银灰的瓦顶沿水面层层排开，城中的楼阁挂着白色的纱幔与银色的饰件，城前的水面平缓，倒映着火树的金光与银城的轮廓，火光在水面碎成万点金鳞。前景的白玉栏杆自画面下缘横过，一位白衣人背身倚栏仰望，他的身影在巨树的尺度下显得渺小。主光为火树的金色自发光，自画面中央辐射，照亮白玉栏杆、银城受光的墙面与白衣人的轮廓；城的背光面呈银灰色，暗部占约三成。\n\n空气中弥漫着金色的火星与飘飞的叶片，前景白玉栏杆与仰望的背影清晰，火树保持整体的燃烧气势、顶端虚化；熔金树焰与银白城郭对撞，整体呈厚涂油画质感的东方火树银城，炽烈而华贵。","zmf_name":"火树银城","zmf_batch":18,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s09.webp","id":"ZS-308"},{"bv":"BV1NxbD68EYE","scene":10,"series":"尘世长卷","title":"树下群像","pal":"红金撞色","who":"人物群","comp":"横列群像，树冠覆顶","motion":"孩童奔跑/花瓣雨/光斑","special":"巨树、村居","note":"巨树之下孩童追逐，光影如旧梦","prompt_moss":"巨树下孩童追逐嬉戏，光影如旧梦。主光为暖光。","prompt_zmf":"横画幅中式温情大场景，一座白发巨树的树冠如金色的云盖住整个画面上半部，树下的小村里孩童们追逐嬉戏，一位红裙白发的女子立在人群边含笑看着，光影如旧梦般温暖。\n\n巨树的树干粗壮，树皮的纹理如老人的皱纹，树冠的叶片呈白发与金叶交织的质感，阳光自叶隙间漏下，在地面洒出满地的光斑；树冠的枝头挂着几只红色的灯笼与祈福的布条，随风轻晃。树下的小村：白墙黑瓦的民居沿土路排开，路边的篱笆上晒着作物；五个孩童在村道上追逐，有的举着风车，有的追逐纸鸢，跑动扬起细小的尘土；一位乌黑长发披散的红裙女子立在道旁，白发的鬓角别着素簪，她含笑看着孩子们，裙摆被风掀动。\n\n前景的树影光斑与孩子跑动的姿态清晰，背景的民居与巨树的树冠层层虚化，光线在画面中形成温暖的丁达尔光束。主光为清晨偏暖的阳光，从画面右上方的树冠间隙洒下，照亮孩童的衣色、红裙的饱和色与地面的光斑；树冠下的阴影呈金褐色。\n\n空气中弥漫着光束中的浮尘与飘絮，人物群像的姿态鲜活，巨树与村庄如旧梦般朦胧；白发金叶、红裙与白墙黑瓦三色交织，整体呈厚涂油画质感的东方巨树村落的童年旧梦，温暖而悠长。","zmf_name":"巨树下孩童群像","zmf_batch":20,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s10.webp","id":"ZS-309"},{"bv":"BV1NxbD68EYE","scene":11,"series":"尘世长卷","title":"执手相看","pal":"仙金蓝","who":"人物群","comp":"双人对称剪影，山横贯","motion":"山雾/衣带/光边","special":"逆光剪影","note":"逆光中执手相看，山与云做幕","prompt_moss":"逆光中一对男女执手相看，山与云做幕。主光为逆光。","prompt_zmf":"横画幅中式古风场景，逆光构图：画面左侧一位黑衣长发男子与右侧一位白衣长发女子站在金色芦苇荡中央，两人相对执手相望，全身入镜，夕阳把两人的轮廓勾成金边。\n\n男子乌黑长发高束，几缕散发被风吹起，身着玄黑色宽袖长袍，腰间佩着一柄细长的长剑，他侧身面向女子，一手与她十指相扣，另一手垂在身侧，侧脸的下颌线在逆光中清晰。女子乌黑长发披落腰际，发间垂着白色的发带飘扬，身着月白色广袖襦裙，裙摆被风扬起，她微微仰头望着男子，眼睫低垂，神情缱绻。\n\n两人四周的芦苇荡高过腰际，金色的芦花被夕阳照得透亮，风过时整片芦浪向同一方向倾斜；前景与画面下缘点缀着几丛红色的秋叶灌木，虚化成红色的色块。远处是层叠的青灰色山峦与暮色的云层，天际线被落日染成暖金色。主光为低角度的暖金夕阳，自画面正后方逆射，勾亮两人的发丝边缘、衣料透光处与芦花的绒毛；暗部呈青灰与暖褐。\n\n空气中漂浮着芦花絮与金色的光尘，前景芦苇与红叶大幅虚化形成前景遮挡，远景山峦层层没入焦外；暖金、玄黑与月白对撞，整体呈厚涂油画质感的东方古风情感场景，缱绻而辽阔。","zmf_name":"芦荡执手","zmf_batch":7,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s11.webp","id":"ZS-310"},{"bv":"BV1NxbD68EYE","scene":12,"series":"尘世长卷","title":"花窗倦卧","pal":"红金撞色","who":"人物","comp":"居中卧姿，花影满窗","motion":"纱帐/花影移/发丝","special":"雕花窗、纱帐","note":"花窗纱帐倦卧，光阴在花影里走","prompt_moss":"花窗纱帐中一名女子倦卧浅眠。主光为暖光。","prompt_zmf":"横画幅中式古典人像场景，俯拍视角：一片深色的荷塘莲叶间，一位乌黑长发铺展的金纱女子倦卧在花叶之间，她的长发与金红的纱裙在水面铺开如盛放的花，她双目轻阖，神情安然，光阴在花影里缓缓走过。\n\n女子乌黑的长发自她的头下铺展，发丝在水面上散开成扇形，几朵粉色的荷花瓣落在她的发间与锁骨；她的双眼轻阖，睫毛低垂，唇色朱润，神态安详如睡。她身着金红色织锦的广袖纱裙，纱料自她的肩头向四周铺展，金线的纹样在水光里流转，裙摆的一角浸在水中泛起细小的涟漪；她的一只手轻放在胸前，另一只手舒展在身侧，指尖点到一片莲叶。\n\n荷塘的莲叶为深绿与墨绿相间，叶面的脉络与水珠清晰，粉色与白色的荷花在她的四周点缀盛开；几条金红色的锦鲤自莲叶的缝隙间游过，鱼尾搅碎了她的倒影。水面的倒影里，她的长发与纱裙如一幅对称的画。主光为明亮的白昼阳光，从画面上方漫射，照亮金红纱裙的织纹、莲叶的脉络与她安静的面容；水面的暗部呈墨绿色。\n\n空气中漂浮着荷香般的光斑与花瓣，前景倦卧的面容与铺展的发纱清晰，莲塘的四周虚化；金红纱裙、墨绿莲叶与粉白荷花三色交织，整体呈厚涂油画质感的东方荷塘倦卧，安然如梦。","zmf_name":"荷塘花影倦卧","zmf_batch":22,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s12.webp","id":"ZS-311"},{"bv":"BV1NxbD68EYE","scene":13,"series":"尘世长卷","title":"宫门相对","pal":"仙金蓝","who":"人物群","comp":"对称纵深，门居中","motion":"水面倒影/宫灯/衣袂","special":"水上宫门","note":"水上宫门二人相对，倒影成双","prompt_moss":"水上宫门两人相对，倒影成双。主光为暖光。","prompt_zmf":"横画幅中式宫门前场景，正面平视，对称构图。画面中央是一座三开间的朱红宫门，门内透出暖金的光；门前的水面把宫门与两个人影照成倒影。\n\n门左立着一位白裙女子，上身微侧，裙裾垂地，发间插着素银簪，衣料上绣着淡粉的花；门右立着一位玄袍男子，头戴黑色的幞头，袍摆垂到脚面，两人隔着门槛相对。\n\n门的两侧各蹲着一尊青铜的瑞兽，兽身的铜绿与磨亮的鼻口形成对比；门的檐下悬着成排的红灯笼，斗拱与额枋上绘着金蓝的彩画，门的朱漆在灯下泛出油光。\n\n门前为白石平台，台下是浅浅的水池，水面平静如镜；平台的左右各有花树，白粉的花枝探入画面边缘；门内的深处置着屏风与廊柱，灯火层层退远。主光为门内溢出的暖金灯光，自门洞向画面外铺开，把两人照成剪影的边缘；月光自画面上方压下来，白石与水面的暗部呈青蓝。\n\n空气中浮着细小的灯尘与几片落花，前景的水面倒影清晰，门的深处渐次虚化；暖金、朱红与青蓝三色撞色，整体呈厚涂油画质感的东方宫门相对，端凝而暗涌。","zmf_name":"宫门相对","zmf_batch":44,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s13.webp","id":"ZS-312"},{"bv":"BV1NxbD68EYE","scene":14,"series":"尘世长卷","title":"怒目出剑","pal":"红金撞色","who":"人物","comp":"大特写，剑横面前","motion":"剑光/发丝狂舞/血珠","special":"面部大特写","note":"少年怒目出剑，青丝狂舞","prompt_moss":"一名少年怒目出剑特写，青丝狂舞。主光为暖光。","prompt_zmf":"横画幅中式武侠人物大特写，正面近距。画面为一位少年侠客的胸像特写，脸部占画面约六成，头略低，抬眼直视镜头；一把青白的长剑横在面前，剑身压在下颌之下，剑锋向画面右侧延伸。\n\n少年的面容清瘦，眉骨凌厉，眉形平直而浓，双眼睁大、眼白分明，眼尾泛红，目光逼人；唇色偏暗红，唇线紧抿；肤色偏白，额角有一线汗光；乌黑的长发被剑气带起，发丝向画面两侧横飞，几缕贴在颊边。\n\n他身着米白与浅金相间的织锦外袍，袍面布满细密的花叶暗纹，领口立起，内衬一层月白的衣领；肩背的衣料被气流掀起，褶皱层层叠起；握剑的手在画面左下缘露出一角，指节因用力而泛白。\n\n背景为大幅虚化的红蓝织物：深红的帷幔与靛蓝的布面交错翻卷，边缘被虚化成色块，其间透出几缕金色的光斑；画面下缘还有一角深色的衣摆掠过。主光为画面前方的冷白硬光，直照面部，把眉骨的阴影与颧骨的转折压得极深；红蓝背景的反光在脸侧补上暖红与冷蓝的边缘光。\n\n空气中弥漫着被剑风卷起的浮尘，前景的剑身与发丝清晰锐利，背景的织物完全虚化；米白、朱红与靛蓝三色对撞，整体呈厚涂油画质感的东方少年出剑，凌厉而压迫。","zmf_name":"怒目出剑","zmf_batch":46,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s14.webp","id":"ZS-313"},{"bv":"BV1NxbD68EYE","scene":15,"series":"尘世长卷","title":"火中交锋","pal":"红金撞色","who":"人物群","comp":"双人对角，火满屏","motion":"火星爆/衣燃/兵刃相击","special":"火场对决","note":"火海里兵刃相撞，火星漫天","prompt_moss":"火海中两人兵刃相撞火星漫天。主光为火光。","prompt_zmf":"横画幅中式武侠对决场景，画面中央两位武者兵刃相撞：左侧一位玄黑长袍的武士横剑劈出，右侧一位白羽华服的女子举剑格挡，两剑相交的接触点迸出炽亮的火星与剑气，他们的四周是熊熊的火海。\n\n武士的黑袍下摆被火海的热浪掀起，他的双手握剑下压，剑身与对方的剑身相交处迸出放射状的火星，火星如金色的花雨向四周飞溅；他的发髻散乱，几缕散发横过面部，神情狠戾。白羽女子身披一件巨大的白色羽披风，羽披风如鹤翼在她身后张开，她的乌黑长发飞扬，她单手举剑格挡，另一只手在身侧展开护住身形，神情冷冽；她的羽披风的每一根羽枝在火光中透亮。\n\n火海包围了两人：成片的火焰自地面向上窜起，火舌的高度过人，火焰的中心炽白、外缘橙红，地面的余烬与火星漂浮在半空；火海的背后隐约可见燃烧的廊柱与建筑的黑影。主光为火海的自发光，自四周包裹两人，照亮武士的黑袍轮廓、羽披风的透光与兵刃相交的炽亮接触点；火海的暗部呈深红与焦黑，占约四成。\n\n空气中弥漫着浓重的火星与烟尘，前景兵刃相撞的火星飞溅清晰，火海的火焰保持向上的燃烧动势；玄黑袍、白羽披风与熔金火海对撞，整体呈厚涂油画质感的东方火海交锋，凌厉而炽烈。","zmf_name":"火海交锋","zmf_batch":30,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s15.webp","id":"ZS-314"},{"bv":"BV1NxbD68EYE","scene":16,"series":"尘世长卷","title":"水面双影","pal":"仙金蓝","who":"人物群","comp":"俯拍水面对称","motion":"水纹涟漪/衣倒影/落花","special":"水面镜像构图","note":"俯拍二人水面相持，倒影把画面一分为二","prompt_moss":"俯拍二人水面持剑相持，倒影对称。主光为日光。","prompt_zmf":"横画幅中式仙侠场景，高角度俯拍一片如镜的天空之镜水面：画面中央偏左一位红衣人与右侧一位白衣人隔着水面遥遥相对，两人的倒影笔直映在水中，把画面沿中轴一分为二。\n\n左侧的红衣人立在水中一块凸起的沙脊上，正红色的宽袖长袍与黑发在风里扬起，手中握着一柄细长的剑，剑尖斜指水面；右侧的白衣人身形舒展，月白色的广袖裙铺展在浅水上，裙摆散开如一朵白花，两人之间隔着一道弯弯的水波纹。红衣人与白衣人的倒影完整而清晰，与本体对称，倒影的边缘被细小的涟漪揉碎。\n\n水面的涟漪自两人的脚下荡开一圈圈同心圆，波纹间漂浮着几片白色的花瓣；画面左上与右上角的远处各露出一座白玉亭台的檐角，檐上挂着铜铃；水面倒映着大朵的积云与湛蓝的天空，云影与波纹交错。主光为明亮的白昼天光自上方漫射，照亮水面的高光、红衣的饱和色与白衣的透光；倒影深处的暗部呈深蓝色。\n\n空气中安静无尘，前景涟漪的波纹清晰，远处的亭台没入焦外；湛蓝、正红与月白对撞，构图对称，整体呈厚涂油画质感的东方天空之镜场景，静谧而对峙。","zmf_name":"水面双影","zmf_batch":8,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s16.webp","id":"ZS-315"},{"bv":"BV1NxbD68EYE","scene":17,"series":"尘世长卷","title":"雪谷黑袍","pal":"仙金蓝","who":"人物","comp":"人物右，雪谷纵深","motion":"雪雾/枫红几点/袍猎猎","special":"雪谷孤影","note":"黑袍立雪谷，红枫几点破色","prompt_moss":"一名黑袍人立于雪谷崖畔，红枫几点。主光为冷光。","prompt_zmf":"横画幅中式苍凉场景，画面右侧一位黑袍人背身立于雪谷的崖沿，俯瞰谷底的万里雪原，他身侧的一丛红浆果灌木在满目的雪白中破出几点红色，雪峰连绵至天际。\n\n黑袍人的乌黑长发被高空的罡风吹起，发丝与袍摆都向后扬起；他身着玄黑色的宽大长袍，袍面上银线绣着暗纹，腰间佩着一柄长剑，剑柄的红穗在风里摆动；他背负双手立于崖石之上，背影像一滴墨落在满幅的雪白里，衣袍的下摆被崖风掀起翻卷。\n\n他脚边的崖石上生着一丛结满红浆果的灌木：赤红的果实成串缀在枝头，果实的红在雪的白里格外鲜明，几颗浆果被风摇落在雪面上；崖石的白雪积着薄薄的一层，石缝间垂着冰凌。谷底的雪原辽阔无际：雪坡的起伏如凝固的浪，谷底的河道结着冰，冰面的裂纹延伸向远方；两侧的雪峰陡峭高耸，峰顶的岩体露出青黑的棱线，远处的雪峰层层淡入天际的淡金色。主光为清冷的雪天日光，从画面左上方漫射，照亮雪面的反光、黑袍的轮廓与浆果的红；雪原的阴影呈淡蓝灰色。\n\n空气中飘着细雪与崖风的雾气，前景黑袍的背影与红浆果清晰，雪谷层层纵深虚化；玄黑袍影、赤红浆果与雪白天地对撞，整体呈厚涂油画质感的东方雪谷孤影，苍凉而孤高。","zmf_name":"雪谷黑袍孤影","zmf_batch":21,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s17.webp","id":"ZS-316"},{"bv":"BV1NxbD68EYE","scene":18,"series":"尘世长卷","title":"火树余烬","pal":"红金撞色","who":"人物","comp":"火树占上半","motion":"火星飘/叶卷/云开","special":"烧透的树冠","note":"巨树烧剩火冠，人立树下不动","prompt_moss":"一株燃烧巨树下白衣人静立。主光为火光。","prompt_zmf":"横画幅中式场景，画面中央偏左矗立着一棵巨大的红叶古树，树冠如燃烧的火焰般赤红透亮，树干粗壮焦黑，树下的空地上一位红衣人静立仰望，占画面高度很小，与巨树形成强烈的尺度对比。\n\n古树的树冠占满画面上半部：成千上万片赤红的叶子在阳光下透亮如燃烧的火冠，叶隙间透出金色的光斑；树干为焦黑皲裂的木质，树皮的裂纹深刻，树根如龙爪般抓住地面，根部的红叶层层堆叠铺满树下。红衣人立在树根旁的空地上，乌黑的发与暗红的衣袍被风微微掀起，他仰头望着树冠，身影安静。\n\n树下四周是白色的沙地与低矮的白墙民居，民居的屋顶为灰黑色，远处一座朱红的门楼与青灰色的远山轮廓在晴空下清晰。主光为明亮的白昼暖阳，从画面右上方照亮红叶的透光面、树干的受光棱线与白衣舍的白墙；树的阴影横铺沙地，暗部呈深红褐色。\n\n空气中漂浮着飘落的红叶与细小尘埃，前景树根与红衣人的姿态清晰，远景民居与远山没入焦外；赤红、焦黑与乳白三色对撞，整体呈厚涂油画质感的东方神树场景，静穆而炽烈。","zmf_name":"火树余烬","zmf_batch":6,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s18.webp","id":"ZS-317"},{"bv":"BV1NxbD68EYE","scene":19,"series":"尘世长卷","title":"白衣归殿","pal":"仙金蓝","who":"人物","comp":"中心纵深，红树侧框","motion":"落叶卷/殿门开/光斜","special":"归殿台阶","note":"白衣拾级归殿，阶上落满红叶","prompt_moss":"白衣人拾级归殿，阶上落满红叶。主光为暖光。","prompt_zmf":"横画幅中式古风场景，画面中央一位白衣人背身沿石阶拾级而上归殿，阶上落满红色的枫叶，殿门透出暖黄的光，两侧的红枫与石灯笼对称排列。\n\n白衣人乌黑长发束成高马尾，发梢垂在背后；他身着月白色的宽袖长袍，衣摆与袖口绣着淡青色的云纹边，腰间束着深色的腰带，背后斜挎着一柄细长的佩剑，剑柄的红穗垂落；他背负双手，步伐沉稳，白衣的下摆被台阶上的红叶扫起几片。\n\n石阶自画面下缘层层升起，阶面上铺满赤红的枫叶，几片枫叶还飘在半空；石阶两侧各立着一盏石灯笼，灯笼的石座上覆着青苔，灯窗里的暖光摇曳。阶顶的殿门为黑瓦白墙的木构殿宇，门楣上挂着两盏红灯笼，殿门半开，暖黄的光从门内涌出，照亮门前的石阶与落叶。两侧的红枫树冠如火如荼，红叶自树冠飘落。主光为殿门透出的暖黄光与白昼的青金天光交织，从画面中央逆射，勾亮白衣人的轮廓、红叶的透光与石阶的高光；两侧枫林的暗部呈红褐色。\n\n空气中弥漫着飘落的红叶与光尘，前景石阶的红叶与人物背影清晰，殿门的光晕柔和过渡；月白、赤红与暖黄三色交织，整体呈厚涂油画质感的东方归殿独行，静谧而庄重。","zmf_name":"白衣归殿","zmf_batch":15,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s19.webp","id":"ZS-318"},{"bv":"BV1NxbD68EYE","scene":20,"series":"尘世长卷","title":"城头望月","pal":"红金撞色","who":"人物群","comp":"巨月占上半，城楼居中","motion":"月晕/幡动/云过月面","special":"超级月亮、城头群像","note":"巨月压城，城头立满望月的人","prompt_moss":"城头群像仰望巨月，幡动云过。主光为月光。","prompt_zmf":"横画幅中式幻想夜景大场景，一轮巨大的满月低悬在城楼上空，月轮几乎压到城楼的重檐；城楼的最高层平台上站满了望月的人，他们的剪影一排映在月轮之前，城中红灯高挂，月色如水银泻地。\n\n满月的月轮巨大，占据画面上半部的中央：月轮的环形山清晰，月色的银白中泛着淡淡的暖黄，月轮的边缘晕着柔和的光晕；月轮的下缘几乎贴着城楼最高层的檐脊。城楼为多层的朱红木构楼阁：青绿的琉璃瓦顶、金色的宝顶与雕梁画栋层层华丽，楼身的每一层都挂着红灯笼与金色的匾额，朱红的廊柱上盘着金色的龙雕；最高层的平台上站满了望月的人影，他们的剪影成排，有人凭栏、有人仰首、有人举杯。\n\n城楼的红绸自檐角垂下数条，红绸在夜风中翻卷；城下的街道灯笼连绵，月色如水银泻在街道与屋瓦上。背景的夜空为深蓝，几朵薄云横过月轮的下缘，云的边缘被月色染成银白。主光为满月的银白月光，自画面上方照亮城楼的檐脊、红绸的翻卷与平台上的人影剪影；城楼内部的灯火暖橙与月色的银白交织。\n\n空气中弥漫着月色的光晕与薄雾，前景城楼的雕梁与红灯清晰，满月与望月的人群构图完整；银白巨月、朱红楼阁与深蓝夜空对撞，整体呈厚涂油画质感的东方巨月压城，庄严而浪漫。","zmf_name":"巨月压城满城望","zmf_batch":26,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s20.webp","id":"ZS-319"},{"bv":"BV1NxbD68EYE","scene":21,"series":"尘世长卷","title":"红裙斗篷","pal":"红金撞色","who":"人物","comp":"人物居中，灯串纵深","motion":"斗篷/灯串/雾","special":"红金长裙","note":"红裙斗篷独过灯廊，裙色烧穿夜色","prompt_moss":"一名红裙斗篷女子独过灯廊。主光为暖光。","prompt_zmf":"横画幅中式幻想场景，画面中央一位身披暗红斗篷的旅人独自行走在金色的岩道上，他的背影渺小而坚定；他的四周，一条青绿色的巨龙的躯体盘绕在金色的岩壁间，龙鳞的金纹在光下如燃烧的河流，龙首在远处昂起俯视着他。\n\n旅人的乌黑长发束成高髻垂落，发梢的白色发带飘起；他身着暗红色织金的宽大斗篷，斗篷的下摆铺展在岩道上拖出长长的弧线，内衬露出月白色的衣缘；他背负一柄长剑，剑柄的红穗鲜明，他行走的姿态沉稳，不惧身侧的庞然大物。\n\n巨龙的躯体自画面的左上盘绕而下：青绿色的鳞甲片片分明，鳞缘的鎏金纹路如流动的熔金，龙身的曲线在岩壁间起伏，如大地的脉络；远处的龙首昂起，金色的龙角与龙须在光中飘扬，龙瞳俯视着小小的旅人，目光威严却无杀意。岩道的两侧，金红色的秋林与金色的岩壁交错，秋叶如火星飘落。主光为明亮的暖金阳光，从画面上方漫射，照亮龙鳞的金纹、斗篷的暗红与岩道的金色；岩壁的阴影呈暗红褐色。\n\n空气中弥漫着飘落的秋叶与岩尘，前景旅人的背影与斗篷拖尾清晰，巨龙保持盘绕的整体气势；暗红斗篷、青绿龙鳞与熔金岩道对撞，整体呈厚涂油画质感的东方金龙道独行，渺小与宏大并存。","zmf_name":"红裙斗篷金龙道","zmf_batch":37,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s21.webp","id":"ZS-320"},{"bv":"BV1NxbD68EYE","scene":22,"series":"尘世长卷","title":"灯桥独渡","pal":"妖夜橙","who":"人物","comp":"桥横贯，灯城背景","motion":"灯焰/桥影/水纹","special":"长桥灯城","note":"提灯人独过长桥，身后满城灯","prompt_moss":"一名提灯人独过长桥，身后满城灯。主光为暖光。","prompt_zmf":"横画幅中式水乡夜景大场景，画面中央一位红衣提灯的女子独自身背行囊走过一座石拱桥，桥下与两岸是铺满画面的水乡灯城，满城的灯与红叶交相辉映。\n\n女子乌黑长发挽成单髻，发间垂着白色的发带；她身着正红色织金的襦裙，裙摆自桥顶铺向桥面，裙上的金纹在灯光下发亮；她右手提着一盏六角的暖黄灯笼，左手背着布囊，独自一人走上桥顶，身影在满城灯火中安静而醒目。\n\n石拱桥为青灰色的石砌拱券，桥栏上雕刻着莲花纹样，桥洞下可见水面的倒影；河面上漂浮着数盏莲花形状的河灯，灯火点点顺水缓行。两岸的水乡民居层层叠叠：白墙黛瓦的屋檐挂满红色的灯笼，枫树的红叶如火如霞点缀在屋舍之间，垂柳的枝条拂过水面；远处一座更大的石桥横跨河道，桥后的楼阁灯火连绵至天际，夜空的云被灯光染成淡紫与暖橙。主光为满城灯海的暖橙自发光，自下而上照亮桥顶女子的红裙与灯笼的暖光；水面倒映着灯城的倒影，暗部呈蓝紫色，占约三成。\n\n空气中弥漫着河灯的光晕与薄雾，前景桥栏的石纹与人物的红裙清晰，灯城层层没入焦外化作光斑；暖橙、正红与蓝紫夜色交织，整体呈厚涂油画质感的东方灯桥独渡，静谧而盛大。","zmf_name":"灯桥独渡","zmf_batch":13,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s22.webp","id":"ZS-321"},{"bv":"BV1NxbD68EYE","scene":23,"series":"尘世长卷","title":"金浪红衣","pal":"仙金蓝","who":"人物","comp":"人物左，金浪满屏","motion":"金浪翻/披帛横飞/鹤群","special":"立浪而立、鹤群伴飞","note":"立于金色浪巅，鹤群自头顶掠过","prompt_moss":"一名红衣女子立于金色浪巅回望，鹤群掠过。主光为暖光。","prompt_zmf":"横画幅中式幻想场景，画面左侧一位身着彩绘长裙的女子侧立于金色芦苇浪边，回眸望向画面右方，全身入镜，裙摆与飘带横扫画面前景；画面右侧为大片深蓝色的湖面，两只丹顶鹤正涉水而行。\n\n女子乌黑长发松松披落，发梢随湖风扬起，侧脸轮廓柔和，神情若有所思。她身着月白色为底的长裙，裙面绘满宝蓝、正红与金色交织的大朵纹样，裙摆极长，自她身后向画面右下方铺展开来，如波浪般翻卷，最前端几片裙裾与飘带悬浮在半空；湖风把裙料吹向右侧，布料边缘半透明。\n\n她身旁的金色芦苇荡如浪涛般起伏，芦花被夕阳照得透亮，形成一片金色的光浪；芦浪边缘与深蓝的湖面相接，湖面上两只丹顶鹤一前一后漫步，白羽黑翎、顶冠猩红，倒影落在湖面。远景的湖对岸是低矮的青灰色山影，没入焦外的暮色中。主光为低角度的暖金夕阳，从画面右侧逆光照亮芦浪与她的发丝边缘、裙料透光处；暗部呈青金色。\n\n空气中漂浮着芦花絮与金色光尘，前景横扫的裙裾大幅虚化形成前景遮挡，远景山影没入焦外；暖金、深蓝与宝蓝对撞，正红点缀，整体呈厚涂油画质感的东方秋湖幻想，辽阔而温柔。","zmf_name":"金浪鹤影","zmf_batch":3,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s23.webp","id":"ZS-322"},{"bv":"BV1NxbD68EYE","scene":24,"series":"尘世长卷","title":"云崖坐忘","pal":"仙金蓝","who":"人物","comp":"人物右，云峰群立","motion":"云瀑/松枝/发丝","special":"云崖孤峰","note":"白衣坐云崖，云峰如岛","prompt_moss":"白衣女子坐云崖抚裙远望云峰群岛。主光为日光。","prompt_zmf":"横画幅中式仙侠场景，画面中央一位白衣女子坐在云崖边缘的岩石上，乌黑的长发垂落如瀑，她面朝画面右侧的云海群峰静坐，长发与裙摆垂在崖沿之下。\n\n女子乌黑长发松松披散，自头顶垂落至崖下，发梢被云气打湿；她身着月白色的多层纱裙，裙摆铺在身侧的岩石上，一层层垂落崖边；她双手交叠放在膝上，脊背舒展，侧脸的轮廓沉静，双眼轻闭，神情坐忘。\n\n崖边的岩石为青灰色，石缝间生着一株横出的金叶古松，松枝自画面左上方斜垂入画；崖下云海如岛屿群：一座座尖顶的云峰自云涛中拔起，峰顶露出青黑色的岩体与零星的红色殿顶，云海铺满画面下半部，层层的云浪推向天际。远处的群峰没入淡金色的雾霭，天光自右侧洒下。主光为清晨的暖金阳光，从画面右上方照亮云峰的受光面、松针的透光与她的白衣；云海阴影呈淡青色。\n\n空气中弥漫着云气与松香般的浮尘，前景发丝垂落的线条与松枝清晰，远处群峰层层虚化；月白、暖金与青灰三色交织，整体呈厚涂油画质感的东方云崖坐忘，空灵而宁静。","zmf_name":"云崖坐忘","zmf_batch":12,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s24.webp","id":"ZS-323"},{"bv":"BV1NxbD68EYE","scene":25,"series":"尘世长卷","title":"月下泊舟","pal":"仙金蓝","who":"人物","comp":"巨月居上，船居中","motion":"月光水路/芦苇/船灯","special":"水中巨月","note":"船泊月光水路尽头，天上水中两轮月","prompt_moss":"一艘船泊于月光水路尽头，天上水中两轮月。主光为月光。","prompt_zmf":"横画幅中式水乡夜景大场景，一条月光的水路自画面近处延伸向远方，水路的尽头泊着一艘乌篷船，天上水中两轮月交相辉映；岸边垂柳的枝条拂水，一座灯火通明的画舫楼阁泊在水路的一侧，一位白衣人立于船头。\n\n天上的满月巨大浑圆，月轮的环形山清晰，月色的银白洒满水面；水中的月影完整而清晰，与天上的月轮上下相对，月影的边缘被细浪揉出银色的碎边；月光的水路自画面的近处铺向远方，水路的两侧泛着银白的波光，如一条铺在水面上的月色大道。\n\n乌篷船泊在水路的尽头：船身的深褐色与船篷的弧线安静，船头立着一位白衣人的背影，他拄着一支长篙，仰望天上的月轮；船舷挂着一盏小小的暖黄灯笼，灯光在水面上投下一小圈光晕。水路一侧的画舫楼阁为多层的水上楼台：朱红的栏杆、灯笼串与青瓦的飞檐层层华美，楼阁的灯影倒映在水中；岸边的垂柳枝条拂水，柳叶的金黄在夜色里温柔。主光为满月的银白月光，自画面上方照亮水路的银带、乌篷船的轮廓与楼阁的檐角；夜空与水面的暗部呈深蓝青色，占约四成。\n\n空气中弥漫着水汽与柳絮，前景乌篷船与月影碎边清晰，两轮月的构图上下呼应；银白双月、暖黄灯笼与青蓝夜水三色交织，整体呈厚涂油画质感的东方月下泊舟，静谧而诗意。","zmf_name":"月下泊舟两轮月","zmf_batch":28,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s25.webp","id":"ZS-324"},{"bv":"BV1NxbD68EYE","scene":26,"series":"尘世长卷","title":"市井回眸","pal":"妖夜橙","who":"人物","comp":"特写，街市虚化","motion":"发丝横飞/人群虚影/灯笼光","special":"街市虚化","note":"金衣女子市井回眸，发丝横飞的一瞬","prompt_moss":"金衣女子市井回眸，发丝横飞，街市虚化。主光为暖光。","prompt_zmf":"横画幅中式古风人像场景，画面中央偏右一位金白色织锦襦裙的少女在市井街头回眸，正对镜头嫣然一笑，半身入镜，长发被风吹起横过画面。\n\n少女乌黑的长发完全被狂风扬起，发丝如绸缎般横向飘飞，几缕掠过她的唇边；发间点缀白色小花与金色发饰。她回眸的侧脸清丽：杏眼弯起，眼尾上挑，脸颊晕着红润，红唇微启露出一抹明朗的笑意。她身着乳白与鹅黄相间的织锦襦裙，领缘与袖口滚金边，肩头披着浅金色透纱披帛，纱料在风中向后翻卷。\n\n背景为虚化的傍晚市集：两侧挂满红灯笼与暖黄灯火，成排的幌子与桥楼轮廓在暖橙光雾中层层铺开，几个模糊的行人身影在灯影中走动。主光为市集的暖橙灯火自左前方照亮她的面部与裙面，逆光把飘飞的发丝勾成金色的丝线；暗部呈暖褐色，柔和过渡。\n\n空气中弥漫着灯火的光斑与细小浮尘，前景横飞的发丝与纱料边缘清晰，背景灯海没入焦外化作圆形光斑；暖金、乳白与朱红点缀三色交融，整体呈厚涂油画质感的东方市井回眸瞬间，鲜活而明媚。","zmf_name":"市井回眸一笑","zmf_batch":5,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s26.webp","id":"ZS-325"},{"bv":"BV1NxbD68EYE","scene":27,"series":"尘世长卷","title":"执剑画中","pal":"红金撞色","who":"人物","comp":"居中人像，金浪为底","motion":"剑穗/金浪/云走","special":"锦衣执剑、字幕后置","note":"锦衣执剑立于金浪，像一幅活的画","prompt_moss":"一名锦衣剑客立于金浪之中直视观者，像一幅活的画。主光为暖光。","prompt_zmf":"横画幅中式幻想场景，画面中央偏右一位身披蓝金织锦大氅的年轻女子立于金色的云涛之上，乌黑长发被狂风横吹过画面，右手持一柄出鞘的长剑斜指下方，整个人像一幅活的油画。\n\n女子的长发完全被罡风掀起，发丝如墨色的绸带横贯画面上半部；她侧身回望镜头方向，下颌微收，眼神冷冽。她身披的宽大织锦大氅为宝蓝与暗金相间，氅面上织满云纹与禽鸟纹样，氅摆被风吹得向左侧翻卷铺展；氅内露出白色的衣缘，腰间束着朱红色的织锦腰带，垂下长长的红色剑穗；她的右手虎口扣着剑柄，长剑的剑身泛着雪亮的寒光，剑尖斜向画面左下方。\n\n她脚下的金色云涛如涌动的油画颜料，一团团金色的云块翻卷堆叠，向画面左侧铺展；几缕白色的云丝横过她的腰际。背景的天空为饱和的湛蓝色，大朵的白云悬在天际，云的受光面泛着暖金。主光为明亮的白昼偏暖天光，从画面右上方照亮她的侧脸、大氅的织金纹样与剑身的寒光，云涛的金色如被点燃；暗部呈蓝紫色。\n\n空气中漂浮着金色云絮与光尘，前景翻卷的氅摆与云涛清晰，背景天空纯净；湛蓝、熔金与宝蓝织锦对撞，整体呈厚涂油画质感的东方执剑侠女，英气逼人如画中走出。","zmf_name":"执剑画中人","zmf_batch":10,"run":true,"image":"../images/scenes/BV1NxbD68EYE/s27.webp","id":"ZS-326"},{"bv":"BV1XnuH66EFU","scene":1,"series":"尘世长卷","title":"青山行旅","pal":"仙金蓝","who":"人物","comp":"大景小人居中，群峰环绕","motion":"金瀑流云/马鬃/旗微动","special":"金山瀑布群峰","note":"古诗词系列通用：底部诗句字幕为固定叠加层","prompt_moss":"红衣旅人牵马坐崖顶歇脚，金山群峰环绕云瀑。主光为暖光。","prompt_zmf":"横画幅中式山水场景，平视中景。画面右侧一位红衣旅人侧坐在岩石上，身后立着一匹白马；左侧与远景是层叠的青绿山峦，山谷间云气流动，占画面高度约七成。\n\n旅人侧脸清瘦，眉形平直，唇色偏淡，发髻以木簪束起；肩背松弛，视线落在山谷的远处。\n\n他身着朱红长袍，外披深褐短斗篷，腰带束得紧，脚边搁着一顶竹笠；白马的鬃毛与尾毛被风带起，鞍上挂着行囊与水囊。\n\n山体为青绿与赭石层叠的岩壁，山脊褶皱深刻，谷底云气被晨光染成暖白；近处坡地铺着浅黄的草与碎石，几株矮树贴地生长；远山轮廓层层淡去。主光为侧逆晨光，自画面左上方穿透云气，照亮山脊受光面、旅人肩线与马背鬃毛，勾出一圈暖边；山阴暗部呈青灰。\n\n空气中弥漫着山谷薄雾与浮尘，前景的岩石与竹笠清晰，远景山峦虚化；青绿、朱红与暖白交织，整体呈厚涂油画质感的东方青山行旅，苍茫而从容。","zmf_name":"青山行旅","zmf_batch":48,"run":true,"image":"../images/scenes/BV1XnuH66EFU/s01.webp","id":"ZS-327"},{"bv":"BV1XnuH66EFU","scene":2,"series":"尘世长卷","title":"我见青山多妩媚","pal":"仙金蓝","who":"人物","comp":"三分背影，云海铺展","motion":"云海翻涌/长发绿丝带飘/群山雾","special":"绿发白衣、字幕后置","note":"","prompt_moss":"绿发白衣女子坐崖畔掠发远眺云海群山。主光为暖光。","prompt_zmf":"横画幅中式山水人像场景，背影构图：画面中央一位绿发的女子背身坐在山巅的崖边，她抬起一只手臂搭在额前眺望层峦叠嶂的青山，她的绿发与彩绘的裙裾铺展在崖沿，脚下是云海与层峦的锦绣江山。\n\n女子的长发为罕见的青绿色，长发如瀑垂落及腰，发间别着素色的发饰与一点红果发簪；她抬臂眺望的姿态舒展，侧脸的轮廓在逆光中柔和。她身着乳白色与青蓝织锦相间的多层裙裾，裙面上绘着金红的大朵纹样，裙摆自崖沿向画面下方铺展，铺成一片流动的锦毯；她的广袖被山风掀起，袖缘的纱料半透明。\n\n群山层峦叠嶂：近处的山峰青绿如洗，中景的山体被暮光染成金红与淡紫，远山的轮廓层层淡入天际的雾霭；山腰的云海如带缠绕，云海的谷地里几座白墙的村落与金顶的塔尖若隐若现。她身侧的崖边生着一株探出的红果树枝，枝头的红果在风中轻晃。主光为黄昏的金红暮光，从画面右前方照亮山脊的受光棱线、她的绿发边缘与裙裾的织锦反光；群山的背光面呈青蓝墨绿。\n\n空气中弥漫着山雾与暮光的光尘，前景眺望的背影与铺展的裙裾清晰，群山层层递进；青绿长发、彩绘裙裾与金红群山对撞，整体呈厚涂油画质感的东方我见青山，辽阔而妩媚。","zmf_name":"我见青山多妩媚","zmf_batch":30,"run":true,"image":"../images/scenes/BV1XnuH66EFU/s02.webp","id":"ZS-328"},{"bv":"BV1XnuH66EFU","scene":3,"series":"尘世长卷","title":"行到水穷处","pal":"仙金蓝","who":"人物","comp":"大景小人居中下，瀑布纵贯","motion":"瀑布奔流/云涌/舟微晃","special":"悬空瀑布群峰","note":"","prompt_moss":"孤舟渔父悬于瀑布之上群峰间静坐。主光为暖光。","prompt_zmf":"横画幅中式山水场景，画面中央的溪潭边一位披蓑戴笠的渔人独坐船头垂钓，他面前的水潭被两侧的金色云山环抱，云山的瀑布与云瀑层层垂落，天光自云山的裂隙洒下，坐看云起时的心境。\n\n溪潭的水面平缓，潭水映着金色云山的倒影；渔人的小舟泊在潭心的礁石旁，他披着蓑衣戴着斗笠，斗笠的边缘垂着细细的蓑草，他执竿垂钓的姿态安然，蓑衣的编织纹理清晰；他的舟头放着一盏小小的灯与一只鱼篓。\n\n两侧的云山巨大：金色的云山如凝固的浪，山体的云瀑层层垂落，云瀑的边缘翻卷着金白色的云花；山体的岩壁上垂挂着红色的藤蔓与金色的苔藓，山腰的瀑布群自云层的裂隙垂落成帘；云山的裂隙间天光如柱洒下，光柱照亮潭心的一片水面。前景的礁石上停着一只白色的小鸟，与渔人相伴。主光为云山裂隙的天光与云瀑的金色反光，自画面上方照亮潭水、蓑衣的纹理与云瀑的层次；云山的暗部呈青金色。\n\n空气中弥漫着水雾与云絮，前景垂钓的渔人与舟头的小鸟清晰，云山与天光层层递进；熔金云山、青黑礁石与蓑衣斗笠的剪影三色交织，整体呈厚涂油画质感的东方行到水穷处，安然而壮阔。","zmf_name":"行到水穷处","zmf_batch":36,"run":true,"image":"../images/scenes/BV1XnuH66EFU/s03.webp","id":"ZS-329"},{"bv":"BV1XnuH66EFU","scene":4,"series":"尘世长卷","title":"鸟倦飞而知还","pal":"仙金蓝","who":"动物","comp":"满屏秋林，鸟群斜线","motion":"雁阵振翅/红叶翻/云走","special":"红枫秋山、雁阵","note":"","prompt_moss":"雁阵掠过层林尽染的红枫秋山。主光为暖光。","prompt_zmf":"横画幅中式田园大场景，画面上空一群南归的大雁排成人字横过秋日山谷，山谷两侧的山林燃烧着金红色的秋叶，山道上一队归人挑担缓行，松树的枝干探入画面。\n\n雁群约二十只，自画面右上向左上飞行，雁羽的灰褐色在逆光中透亮，雁阵的队形舒展，领头的雁振翅的角度清晰；它们飞越的山谷两侧，山坡上的秋叶如火如荼：金色、橙红与深红的林带层层铺染山体，林间的岩壁裸露出青灰的肌理，几缕山雾在林隙间横流。\n\n山道自画面左下蜿蜒入谷：道上的归人约五六人，挑着柴担、背着行囊、推着独轮车，最前面的一位老者拄杖而行，他们的身影在逆光中呈半剪影；道旁的松树枝干虬曲，松针在光下透亮，枝头挂着红色的叶簇。谷底的白墙村落炊烟袅袅，屋顶晒着收获的作物。主光为低角度的暖金夕阳，从画面右侧逆射，照亮雁羽的透光、秋林的燃烧感与归人的轮廓光；山体背光面呈蓝青色，暗部占约四成。\n\n空气中弥漫着山雾与飘落的秋叶，前景松枝与山道归人清晰，雁群保持完整的飞行动势；金红、墨绿与灰褐雁羽对撞，整体呈厚涂油画质感的东方秋归图，辽阔而温情。","zmf_name":"鸟倦知还","zmf_batch":15,"run":true,"image":"../images/scenes/BV1XnuH66EFU/s04.webp","id":"ZS-330"},{"bv":"BV1XnuH66EFU","scene":5,"series":"尘世长卷","title":"采菊东篱下","pal":"仙金蓝","who":"人物","comp":"人物左，小院篱笆右","motion":"花瓣轻颤/袖口/炊烟","special":"小院篱笆、菊花","note":"","prompt_moss":"白衣少女蹲东篱采菊插瓶，小院炊烟。主光为暖光。","prompt_zmf":"横画幅中式田园幻想场景，画面左侧一位白衣古装女子俯身在竹篱边采菊，篮中已盛了半篮白菊，背景是一座被金色秋叶覆盖的燃烧般的青山，山脚下是白墙灰瓦的村落。\n\n女子乌黑长发挽成随意的发髻，发间别着一支素簪，垂落的发丝拂过肩头；她身着月白色的广袖长裙，肩头披着一条蓝底织满花卉纹样的宽幅披帛，披帛的一角垂进花丛；她俯身弯腰，一手扶着竹篱，一手拈着一朵白菊的茎秆，指尖轻柔，侧脸含笑，神情恬淡。\n\n竹篱为细竹竿扎成，篱笆上爬着藤蔓；篱内篱外开满菊花：白色、鹅黄与淡紫的菊丛一丛丛铺满画面前景，竹篮里白菊与枝叶堆得冒尖；篱边的木架上晾晒着成串的红辣椒与金黄的玉米。背景的南山如火如金：漫山的秋叶被阳光照成透亮的金红色，山间瀑布的银线自崖顶垂落，山腰缠绕着白色的雾带；山脚下的白墙民居青瓦屋顶错落，晒秋的竹匾摆在屋顶。主光为明亮的秋日暖阳，从画面右上方照亮山体的秋叶、白菊的瓣与她的白衣；山影的暗部呈蓝青色。\n\n空气中漂浮着菊瓣与光尘，前景采菊的手与竹篮清晰，远山与村落没入焦外；暖金、月白与淡紫菊色交织，整体呈厚涂油画质感的东方采菊东篱，恬淡而丰盈。","zmf_name":"采菊东篱下","zmf_batch":13,"run":true,"image":"../images/scenes/BV1XnuH66EFU/s05.webp","id":"ZS-331"},{"bv":"BV1XnuH66EFU","scene":6,"series":"尘世长卷","title":"悠然见南山","pal":"仙金蓝","who":"人物","comp":"人物左转中景","motion":"山雾/发带/群鸟","special":"南山远景","note":"","prompt_moss":"采菊少女起身回眸，远处南山云开。主光为暖光。","prompt_zmf":"横画幅中式田园幻想场景，画面左侧一位白衣红裙的古装女子立于自家庭院的竹篱旁，手中执着一枝白色菊花抬头远望，背景是一座被金色秋叶覆盖的巍峨高山，山体如火焰般金红透亮。\n\n女子乌黑长发挽成随意的发髻，鬓边垂落细软碎发，侧脸恬静，目光越过篱笆望向远山。她身着月白色的广袖外衫，领缘露出水红色的内裙与青绿色腰带，腰间垂着绣满花卉纹样的红蓝织锦飘带；广袖被山风微微吹起，袖缘的纱料半透明。她的指尖轻拈一枝白菊，菊瓣在光下近乎透亮。\n\n庭院里：她身前的竹篱上爬满藤蔓，篱边摆着几盆盛开的黄菊与白菊，右侧是白墙灰瓦的民居一角，屋檐下挂着成串的金黄玉米与干辣椒，竹匾里晒着收获的果实。远景的南山占据了画面上半部的中央：山体被漫山的金红色秋叶覆盖，如火焰山般灿烂，山间瀑布的银线自崖顶垂落，山脚雾气缠绕白墙村落。主光为明亮的秋日暖阳，从画面右上方照亮山体的秋叶、屋檐与她的白衣；暗部呈蓝青色。\n\n空气中漂浮着落叶与花粉微粒，前景竹篱与菊花清晰，远山没入焦外仍保持金红的整体色块；暖金、朱红与月白三色交织，整体呈厚涂油画质感的东方田园诗意，悠然恬淡。","zmf_name":"悠然见南山","zmf_batch":5,"run":true,"image":"../images/scenes/BV1XnuH66EFU/s06.webp","id":"ZS-332"},{"bv":"BV1XnuH66EFU","scene":7,"series":"尘世长卷","title":"飞鸟相与还","pal":"仙金蓝","who":"动物","comp":"大远景山群收束","motion":"云瀑奔流/鸟群归飞/光线移动","special":"云瀑山群","note":"","prompt_moss":"雁阵归飞入林，云瀑奔流收束。主光为暖光。","prompt_zmf":"横画幅中式山水大场景，无人物：暮光下的金色群山之间，一群归巢的飞鸟掠过山脊，山体的肌理如油画的笔触，云雾在山腰缠绕，山坳里的金色云瀑倾泻而下。\n\n群山的山体为青蓝色与墨绿色交织，山脊的受光面被暮光染成熔金与橙红，山体的皴裂肌理如刀劈斧凿；山腰的云雾横向缠绕，雾带的边缘被暮光染成淡金色；画面中央偏左的一座高峰上，金色的云瀑自山顶倾泻而下，云瀑如发光的河流沿山势淌进谷底，云瀑的边缘翻卷着金红的浪花。\n\n飞鸟群自画面的右侧飞向左侧的山坳：约二十只飞鸟排成松散的阵形，鸟翼的剪影在金色天幕下清晰，有几只鸟振翅的角度分明，鸟群的高度参差，近处的两只翼展舒展。山谷的底部为深色的谷林，谷林的树冠层叠如绒毯。主光为暮色的金红光，从画面右侧照亮山脊的受光棱线、云瀑的金色与飞鸟的剪影边缘；山体的背光面呈青蓝墨绿，暗部占约四成。\n\n空气中弥漫着山雾与暮光的光尘，前景的飞鸟剪影与山脊肌理清晰，远山层层虚化；熔金山脊、青蓝山影与金红云瀑三色交织，整体呈厚涂油画质感的东方暮山归鸟，辽阔而宁静。","zmf_name":"飞鸟相与还","zmf_batch":23,"run":true,"image":"../images/scenes/BV1XnuH66EFU/s07.webp","id":"ZS-333"},{"bv":"BV1eAg96TEYs","scene":0,"series":"尘世长卷","title":"撞钟","pal":"红金撞色","who":"人物","comp":"人物左，钟居中占半","motion":"钟身震颤/杵离手回位/云散/幡动","special":"巨型铜钟、云上山城","note":"动作场景：撞击-回弹循环","prompt_moss":"一名蓝金衣女子抱杵奋力撞钟，钟震涟漪在云中扩散。主光为日光。","prompt_zmf":"横画幅中式殿前场景，平视中景。画面左侧是一口巨大的青铜钟，钟身占画面高度约七成；右侧一位着蓝金礼服的乐师双手握着撞木向前撞去，身体后倾，占画面高度约五成。\n\n乐师为中年面孔，须髯齐整，眉眼专注；头戴青蓝幞头，长发束起；动作正处在撞出的瞬间，足跟离地。\n\n他身着宝蓝与金黄相间的织锦礼服，肩背有暗红披帛，宽袖被动作带起翻卷，腰间玉带与绦穗甩动；撞木为深褐硬木，撞头裹着织物。\n\n钟身为青铜，表面铸着细密纹样，钟口内壁发暗，钟鼻系着红绸；殿前的台阶与栏板为白石，远处山峦与云海层叠，天空为深蓝。主光为侧后方的暖金阳光，自钟身一侧逆射，把钟体弧面照出金属高光，乐师的轮廓被勾亮；暗部呈深青。\n\n空气中浮着被震起的细尘，前景的撞木与钟面清晰，远景山峦虚化；宝蓝、金与青铜绿撞色，整体呈厚涂油画质感的东方撞钟，肃穆而有力。","zmf_name":"撞钟","zmf_batch":48,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s00.webp","id":"ZS-334"},{"bv":"BV1eAg96TEYs","scene":1,"series":"尘世长卷","title":"大婚红堂","pal":"红金撞色","who":"人物群","comp":"对称纵深，红毯居中","motion":"白纱飘/花瓣落/宾客衣动/幡动","special":"红堂大典、白纱群","note":"群像：人群降级描述","prompt_moss":"红堂大婚典礼对称纵深构图，白纱与红毯分列，花瓣飘落。主光为暖光。","prompt_zmf":"横画幅中式大婚场景，群像构图：朱红的大婚殿堂内红绸与花海铺满穹顶与四壁，一对新人立于堂中的红毯中央，他们的四周环绕着观礼的宾客与起舞的白衣舞者，花瓣自穹顶飘落满堂。\n\n殿堂的穹顶与四壁为红色的海洋：朱红的绸幔自梁柱间层层垂落，成串的红花与白花编成花环挂在梁间，红绸的瀑布自藻井垂下；堂中的红毯自门口铺向主位，毯上花瓣散落。新人并肩立于红毯的中央：新郎着红金织金的喜服，新娘的凤冠霞帔华丽，两人的身形在群像中居中而立；观礼的宾客分列红毯的两侧，红衣的贵妇与青衣的官员执礼而立；数位白衣的舞者在红毯的两翼起舞，舞者的白裙与红堂相映。\n\n殿堂的金色梁柱与朱红立柱高阔，梁间的宫灯成串点亮；堂侧的乐师奏着礼乐，金钟与红鼓的器物陈设华丽。主光为殿堂的暖红灯光与穹顶天窗的白光交织，照亮新人的喜服、宾客的衣冠与花瓣的飘落；殿堂的暗部呈深红色。\n\n空气中弥漫着花瓣与红绸的飘絮，前景新人居中的群像构图与环绕的舞者清晰，殿堂的纵深层层递进；朱红堂室、白裙舞者与金梁红绸对撞，整体呈厚涂油画质感的东方大婚红堂，喜庆而盛大。","zmf_name":"大婚红堂","zmf_batch":35,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s01.webp","id":"ZS-335"},{"bv":"BV1eAg96TEYs","scene":2,"series":"尘世长卷","title":"嫁衣背影","pal":"红金撞色","who":"人物","comp":"背影居中，城郭横铺","motion":"凤冠垂珠/披纱/云/城灯","special":"凤冠霞帔","note":"背影构图","prompt_moss":"一名凤冠霞帔新娘背身立于高台远望节庆城郭。主光为暖光。","prompt_zmf":"横画幅中式婚庆大场景，背影构图：画面左侧一位身着红金嫁衣的新娘背身而立，她自花轿的轿帘前转过身，望向远处的宫城大道；大道两侧红金相间的幡旗与宫灯连绵，直通尽头金顶的宫城。\n\n新娘乌黑长发挽成繁复的高髻，发髻上插满金色的凤簪、红色的绢花与成串的珍珠流苏，流苏自鬓边垂落；她身着正红织金的嫁衣：衣身的金线绣满凤凰与缠枝，肩头的披帛为金红相间的织锦，宽大的衣袖垂落，袖缘的毛边滚着白狐毛；红色的裙摆铺展在轿前的地毯上，裙裾层层如花瓣。\n\n她面前的花轿为绿色的轿顶、朱红的轿身，轿帘半掀，轿身的金线纹样华丽；轿前的大道自画面左下延伸向右上的宫城：大道两侧立着成排的红金相间的幡旗，幡旗上印着金色的文字图案，宫灯成串挂在旗杆之间；大道的尽头，一座金顶的宫城巍峨矗立，宫城的红墙金瓦在日光下恢弘，宫城前的广场上人影如蚁。天空为晴朗的蓝，大朵的白云悬在宫城上空，几片红色的花瓣飘在空中。主光为明亮的白昼阳光，从画面右上方照亮嫁衣的金线、幡旗的红与宫城的金顶；幡旗的阴影呈暖褐色。\n\n空气中弥漫着喜庆的花瓣与浮尘，前景嫁衣背影的金线纹样清晰，大道与宫城纵深透视；正红嫁衣、鎏金幡旗与金色宫城三色交织，整体呈厚涂油画质感的东方出阁背影，盛大而庄重。","zmf_name":"嫁衣背影出阁","zmf_batch":21,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s02.webp","id":"ZS-336"},{"bv":"BV1eAg96TEYs","scene":3,"series":"尘世长卷","title":"群袖起舞","pal":"红金撞色","who":"人物群","comp":"领舞居中，群舞环绕","motion":"长袖翻飞/裙旋/灯串/珠钗","special":"舞袖大殿","note":"群舞：领舞为主焦点，群舞虚化跟随","prompt_moss":"一名金白衣领舞展开双袖，群舞者环绕相随，灯串亮起。主光为暖光。","prompt_zmf":"横画幅中式殿内群舞场景，平视机位。画面中央偏左一位领舞女子双臂向两侧展开，广袖垂落如翼，占画面高度约六成；她身后与两侧各有两名舞者侧身随舞，队形沿殿内地毯铺开。\n\n领舞为鹅蛋脸，眉形细长，眼尾上挑，唇色正红，额间贴一枚花钿；乌黑长发高挽成髻，两侧插金步摇与红玉珠钗，鬓边垂落的发丝随舞步飘起，发梢扫过肩头的纱料。\n\n她身着米白与朱红相间的交领长裙，外罩一层青绿的薄纱大袖，袖口与裙裾滚金线云纹；双臂展开时薄纱自肩头向两侧铺展，纱料被殿内气流掀起，透出背后灯笼的暖光；腰间束红锦腰带，垂下两条长绦。\n\n殿内立着朱红立柱与雕花的梁枋，柱间悬挂成串的暖橙宫灯，灯下垂着金穗；地面铺朱红地毯，毯上织金色团花；两侧的舞者身着青绿与正红的短襦长裙，衣袖连成起伏的弧线，裙摆在地毯上旋开；远处殿门处站着几个执灯的宫人，身影缩小虚化。主光为殿内宫灯的暖橙透光，自上方与两侧照亮领舞的面颊、纱袖的透光与金线纹样；廊柱背光的一面呈深红褐色，暗部约占四成。\n\n空气中弥漫着被灯光点亮的浮尘与香烟，前景纱袖的边缘大幅虚化，远景殿门没入暖金色的光雾；朱红、青绿与米白三色撞色，整体呈厚涂油画质感的东方殿舞，盛大而明艳。","zmf_name":"群袖起舞","zmf_batch":42,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s03.webp","id":"ZS-337"},{"bv":"BV1eAg96TEYs","scene":4,"series":"尘世长卷","title":"回身旋舞","pal":"红金撞色","who":"人物","comp":"居中旋转动态","motion":"袖弧/裙旋/珠钗","special":"旋舞瞬间","note":"旋转循环：一整圈=5秒","prompt_moss":"一名红金舞者旋身甩袖回眸带笑，裙摆旋成锥形。主光为暖光。","prompt_zmf":"横画幅中式宫宴舞蹈场景，画面中央一位身着白绿金三色织锦舞衣的舞者正在回身旋舞，她的裙摆与披帛随旋转铺开成圆弧，她的周围，数位青绿色舞衣的伴舞同步旋舞，背景为朱红立柱与金顶的宫宴大堂。\n\n中央舞者的乌黑长发挽成古典的舞髻，发间插着金色的步摇与绢花，发梢随旋转甩出弧线；她回身的侧脸清丽，神情沉醉。她的舞衣华丽：上身为米白色织金的交领短衫，衣料上绣着红绿相间的花卉纹样，肩头绕着一条正红色的宽披帛，披帛随旋转在空中拉出圆弧；下裙为青绿与乳白相间的多层大摆裙，裙摆随旋转铺开成完美的圆形裙浪，裙缘的金线流苏飞扬；她的双臂展开，广袖如翼。\n\n她周围的伴舞们身着青绿色与米色相间的舞衣，同步旋舞，裙摆的圆弧大小相扣，形成旋舞的涟漪；宫宴的大堂金碧辉煌：朱红的立柱与金顶的藻井高阔，柱间的宫灯与金色的屏风华丽，堂侧的乐师们执琵琶与笛箫奏乐。主光为宴堂的暖金灯火，自上方漫射，照亮舞者的裙摆层次、披帛的圆弧与立柱的朱红；堂内的暗部呈红褐色。\n\n空气中弥漫着舞动掀起的裙风与灯穗，前景中央舞者的旋转裙浪与披帛圆弧清晰，伴舞的涟漪与宫宴的背景层次分明；白绿金舞衣、正红披帛与朱红金顶对撞，整体呈厚涂油画质感的东方宫宴旋舞，华美而灵动。","zmf_name":"宫宴回身旋舞","zmf_batch":34,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s04.webp","id":"ZS-338"},{"bv":"BV1eAg96TEYs","scene":5,"series":"尘世长卷","title":"宾客仰望","pal":"红金撞色","who":"人物群","comp":"人物左，金饰宾客虚化","motion":"金光/人群衣动/幡","special":"金色宾客群","note":"群像：焦点在他一人","prompt_moss":"一名深色锦袍新郎立于虚化金色宾客群中仰头望上方。主光为暖光。","prompt_zmf":"横画幅中式宫宴群像场景，焦点在画面左侧一位身着正红织金华服的年轻男子，他立于宴席中央神情沉静；他身旁与身后环绕着数十位盛装的宾客，所有人都仰望同一个方向，景深把焦点留在他一人身上。\n\n男子的乌黑长发束成金冠的高髻，金冠上垂着红色的缨带；他身着正红色织金的交领华服，衣身上金线绣着腾龙与云纹，肩头的披领为厚重的金线织锦，领缘滚着白狐毛边；他的目光望向画面右侧的高处，神情沉稳，与周围仰望的宾客一致。\n\n他身旁的宾客盛装如云：右侧一位头戴鎏金凤冠、身着湖蓝织金华服的贵妇以袖掩唇，眼波流转；她们与周围数十位红金、蓝金、翠绿织锦的宾客都仰着头，望向画面外的同一个高点，衣饰的织金纹样在宴堂的暖光中连成一片金色的人海。背景为宫宴的大堂：金色的立柱与朱红的帷幔层层排开，帷幔间垂着成串的宫灯与金铃，案上摆满金盘玉盏。主光为宴堂的暖金光，自上方漫射，聚焦点亮男子的红衣与身旁贵妇的蓝金衣饰，前后景的宾客虚化成金红的光斑人海。\n\n空气中弥漫着酒香的光晕与金粉，前景男子的织锦纹样清晰，群像的层次由实到虚；正红、湖蓝与鎏金三色交织，整体呈厚涂油画质感的东方宫宴群像，富贵而隆重。","zmf_name":"宴中群像仰望","zmf_batch":17,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s05.webp","id":"ZS-339"},{"bv":"BV1eAg96TEYs","scene":6,"series":"尘世长卷","title":"编钟执槌","pal":"红金撞色","who":"人物","comp":"钟列占左，人右","motion":"槌起落/钟纹微光/灯焰/衣袖","special":"青铜编钟","note":"动作场景：击钟循环","prompt_moss":"一名锦袍乐师执槌击青铜编钟，烛光照亮钟面纹样。主光为烛光。","prompt_zmf":"横画幅中式殿内场景，平视近景。画面左侧占据三分之二的是成排的青铜编钟，钟架为朱红的木梁；右侧一位穿礼服的执槌者侧身而立，正抡起木槌击向最大的一口钟。\n\n执槌者为中年的面容，眉眼专注，须髯修剪齐整；头戴青绿的软脚幞头，身着金地蓝纹的织锦礼服，肩背处有暗红的披帛，袖口宽大，随挥臂的动作翻卷。\n\n编钟为大小渐次的青铜钟，钟面铸着细密的乳钉与蟠螭纹，钟体的铜色被火光照成暖褐，钟口的内壁发暗；钟架的木梁上绘着彩画，悬钟的铜钩磨得发亮；执槌者的木槌为深色硬木，槌头裹着织物，正抵在钟面的下缘。\n\n殿内的背景为朱红的墙与柱，柱间挂着成串的暖橙宫灯，灯下垂着金穗，灯火把殿内照成一片浓艳的暖红；远处还有成排的钟架与乐师的身影，没入暖红的光雾。主光为殿内的宫灯火光，自上方与左侧照亮钟面的乳钉、执槌者的衣袖与幞头；钟面的深处与殿角沉入暗红，暗部约占四成。\n\n空气中弥漫着灯火的暖雾与细小的烟尘，前景的钟面与木槌清晰，远处的钟架虚化；正红、金褐与青铜绿三色撞色，整体呈厚涂油画质感的东方编钟执槌，浓艳而庄重。","zmf_name":"编钟执槌","zmf_batch":44,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s06.webp","id":"ZS-340"},{"bv":"BV1eAg96TEYs","scene":7,"series":"尘世长卷","title":"红绸对舞","pal":"红金撞色","who":"人物群","comp":"双人对称，绸相连","motion":"红绸连/发飞/衣展/人群虚化","special":"红绸连心","note":"双人：绸相连是主视觉","prompt_moss":"蓝金盛装的男女执红绸对舞相望，绸连两端。主光为暖光。","prompt_zmf":"横画幅中式古典场景，画面中央一对古装男女相向对舞，一条正红色的长绸把两人连在一起：绸带自男子的腰间绕出，穿过两人之间的空中，缠向女子的手臂，绸带在两人之间拉出优美的弧线。\n\n左侧男子乌黑长发束起，身着宝蓝色织金的宽袖长袍，袍面上织满银色的团花纹样，衣缘滚红边，他一手叉腰，一手向后甩出绸带的一端，下颌微抬，舞姿挺拔。右侧女子乌黑长发高束，发梢随风扬起，身着米白色与宝蓝相间的织锦襦裙，领缘与袖口滚着藏青的纹样边，红色的腰带垂着长穗；她面向男子，双臂微张承接绸带，裙摆旋起，神情含笑。\n\n红绸在两人之间的空中划出数道交叠的弧线，绸面的正红色在逆光下透亮如火焰，绸带的运动带着轻微的模糊，表现出舞动的动感。背景为宫殿的长廊：朱红的立柱、彩绘的枋梁与悬挂的白色纱幔层层排开，纱幔被风吹起，透过纱幔可见廊外的白玉栏杆与远处的宫城。主光为清晨的暖金阳光，自廊外逆射，照亮红绸的透光、两人的衣料边缘与纱幔的飘动；廊内阴影呈暖褐色。\n\n空气中弥漫着浮尘与纱幔的纤维，前景红绸的弧线与两人的舞姿清晰，背景长廊层层虚化；正红、宝蓝与米白三色交织，整体呈厚涂油画质感的东方双人舞绸场景，动感而典雅。","zmf_name":"红绸对舞","zmf_batch":12,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s07.webp","id":"ZS-341"},{"bv":"BV1eAg96TEYs","scene":8,"series":"尘世长卷","title":"上元灯船","pal":"红金撞色","who":"人物群","comp":"灯船占上半，二人下缘","motion":"灯船巡游/灯串/人潮/雾","special":"巨灯船","note":"仰视构图：灯船是主奇观","prompt_moss":"上元灯节，两人背影仰望一条龙形巨灯船巡游空中。主光为灯船自发光。","prompt_zmf":"横画幅中式元宵夜景大场景，仰视构图：一条巨大的锦鲤形灯船悬在街道上空，蓝绿色的鳞片灯盏次第点亮，画面下沿两侧的楼阁与灯海之间站着仰望的人群，左侧近景一位蓝衣金纹的男子与右侧一位白衣红裙的女子背影入镜。\n\n锦鲤灯船的鳞片为一片片蓝绿与青白相间的发光灯盏，鳞片边缘描着金线，鱼首高昂，金色的鱼须与鱼鳍舒展，鱼尾摆出有力的弧度，鱼腹下的支架上挂着红色的流苏灯穗；灯船悬停在半空，鳞光把夜空染成蓝绿与暖金交映。\n\n街道两侧是飞檐重叠的中式楼阁，檐下与廊柱间挂满成千上万盏红灯笼与金色饰件，灯海自近处铺向街道深处，人潮涌动成海；左右两侧前景各一位仰望者：左边的男子乌黑长发束冠，身着宝蓝色织金斗篷，锦缎上的团纹在灯下泛光；右边的女子发髻繁复，插着金钗与绢花，身着米白广袖裙与朱红束腰长裙，两人都微微仰头。远处的街道尽头没入虚化的暖橙光雾。\n\n主光为灯海与灯船的自发光，从下方与上方同时照亮两人的背影轮廓、锦缎的织纹与楼阁的飞檐；暗部呈蓝黑色，占约三成。空气中弥漫着灯火的光尘与薄雾，前景人物的织锦细节清晰，灯海深处层层虚化成圆形光斑；蓝绿、暖金与正红三色撞色，整体呈厚涂油画质感的东方上元灯会，璀璨盛大。","zmf_name":"上元锦鲤灯船","zmf_batch":8,"run":true,"image":"../images/scenes/BV1eAg96TEYs/s08.webp","id":"ZS-342"},{"bv":"BV1h4NM6sEcR","scene":0,"series":"尘世长卷","title":"孤舟抱膝","pal":"水乡青绿","who":"人物","comp":"人物左三分之一，水面与水城占右二","motion":"水纹/船微晃/发丝/远处红幡","special":"短发造型、白绿交领衫、石桥金顶水城","note":"全库罕见：短发+直视镜头","prompt_moss":"一名短发女子坐小舟头抱膝直视观者，水城倒影笔触流动。主光为日光。","prompt_zmf":"横画幅中式水乡场景，平视中景。画面中央偏左一位短发女子坐在窄木舟的船头，双膝并拢，双手交叠在膝上，直视画外；她的右侧是碧绿的水面与对岸的街市。\n\n她留着齐颈的短发，发尾内扣，额前有细碎的刘海；面容清秀，眉眼干净，唇色偏淡；神情安静，视线平直，坐姿端正如一尊小像。\n\n她身着月白与浅青相间的交领长衫，衣料柔软，袖口挽到小臂，衣摆铺在船板上；腰间系一条深青的布带，赤足收在膝下；木舟为深褐的原木，船板上有水痕与磨损的纹理。\n\n对岸是层叠的水乡街市：白墙黑瓦的楼屋、临水的石阶、横跨的桥洞，檐下挂着成串的灯，岸边停着几艘小船；水面被天光与灯影染成青绿与暖金交错的色带，波纹细碎。主光为斜射的午后阳光，自画面右上方照亮她的肩线、发丝边缘与船沿，勾出一圈暖边；水面的反光自下方补亮下颌与手掌，暗部呈深青。\n\n空气中浮着水汽与细小的尘粒，前景的船头与水纹清晰，对岸的楼屋虚化；青绿、月白与暖金交织，整体呈厚涂油画质感的东方水乡小舟，安静而清冷。","zmf_name":"孤舟抱膝","zmf_batch":49,"run":true,"image":"../images/scenes/BV1h4NM6sEcR/s00.webp","id":"ZS-343"},{"bv":"BV1h4NM6sEcR","scene":1,"series":"尘世长卷","title":"俯身掬水","pal":"水乡青绿","who":"人物","comp":"人物居中俯身","motion":"水珠从指缝落下/涟漪/袖口湿/发丝","special":"掬水一捧、颜料水色","note":"俯身动作，水珠是主要灵动源","prompt_moss":"一名白衣女子船头俯身掬水，水线从指间流泻。主光为日光。","prompt_zmf":"横画幅中式水乡场景，平视中景。画面中央一位女子跪坐在浅水的石阶上，上身前倾俯向水面，右手正从水中托起一朵白莲，指尖沾着水珠；她占据画面中部约五成高度，水乡的楼阁在她身后层层铺开。\n\n她为鹅蛋脸，眉形细长，眼尾上挑，唇色正红，鬓边贴着一枚金色花钿；乌黑长发高挽成髻，两侧插金步摇与红玉珠钗，几缕碎发垂在颊边，随着俯身垂落。\n\n她上身着月白的交领半臂，领缘镶青碧色的织锦边，内衬一层薄纱，纱料被水汽浸得半透，贴着肩背；下身为朱红的高腰长裙，裙摆铺进水里，湿透的裙缘沉在水下，纱与水交叠出深红的色阶；她的右臂裸露，小臂上挂着水痕。\n\n水乡的楼阁沿河道两侧排开：朱红的木柱、黑瓦的檐口，檐下挂着成串的红灯笼与白底黑字的布幌，一座木拱桥横在画面右后方；水面上漂着落花与几盏未熄的河灯，水底的青石与游鱼在清浅处可见。主光为暖橙的灯影与天光的混合，自画面右上方照亮她的侧脸、湿纱的高光与白莲的花瓣，勾出肩背的轮廓；水面把灯光反射成成片的暖金色斑。\n\n空气中弥漫着水汽与灯光的光晕，前景的水珠与花瓣清晰，远处的楼阁层层虚化；青碧、朱红与暖金三色交织，整体呈厚涂油画质感的东方水乡拈莲，柔婉而清透。","zmf_name":"俯身拈莲","zmf_batch":43,"run":true,"image":"../images/scenes/BV1h4NM6sEcR/s01.webp","id":"ZS-344"},{"bv":"BV1h4NM6sEcR","scene":2,"series":"尘世长卷","title":"码头浣衣","pal":"水乡青绿","who":"人物","comp":"人物左，水城右","motion":"皂沫/搓衣节奏/水纹/远处船动","special":"青竹篮、石阶、红衣点缀","note":"生活场景","prompt_moss":"一名蓝白衣女子蹲码头石阶搓洗衣物。主光为日光。","prompt_zmf":"横画幅中式水乡生活场景，画面左侧一位挽着发髻的少女蹲在水码头的石阶上浣衣，她双手在青绿色的水中搓洗着衣料，衣料在水里散开；她身后的水乡集市灯火与游船连绵，青绿水色的河面波光潋滟。\n\n少女乌黑长发挽成低髻，发间别着一朵白色的绒花；她的侧脸恬静，神情专注。她身着乳白色的短衫与青绿色的长裙，袖口挽至肘间露出小臂；她蹲在码头的石阶上，双手在水中搓洗一件青色的衣料，衣料在水中散开如一朵青色的花，水面的波纹自她的双手荡开；她的身旁放着一只竹篮与一只木盆，盆里堆着待洗的衣物。\n\n码头的石阶为青灰的石砌，阶边的木桩上系着缆绳；河面的水色为青绿色，波光潋滟，水面上漂着几片红色的花瓣与菜叶；她身后的集市连绵：朱红的楼阁与青瓦的民居沿河排开，河上的游船挂着红灯笼穿梭，岸边的行人往来，集市的幌子与彩旗在风中飘展。主光为明亮的白昼阳光，从画面上方漫射，照亮水面的波光、她的白衣与集市的彩旗；河面的阴影呈青绿色。\n\n空气中弥漫着水乡的湿气与炊烟，前景浣衣的双手与水中的衣料清晰，背景集市与游船虚化；青绿水色、乳白衫裙与朱红灯影三色交织，整体呈厚涂油画质感的东方码头浣衣，恬淡而鲜活。","zmf_name":"水乡码头浣衣","zmf_batch":35,"run":true,"image":"../images/scenes/BV1h4NM6sEcR/s02.webp","id":"ZS-345"},{"bv":"BV1h4NM6sEcR","scene":3,"series":"尘世长卷","title":"官人过市","pal":"水乡青绿","who":"人物","comp":"背影大半身居左，街景纵深","motion":"袍摆/幡/行人/水光","special":"青绿官袍","note":"背影构图","prompt_moss":"一名青绿官袍男子背手走过水乡红幡街道。主光为日光。","prompt_zmf":"横画幅中式幻想夜景场景，跟拍背影构图：画面左侧一位身着蓝色织锦官服的官人背影立于高台边缘，宽大的披风被夜风吹得扬起，他俯瞰下方一条灯火通明的水乡灯市长街。\n\n官人乌黑长发束成官髻，插着银色的发簪；他的官服为宝蓝色织锦，肩头与衣摆布满银线团花纹样，外披一件月白色的长披风，披风的内衬为青绿色，被风掀起时如一面旗；他背手而立，身形挺拔，官帽的帽翅轮廓分明。\n\n他脚下是沿水而建的水乡灯市：一条青绿色的河道自画面右侧蜿蜒伸向深处，河面上停泊着数艘挂着红灯笼的画舫灯船，最大的一艘船头堆着红色的帷幔与灯球；两岸的白墙民居与朱红灯笼连绵成片，红白蓝三色的幡旗自檐角垂落，旗影在灯火中翻卷。街道上游人如织，小小的身影沿河而行。远景的河道尽头是一座灯火辉煌的城楼，城门洞开着暖光。主光为两岸灯火的暖橙自发光与河面的青绿反射，冷暖交织，照亮官人的披风边缘与河面的波光；暗部呈蓝青色，占约四成。\n\n空气中弥漫着河面水汽与灯火光尘，前景官人的背影与披风纹理清晰，河市层层没入焦外化作光斑；宝蓝、暖橙与青绿水色三色对撞，整体呈厚涂油画质感的东方官人观市，端庄而有烟火气。","zmf_name":"官人过市","zmf_batch":10,"run":true,"image":"../images/scenes/BV1h4NM6sEcR/s03.webp","id":"ZS-346"},{"bv":"BV1h4NM6sEcR","scene":4,"series":"尘世长卷","title":"船窗托腮","pal":"水乡青绿","who":"人物","comp":"人物左，夜市灯船右","motion":"指尖轻敲/灯影水面/发丝/远处船动","special":"船窗夜市","note":"夜景","prompt_moss":"一名女子倚船窗托腮望夜市灯船，指尖轻敲窗沿。主光为灯串。","prompt_zmf":"横画幅中式水乡夜景人像，画面左侧一位身着宝蓝织锦的女子坐在船舱的窗边，手肘撑着窗沿，指尖抵着唇边托腮，望向窗外的水上灯市，窗外的河面灯船如虹。\n\n女子乌黑长发挽成松散的发髻，发间簪着银白的发饰与珠花，鬓边垂着细碎的发丝；她的侧脸清丽，眼神放空而温柔，指尖抵唇的姿态慵懒。她身着宝蓝色织金的交领华服，衣身上织满金红相间的缠枝纹样，织锦的缎面在窗灯下泛着幽幽的光泽，肩头的披帛堆在肘边。\n\n船舱的窗框为朱红色的雕花木格，窗棂的几何纹样精致；窗外的河面为夜色的青蓝，一艘挂着红帷幔的大灯船自河心缓缓驶过，船身的红灯串成光带，倒映在水里拉出长长的红色光纹；两岸的白墙民居与挂满红灯笼的廊檐连绵，远处的石拱桥横跨河面，桥上也灯火成串，更远的城楼灯火如星。主光为窗内的一盏油灯暖光与窗外灯市的红橙光交织，照亮她的侧脸、织金的纹样与窗棂的雕花；河面的暗部呈蓝青色，冷暖对映。\n\n空气中弥漫着河灯的光晕与水汽，前景托腮的手指与望向窗外的眼神清晰，窗外的灯河层层虚化；宝蓝织金、朱红灯影与青蓝夜水三色交织，整体呈厚涂油画质感的东方船窗望灯河，慵懒而温润。","zmf_name":"船窗托腮望灯河","zmf_batch":19,"run":true,"image":"../images/scenes/BV1h4NM6sEcR/s04.webp","id":"ZS-347"},{"bv":"BV1h4NM6sEcR","scene":5,"series":"尘世长卷","title":"画舫夜泊","pal":"水乡青绿","who":"无人物","comp":"画舫居中横贯","motion":"灯笼串/水纹/雾","special":"朱红画舫","note":"纯景段","prompt_moss":"一艘朱红画舫夜泊水面，灯串沿檐亮起，倒影碎金。主光为灯串。","prompt_zmf":"横画幅中式水乡夜景大场景，无人物特写：画面左侧停泊一艘装饰华丽的红色雕花画舫，船头朝向画面右方，占据画面左下三分之一，右侧为铺满画面的青绿水巷与两岸灯火。\n\n画舫为深红色木质船身，雕花窗棂与卷棚顶覆着青瓦，檐角悬挂成串的红灯笼与彩球，船身漆面在夜色中泛着温润的反光，船舷倒映在墨绿色的水面。水巷自右下向左上延伸：两岸是青瓦白墙的中式建筑群，临水的雕花木窗内透出暖黄灯光，一座石拱桥横跨水巷深处，桥上与岸边散布着成排的红灯笼与金色饰件，远处灯火层层叠叠没入焦外的暖橙光雾。\n\n水面占据画面下半部分，青绿色的水波揉碎了两岸的灯火倒影，形成无数条蓝绿与暖金交错的长长光带，几片红色的花瓣与灯影漂浮水面。主光为两岸灯笼的暖橙自发光，从两侧照亮画舫的受光船身与水面；环境为青蓝色的夜色，暗部呈蓝黑，占约三成。\n\n空气中漂浮着细小的水汽微粒与光斑，前景水面波纹与画舫船头的雕花清晰，远景灯火没入焦外形成圆形光斑；青绿、暖金与正红三色交织，整体呈厚涂油画质感的东方水乡夜市，繁华而静谧。","zmf_name":"水乡画舫夜泊","zmf_batch":2,"run":true,"image":"../images/scenes/BV1h4NM6sEcR/s05.webp","id":"ZS-348"},{"bv":"BV1h4NM6sEcR","scene":6,"series":"尘世长卷","title":"独坐垂帘","pal":"水乡青绿","who":"人物","comp":"人物左，红绸环绕","motion":"红绸静垂微动/烛焰/尘埃","special":"红帐、烛焰","note":"情绪段：热闹是外面的","prompt_moss":"一名女子独坐红绸帐帘内低首，烛焰照亮侧脸。主光为烛光。","prompt_zmf":"横画幅中式古装情绪场景，画面右侧近景一位黑发男子倚着雕花栏杆垂下眼帘，神情落寞，占画面右侧约二分之一；画面左侧远景是热闹沸腾的庙会，强烈的景深把两个世界隔开。\n\n男子乌黑长发束起，几缕湿软的发丝贴在颊侧，耳垂戴着银色耳坠；低垂的眼睑下睫毛清晰，鼻梁高挺，薄唇微抿，神情疲惫而疏离。他身着宝蓝色织金长袍，肩头与衣缘布满繁复的金线团花纹样，衣料的锦缎光泽在暗中发亮，他单手支颐倚在朱红色的栏杆上。\n\n左侧远景的庙会人山人海：中央一位红衣舞者正挥舞两条长长的红绸，红绸在空中旋出巨大的圆弧；四周挤满举着酒旗、幌子与灯笼的小小行人身影，杏黄色与青蓝色的布幌层层叠叠，街市深处灯笼成串，暖光涌动。男子所在的近景处于阴影中，只有边缘被远处庙会的暖光照亮，冷调的青蓝色笼罩他的衣袍；远景庙会则被暖橙与正红填满。\n\n前景栏杆与他的衣袍边缘清晰锐利，远景人群与红绸大幅虚化成流动的暖色光斑；宝蓝织金与热闹的暖橙红对撞，一冷一暖、一静一闹，整体呈厚涂油画质感的东方情绪场景，孤独与繁华同框。","zmf_name":"垂帘看闹市","zmf_batch":3,"run":true,"image":"../images/scenes/BV1h4NM6sEcR/s06.webp","id":"ZS-349"},{"bv":"BV1h4NM6sEcR","scene":7,"series":"尘世长卷","title":"广场旋裙","pal":"水乡青绿","who":"人物","comp":"人物居中，人群环绕","motion":"裙旋/白纱抛展/红绸划空/人群掌声/幡旗","special":"鼓台、蓝裙云纹、红幡、湛蓝天","note":"大动作旋转场景：旋转周期=5秒一整圈","prompt_moss":"一名蓝裙舞者在广场中央旋转，裙摆展开成圆，白纱抛天，人群环绕。主光为日光。","prompt_zmf":"横画幅中式民俗舞蹈大场景，画面中央一位身着宝蓝织锦大摆裙的舞者在广场的中央旋舞：她的大裙摆随旋转完全铺开成圆浪，红金相间的长绸自她的双臂环绕飞出，环绕她旋成一圈彩色的绸环；她周围的观众围成一圈，喝彩的、拍手的、击鼓的，广场四周的彩楼挂满幡旗。\n\n舞者乌黑长发挽成高髻，发间的银饰与红绳随旋转甩动；她旋舞的侧脸神采飞扬，笑意盎然。她的舞裙为宝蓝色织金的大摆长裙：裙面上织着金红色的凤凰纹样，裙摆的圆浪铺开占据画面的中央，裙缘的红金流苏飞扬；她的双臂展开，两条正红与乳白的长绸自袖口环绕飞出，绸带在空中旋成双层的彩环，绸带的运动带着旋转的模糊动感。\n\n观众的围圈：内圈的观众席地而坐，外圈的站立喝彩，他们的衣色缤纷——青衫、红裙、黄袍，前排的孩童钻到人前张望；广场的地面为青石的圆形舞坪，坪心的彩绘图案清晰。背景的集市彩楼层层：朱红的楼阁挂满幡旗与灯笼，金色的饰件在日光下闪烁，广场的彩棚与凉伞散布四周。主光为明亮的白昼阳光，从画面上方漫射，照亮舞裙的圆浪、绸带的透光与观众的缤纷衣色；广场的阴影呈暖褐色。\n\n空气中弥漫着扬起的彩带与尘土，前景旋舞的裙浪与绸环的动感清晰，观众与彩楼层层虚化；宝蓝裙浪、正红绸环与缤纷衣海对撞，整体呈厚涂油画质感的东方广场旋裙，欢腾而华美。","zmf_name":"广场旋裙大动作","zmf_batch":39,"run":true,"image":"../images/scenes/BV1h4NM6sEcR/s07.webp","id":"ZS-350"},{"bv":"BV1iSN46HEy5","scene":0,"series":"尘世长卷","title":"拈笔照镜","pal":"红金撞色","who":"人物","comp":"人物居中占约六成，右侧镜中有她的倒影","motion":"朱笔微移/阳光光束中金尘/步摇/花影轻颤","special":"金牡丹画框、青绿地毯、镜中倒影、金步摇、阳光斜切光束","note":"全分辨率修正：手中是朱笔/口红笔，正对镜画唇妆；右侧镜中倒影是第二焦点","prompt_moss":"一名金衣女子坐牡丹金框妆台前执朱笔停在唇边画妆，左手托胭脂盒，右侧镜中有倒影，阳光斜切金尘。主光为暖金。","prompt_zmf":"横画幅中式闺阁近景，平视。画面中央偏左一位女子左手扶镜、右手拈着一支朱红的小笔，正对着镜面在唇上描画；镜面在画面右侧，镜中映出她的正脸，构成第二焦点。\n\n她为鹅蛋脸，眉形细长，眼尾上挑，眼窝里晕着一点红；唇色是浓正的红，唇峰清晰；乌黑长发挽成高髻，两侧插着金花与红珠，鬓边垂落的碎发贴着颊线。\n\n她身着金地与朱红相间的织锦长衫，衣面布满缠枝花纹与金线，领口立起，袖口宽大；右手的衣袖滑到肘部，露出小臂；镜框为鎏金的雕花木框，顶端雕着缠枝与花头，镜面泛着旧银的光。\n\n画面的四周堆着成簇的红花与金叶，花瓣层层叠叠，几乎溢出画框；背景的墙面为暗红的织物，挂着金线垂饰。主光为左侧的暖金灯光，自侧前方照亮她的面颊、笔尖与锦缎的金线；镜面把光反射成一片暖白的高光，暗部呈深红褐。\n\n空气中浮着细小的金粉与花瓣的碎屑，前景的笔尖与唇线清晰，背景的花簇与镜框虚化；朱红、金与暗红交织，整体呈厚涂油画质感的东方对镜画唇，浓艳而细腻。","zmf_name":"拈笔照镜","zmf_batch":49,"run":true,"image":"../images/scenes/BV1iSN46HEy5/s00.webp","id":"ZS-351"},{"bv":"BV1iSN46HEy5","scene":1,"series":"尘世长卷","title":"伞下半面","pal":"红金撞色","who":"人物","comp":"人物右半占约五成，伞占左半","motion":"伞面微旋/发丝横飞/颜料布幔轻颤/竹竿光影","special":"泼彩油纸伞、颜料作坊、竹竿、蓝绿高髻","note":"伞面是红蓝泼彩；背景挂满同款伞与泼彩布","prompt_moss":"一名蓝绿高髻女子执红蓝泼彩油纸伞遮半面，斜视左下，颜料伞作坊背景。主光为日光。","prompt_zmf":"横画幅中式市井人像场景，画面中央一位乌黑发髻的少女执着一柄红蓝泼彩的油纸伞，伞面遮住她的半张脸，露出的半面眼波流转；她的四周挂满同款泼彩的伞与布匹，泼彩的红蓝撞色铺满画面。\n\n少女乌黑长发挽成古典的发髻，鬓边的碎发被风吹起；露出的半面脸清丽，眼尾微挑，朱唇轻抿，眼神透过伞沿望向画外。她身着乳白色与靛蓝织锦相间的交领襦裙，衣料的缎面反光柔润；她执伞的手指白皙，伞柄为深色的木质；油纸伞的伞面为红蓝撞色的泼彩图案，泼彩的色块如火焰与海浪交织，伞骨的竹木原色自伞心放射。\n\n她的四周挂满同款的泼彩伞与布匹：红蓝泼彩的油纸伞自摊位的横杆上一柄柄垂挂，染坊晾晒的泼彩布匹在风里翻卷，布面与伞面的红蓝色块交相辉映；摊位的竹架上还摆着未上色的素伞。背景的染坊空间为虚化的红蓝色块，暖光自布匹的间隙漏下。主光为明亮的暖金阳光，自画面左上方穿透伞面的薄处，照亮泼彩的色彩饱和度、她的半面脸与衣料的缎光；布匹的阴影呈红褐色。\n\n空气中弥漫着染料的气息与布屑，前景伞面的泼彩与半面容颜清晰，背景的伞阵与布匹虚化成红蓝的色海；红蓝泼彩与乳白衣色对撞，整体呈厚涂油画质感的东方染坊少女，色彩浓烈如画。","zmf_name":"泼彩伞下半面","zmf_batch":22,"run":true,"image":"../images/scenes/BV1iSN46HEy5/s01.webp","id":"ZS-352"},{"bv":"BV1iSN46HEy5","scene":2,"series":"尘世长卷","title":"琵琶遮面","pal":"水乡青绿","who":"人物","comp":"人物居中占约六成，水面背景","motion":"琴弦振颤/水光/穗子/发丝","special":"螺钿琵琶、穗子、水乡倒影","note":"水面背景蓝青色，琵琶斜抱","prompt_moss":"一名女子怀抱螺钿琵琶垂眸拨弦，水面倒影蓝青色。主光为柔和光。","prompt_zmf":"横画幅中式古风人像特写，画面中央一位怀抱琵琶斜倚的年轻女子，头部与琵琶占据画面主要位置，她低头浅笑，视线落在琴弦上。\n\n女子为清秀的鹅蛋脸，肤色白皙细腻，双眼轻闭，长睫毛垂下柔和的阴影，红润的双唇微微上扬，耳垂坠着一枚带红色长穗的玉坠，穗子垂落在肩头。乌黑长发挽成古典发髻，发间点缀珠翠，颈侧垂落几缕碎发。她身着米白色织金广袖襦裙，领缘滚朱红边，裙面上金线织出细密的缠枝花纹，肩头披着蓝绿色的透纱披帛，纱料边缘泛着细闪。\n\n她怀中的琵琶琴身呈温润的木色，琴头装饰着精致的骨白色琴轸，她的手指正拨在琴弦上。背景为整片虚化的蓝青色水面，水面上漂浮着成群的金色锦鲤与斑驳的金叶光斑，红 :"人物","comp":"人物左侧占约五成，水面占右半","motion":"灯焰/水面涟漪/发丝/油纸伞穗/月晕","special":"暖橙灯笼、月轮右上、水面涟漪倒影、油纸伞挂墙","note":"暖橙与蓝青对撞的经典夜景；提灯照亮她半身","prompt_moss":"一名女子提灯立夜巷水畔侧望，油纸伞挂墙，月轮右上，水面涟漪。主光为灯与月。","prompt_zmf":"横画幅中式夜景人像场景，暖橙与蓝青对撞的经典色调：画面中央一位身着白纱披肩的古装女子提着一盏六角的暖黄灯笼，侧身走进夜巷，灯光照亮她的半身，身后是水巷的灯影与一弯月亮。\n\n女子乌黑长发松松挽起，发髻上插着金色的发饰，几缕长发随风扬起横过肩头；她的侧脸清丽，眼睑低垂望着巷道深处，唇色朱红。她身着乳白色的织锦襦裙，裙面上暗纹隐约，肩头披着一条宽大的白色透纱披肩，纱料自双肩垂落至膝弯，边缘的金线在灯下闪烁；她右手提着灯笼的提梁，灯笼的暖黄光自内透出，照亮她的半身与身前的巷道。\n\n夜巷的一侧是水巷：青蓝色的水面倒映着两岸的灯火，灯影在水波中拉成一条条金色的光带；对岸的屋檐下挂满成串的橙色灯笼，灯笼的光晕层层叠叠延伸向巷子深处。夜空的右上方悬着一弯新月，月色清冷。主光为灯笼的暖黄自发光与巷外灯海的暖橙光交织，自右前方照亮她的半身；水面与天空的暗部呈蓝青色，冷暖对撞强烈。\n\n空气中弥漫着水汽与灯火的光晕，前景提灯的手与纱披肩的纹理清晰，灯海深处层层虚化；暖橙灯火与蓝青夜色对撞，整体呈厚涂油画质感的东方夜巷提灯，静谧而温暖。","zmf_name":"夜巷提灯","zmf_batch":19,"run":true,"image":"../images/scenes/BV1iSN46HEy5/s05.webp","id":"ZS-356"}];
let F_SERIES = '', F_PAL = '', F_RUN = '', Q = '';
const statsEl = document.getElementById('stats');
const done = SCENES.filter(s => s.run).length;
statsEl.innerHTML = `共 <b>${SCENES.length}</b> 段 · 已跑双采 <b>${done}</b> 段 · 六层手写词 <b>${SCENES.filter(s=>s.prompt_zmf).length}</b> 条`;
const chipsBox = document.getElementById('chips');
function chip(label, get) {
  const c = document.createElement('span');
  c.className = 'chip';
  c.textContent = label;
  c.onclick = () => {
    const on = c.classList.contains('on');
    c.classList.toggle('on');
    get(on);
    render();
  };
  chipsBox.appendChild(c);
  return c;
}
const seriesList = [...new Set(SCENES.map(s => s.series))];
const palList = [...new Set(SCENES.map(s => s.pal).filter(Boolean))];
chip('只看已跑', on => { F_RUN = on ? '1' : ''; });
seriesList.forEach(s => chip(s, on => { F_SERIES = on ? s : ''; }));
palList.forEach(s => chip(s, on => { F_PAL = on ? s : ''; }));
document.getElementById('q').oninput = e => { Q = e.target.value.trim().toLowerCase(); render(); };

function match(s) {
  if (F_SERIES && s.series !== F_SERIES) return false;
  if (F_PAL && s.pal !== F_PAL) return false;
  if (F_RUN && !s.run) return false;
  if (!Q) return true;
  return (s.title + s.note + s.prompt_moss + s.prompt_zmf + s.pal + s.who).toLowerCase().includes(Q);
}
function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let shown = 0;
  for (const series of seriesList) {
    const list = SCENES.filter(s => s.series === series && match(s));
    if (!list.length) continue;
    shown += list.length;
    const sh = document.createElement('div');
    sh.className = 'sh';
    sh.innerHTML = `<span class="badge">${series}</span><span class="t">${series}</span><span class="c">${list.length} 段</span><div class="ln"></div>`;
    main.appendChild(sh);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const s of list) grid.appendChild(card(s));
    main.appendChild(grid);
  }
  if (!shown) main.innerHTML = '<div class="empty">没有匹配的场景</div>';
}
function card(s) {
  const c = document.createElement('div');
  c.className = 'card';
  c.onclick = () => openDlg(s);
  const pills = [];
  if (s.run) pills.push('<span class="pill run">已跑双采</span>');
  if (s.prompt_zmf) pills.push('<span class="pill zmf">六层手写词</span>');
  pills.push(`<span class="pill">${s.pal || '未标注色系'}</span>`);
  pills.push(`<span class="pill">${s.who || ''}</span>`);
  c.innerHTML = `<img loading="lazy" src="${s.image}">
    <div class="ci"><div class="t"><span class="id">${s.id}</span>${esc(s.title || '未命名')}</div>
    <div class="pills">${pills.join('')}</div>
    <div class="note">${esc(s.note)}</div></div>`;
  return c;
}
let CUR = null;
function openDlg(s) {
  CUR = s;
  document.getElementById('dimg').src = s.image;
  const blocks = [];
  if (s.prompt_moss) blocks.push(`<div class="pblock"><div class="pl"><span>标注静图提示词（prompt_moss）</span><button onclick="cp('pm')">复制</button></div><div class="pt" id="pm">${esc(s.prompt_moss)}</div></div>`);
  if (s.prompt_zmf) blocks.push(`<div class="pblock"><div class="pl"><span>六层法则手写提示词（批次${s.zmf_batch} · ${esc(s.zmf_name)}）</span><button onclick="cp('pz')">复制</button></div><div class="pt" id="pz">${esc(s.prompt_zmf)}</div></div>`);
  document.getElementById('dmeta').innerHTML =
    `<div class="pname">${s.id} · ${esc(s.title || '未命名')}</div>` +
    `<span class="pill">${s.series}</span> <span class="pill">${s.pal}</span> <span class="pill">${s.who}</span>` +
    (s.comp ? ` <span class="pill">构图：${esc(s.comp)}</span>` : '') +
    (s.special ? ` <span class="pill">元素：${esc(s.special)}</span>` : '') +
    (s.run ? ' <span class="pill run">已跑双采</span>' : ' <span class="pill">未跑</span>') +
    `<div style="margin-top:8px">${esc(s.note)}</div>` + blocks.join('');
  document.getElementById('dlg').showModal();
}
function cp(which) {
  const el = document.getElementById(which);
  const text = el.textContent;
  const btn = event.target;
  const done = () => { btn.textContent = '✓ 已复制'; setTimeout(() => { btn.textContent = '复制'; }, 1200); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fb(text, done));
  } else { fb(text, done); }
}
function fb(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}
document.getElementById('dclose').onclick = () => document.getElementById('dlg').close();
document.getElementById('dlg').onclick = e => { if (e.target.id === 'dlg') document.getElementById('dlg').close(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('dlg').close(); });
render();
