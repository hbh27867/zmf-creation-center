锦缎的织纹与星火的碎屑；云海的暗部呈紫灰色。\n\n空气中弥漫着星火的碎屑与云絮，前景接星的手掌与流星的光尾清晰，云海与天际虚化；熔金流星、多彩锦缎与深蓝天幕对撞，整体呈厚涂油画质感的东方流星援手，浪漫而奇幻。","zmf_name":"执笔崖上流星援手","zmf_batch":38,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s03.webp","id":"ZS-190"},{"bv":"BV1RJuc6DEgF","scene":4,"series":"九霄神游","title":"金环吞月","pal":"仙金蓝","who":"无人物","comp":"居中奇观，舟小衬底","motion":"金环内旋/云绕/舟行","special":"巨型金环漩涡","note":"天空张开金色巨环，小舟正驶入","prompt_moss":"一扇金色巨型圆环悬浮在云海之上，环内是深蓝色的旋转云涡，环的外缘有鎏金纹样。一艘小舟在圆环下方的水面航行，舟上有人影。远处有仙阁轮廓。主光为圆环内侧的金光与外圈的深蓝对比。","prompt_zmf":"横画幅中式幻想大场景，画面的天穹之上张开一座巨大的金色圆环，圆环的环身雕满繁复的金纹与宝石，环心是一片深蓝的星空黑洞；云海之上，一位白衣红裙的女子手持一根长杖立于石阶的顶端，仰望巨环。\n\n巨环的直径横贯画面上半部：环身为鎏金的金属质感，环面上雕着卷草纹、兽首与成串的宝石镶嵌，金纹的浮雕在阳光下层次分明；环心不是天空而是一片深邃的星空，星星在环心的黑洞中闪烁，环的内缘挂着一圈细碎的金色流苏光屑，环身的最下缘坠着红色的绸结。\n\n女子乌黑长发垂落腰际，发间垂着白色的绦带；她身着月白色的广袖长裙，腰间束着正红色的织锦腰封，红裙的长摆自石阶垂落铺展，她双手拄着一根与她等高的长杖，杖头托着一盏发光的灯，她仰头望向环心的星空，侧脸的轮廓被环身反射的金光照亮。她脚下的石阶为白玉铺成，阶面的雕纹精美，阶下的云海铺满画面下半部，云涛受光面泛金。主光为巨环反射的金光与环心星光的冷辉交织，照亮她的白衣、红裙与石阶的雕纹；云海的阴影呈淡青色。\n\n空气中弥漫着金色的光尘与云絮，前景人物持杖仰望的姿态与石阶雕纹清晰，巨环保持完整的环形、环纹细节虚化；鎏金环身、深蓝星空与月白红裙对撞，整体呈厚涂油画质感的东方金环吞月，神圣而壮阔。","zmf_name":"金环吞月","zmf_batch":20,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s04.webp","id":"ZS-191"},{"bv":"BV1RJuc6DEgF","scene":5,"series":"九霄神游","title":"云卷漩涡","pal":"仙金蓝","who":"人物","comp":"漩涡占右 2/3，人物左下","motion":"云漩旋转/瀑帘/云雾翻","special":"云海大漩涡","note":"云海卷成巨大漩涡，红衣立于其前","prompt_moss":"一名穿红袍的女子站在云海大漩涡之前仰望，漩涡呈螺旋状向中心收缩，中心为深蓝色。她红裙与白纱在风中向后飘展。远处有仙阁的飞檐从云中探出。主光为漩涡边缘的金色光；暗部为漩涡中心的深蓝。","prompt_zmf":"横画幅中式仙域奇观大场景，高空俯视。画面右侧三分之二被一个巨大的云海漩涡占据，漩涡的螺旋自外缘层层向内收束，中心深陷如井；画面左下角一位披红斗篷的身影立于白石栏杆之后，背身仰望远处的漩涡。\n\n漩涡的云体由乳白、青蓝与金棕的云带交替盘绕，云带的边缘翻卷成絮状，受光处透亮如绢；漩涡的中心呈深青蓝，隐约可见底部的暗影；螺旋的纹理清晰，一圈圈向心收拢。\n\n漩涡的外缘浮着一圈城郭：金顶的殿宇、朱红的廊柱与层叠的楼阁沿云缘排布，建筑的下方悬着云絮；一条细长的水柱自画面上方的云层垂落，直插入漩涡的中心，水柱的周围散着白亮的水雾。\n\n左下角的红斗篷身影只占画面的一小角，斗篷的布料被高处的风扯开，边缘翻卷；她的身前是一道汉白玉的栏杆，栏柱与栏板沿画面下缘延伸，背后的台面铺着白石。主光为自画面左上斜射的暖金阳光，照亮云带的受光面、城郭的金顶与斗篷的褶边；漩涡中心的暗部呈深青蓝，占画面约三成。\n\n空气中弥漫着云絮与飞散的水沫，前景的栏杆与斗篷清晰，漩涡与远处的城郭层层虚化；乳白、暖金与深青蓝三色对撞，整体呈厚涂油画质感的东方云卷漩涡，磅礴而震慑。","zmf_name":"云卷漩涡","zmf_batch":45,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s05.webp","id":"ZS-192"},{"bv":"BV1RJuc6DEgF","scene":6,"series":"九霄神游","title":"悬塔环云","pal":"仙金蓝","who":"无人物","comp":"塔居中，环云绕顶","motion":"环形云盘旋/塔身灯/鹤飞","special":"悬浮塔、碟状环云","note":"仙塔顶托着一圈旋转的云环","prompt_moss":"一座白玉佛塔悬浮在云海之上，塔顶环绕一圈旋转的碟状云环，云环呈碟状向外扩展。塔身有鎏金尖顶与白玉栏杆。远处有仙阁轮廓。主光为塔顶的自发光与云环的漫射。","prompt_zmf":"横画幅中式幻想奇观场景，画面中央一座多层金顶的仙塔高耸，塔顶托着一圈巨大的旋转云环：环状的云如同一个悬浮的烟圈环绕塔尖缓慢转动，塔下的红色水面上，一位白衣人正沿朱红的堤道独行。\n\n仙塔自画面下方的水面中央升起，塔基为朱红与金色相间的多层石台，塔身一层层的楼阁收分向上，每层的飞檐挂着铜铃，塔顶的金色宝刹为最亮点；塔顶之上，巨大的环状云悬浮着，云环的外缘翻卷着金红色的云絮，内缘泛着乳白，云环以塔尖为轴缓缓旋转，环心的天空澄澈湛蓝。\n\n塔基四周的水面如红色玛瑙般深邃，水面的堤道为朱红色的长堤，堤上一位白衣人背身独行，衣摆被水面的风掀起；水面倒映着塔身与云环的倒影，倒影被细浪揉碎。背景的天空为湛蓝与暖金交界，大朵的积云堆在塔的四周，云隙间透出金色的天光。主光为明亮的暖金阳光，从画面右上方照亮云环的金红卷边、塔身的鎏金与水面的反光；塔的背光面与水面暗部呈深红褐色。\n\n空气中弥漫着云絮与金色光尘，前景堤道与白衣人清晰，云环保持完整的环形轮廓、外缘虚化；熔金、朱红与湛蓝对撞，整体呈厚涂油画质感的东方悬塔环云奇观，庄严而超现实。","zmf_name":"悬塔环云","zmf_batch":14,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s06.webp","id":"ZS-193"},{"bv":"BV1RJuc6DEgF","scene":7,"series":"九霄神游","title":"丹鼎金焰","pal":"仙金蓝","who":"无人物","comp":"鼎居中偏左","motion":"金焰喷薄/云絮翻/檐铃","special":"喷金丹鼎","note":"丹鼎喷出金色太阳般的火焰","prompt_moss":"一座鎏金丹鼎悬浮在云海之上，鼎口喷出巨大的金色火柱冲天，火光在云中形成大片光晕。鼎身有三足与鎏金纹样。主光为丹炉喷出的金色火焰。","prompt_zmf":"横画幅中式神话炼丹奇观，画面中央一座巨大的青铜丹鼎喷出一朵金色太阳般的火焰：火焰如盛放的金色牡丹层层绽开，焰心的光炽白刺目，焰瓣的金红如熔岩的绸缎向四周铺卷；鼎前的白石阶上，一位白衣人背身静立仰望。\n\n丹鼎的鼎身为青铜色，鼎腹的饕餮纹与云雷纹古朴厚重，鼎耳如双龙攀附，三足稳稳踏在圆形的石台上；鼎口喷出的金焰如一朵绽放的金菊：焰心的光球炽白，中层的焰瓣为熔金色，层层叠叠向四周铺展，外层的焰缘化作流动的金红绸带环绕飞舞，火星如金雨自焰瓣的边缘洒落。\n\n鼎前的白石阶上，白衣人背身而立，他的乌黑长发与宽大的袍摆被热浪掀起，双手拢在袖中，仰望的姿态渺小而虔诚。鼎的四周，蓝白色的云涛如激流环绕奔涌，云涛的表面泛着金红的光，云浪的旋涡把丹鼎围在中央；画面的右侧，一座朱红重檐的殿宇自云中探出，殿前的白玉栏杆沿云缘排开。主光为金焰的自发光，自画面中央辐射，照亮鼎身的铜纹、云涛的受光卷曲与白衣人的轮廓；云涛的背光面呈青蓝墨色，暗部占约四成。\n\n空气中弥漫着金色的火星与灼热的云雾，前景鼎身的浮雕与焰瓣的层次清晰，金焰绽放的整体动势完整；熔金焰菊、青铜丹鼎与青白云涛对撞，整体呈厚涂油画质感的东方丹鼎金焰，炽烈而神圣。","zmf_name":"丹鼎金焰如日绽","zmf_batch":37,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s07.webp","id":"ZS-194"},{"bv":"BV1RJuc6DEgF","scene":8,"series":"九霄神游","title":"雨帘垂瀑","pal":"仙金蓝","who":"人物","comp":"对角廊桥，瀑帘垂落","motion":"雨丝/瀑帘/云开合","special":"斜雨瀑帘、长桥","note":"雨丝如帘垂满仙宫长桥，一线红衣走过","prompt_moss":"仙宫的长廊被斜落的雨丝笼罩，一缕红衣的身影独行其上。长廊有白玉栏杆与飞檐，檐角挂灯笼。远处云海与宫殿群在雨中若隐若现。主光为穿透雨帘的暖金光。","prompt_zmf":"横画幅中式仙宫大场景，平视远景。画面中段垂落着数道巨大的水帘，水线自画面上缘直落，落点在白石的广场上炸成水雾；水帘的左侧是一座朱红的楼阁，右侧是一列高耸的廊柱与檐顶，广场上散着成群的细小身影。\n\n水帘自高处的云层垂落，水体呈乳白与暖金，水线的边缘被光穿透成亮白的丝缕；落点的水花高高扬起，水雾向四周漫开，把广场的地面浸成一层薄水，水面映出楼阁与廊柱的倒影。\n\n左侧的楼阁为多层重檐，覆朱红的瓦，檐角起翘，檐下雕花密集，柱身漆成正红；右侧的廊柱一列排开，柱头的斗拱层层叠出，廊内的梁枋被光染亮；广场的地面为浅粉与乳白的石板，边缘立着石栏与灯座。\n\n广场上的人群极小、分布疏密有致，衣色为青、白、红，有的正举袖走向水帘，有的停在石栏边；远处的云海翻涌，云层的受光面为乳白，暗部为灰蓝；画面的右下角透出一角远天。主光为自水帘后方逆射的暖金阳光，把水线、水雾与柱列的边缘勾亮，人物的轮廓被压成剪影；楼阁的深处与廊内的暗部呈赭红与墨蓝，明暗对比强烈。\n\n空气中弥漫着水雾与飞散的光尘，前景的石板与水纹清晰，远处的云海与天光虚化；暖金、朱红与灰蓝三色对撞，整体呈厚涂油画质感的东方仙宫雨帘，宏阔而空灵。","zmf_name":"雨帘垂瀑","zmf_batch":46,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s08.webp","id":"ZS-195"},{"bv":"BV1RJuc6DEgF","scene":9,"series":"九霄神游","title":"卧观云马","pal":"仙金蓝","who":"人物","comp":"卧姿横贯，云马右","motion":"云马奔形/纱幔/发丝","special":"云化奔马","note":"侧卧看云海奔马掠过榻前","prompt_moss":"一名白衣女子侧卧在仙宫的锦榻上，榻旁云海中奔马形状的云朵掠过。她黑发铺在榻面，一手撑头远望。榻前云中有一群白马形态的云朵奔驰。主光为右侧暖光。","prompt_zmf":"横画幅中式仙侠场景，画面中央一位白衣的仙娥侧卧在云台的软榻上，侧脸望着云海：一群金色的云马自她榻前的云海中奔掠而过，马群的鬃毛与云絮混成一体，她的长发随风与云马同向飘展。\n\n仙娥乌黑长发披落，长发被高空的罡风吹得向后飘展，与云马的奔向一致；她侧卧的姿态慵懒，一手支颐，一手搭在榻沿，广袖的纱料垂落榻下；她身着月白与青蓝相间的多层纱裙，纱料的边缘泛着金色的光，裙摆的纱层被风掀成波浪的形状；她侧脸的轮廓在云海的反光中柔和，眼神望着奔过的云马，神情悠然。\n\n云马的群体自画面右侧向左侧奔掠：每一匹马都由金色的云絮凝成，马身的云鬃飞扬，马蹄踏处溅起金色的云屑，马群的姿态奔放，领头的云马昂首嘶鸣的姿态清晰；云马掠过的轨迹在云海上留下一道金色的风的痕迹。她卧着的软榻为白玉的榻面，榻上铺着锦垫，榻沿垂着的纱幔与云海相连。背景的天空为澄澈的蓝，几朵积云舒卷，云海的受光面泛金。主光为明亮的暖金阳光，从画面右上方照亮云马的金色、她的白衣与云海的浪脊；云海的阴影呈淡紫灰。\n\n空气中弥漫着云絮与马蹄扬起的金屑，前景侧卧的仙娥与奔掠的云马清晰，云海的远端虚化；月白纱裙、金色云马与青蓝天空对撞，整体呈厚涂油画质感的东方卧观云马，悠然而奇幻。","zmf_name":"卧观云马掠榻","zmf_batch":28,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s09.webp","id":"ZS-196"},{"bv":"BV1RJuc6DEgF","scene":10,"series":"九霄神游","title":"案前研墨","pal":"仙金蓝","who":"人物","comp":"居中特写，红绸斜挂","motion":"墨锭画圈/烟/绸飘","special":"鎏金砚案","note":"仙娥案前研墨，红绸从肩头滑落","prompt_moss":"一名金衣仙娥跪坐案前研墨，案上有鎏金砚台与宣纸，她右手执墨锭画圈。身后斜挂一条红色长绸。她金发簪垂坠，穿黄色抹胸配红色腰带与米色纱裙。主光为右侧暖光。","prompt_zmf":"横画幅中式古典场景，画面中央一位古装仙娥坐在书案的青铜砚台前研墨，一缕金红色的烟雾自砚池升起，化作云中的宫殿楼阁；她的红绸自肩头滑落垂地，案上笔墨纸砚齐备。\n\n仙娥乌黑长发挽成古典的发髻，发间垂着金色的步摇；她低垂眼帘，神情专注地研墨，手执墨锭在砚台里画着圈，动作轻柔。她身着浅金色与正红织锦的襦裙，抹胸的织锦上金线绣花，外衫的纱料透如蝉翼，一条正红色的长绸自她的肩头滑落，绸带的一端垂在案沿，另一端铺在地面；她的衣袂被升起的暖风轻轻托起。\n\n书案为深色的木案，案上的青铜砚台古朴，砚池中的墨汁泛着金红的光，自砚池升起的烟雾如金色的云，云烟在半空凝成一座悬浮的宫殿：金顶的楼阁与悬空的岛屿在云烟中若隐若现，宫殿的灯火点点；案上的笔架、镇纸与宣纸齐备。背景为虚化的红蓝织锦帷幔与金色的屏风。主光为暖金的室内光，自画面右上方照亮仙娥的侧脸、红绸的缎光与云烟宫殿的金顶；案下的暗部呈红褐色。\n\n空气中弥漫着墨香的光尘与金色的云烟，前景研墨的手部与升起的云烟宫殿清晰，背景帷幔虚化；金红云烟、红绸衣袂与青铜砚台对撞，整体呈厚涂油画质感的东方案前研墨，静谧而奇幻。","zmf_name":"案前研墨红绸落","zmf_batch":25,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s10.webp","id":"ZS-197"},{"bv":"BV1RJuc6DEgF","scene":11,"series":"九霄神游","title":"虹桥独行","pal":"仙金蓝","who":"人物","comp":"大景小人，桥横贯下缘","motion":"云海翻/宫灯/桥上风","special":"跨云长桥、宫城","note":"一线红衣独步跨云长桥","prompt_moss":"一名穿深红长袍的人独自行走在一座横跨云海的白玉长桥上，桥面有栏杆，两侧云海翻涌，远处宫城灯火在云中隐现。主光为桥面的暖光与远处宫城的灯火。","prompt_zmf":"横画幅中式幻想大场景，一线红衣独步跨越云海的长桥：细长的桥身自画面左侧的朱红楼阁延伸向右侧的宫城，桥下是翻涌的云海与倾泻的天光，一位红衣的旅人正在桥的中央独行。\n\n朱红楼阁自画面两侧的云中拔起：左侧的楼阁层叠如书架，楼身上挂满朱红的灯饰与金字匾额，右侧的宫城为金顶的重檐殿宇，殿宇的白玉台基自云中探出；连接两地的长桥细如一线，桥面为朱红色，桥身没有栏杆，桥下是深不见底的云海，云海的裂隙间一道天光垂直洒下，照亮桥下翻涌的云涛。\n\n红衣的旅人身形极小：红色的长袍与斗篷在桥面显得如一笔朱砂，他的背影独自向着右侧行走，步伐沉稳。背景的天穹为湛蓝，大朵的积云堆在楼阁的上方，云隙间的天光如光瀑倾泻。主光为明亮的暖金阳光，从画面上方照亮楼阁的金饰、云海的受光面与红衣的点睛之色；云海的阴影呈淡青色。\n\n空气中弥漫着云絮与光尘，前景桥面的红色与旅人的背影清晰，两侧楼阁保持层叠的宏伟气势；朱红楼阁、熔金云海与一点红衣对撞，整体呈厚涂油画质感的东方虹桥独行，孤勇而壮阔。","zmf_name":"虹桥独行","zmf_batch":31,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s11.webp","id":"ZS-198"},{"bv":"BV1RJuc6DEgF","scene":12,"series":"九霄神游","title":"摘星入袖","pal":"仙金蓝","who":"人物","comp":"人物右，星火居中","motion":"星火爆散/袖接/云涌","special":"可摘的星光","note":"从檐角摘下一捧星火拢进袖中","prompt_moss":"一名白衣仙娥站在仙宫殿檐角，探身摘下一团悬浮的金色星火拢进袖中。星火在她指尖散发光芒。她的白袍与红带在风中飘展。远处有云海与宫城。主光为星火的光与右侧暖光。","prompt_zmf":"横画幅中式仙侠场景，画面中央一位白衣的仙娥在云台廊桥的檐角俯身，右手探向檐外的树梢，把一捧发光的星火拢进左手的袖中，星火的光映亮她的侧脸，背景为金顶的宫殿群与云海。\n\n仙娥乌黑长发挽成单髻，发间垂着细长的银步摇；她身着月白色的广袖纱裙，两条极长的袖帛自肩头垂落——一条为正红色织金，一条为宝蓝色织银，袖帛自檐角垂入云海，被风扬起铺展如两条彩带；她俯身的姿势轻盈，右手拢着一捧金色的星火，星火的火花自指缝溢出，飘向袖口，左手拢起袖子承接，星火在袖中隐隐发光。\n\n檐角为深色的木质雕花，檐下悬挂的铜铃轻晃；她脚下的云台边，云海铺满画面下半部，几条细小的瀑布自云台的石缘跌入云中，溅起白色的云雾。背景为层叠的宫殿群：金色的塔顶与朱红的殿身沿云缘排开，最高的塔尖直入天际，阳光把塔尖照得耀眼。主光为暖金的白昼阳光与星火的金色自发光，照亮她的侧脸、袖帛的织金纹样与云台的边缘；云海阴影呈淡青色。\n\n空气中弥漫着星火的碎光与云絮，前景拢星的双手与袖口清晰，背景宫群与云海层层虚化；月白、熔金与红蓝袖帛对撞，整体呈厚涂油画质感的东方摘星场景，轻盈而璀璨。","zmf_name":"摘星入袖","zmf_batch":12,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s12.webp","id":"ZS-199"},{"bv":"BV1RJuc6DEgF","scene":13,"series":"九霄神游","title":"对弈云台","pal":"仙金蓝","who":"人物群","comp":"对称双人中景","motion":"云台漂移/水波纹案/衣袂","special":"云上棋台","note":"云台之上对弈，脚下云海奔流","prompt_moss":"两名仙娥在云台之上对坐下棋，中间有一张石桌，桌上有棋盘。她们一人穿蓝金配色的宽袖长袍，一人穿红白配色。台面浮于云海之上缓缓漂移。主光为柔和日光。","prompt_zmf":"横画幅中式仙侠场景，一座悬空的云台自画面左侧探出，台上一位红衣的仙人与一位白衣的仙人隔案对弈：红衣仙人执子欲落，白衣仙人托腮沉思，云台的案上棋盘与青瓷茶具齐备；云台的下方，金色的云海奔流而下如瀑布倾泻，云涛的流速惊人。\n\n红衣仙人乌黑长发挽成道髻，插着木簪；她身着正红织金的宽袖道袍，袍面上金线的云纹华贵，她一手执玉质的棋子悬在棋盘上方，落子未落，神情专注。白衣仙人的乌黑长发束冠垂落，身着月白色的宽袖道袍，衣袂被云台的罡风掀起，他托腮凝视棋局，唇边带着浅笑。\n\n云台的台面为深色的木质棋枰台，台沿的雕花与鎏金的包角精致，案上的棋罐、棋笥与两只青瓷茶盏齐备；云台的基座下，金色的云海如瀑布般奔流倾泻，云涛的流速拉出流动的纹理，云浪的白沫自台沿翻卷坠落。背景的天空为深邃的蓝，高处横着一带青蓝色的极光般的云带，云带的光晕流动。主光为明亮的暖金阳光，从画面右上方照亮两人的衣袍、棋盘的木纹与云瀑的受光面；云瀑的暗部呈青金色。\n\n空气中弥漫着云絮与棋盘旁的茶香光尘，前景对弈的两人与棋盘清晰，云瀑奔流的动势完整；正红与月白的道袍、熔金云瀑与深邃天穹对撞，整体呈厚涂油画质感的东方云台对弈，闲适而壮阔。","zmf_name":"云台对弈奔流下","zmf_batch":39,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s13.webp","id":"ZS-200"},{"bv":"BV1RJuc6DEgF","scene":14,"series":"九霄神游","title":"瀑前负手","pal":"仙金蓝","who":"人物","comp":"居中，瀑占满屏","motion":"瀑帘倾泻/雾/红带飘","special":"千尺垂瀑、金字题","note":"白衣负手立于千尺瀑前，红带自肩垂落","prompt_moss":"一名白衣仙娥负手立于千尺瀑布前仰望，瀑布从画面上方倾泻而下分出数股水柱，水流冲击产生雾气。她身后有一条红带自肩垂落。远处有仙阁轮廓。主光为瀑布的透光漫射。","prompt_zmf":"横画幅中式幻想场景，画面中央一位身着白纱红裙的女子立于倾泻的瀑布之间，千尺的瀑帘自她身后的高处整体垂落，水幕的透光如垂落的琉璃，她的红纱长裙自肩头向四周铺展，如火焰在水幕中盛开。\n\n瀑布的水帘自画面的顶端整体倾泻：水流如透明的琉璃垂落，水帘的表面波光粼粼，水帘被透过来的日光染成金蓝交织的色块，水帘的边缘翻卷着白色的水花；水帘垂落的底部激起大片白色的水雾，水雾弥漫在她脚下的水潭上。女子立在两道水帘之间的岩台上：她的乌黑长发垂落腰际，发梢被水汽打湿；她身着月白色的广袖纱衣，裙摆为正红色与金红色相间的多层纱裙，红纱自她的腰间向四周炸开铺展，红纱的边缘在水雾中如火焰的花瓣，纱料上金线的纹样在透光处闪亮；她双臂微张，姿态如 falling 的仙子，神情平静。\n\n岩台的两侧立着几座青灰色的石塔，塔身的浮雕古朴；水潭的水面映着红纱与白瀑的倒影。主光为穿过水帘的日光，水帘的透光把日光滤成金蓝色，照亮红纱的火焰色、白纱的透明质感与水雾的珠光；水帘背光处呈青蓝色。\n\n空气中弥漫着浓重的水雾与飞珠，前景红纱的铺展与水帘的垂落清晰，瀑布的整体气势磅礴；正红纱裙、金蓝水帘与月白纱衣对撞，整体呈厚涂油画质感的东方瀑间红纱，圣洁而炽烈。","zmf_name":"瀑间水幕红纱","zmf_batch":32,"run":true,"image":"../images/scenes/BV1RJuc6DEgF/s14.webp","id":"ZS-201"},{"bv":"BV1WStR6vEca","scene":0,"series":"九霄神游","title":"云绸缠身","pal":"红金撞色","who":"人物","comp":"漩涡环抱人物居中","motion":"云绸旋卷/红带/花瓣","special":"云化绸带漩涡","note":"云像红绸一样把她卷在中心","prompt_moss":"一名白衣女子回身于红金色的云绸漩涡中央，云像红绸一样环绕她旋转成漩涡状。她黑发飘展，双袖展开。漩涡外缘有花瓣飞散。主光为漩涡内壁的金红光。","prompt_zmf":"横画幅中式幻想人像，平视中景。画面中央一位女子双臂抬起，被一圈翻卷的云绸环抱，云绸自脚下盘旋而上，占画面高度约七成。\n\n她为鹅蛋脸，眼尾上挑，唇色朱红；乌黑长发高挽，发间插着金饰，鬓边垂下细碎的发丝。\n\n她身着米白的薄纱长裙，胸前与肩头绣着暗金云纹，纱料极薄，透出手臂与锁骨的轮廓；云绸的绸面由朱红、青蓝与乳白渐变，被气流扯成螺旋，绕着她的腰与肩卷动，绸缘散成细丝。\n\n背景为深蓝夜色，散着金色星点与光斑；云绸外围浮着白色花瓣与光尘，远处隐约有云海的轮廓。主光为云绸自带的暖金光，自身侧与下方照亮面颊、肩线与绸面褶皱；星夜暗部呈深靛蓝。\n\n空气中漂浮着光尘与飞散的花瓣，前景的绸缘虚化，面部与手部清晰；朱红、青蓝与深靛蓝对撞，整体呈厚涂油画质感的东方云绸缠身，绮丽而神秘。","zmf_name":"云绸缠身","zmf_batch":48,"run":true,"image":"../images/scenes/BV1WStR6vEca/s00.webp","id":"ZS-202"},{"bv":"BV1WStR6vEca","scene":1,"series":"九霄神游","title":"行于倒瀑之城","pal":"红金撞色","who":"人物","comp":"纵深，瀑左右夹道","motion":"倒瀑上流/幡/云","special":"倒悬瀑布之城","note":"两道倒流的瀑夹着一条街","prompt_moss":"一名白衣人背影行走于两道倒悬瀑布之间的街道，瀑布自两侧崖壁向天空流回。街道有白玉路面与石栏。主光为瀑布的透光。","prompt_zmf":"横画幅中式幻想奇观大场景，一座悬浮之城的两道瀑布逆流而上，两道水幕夹着中间的一条长街：长街的白玉道面沿城的中轴延伸，街心的尽头没入云层的裂隙；一位白衣金纹长袍的旅人正沿街心独行，他的背影渺小，城的两翼楼阁与瀑布对称为构图。\n\n倒悬的双瀑自长街的两侧对称升起：水流逆着重力向上奔流，瀑身的水幕如两条银白的巨龙自城缘升向天穹，瀑布的表层翻卷着白色的水沫，水沫在半空凝成悬浮的水珠环；长街的两侧，朱红与白玉相间的楼阁沿街对称排开，楼阁的檐角挂着红灯笼与金色的风铃，街面的白玉映着双瀑的水光。\n\n白衣旅人的乌黑长发束成发髻垂落，发间的白色发带飘起；他身着月白色织金的宽袖长袍，袍面上金线的纹样华丽，肩头的披帛为青绿与正红相间的织锦，披帛的长摆拖在街面上；他独行的背影从容，长街的透视把他的身影引向街尽头的云隙天光。背景的天穹为金红与青蓝交界的异色天空，天穹的中央一道金色的光扇自城顶的缺口放射，光扇的辐条贯穿云层。主光为异色天穹的金红光，自街的尽头逆射，照亮双瀑的透光水幕、旅人的背影轮廓与街面的白玉反光；街两侧的楼阁阴影呈青紫色。\n\n空气中弥漫着瀑雾与悬浮的水珠，前景旅人的背影与街面的倒影清晰，双瀑保持逆流的对称动势；银白双瀑、白玉长街与金红天穹对撞，整体呈厚涂油画质感的东方倒瀑之城，超现实而恢弘。","zmf_name":"行于倒瀑之城","zmf_batch":39,"run":true,"image":"../images/scenes/BV1WStR6vEca/s01.webp","id":"ZS-203"},{"bv":"BV1WStR6vEca","scene":2,"series":"九霄神游","title":"携珠唤龙","pal":"红金撞色","who":"人物/妖","comp":"人左龙右，云环背景","motion":"龙现身/珠光/云旋","special":"龙珠唤龙","note":"掌上龙珠一亮，金龙自云中探头","prompt_moss":"一名白袍女子托起一颗发光的龙珠，一条金龙自右侧云中探头接近龙珠。金龙有金色鳞片与长须。主光为龙珠的金光。","prompt_zmf":"横画幅中式幻想场景，画面左侧一位白衣古装女子托起掌心的发光龙珠，画面右侧一条金鳞巨龙自翻涌的云涡中探出头来，龙首与女子隔着珠光遥遥相对，环形云涡包裹整个画面。\n\n女子乌黑长发垂落腰际，发间簪着素金发饰；她身着乳白色广袖长裙，腰间与袖口滚着正红色织锦边，一条红绸自肩头飘落划出弧线；她左手托着一颗自内发出暖金色光晕的圆珠，掌心向上，珠光映亮她的下颌与掌纹，她侧脸平静地望着龙首，目光坚定。\n\n金龙自右侧的云涡中探出：龙首的金色鳞甲层层分明，鳞缘泛着熔金的光泽，龙角后掠如枯枝，金色的长须与鬃毛飘扬，琥珀色的龙眼圆睁，与女子对视，神情庄重；龙身在云涡间盘旋，部分躯干隐入云中。整个天空被环形的云涡占据，云涡以画面中心为轴旋转，云层的边缘被珠光染成金色。主光为龙珠的暖金自发光与龙鳞的反射光，自画面中央照亮两人的相对面，云涡边缘呈金色的透光；云涡深处呈青蓝色，占约三成。\n\n空气中弥漫着旋转的云絮与金色光尘，前景女子的掌珠与龙首的鳞甲清晰，环形云涡向外层层虚化；乳白、熔金与正红点缀三色交织，整体呈厚涂油画质感的东方人龙契约场景，神圣而庄重。","zmf_name":"掌珠唤龙","zmf_batch":6,"run":true,"image":"../images/scenes/BV1WStR6vEca/s02.webp","id":"ZS-204"},{"bv":"BV1WStR6vEca","scene":3,"series":"九霄神游","title":"城头望涡","pal":"红金撞色","who":"人物群","comp":"涡占左上，城横贯","motion":"涡旋/云/幡","special":"天空漩涡","note":"天空破开一个云漩涡，全城仰望","prompt_moss":"多名白衣人在城头仰望天空中一个巨大的云中漩涡，漩涡呈螺旋状，中心深蓝。城郭有红墙与飞檐。主光为漩涡边缘的光。","prompt_zmf":"横画幅中式幻想奇观大场景，天空破开一个巨大的云漩涡：漩涡的旋臂为粉红、金白与青绿交织的云焰，涡心透出深蓝的星空；全城的人立于城头与街道仰望，画面右侧几位白衣的仙人在城头凭栏仰望，云涡的下方是仙城的楼阁群。\n\n云涡巨大：涡的旋臂自画面的中央向外旋转展开，旋臂的云层如火焰的绸缎层层卷曲，旋臂的颜色自外向内由粉白渐变为金红，涡心的洞口为深邃的青蓝色，涡心的边缘垂着金色的流苏状云须；云涡的旋转带动整片天空的云层，天空的底色为深蓝。\n\n全城仰望：画面的右侧前景，几位白衣的仙人立于城头的白玉栏杆边仰望，他们的长发与广袖被涡风掀起，仙人们的姿态仰慕；城头的朱红栏杆与金色的柱头华丽。下方的仙城铺满画面下半部：粉白与金红相间的楼阁沿山势层层排开，楼阁的重檐与白玉的街道如雪城，街道上的行人如尘点仰头。主光为云涡的自发光，自画面中央辐射，照亮城头的仙人群像、楼阁的受光面与旋臂的层次；云涡外的夜空呈深蓝。\n\n空气中弥漫着涡风的云絮与光尘，前景仰望的仙人群像清晰，云涡保持旋转的整体动势；粉金云涡、青蓝涡心与雪白仙城对撞，整体呈厚涂油画质感的东方云涡望城，神圣而壮丽。","zmf_name":"云涡当空全城仰望","zmf_batch":34,"run":true,"image":"../images/scenes/BV1WStR6vEca/s03.webp","id":"ZS-205"},{"bv":"BV1WStR6vEca","scene":4,"series":"九霄神游","title":"桥尽金轮","pal":"红金撞色","who":"人物","comp":"桥居中纵深，轮悬尽头","motion":"轮转/桥上幡/云走","special":"尽头金轮","note":"长桥的尽头悬着一座金轮","prompt_moss":"一名红衣人走向一座长桥尽头的金色巨轮法器，桥面有白玉栏杆，金轮悬于桥端上方。主光为金轮的自发光。","prompt_zmf":"横画幅中式幻想大场景，一点透视对称构图：一条铺着华丽织毯的长桥自画面下缘笔直延伸向远方尽头悬着的一座金色圆轮与天门，两位女子背身立于桥面中段，云海的漩涡在桥的两侧翻卷。\n\n长桥的桥面铺着宝蓝底色的织毯，毯上织满红金相间的团花纹样，桥两侧的白玉栏杆与鎏金柱头自近向远排开，透视纵深感强烈；桥面的织毯上散落着几片金色的落叶。桥的中段，两位女子背身而立：靠前的女子身着正红与乳白织金的重工襦裙，裙摆铺展拖曳在毯面上；稍后一位身着素白广袖裙，两人都仰望桥的尽头。\n\n桥的尽头悬着一座巨大的金色圆轮，轮心是一座重檐的天门城楼，城楼的门洞透出炽白的天光，一道笔直的金色光柱自天门向上贯穿云层；圆轮的金色轮辐与云层的漩涡一同旋转，环外的天空翻涌着青金色的云涛，几座悬浮的山石岛屿自两侧的云中探出，岛上挂着红色的垂幡。主光为天门的炽白光柱与圆轮的金光，自画面中央辐射，照亮桥面的织毯、人物的裙摆边缘与云涡的受光卷曲；桥的近景两侧阴影呈青金色。\n\n空气中弥漫着金色光尘与云絮，前景织毯纹样与栏杆柱头清晰，天门与圆轮保持宏大的整体轮廓、细节虚化；熔金、宝蓝与正红对撞，整体呈厚涂油画质感的东方天门长桥奇观，庄严而壮阔。","zmf_name":"桥尽金轮天门","zmf_batch":10,"run":true,"image":"../images/scenes/BV1WStR6vEca/s04.webp","id":"ZS-206"},{"bv":"BV1WStR6vEca","scene":5,"series":"九霄神游","title":"天河悬瀑","pal":"红金撞色","who":"无人物","comp":"瀑柱纵贯居中","motion":"天河柱倾泻/云楼/雾","special":"贯穿天地的水柱","note":"一根天河从云层直灌进楼阁之间","prompt_moss":"一根巨大的水柱从画面上方直灌入云中楼阁之间，水柱白色透光。两侧有仙阁飞檐。主光为水柱的透光。","prompt_zmf":"横画幅中式仙域大场景，正面平视。画面中央一道巨大的光水之柱自天顶垂直灌下，柱体从画面上缘直贯到底部的白石水盆，柱身占据画面宽度的三分之一；左右两侧各有一座朱红的楼阁探入画面，把天柱框在中央。\n\n天柱的水体自云层中垂落，柱身呈乳白与暖金，边缘翻卷成絮状的云花与飞溅的水沫，水柱的内芯透出蓝白的冷光；柱底的落点是一座巨大的汉白玉圆盆，盆沿光素，盆中水花向上炸开成环形的浪，浪尖泛着金光。\n\n画面两侧的楼阁为多层重檐，覆盖朱红的瓦与金黄的脊饰，檐角起翘，檐下悬挂着成串的红灯笼与铜铃；楼阁的梁柱与栏杆为朱红，斗拱层叠，廊内的窗光透出暖黄；台基为白石，台前的栏杆与石阶沿画面下缘展开。\n\n天柱背后的天空为深蓝的夜空，缀着细碎的星点与流云，云层向左右两侧翻卷成乳白与淡粉的云雾，云的暗部呈青灰；云雾在楼阁之间层层填满，把建筑托在半空。主光为天柱自身的冷白光芒，自画面中央向外辐射，照亮云涛的受光面、楼阁的檐口与白石的盆沿；两侧楼阁的背光面沉入暖红与赭色。\n\n空气中弥漫着水雾与飞散的光尘，前景的盆沿与水花清晰，两侧楼阁的檐角虚化；乳白、朱红与深蓝三色对撞，整体呈厚涂油画质感的东方天河悬瀑，宏大而华美。","zmf_name":"天河悬瀑","zmf_batch":43,"run":true,"image":"../images/scenes/BV1WStR6vEca/s05.webp","id":"ZS-207"},{"bv":"BV1WStR6vEca","scene":6,"series":"九霄神游","title":"袖卷山河","pal":"红金撞色","who":"人物","comp":"人物居中，云卷环抱","motion":"云成绸绕袖/衣飞/楼倾","special":"袖卷云城","note":"一展袖，整座云城跟着她转","prompt_moss":"一名白衣女子展双袖，整座云城随之旋转成云绸环绕她。她的袖子展开成巨大的弧线。主光为暖光。","prompt_zmf":"横画幅中式幻想奇观场景，画面中央一位红裙的女子立于云城的最高处一展长袖，她挥出的云袖卷起整片天空的金色云涡，云城的天空、云海与楼阁都随着她的袖势旋转起来，如天地随她的舞袖而转。\n\n女子的乌黑长发扬起，发梢没入金色的云涡；她身着正红织金的广袖华服，衣身上的金线凤纹华贵，白色的中裙衬在红裙之内；她一臂高举挥出长袖，云袖化作一条巨大的金色云带在空中盘旋，云带卷起整片天空的云层形成巨大的旋涡，旋涡的金色云焰如凤羽般层层展开，旋涡的中心透出深蓝的夜空与星斗。\n\n她脚下踏着一朵金色的云莲，云莲的花瓣展开托着她的裙摆；云城在她的四周随袖势旋转：朱红的楼阁与金顶的殿宇沿旋涡的边缘排布，殿宇的灯火连成金色的环线，环线的灯海与旋涡的金焰连成一体。远景的夜空为深蓝，旋涡的边缘没入夜色。主光为旋涡的金色自发光，自画面中央辐射，照亮红裙的金纹、云焰的层次与楼阁的受光面；旋涡外的暗部呈深蓝黑。\n\n空气中弥漫着金色的云焰与光尘，前景挥袖的红裙与云莲清晰，云城随旋涡旋转的动势完整；正红织金、熔金云涡与深蓝夜空对撞，整体呈厚涂油画质感的东方一展袖卷动云城，气势磅礴。","zmf_name":"一展袖卷动云城","zmf_batch":32,"run":true,"image":"../images/scenes/BV1WStR6vEca/s06.webp","id":"ZS-208"},{"bv":"BV1WStR6vEca","scene":7,"series":"九霄神游","title":"金顶孤舟","pal":"红金撞色","who":"无人物","comp":"金顶居中，舟小衬底","motion":"光柱自顶冲天/幡/云","special":"金顶光柱","note":"金色巨顶冲出一道天光","prompt_moss":"一座金色巨顶建筑自顶部冲出一道天光光柱，光柱纵贯画面。主光为金顶与光柱的自发光。","prompt_zmf":"横画幅中式幻想大场景，一座巨大的金色宫殿圆顶自城池的中央冲出一道笔直的天光，天光自穹顶的金尖垂直射向天际，把云层劈开；城池的白玉楼阁沿山势层层铺展，天空的云彩被天光照成金红色。\n\n金色圆顶为宫殿群的最高点：穹顶的表面为鎏金的鳞甲状拼接，穹顶的顶端竖着一根金色的尖塔，天光自尖塔垂直喷薄而出，光柱笔直炽亮，自穹顶直贯画面顶端的天际；光柱的根部为炽白，中段为熔金，光柱的两侧各垂着一幅金红色的织锦巨幔，织锦的流苏垂落。城池沿山势铺展：白玉的台基、朱红与金色相间的楼阁层层升高，楼阁的重檐与金顶在阳光下璀璨，城墙的红幡随风飘展；城池的四周，青绿色的琉璃瓦顶的民居延绵。\n\n天空的云彩为画面上半部的主体：大朵的积云被天光照成金红与淡紫，云层的层次如油画的笔触堆叠；几座悬浮的岛城自云隙间探出，岛城的轮廓金光闪闪。主光为天光柱的自发光与白昼的阳光交织，照亮穹顶的金鳞、城池的白玉台基与云彩的受光面；城池的阴影呈青蓝色。\n\n空气中弥漫着金色的光尘与云絮，前景城池的楼阁与金顶穹隆清晰，天光柱保持笔直的贯穿动势；鎏金穹顶、金红云彩与青蓝城郭对撞，整体呈厚涂油画质感的东方金顶天光，恢弘而神圣。","zmf_name":"金顶冲天光","zmf_batch":26,"run":true,"image":"../images/scenes/BV1WStR6vEca/s07.webp","id":"ZS-209"},{"bv":"BV1WStR6vEca","scene":8,"series":"九霄神游","title":"夜港灯船","pal":"妖夜橙","who":"无人物","comp":"横铺夜港","motion":"灯串/水纹/白兽行","special":"夜港灯列","note":"夜港灯列如市，白兽驮货归港","prompt_moss":"夜晚的港口灯市：白兽驮货归港，灯串沿码头排列，水面反射灯影。主光为灯串的自发光。","prompt_zmf":"横画幅中式幻想夜景场景，夜港的灯列如市，一头由云雾凝成的白色巨兽驮着货物正踏水归港：云兽的形体如狮如雾，鬃毛与身躯都由翻卷的云絮构成，它的背上驮着满载的货箱与灯笼，港内的灯楼与水面的倒影交相辉映。\n\n云兽的躯体由乳白与淡青的云絮凝成，鬃毛如翻卷的浪花向后飘散，云絮的边缘泛着灯笼映出的暖金光晕；它的四肢踏在水面上，蹄下踩碎的水纹荡开涟漪；它背上的货箱为朱红与木色相间的木箱，箱顶插着几面小旗，捆货的红绳紧绷，一盏方形的小灯挂在货箱的边角，暖光摇曳。\n\n夜港的两岸灯列如市：朱红的灯楼一层层叠起，楼上的灯笼自檐角垂串而下，金色的窗格里透出暖光；码头的水面上泊着几艘挂着红灯的小船。港口的水面为深蓝的夜色，倒映着两岸的灯楼与云兽的白影，倒影被细浪揉碎。背景的夜空为深蓝色，一轮淡淡的月挂在灯楼之上，几缕薄云横过。主光为两岸灯楼的暖橙自发光，自两侧照亮云兽的云絮边缘、货箱的木纹与水面的倒影；夜空的暗部呈深蓝黑，占约四成。\n\n空气中弥漫着水汽与灯火的光晕，前景云兽踏水的足下涟漪与货箱清晰，灯楼层层虚化；乳白云絮、暖橙灯火与深蓝夜港三色交织，整体呈厚涂油画质感的东方夜港归航，温馨而奇幻。","zmf_name":"夜港云兽归航","zmf_batch":16,"run":true,"image":"../images/scenes/BV1WStR6vEca/s08.webp","id":"ZS-210"},{"bv":"BV1WStR6vEca","scene":9,"series":"九霄神游","title":"莲台孤悬","pal":"仙金蓝","who":"无人物","comp":"莲台居中悬空","motion":"台缘光带/云走","special":"悬空巨莲台","note":"一朵巨莲悬在云海，无人登临","prompt_moss":"一朵巨大的白玉莲花悬浮在云海之上，莲花瓣层叠展开，花心有光。无人物。主光为莲台的自发光。","prompt_zmf":"横画幅中式仙域大场景，高角度俯瞰机位。画面中央一座巨大的白玉台基悬于虚空，台上有朱红廊柱环列的长廊与殿宇，一条蓝色的河水自台前横流，两个极小的白衣身影正沿白石长堤行走，占画面高度不足一成。\n\n白玉台面光洁，边缘雕着连续的云纹与莲瓣，台面反射着天空的青蓝与云霞的朱红；台前一道宽阔的白石坡道斜向画面右下延伸，坡面的接缝与石纹清晰。\n\n台上的殿宇为重檐歇山，覆盖金黄的琉璃瓦，檐下的斗拱与朱红立柱排成一线；殿前平台中央立着一座巨大的青铜香炉，炉身饰饕餮纹，炉口升起一道细直的青烟，直上画面上缘。\n\n台的两侧环绕着长廊与配殿，栏杆上挂着成排的铜铃；台后为层叠的殿宇群，飞檐层层退远；画面四周翻涌着巨大的云涛，云层的受光面为乳白与金，暗部为朱红与赭色，云的形态厚重如油画的笔触堆叠；远处天空为深青蓝，缀着细碎的星点与流云。主光为高处的白昼天光，自画面上方洒落，照亮白玉台面、金瓦与香炉的铜纹；云涛的暗部呈朱红，明暗对比强烈。\n\n空气中弥漫着香炉的青烟与云的絮状颗粒，前景云涛大幅虚化，台面上的两个小身影与香炉清晰；乳白、朱红与深青蓝三色对撞，整体呈厚涂油画质感的东方仙台孤悬，庄严而空寂。","zmf_name":"莲台孤悬","zmf_batch":42,"run":true,"image":"../images/scenes/BV1WStR6vEca/s09.webp","id":"ZS-211"},{"bv":"BV1WStR6vEca","scene":10,"series":"九霄神游","title":"伞云垂瀑","pal":"仙金蓝","who":"人物","comp":"伞盖占上半","motion":"伞缘瀑落/雾/衣","special":"伞状云瀑","note":"云长成了伞，伞缘垂下一圈瀑","prompt_moss":"一名红衣人立于伞状云瀑之下仰望，云长成了伞的形状，伞缘垂下一圈瀑布。主光为伞缘的漫射光。","prompt_zmf":"横画幅中式幻想奇观大场景，一片巨大的云在天空长成了一把伞的形状：伞形的云盖自画面中央的天空铺开，云伞的伞缘垂下一圈细密的瀑布，如伞边的流苏，一位红蓝长裙的女子立于云台的崖边仰望伞云。\n\n伞形的云盖巨大如天穹：伞面的云层为金红色与乳白交织，云的表面如熔金的绸缎翻涌，伞心最厚，向伞缘渐薄；伞缘垂下一圈瀑布，瀑布如伞边的流苏均匀分布，每一道瀑布的水流为银白色，自云伞的边缘垂直落向云海，瀑布落进云海时激起一圈圈白色的云雾环。\n\n红蓝长裙的女子立于前景云台的崖沿：她乌黑长发垂落，发梢被瀑布的水雾打湿；她身着宝蓝与正红织锦的广袖长裙，肩头的白纱披帛被风吹起，她背身仰望伞云与垂瀑，双手拢在身前，裙摆被崖风掀起。她脚下的云台为白玉的崖面，崖下的云海铺满画面的下半部，云涛如雪浪。主光为伞云缝隙漏下的金色天光与瀑布的银白水光交织，照亮她的侧影、云台的白玉与伞云的受光面；伞云的背光面呈金红的暗色。\n\n空气中弥漫着瀑雾与云絮，前景仰望的背影与崖沿清晰，伞云与垂瀑保持完整的伞形动势；金红伞云、银白瀑帘与宝蓝织锦对撞，整体呈厚涂油画质感的东方伞云垂瀑，超现实而壮丽。","zmf_name":"伞云垂瀑","zmf_batch":23,"run":true,"image":"../images/scenes/BV1WStR6vEca/s10.webp","id":"ZS-212"},{"bv":"BV1WStR6vEca","scene":11,"series":"九霄神游","title":"双瀑拱门","pal":"仙金蓝","who":"无人物","comp":"双瀑对称成门","motion":"瀑落/云涌/鸟群","special":"瀑水拱门","note":"两道瀑在空中合成一道拱门","prompt_moss":"两道瀑布在空中合成一道拱门形状，水流从两侧崖壁汇合于顶部。无人物。主光为水帘的透光。","prompt_zmf":"横画幅中式幻想奇观大场景，两道巨大的瀑布自天空的两侧相对倾泻，在半空合成一道拱门状的巨型水拱：拱门内透出深蓝的夜空与一道垂直的天光柱，拱门下的云海上，几位白袍的仙人驾着云舟列队穿行，朱红的殿宇环绕四周。\n\n双瀑自画面的左上与右上相对倾落，两道瀑布的水流在画面中央的高空交汇成拱：拱门的水体为炽亮的银白与熔金交织，水流的表面翻卷着白色的泡沫花，拱门的内缘挂着流苏状的水帘，水帘的水珠在夜色中发光；拱门的中央，一道垂直的天光柱自拱顶的天光处直贯而下，光柱的根部炸开一片金色的光雨。\n\n拱门下方的云海上，数艘白帆的云舟列队航行，帆影上的仙人衣袂飘展；云海的四周环绕着朱红与金色的殿宇群：殿宇的重檐金顶自云中层层升起，殿群沿画面的边缘铺展，殿前的白玉阶梯探入云海。背景的夜空为深邃的蓝，星光在拱门的环内闪烁。主光为天光柱的金白光与瀑布的银白水光交织，照亮拱门的内侧水壁、云舟的帆影与殿宇的金顶；拱门外的夜空呈深蓝黑，占约三成。\n\n空气中弥漫着瀑雾与金色的光雨，前景殿宇的飞檐与云舟清晰，双瀑拱门保持完整的拱形动势；银白拱瀑、熔金天光与朱红殿群对撞，整体呈厚涂油画质感的东方双瀑天门，恢弘而神圣。","zmf_name":"双瀑合成天拱门","zmf_batch":31,"run":true,"image":"../images/scenes/BV1WStR6vEca/s11.webp","id":"ZS-213"},{"bv":"BV1WStR6vEca","scene":12,"series":"九霄神游","title":"城望天眼","pal":"红金撞色","who":"人物","comp":"黑瞳居上，城横贯","motion":"瞳状云旋/城灯/幡","special":"云中巨瞳","note":"云破出一个瞳孔，正看着这座城","prompt_moss":"一名白衣人立于城头仰望天空中一只巨大的云中瞳孔，瞳孔呈螺旋状收缩，瞳心深蓝。城郭横贯画面下缘。主光为瞳缘的红金光。","prompt_zmf":"横画幅中式幻想夜景大场景，画面右侧一位身着红蓝织锦华服的女子背身立于城楼最高处仰望天穹：夜空的云层在天上破开一个巨大的瞳孔状漩涡，漩涡正俯视着这座灯火通明的不夜城。\n\n女子乌黑长发垂落腰际，发间的金饰与白色的绢花在夜风中轻晃；她身着正红与宝蓝织金的重工华服，衣身上金线的凤凰纹样华丽，宽大的裙摆与披帛被高空的罡风掀向一侧铺展；她背身而立，双手拢在身前，仰头的侧脸轮廓被城中的灯火映亮。\n\n天上的瞳孔状漩涡占据画面上半部的中央：云层以漩涡为心旋转，涡的外缘为金红色的云焰，内圈翻卷成虹膜的环纹，漩涡的最中心是一孔深蓝的夜空，如瞳孔的正中，星光在孔中隐约闪烁。城池铺满画面下半部：红瓦的楼阁群灯火万家，成百上千盏孔明灯自城中升起，漂向天穹的漩涡，最高的城楼上红灯成串。主光为城池万灯的暖橙光与漩涡天窗的深蓝夜色对撞，照亮女子的背影轮廓、织金的衣纹与孔明灯的透光；城的暗部呈暖褐色。\n\n空气中弥漫着升腾的灯火光晕与云絮，前景人物的背影与裙摆铺展清晰，天穹的漩涡保持完整的瞳孔轮廓、边缘虚化；熔金灯火、正红宝蓝织锦与深蓝瞳孔对撞，整体呈厚涂油画质感的东方天眼望城，神秘而盛大。","zmf_name":"云破天眼望城","zmf_batch":18,"run":true,"image":"../images/scenes/BV1WStR6vEca/s12.webp","id":"ZS-214"},{"bv":"BV1WStR6vEca","scene":13,"series":"九霄神游","title":"环中窥城","pal":"红金撞色","who":"人物","comp":"环占满屏","motion":"环内云旋/城微缩","special":"环视人间","note":"立在一枚巨环里，脚下是一整座城","prompt_moss":"一名白衣人立在一枚金色巨环的正中央俯瞰下方的一整座城，环的内外都有鎏金纹样。主光为环内壁的暖光。","prompt_zmf":"横画幅中式幻想大场景，画面中央矗立着一枚巨大的金色圆环，环内是一整座悬浮的云上城市，一位红裙白帛的女子背身立于环下的云台边缘，仰望环中的城市，环形构图。\n\n巨环的外壁为鎏金的金属质感，环身刻满细密的符文与浮雕，环的内壁如镜面般泛着流动的金蓝色光晕；透过环心望去，云海之中层叠着一座垂直堆叠的城市：金顶的楼阁、悬空的桥梁与层层升高的白玉平台沿环心向上排布，城市深处泛着暖金的光。环外的天空为深邃的蓝金色，几缕云丝横过。\n\n女子乌黑长发垂落，发梢随罡风扬起；她身着月白色广袖长裙，肩头至裙摆铺着大面积的正红与宝蓝织锦披帛，披帛的下摆铺展在云台上如流淌的绸缎；她背身而立，双手自然垂落，微微仰头望向环中的城市，身影在巨环的尺度下显得小巧。她脚下的云台为白玉质地，边缘的栏杆断裂，台边云海翻涌。主光为巨环内壁的金蓝光晕自上方漫射，照亮她的发丝边缘、披帛的织金纹样与云台的受光面；环体背光面呈青铜暗色，暗部占约三成。\n\n空气中漂浮着金色的光尘与云絮，前景人物的背影与铺展的披帛清晰，环中城市与云海层层虚化；熔金、湛蓝与正红对撞，整体呈厚涂油画质感的东方天环奇观，宏大而神秘。","zmf_name":"巨环窥城","zmf_batch":7,"run":true,"image":"../images/scenes/BV1WStR6vEca/s13.webp","id":"ZS-215"},{"bv":"BV1WStR6vEca","scene":14,"series":"九霄神游","title":"龙头吞吐","pal":"红金撞色","who":"动物","comp":"龙首居中，环为框","motion":"龙须/环云/火花","special":"穿环龙头","note":"金龙自云环里探出头来","prompt_moss":"一条金龙自金色云环中探出头，龙首有金色鳞片与长须，环内壁有火焰纹。主光为龙鳞的高光。","prompt_zmf":"横画幅中式幻想大场景，画面中央上方一条蓝金色的巨龙自翻卷的云环中探出头来，龙首俯向下方，白色的长鬃飞扬，龙身在云环间盘旋半隐，背景为红色的城郭与云海。\n\n巨龙的鳞甲为宝蓝与鎏金相间，鳞片层层分明，鳞缘泛着金属光泽；龙首宽阔，金色的双角后掠，乳白色的长须与鬃毛自颌下飘扬，龙须分缕垂落数米；琥珀色的龙眼低垂，凝视下方，鼻孔喷出两缕白色的雾气；龙口半张，吐出一团金色的光雾，光雾在龙首下方散成漫天的光尘。龙身在环形云涡中盘旋，云环以龙首为中心旋转，云层的边缘被龙光照成金红。\n\n下方与远景为依山而建的红白色城郭：朱红的殿宇、白墙的民居与层叠的城楼沿山势铺开，城中飘着数条红色的长幡与绸带，绸带在风中翻卷；更远处的群山没入虚化的青金色雾霭，天空为高远的湛蓝，大朵的积云悬在龙身之上。主光为明亮的白昼天光与龙首金雾的自发光，从画面上方照亮龙鳞的受光面、龙须的飘动与城郭的红瓦；云涡的阴影呈青金色。\n\n空气中弥漫着云絮与金色光尘，前景龙首的鳞甲与长须清晰，城郭与群山层层虚化；宝蓝、鎏金与朱红城郭三色对撞，整体呈厚涂油画质感的东方巨龙探云奇观，恢弘而灵动。","zmf_name":"龙头吞吐云环","zmf_batch":12,"run":true,"image":"../images/scenes/BV1WStR6vEca/s14.webp","id":"ZS-216"},{"bv":"BV1WStR6vEca","scene":15,"series":"九霄神游","title":"红幡环阵","pal":"红金撞色","who":"人物","comp":"环形幡阵环绕","motion":"幡带横飞/环转/衣","special":"红幡环形法阵","note":"红幡围成一圈，人在阵心诵礼","prompt_moss":"一名红衣人立于红幡环形法阵的正中央，幡旗自四面八方指向中心。主光为幡面与灯串的光。","prompt_zmf":"横画幅中式幻想仪式场景，画面中央一位身着蓝金锦衣的女子立于阵心，双手交叠在身前行诵礼，她的四周，数十面巨大的红色幡旗围成一个悬空的环形，幡阵正绕着她缓缓旋转。\n\n女子乌黑长发垂落腰际，发间的金色步摇随诵礼的动作轻晃；她身着宝蓝与鎏金织锦的广袖华服，衣身上金线的云凤纹样华丽，乳白色的裙摆自腰间铺展垂落，红色的宽腰带垂着长穗；她双手交叠行礼，神情庄重虔诚，双目微阖。\n\n环绕她的幡阵为数十面红色的长幡：每一面幡旗都竖直悬空，幡面上用金色写满古老的符文，幡尾垂着金色的流苏；幡旗围成的圆环自她的头顶上方倾斜环绕，环阵在缓缓旋转，幡面的红在光下深浅不一，幡影投在她的裙摆周围。阵外的天空为火红与金白交织的云层，云层的边缘翻卷着焰色的光，几座金顶的殿宇轮廓在云海深处若隐若现。主光为阵心向上的暖金光与幡阵的红光交织，照亮她的面部、织金的纹样与幡文的金字；幡阵背光面呈深红色。\n\n空气中弥漫着金色的符文光尘与云絮，前景诵礼的手势与裙摆铺展清晰，幡环保持旋转的整体动势；正红幡阵、宝蓝织金与焰色云层对撞，整体呈厚涂油画质感的东方红幡环阵诵礼，庄严而盛大。","zmf_name":"红幡环阵诵礼","zmf_batch":19,"run":true,"image":"../images/scenes/BV1WStR6vEca/s15.webp","id":"ZS-217"},{"bv":"BV1WStR6vEca","scene":16,"series":"九霄神游","title":"雷云对峙","pal":"红金撞色","who":"人物群","comp":"多角色斜线布阵","motion":"闪电劈/兽跃/云压","special":"雷云斗法","note":"雷云压城，各方乘兽凌空对峙","prompt_moss":"多名骑兽仙人在雷云压顶的空中对峙，闪电劈下，各自乘兽凌空。主光为闪电的自发光。","prompt_zmf":"横画幅中式神话对峙大场景，第一人称视角：双手攥着两条金色锁链自画面下缘伸入，锁链绷直伸向对峙的各方；天穹之上雷云压城，紫白色的闪电在云层间炸裂，各方乘着云台与瑞兽凌空列阵，金链的阵网把他们连成一圈对峙的局。\n\n四方的对阵者凌空分布：左侧一位红衣的将军踏着独角的神兽，兽首昂扬，他的金甲在雷光下反光；右侧一位青衣的仙者立于鹤背，拂尘横于臂弯；上方一位白袍的老者乘着莲台，袍袖鼓荡；下方一位黑袍的武者骑虎而立；他们的锁链互相牵引，金链的交点在画面的中央炸开一团紫白色的电弧。\n\n雷云的云层为画面的上半部：紫白色的闪电自云心劈落数道，电光的分叉如树根张开，云层的内壁被电光照亮，翻卷的云涛带着金红的边缘；云层的下方，金碧辉煌的仙城铺满视野：鎏金的殿宇、白玉的阶梯与朱红的牌楼沿云缘排布，城中的金顶群如星海。主光为闪电的电蓝紫光与金链的符光交织，照亮各方人物的轮廓、瑞兽的鬃毛与金链的链环；雷云的暗部呈深灰蓝，占约四成。\n\n空气中弥漫着雷雨的水汽与电弧的碎光，前景攥链的双手与绷直的金链清晰，各方对峙的阵形完整；电蓝雷光、鎏金锁链与仙城金顶对撞，整体呈厚涂油画质感的东方雷云对峙，剑拔弩张而神圣。","zmf_name":"雷云压城凌空对峙","zmf_batch":40,"run":true,"image":"../images/scenes/BV1WStR6vEca/s16.webp","id":"ZS-218"},{"bv":"BV1WStR6vEca","scene":17,"series":"九霄神游","title":"踏兽穿云","pal":"红金撞色","who":"人物群","comp":"斜线疾速构图","motion":"兽奔/云裂/衣猎猎","special":"骑兽穿云","note":"踏兽穿云，像一支离弦的箭","prompt_moss":"多名骑兽仙人疾驰穿云，兽蹄踏碎云层，画面呈斜线运动构图。主光为暖光。","prompt_zmf":"横画幅中式神话飞行大场景，画面中央数位仙人各自踏着一方飞行的云台，云台之间拉着绷直的金色锁链，整支队伍如一支离弦的箭般穿云而出；天际的雷光炸裂，云城的轮廓在雷光的缝隙间显现。\n\n领头的仙人立于最前的云台：他身着米白色的宽袖长袍，衣袍被高速的罡风向后掀成一面旗，他一手向前平伸引路，姿态如箭头；他身后的仙人们依次踏着云台列成箭形的队列，每位仙人的衣色各异——绛红、翠绿、月白，他们的长发与衣摆都向后飞扬；云台与云台之间的金色锁链绷得笔直，链身的符文在雷光下发光，锁链的末端连向画面下方一双执链的手。\n\n他们穿行的云层为厚重的积云与雷雨云：云层的裂隙间炸开数道蓝紫色的闪电，闪电的分叉如树根劈落，雷光照亮云层的内壁；云层的下方，一座巨大的云中城郭铺满视野：朱红的楼阁与金顶的塔沿街道排布，城中的灯火如星海。前景的云台与仙人的衣袂清晰，雷光炸裂的瞬间定格。主光为天雷的电蓝光与金链的符光交织，照亮云台的边缘、仙人的衣袍与云层的内壁；雷云的暗部呈深灰蓝，占约四成。\n\n空气中弥漫着雷雨的水汽与电弧的碎光，前景领头的仙人与绷直的金链清晰，队伍保持箭形的穿云动势；电蓝雷光、熔金锁链与多彩仙衣对撞，整体呈厚涂油画质感的东方踏兽穿云，疾速而震撼。","zmf_name":"踏兽穿云箭离弦","zmf_batch":30,"run":true,"image":"../images/scenes/BV1WStR6vEca/s17.webp","id":"ZS-219"},{"bv":"BV1WStR6vEca","scene":18,"series":"九霄神游","title":"接引天雷","pal":"红金撞色","who":"人物群","comp":"雷柱居中，人环列","motion":"雷柱贯天/剑光/雾散","special":"引雷入阵","note":"天雷被引下来，正落在阵心","prompt_moss":"多名仙人在空中举剑引天雷，一道雷柱从天而降落在阵中央。主光为雷柱的自发光。","prompt_zmf":"横画幅中式神话大场景，翻涌的云海之上，数位仙人各自立于云台与飞舟之上，拉着长长的金色绳索结成一张巨阵，数道炽亮的天雷自天穹劈下，正落在阵心的中央，前景一双执绳的手自画面下方伸入。\n\n天雷为炽白偏蓝紫的电光，自画面顶端的乌云中劈落数道，每一道的分支如树根般张开，正中的主雷落在阵心的金色的法阵光圈上，雷光与法阵相接处迸射出漫天的电弧与金色的光屑；法阵为多层的同心圆环，环上浮着古老的符文。阵心处一位白衣人执着一柄出鞘的长剑指向天空，剑尖是雷光的汇聚点，他的衣袍被雷光映得雪亮。\n\n围阵的仙人们分布四周：有的立于悬浮的云台，有的乘着飞舟，有的踏着飞剑，手中的金绳各自绷直，绳身上流转着金色的符光；他们的衣袍有青、白、绛红多种颜色，姿态各异。前景自画面下方伸入的一双缠着护腕的手正攥紧金绳，绳身绷紧的弧线清晰。背景的天穹为乌云与金光交织，云层的裂隙透出天界的金色宫阙轮廓，云海在阵的下方向四周铺开。主光为天雷的电光与法阵的金光，从画面中央辐射，照亮所有人物与绳阵的轮廓；乌云的暗部呈深灰蓝，占约四成。\n\n空气中弥漫着电弧的碎光与金色的符文光尘，前景执绳的手与绳身的张力清晰，天雷保持劈落的整体动势、顶端虚化；电蓝、熔金与多元衣色对撞，整体呈厚涂油画质感的东方接引天雷大阵，震撼而神圣。","zmf_name":"接引天雷","zmf_batch":13,"run":true,"image":"../images/scenes/BV1WStR6vEca/s18.webp","id":"ZS-220"},{"bv":"BV1WStR6vEca","scene":19,"series":"九霄神游","title":"袖展遮天","pal":"红金撞色","who":"人物","comp":"居中，双 cene":5,"series":"九霄神游","title":"长竿牧鹅","pal":"仙金蓝","who":"人物群","comp":"人物右，鹅群散点","motion":"鹅群下水/水花/竿","special":"天池牧鹅","note":"在天池里放鹅，红衣一支长竿","prompt_moss":"一名红衣仙娥执长竿在天池边牧鹅群。主光为日光。","prompt_zmf":"横画幅中式幻想牧野场景，平视远景。画面前景偏右一位披红斗篷的女子背身而立，右臂垂握一支细长的竹竿，竿头点在水面上；她面前是一片与天相接的浅水，成群的白鹅散在水面上，占画面高度约五成。\n\n女子背身，乌黑长发在脑后挽起，几缕碎发被风带起；红斗篷自肩头垂落，布料被风鼓成弧形，内衬的青蓝长裙从斗篷下摆露出一截，裙缘浸在浅水里。\n\n水面平如镜，倒映着天光与远处的楼阁；白鹅分作数群，颈项弯成各样的弧度，羽翼的白在逆光里透出绒边，水面被鹅掌拨出一圈圈细纹；更远处还有一位白衣人持竿而立，身形缩小。\n\n远景的天际线上浮着一座尖塔状的云上建筑，塔尖与云层相接；地平线被晚霞染成粉紫与浅金，云层横陈如带，水天交界处几乎看不出分界。主光为低角度的暖粉夕光，自画面左前方斜射，把斗篷的边缘、鹅群的羽缘与水面点亮；背光处的水面呈青灰，暗部柔和。\n\n空气中弥漫着薄雾与水汽，前景的斗篷与水纹清晰，远景的塔与云带虚化；粉紫、暖金与青灰三色交织，整体呈厚涂油画质感的东方天池牧鹅，静谧而辽远。","zmf_name":"长竿牧鹅","zmf_batch":45,"run":true,"image":"../images/scenes/BV1m4tA6bEbP/s05.webp","id":"ZS-231"},{"bv":"BV1m4tA6bEbP","scene":6,"series":"九霄神游","title":"簸箕簸鸡","pal":"红金撞色","who":"人物群","comp":"人物居中，白鸡环绕","motion":"谷壳飞/鸡群啄食/裙摆","special":"白鸡群环绕","note":"云台上扬谷喂鸡，白鸡围成一圈","prompt_moss":"一名仙娥坐云台扬簸箕喂白鸡群。主光为日光。","prompt_zmf":"横画幅中式幻想喜剧场景，云上白玉庭院中，一位头戴金冠、身披红蓝织锦华服的贵气女子跪坐在白玉地面上，双手端着一只金色的大簸箕向前扬谷，金黄的谷粒在空中扬成一道弧线，一群白色公鸡母鸡围成一圈争食。\n\n女子乌黑长发挽成繁复的高髻，头戴一座金色的凤冠，冠上垂着珠链流苏；她身着红蓝金三色织锦的广袖华服，肩头的披帛铺展在白玉地面上，裙摆的织金纹样华丽，袖口挽起露出持簸箕的双手；她微微前倾，神情认真又带笑意，谷粒自簸箕边缘扬出，在逆光中像金色的雨。\n\n围绕她的白鸡肥硕圆滚，红冠鲜明，颈羽蓬松，正低头啄食地面的谷粒，有几只扑棱着翅膀争抢；地面上散落的谷粒与几根白色的羽毛清晰。背景为宫殿庭院：朱红的立柱、白玉的栏杆与金顶的殿宇，廊下挂着白色的纱幔与灯笼，远处还有两位侍女提着谷袋走来。主光为明亮的暖金阳光，从画面右上方照亮谷粒的扬撒轨迹、鸡羽的白与织锦的织金反光；阴影呈蓝紫色。\n\n空气中弥漫着扬起的谷壳与浮尘，前景簸箕与啄食的鸡群清晰，背景宫殿没入焦外；暖金、正红与乳白三色交织，整体呈厚涂油画质感的东方云上喂鸡喜剧，贵气与烟火气同框。","zmf_name":"云台扬谷喂鸡","zmf_batch":9,"run":true,"image":"../images/scenes/BV1m4tA6bEbP/s06.webp","id":"ZS-232"},{"bv":"BV1m4tA6bEbP","scene":7,"series":"九霄神游","title":"檐上闲坐","pal":"仙金蓝","who":"人物","comp":"人物右，檐线横贯","motion":"云走/衣垂/远处劳作人群","special":"坐檐远眺","note":"干活累了坐在檐上发呆，云从脚边过","prompt_moss":"一名年轻男子坐宫檐上眺远，云从脚边过。主光为日光。","prompt_zmf":"横画幅中式仙侠生活场景，画面中央一位白衣束发的男子坐在宫殿最高处殿顶的青瓦檐上发呆，双腿垂在檐外，云海自他的脚边流过，身后几位工匠正在修缮瓦面。\n\n男子的乌黑长发半束半披，几缕散发被高空的罡风吹起；他身着月白色的宽袖长袍，腰间束着青绿色的丝绦，肩上搭着一条宝蓝色的半臂外衫，红色的衬里自袖口露出；他双手向后撑在瓦面上，身体微微后仰，双腿随意地垂在檐沿外晃着，仰头望向天空，神情放空惬意。\n\n他坐着的殿顶为深青色的琉璃瓦，瓦垄的弧线自檐口一层 上家宴菜摊","zmf_batch":10,"run":true,"image":"../images/scenes/BV1m4tA6bEbP/s19.webp","id":"ZS-245"},{"bv":"BV1m4tA6bEbP","scene":20,"series":"九霄神游","title":"灶前扬烟","pal":"红金撞色","who":"人物","comp":"人物居中，灶火前景","motion":"火星/烟起/勺翻","special":"天厨掌勺","note":"天厨颠勺，烟把云都熏弯了","prompt_moss":"一名仙娥灶前扬勺起烟。主光为火光。","prompt_zmf":"横画幅中式幻想生活场景，画面中央一位身着白纱红裙的天厨在云端的露天灶台前颠勺，锅中的烟气腾起，把头顶的一片云都熏得弯了腰；她的身后是悬浮的宫城与云海，两位小厨娘在旁打下手。\n\n天厨乌黑长发挽成高髻，发髻上插着金钗与绢花；她身着白纱的广袖外衫与正红色的织金抹胸长裙，纱袖挽至肘间，腰间的红锦带垂着长穗；她双手握着锅柄，手腕发力向上一颠，锅中的菜肴腾空而起，锅口的烟气腾起一大团，烟柱向上翻卷，把头顶的一片白云熏得弯曲变形，烟的颜色暖白中带着淡淡的金黄。\n\n露天灶台为青铜的灶座，灶膛里的火苗舔着锅底，灶边的案板上摆满待烹的食材：青菜、菌菇与整只的果篮；两位小厨娘一位蹲在灶边添柴，一位捧着调味的瓷罐候着。背景的悬浮宫城为金顶白墙的楼阁群，宫城自云海中探出，宫城的阶梯与白玉的栏杆沿云缘铺开，远处的云海上还有别的浮空楼阁。主光为明亮的暖金阳光，从画面右上方照亮烟气、她的纱袖与食材的鲜艳色彩；云海的阴影呈淡青色。\n\n空气中弥漫着饭菜的香气与烟的暖白，前景颠勺的动态与熏弯的烟云清晰，宫城与云海层层虚化；正红织金裙、白纱广袖与熔金云城对撞，整体呈厚涂油画质感的东方天厨颠勺，鲜活而宏大。","zmf_name":"天厨颠勺烟熏云","zmf_batch":30,"run":true,"image":"../images/scenes/BV1m4tA6bEbP/s20.webp","id":"ZS-246"},{"bv":"BV1m4tA6bEbP","scene":21,"series":"九霄神游","title":"月门望城","pal":"仙金蓝","who":"无人物","comp":"圆月门框景","motion":"云过门/楼灯","special":"圆形月门","note":"圆月门里望见整座云上宫城","prompt_moss":"圆月门洞框望整座云上宫城。主光为日光。","prompt_zmf":"横画幅中式仙域大场景，高角度俯瞰。画面左侧一轮巨大的圆形石月门自画面边缘切入，门洞如满月；透过门洞望见整座云上的宫城：白石的长桥、层叠的殿宇与翻涌的云海。\n\n月门的石壁为浅灰的砂岩，门沿的雕纹被风磨圆，门洞的内缘泛着暖光；一条白石的长桥自门洞下方斜向画面右侧，桥面铺着方石，两侧的栏板与望柱连绵，望柱头上雕着莲瓣。\n\n桥的尽头与画面的右侧是层叠的宫城：汉白玉的台基、金绿相间的琉璃瓦、朱红的廊柱与斗拱，殿宇沿山势层层升高，檐角起翘，脊上立着吻兽；远处还有一座八角的重檐楼阁探出云面；桥上与台前散着极小的行人身影，衣色为青、白、红。\n\n桥下与宫城的四周是翻涌的云海，云涛的受光面为乳白与浅金，暗部为淡青与灰紫，云的边缘卷成絮状；云层深处透出一线远山。主光为高位的暖阳，自画面右上方洒落，照亮白石桥面、金绿瓦面与云涛的边缘；月门内的背光面呈冷灰，明暗对比分明。\n\n空气中弥漫着云的絮粒与飘散的薄雾，前景月门的石纹清晰，远处的宫城与云海层层虚化；乳白、金绿与浅青三色交织，整体呈厚涂油画质感的东方月门望城，开阔而空灵。","zmf_name":"月门望城","zmf_batch":44,"run":true,"image":"../images/scenes/BV1m4tA6bEbP/s21.webp","id":"ZS-247"},{"bv":"BV1m4tA6bEbP","scene":22,"series":"九霄神游","title":"雪径归人","pal":"仙金蓝","who":"人物群","comp":"纵队纵深，雪山夹道","motion":"雪粉/担筐晃/呼气","special":"云上雪径","note":"云上也有雪天，一行人担筐归家","prompt_moss":"一行人担筐行于云上雪径。主光为冷光。","prompt_zmf":"横画幅中式仙侠生活场景，云上的雪天里一行人沿雪径归家：画面中央一位白衣的女子推着独轮车走在雪径的最前，她身后跟着挑担的农夫与牵牛的车夫，队伍沿雪坡的路径蜿蜒向上；雪径的尽头，一座悬浮在云海之巅的金色云城灯火辉煌。\n\n白衣女子乌黑长发束成发髻，发间插着素簪；她身着月白色的广袖棉袍，肩头披着淡青色的披帛，双手推着独轮车，车上的筐里装着采买的年货；她的脚印在雪地上留下一串深深的足迹。她身后的队伍：一位绛红长袍的农夫挑着两只满筐的行囊，扁担压弯了肩；一位牵牛的车夫赶着一头驮着货箱的青牛，牛蹄踏雪；还有几位提篮的村人跟在队尾，人人步履匆匆，归心似箭。\n\n雪径为云上的雪坡小路，路面的积雪厚实，路径的两侧是陡峭的雪山崖壁，崖壁的积雪如棉；雪天的天空为淡金色与灰白交界，雪片纷纷扬扬。路径的尽头，一座金色的云城悬浮在云海之巅：金顶的楼阁层叠如山，城中的灯火在雪色里温暖明亮，城下云涛翻涌如雪浪。主光为雪天的清冷日光与云城的暖金灯火交织，照亮雪径的白、行人衣物的色彩与云城的灯火；雪地的阴影呈淡蓝灰。\n\n空气中弥漫着纷飞的雪片与云絮，前景归人推车与挑担的姿态清晰，云城保持悬浮的辉煌轮廓；雪白路径、绛红衣袍与熔金云城对撞，整体呈厚涂油画质感的东方雪径归人，温馨而壮阔。","zmf_name":"云上雪径归人","zmf_batch":27,"run":true,"image":"../images/scenes/BV1m4tA6bEbP/s22.webp","id":"ZS-248"},{"bv":"BV1B4nV69EcY","scene":0,"series":"灵动仙姿","title":"榻前邀近","pal":"红金撞色","who":"人物/POV","comp":"人物占画面约七成，POV 手入前景右下","motion":"金步摇坠饰轻摆/发丝/烛光光斑/绸面流光","special":"金丝圆眼镜、白狐毛领、凤钗步摇、暖橙烛光","note":"金饰细节全分辨率确认：琥珀眼、圆眼镜、白狐毛领、黑发蓝光泽","prompt_moss":"一名狐妖女子卧于锦榻直视观者，扶金丝眼镜，另一手向观者伸出食指。金凤钗步摇、白狐毛领、黑发蓝泽。主光为暖橙烛光。","prompt_zmf":"横画幅中式人物近景，平视。画面中部一位戴金花冠的女子伏在深色木栏上，头微侧看向画外，左手扶着栏沿，占画面高度约七成。\n\n她面容清秀，眉眼描得细长，眼尾上挑，唇色正红；耳上挂细金坠，鼻梁架着一副细金属圆框眼镜，镜片反出一线暖光。\n\n她头戴金丝缠枝的花冠，缀着白花与垂珠，冠后的发丝被风带起；上身穿白色薄纱外袍，内衬月白抹胸，肩头搭一件绣金的蓝地披帛，纱料在臂弯堆成褶皱，透出肤色与骨骼的起伏。\n\n背景为深色木构与暖金散景，几枝金叶横过画面上缘；光线自右侧低角度斜射，照亮她的面颊、镜框、花冠与纱料的高光。主光为暖金侧光，左侧由冷调暗部补衬，皮肤呈柔润的次表面散射；暗部为深褐。\n\n空气中浮着细小的光斑与尘粒，前景纱料与手指清晰，背景木构与金叶虚化成环状光斑；金、白与深褐交织，整体呈厚涂油画质感的东方人物近景，慵懒而明艳。","zmf_name":"榻前邀近","zmf_batch":47,"run":true,"image":"../images/scenes/BV1B4nV69EcY/s00.webp","id":"ZS-249"},{"bv":"BV1B4nV69EcY","scene":1,"series":"灵动仙姿","title":"双屏对望·左","pal":"红金撞色","who":"人物","comp":"双联壁纸左幅，人物居中","motion":"发丝/金饰/披帛","special":"双联壁纸设计","note":"双联壁纸的左幅；与 s02 同设计不同帧","prompt_moss":"金冠华服狐女托腮俯身面向右屏含情微笑。主光为暖光。","prompt_zmf":"横画幅中式古典人像特写，画面中央一位华服金饰的狐妖女子托着腮凝望画外，她的乌黑长发铺散，白绿金三色的纱衣层叠如云，繁复的金色头面在光下璀璨，眼神里带着一丝慵懒的探究。\n\n女子乌黑长发如瀑铺展，发间堆叠着繁复的金色头面：金冠、金簪、金色的流苏步摇层层插戴，白色的绒花点缀其间；她的托腮手势优雅，指尖白皙，琥珀色的眼瞳望向画外，眼尾上挑，唇色朱红微嘟，神情慵懒中带着好奇。她身着白绿金三色织锦的广袖华服：纱衣的层数繁多，外层的纱透如雾，中层的锦缎织满金线的团花纹样，领口的白色狐毛领蓬松，衣料的层次在光下如云海般铺展。\n\n她的身前与身侧铺着锦缎的软榻，榻上的织物与她的纱衣连成一片；背景为暗色的殿帐，帐幔的深色衬托出她金纱的璀璨。主光为暖金的室内光，自画面左前方照亮她的面部、头面的金饰层次与纱衣的透光；帐幔的暗部呈深蓝黑。\n\n空气中弥漫着金粉与织物的浮絮，前景托腮的凝望眼神与金纱的层次清晰，背景帐幔虚化；白绿金纱
