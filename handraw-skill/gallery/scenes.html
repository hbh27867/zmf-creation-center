<script>
const SCENES = [{"bv":"BV126aw6vEG6","scene":0,"series":"妖都浮生","title":"鹿妖醉月","pal":"妖夜橙","who":"人物/妖","comp":"三分侧身特写，巨月占左上","motion":"月晕光斑/发丝/红披帛/杯中酒光/飘叶","special":"巨大满月、鹿角、金步摇","note":"鹿角妖女在巨月前侧身饮一杯月光，蓝金夜色，红带点睛","prompt_moss":"一名鹿角妖女侧身立于画右，执杯仰首啜饮，双目轻闭。身后一轮巨大的满月占据左上方，月光照亮她的侧脸与鹿角。她穿红白相间的古装，腰系红带，金步摇垂坠。地面白玉桥面反射月光，远处有灯火。主光为月光的冷白与灯火的暖橙交叠。","prompt_zmf":"横画幅中式幻想夜景人物近景，侧前平视。画面左侧三分之二为一位鹿角妖女的侧脸与肩背，她右手持一只高脚酒杯就唇慢饮；画面上缘一轮巨月，月下是漫山的灯火楼阁。\n\n她的侧脸清锐，鼻梁挺直，眼尾上挑，眼妆为深红，唇色朱红；头顶生着一对枝状鹿角，角上挂着细金饰与珠串；乌黑长发垂至腰际，发间编着红缎带，几缕碎发横过颊边。\n\n她肩背的肌肤裸露，胸前交叠着月白的薄纱与金属胸饰，纱缘缀着成串珠链；右臂赤裸，腕上戴一圈细金环；杯壁映着月色，杯中的酒面泛微光。\n\n她右后方的山坡密布灯火楼阁：层叠翘檐、成串暖橙灯笼、成片金色窗光，自山腰漫到山脚；巨月占据右上，月面暖白光晕，几缕流云横过月缘。主光为月光自右上方勾出鹿角与发丝的亮边，灯海的暖橙自下补亮她的下颌与颈侧，冷月与暖灯在颈线交汇。\n\n空气中浮着被月光点亮的细尘与橙红落叶，前景发丝与杯沿清晰，远景楼阁与月晕虚化；暖橙、深蓝与朱红撞色，整体呈厚涂油画质感的东方鹿妖醉月，妖冶而静美。","zmf_name":"鹿妖醉月","zmf_batch":47,"run":true,"image":"../images/scenes/BV126aw6vEG6/s00.webp","id":"ZS-001"},{"bv":"BV126aw6vEG6","scene":1,"series":"妖都浮生","title":"蝶衣回眸","pal":"仙金蓝","who":"人物/妖","comp":"对角线卧姿，人脸左上","motion":"蝶翅微颤/绸缎起伏/发丝","special":"金纹蝶翼、金箔绸堆","note":"蝶翼妖女俯卧金绸堆上回眸，翼与绸同质感的暖金","prompt_moss":"一名蝶翼妖女俯卧于金箔绸缎堆中，上半身撑起，向右回眸。背后蝶翼呈金纹半透明状。她穿白色抹胸配蓝金刺绣外衫。绸缎堆如金浪。主光为暖金烛光。","prompt_zmf":"横画幅中式幻想夜色人像，平视中景。画面中央一位生着巨大蝶翼的女子俯卧在成堆的金绸之上，上身支起，回眸看向画外；她的头顶是一片浓密的枝叶，画面上缘一轮巨月，占画面高度约七成。\n\n她为鹅蛋脸，眼尾上挑，眼妆偏深，唇色朱红；乌黑长发散落在臂弯，发间缀着细金饰与红珠，几缕贴在颊边。\n\n她的蝶翼自肩胛展开，翼面为半透的浅金与灰蓝，翅脉清晰，边缘呈齿状；她上身着极薄的浅金纱衣，肩背裸露，肌肤被月光照亮；下身裹着深蓝的软绸，绸面在膝间堆出褶皱；身下的金绸堆成一片起伏的浪。\n\n背景为深蓝的夜空，星点细密，月面泛着暖白的光晕，月边有薄云横过；枝叶自上方垂下，叶片被月光勾出银边。主光为右上方洒落的冷月光，照亮蝶翼的透光与她的肩背；金绸与暖橙的灯火自下补亮，冷暖在翼面上交汇。\n\n空气中浮着细小的光尘与飘落的叶片，前景的金绸与蝶翼清晰，远景的月与枝叶虚化；暖金、深蓝与朱红交织，整体呈厚涂油画质感的东方蝶衣回眸，妖冶而慵懒。","zmf_name":"蝶衣回眸","zmf_batch":49,"run":true,"image":"../images/scenes/BV126aw6vEG6/s01.webp","id":"ZS-002"},{"bv":"BV126aw6vEG6","scene":2,"series":"妖都浮生","title":"鹰妖赴宴","pal":"妖夜橙","who":"人物/妖","comp":"人物右侧，翼占上半对角","motion":"羽毛层次翻动/灯焰/衣摆","special":"巨大鹰翼、红衣金饰","note":"鹰妖收翼立于案旁，翼羽如蓑衣层叠","prompt_moss":"一名鹰妖展开巨大羽翼立于宴案旁，羽翼呈层叠的棕金色，每根羽枝清晰。她穿红衣低头敛目。远处有灯火与云。主光为烛光。","prompt_zmf":"横画幅中式幻想场景，画面中央一位鹰妖收拢双翼立在宴案的案旁，她身后巨大的翼羽收拢如层叠的蓑衣羽披，翼羽的金褐色在月光下泛着光泽；她低头整理案上的礼盒，月轮悬在身后的楼宇之上。\n\n鹰妖的乌黑长发挽成繁复的高髻，发间插着金色的发饰；她的面容清丽，眼尾上挑，神情认真。她身着靛蓝与米白织锦的广袖华服，衣料上织满金红的花纹，腰间束着革带与配饰，多层的水色纱裙铺展；她的双翼收拢在背后，翼羽如蓑衣般层层叠叠自肩后披落，翼面的羽枝根根分明，羽缘的乳白与金褐相间，翼尖的长羽垂到地面。\n\n她面前的案上摆着数只红色的礼盒与果篮，礼盒的金纹精致；案旁的柱子上缠着金色的绸带。背景为夜晚的宴街：朱红的楼阁挂满灯笼与幡旗，远处的城郭灯火连绵；巨大的满月悬在楼宇之上，月轮的环形山清晰，月色洒在她的翼羽上。主光为满月的银白月光与宴街的暖橙灯火交织，照亮翼羽的层次、织锦的纹样与礼盒的红；暗部呈蓝紫色。\n\n空气中弥漫着灯穗的流苏与月色的光尘，前景翼羽的层叠质感与整理礼盒的手部清晰，月轮与楼宇构图饱满；金褐翼羽、靛蓝织锦与银白月轮对撞，整体呈厚涂油画质感的东方鹰妖赴宴，华贵而静谧。","zmf_name":"鹰妖收翼赴宴","zmf_batch":28,"run":true,"image":"../images/scenes/BV126aw6vEG6/s02.webp","id":"ZS-003"},{"bv":"BV126aw6vEG6","scene":3,"series":"妖都浮生","title":"俯瞰整衣","pal":"妖夜橙","who":"人物/妖","comp":"大景小人，俯瞰城市灯火","motion":"衣带/城市灯火微闪/云","special":"高空夜景","note":"从妖都上空俯瞰，红衣妖在栏杆边整衣","prompt_moss":"一名红衣妖女立于高台边缘低首整理衣带，身后是俯瞰的妖都城市灯火与云海。主光为城市灯火的自下光。","prompt_zmf":"横画幅中式幻想夜景场景，画面中央偏右一位背生巨翼的红衣女子俯身立于城楼白玉栏杆边，低头整理衣裙，半侧背影入镜，占画面高度约六成。\n\n女子乌黑长发垂落腰际，发间缀着金饰，侧脸下颌微收，神情专注。她身着红白织金的重工襦裙：上身红色织金抹胸与广袖，裙摆层叠如云，白底上织满红金缠枝纹样，腰封垂下长长的金色流苏；背后一对巨大的棕褐色鹰翼完全张开，翼羽根根分明，从肩后向上铺展至画面上缘，占画面宽度约一半。\n\n城楼的白玉栏杆与朱红立柱在她身前，檐下悬挂成串的金色灯笼，灯笼光晕温暖。她脚下是漂浮于云海之上的城市群：朱红屋顶的金瓦楼阁沿云缘层层排开，远处漂浮的岛屿没入焦外的蓝紫暮色。天空呈深邃的蓝色，一轮巨大的满月悬于右上，月光与灯笼暖光交织，勾亮她的翼羽边缘与织金裙面的反光；暗部呈蓝黑色，占约三成。\n\n空气中漂浮着金色的光粒与云絮，前景栏杆与灯穗大幅虚化；正红、织金与深蓝对撞，整体呈厚涂油画质感的东方奇幻夜景，华丽而神秘。","zmf_name":"城楼巨翼整妆","zmf_batch":2,"run":true,"image":"../images/scenes/BV126aw6vEG6/s03.webp","id":"ZS-004"},{"bv":"BV126aw6vEG6","scene":4,"series":"妖都浮生","title":"金箔抽签","pal":"仙金蓝","who":"人物","comp":"居中偏左特写，窗框月色","motion":"签支轻碰/绸面流光/发丝","special":"金箔绸缎堆、签筒","note":"少女陷在金绸里抽签，暖金溢出画面","prompt_moss":"一名年轻女子坐于金箔绸缎堆中，双手执签筒抽签。她穿白色抹胸配蓝金刺绣外衫，垂眸浅笑。背景有一扇窗，窗外月色。主光为暖金光。","prompt_zmf":"横画幅中式幻想夜宴场景，画面中央一位黑发美人半躺在一张巨大的蚌壳形金榻里，手中拈着一枝结满红色果实的花枝正在抽签，榻沿垂着珍珠串成的纱幔，榻上散落着月饼与果盘，舷窗外是满月与河灯。\n\n美人的乌黑长发如瀑铺展在榻上，发间缀着白色的绒羽发饰与水色的玉簪，她的耳畔生着细小的鳞羽，肤色在珠光里泛着珍珠般的润泽；她身着乳白与水蓝相间的纱质抹胸长裙，裙上缀满细碎的珠饰；她半倚在榻心，一手拈着花枝般的签筒，另一手拢着垂落的长发，唇角含笑，神情慵懒愉悦。\n\n蚌壳形的金榻如一枚张开的巨贝：榻沿为乳白与淡金相间的珠光质地，榻沿的边缘垂着一串串珍珠纱幔，珠帘的弧线优雅；榻上散落着几只金黄的月饼、一枚切开露出馅料的果盘与两只斟满的酒杯。舷窗之外是夜色的水面：满月悬在水面的尽头，几盏河灯自远处漂来，灯影在水上连成光带。主光为舷窗外的月色与榻内珠光的暖白交织，照亮她的珠饰、纱裙与榻沿的珠光；榻内暗部呈蓝紫色。\n\n空气中弥漫着珠光的浮屑与桂花香般的光尘，前景抽签的花枝与散落的月饼清晰，珠帘与水面虚化；乳白珠光、水蓝纱裙与月色银白三色交织，整体呈厚涂油画质感的东方蚌榻抽签，华贵而梦幻。","zmf_name":"蚌壳金榻抽签","zmf_batch":21,"run":true,"image":"../images/scenes/BV126aw6vEG6/s04.webp","id":"ZS-005"},{"bv":"BV126aw6vEG6","scene":5,"series":"妖都浮生","title":"纱帆渡月","pal":"仙金蓝","who":"人物","comp":"大景小人，布幔占右半","motion":"白纱幔鼓荡/水波/雾气/船行","special":"巨型纱帆、月光水路","note":"白纱巨帆船渡月光水路，幔布如浪","prompt_moss":"一艘巨型白纱帆船在月光水面上航行，白纱幔鼓风占满画面右侧。远处有金色仙阁轮廓。主光为月光在水面形成的金色水路。","prompt_zmf":"横画幅中式幻想夜航场景，一艘挂着白纱巨帆的船正渡过月光的水路：帆幔为半透明的白纱，纱幔被月光照得如凝固的浪，帆船上的一位金饰女子扶着桅杆扬帆，满月悬在帆船的身后，水路的月光铺成银白的大道。\n\n纱帆的帆幔巨大：白纱的帆面如凝固的浪花层层叠叠，纱幔的透光在月光下泛着珍珠的润泽，帆幔的边缘被风撕出飘逸的纱丝；桅杆为深色的木构，桅杆上缠着红绳与铜铃，帆索的绳结清晰。扶桅的女子乌黑长发垂落及腰，长发被夜风扬起，她的发间簪着金色的步摇；她身着金色与乳白相间的纱裙，纱裙的层次在月光下泛光；她双手扶着桅杆扬帆的姿态舒展，侧脸仰望帆顶。\n\n月光的水路自帆船的船首延伸向远方：水路的银白如一条铺在水面的大道，水路的尽头与满月的倒影相接；满月巨大浑圆，月轮的环形山清晰，月色的银白晕染了半个夜空。帆船的甲板上摆着提灯与货物，船舷的红绳结点缀。主光为满月的银白月光，自画面上方照亮纱帆的透光、水路的银带与女子的纱裙；夜空的暗部呈深蓝黑，占约四成。\n\n空气中弥漫着水路的月光雾气与纱幔的飘絮，前景扶桅的女子与纱幔如浪的层次清晰，月路与满月上下呼应；银白纱帆、熔银月路与深蓝夜空对撞，整体呈厚涂油画质感的东方纱帆渡月，静谧而华美。","zmf_name":"纱帆渡月幔如浪","zmf_batch":36,"run":true,"image":"../images/scenes/BV126aw6vEG6/s05.webp","id":"ZS-006"},{"bv":"BV126aw6vEG6","scene":6,"series":"妖都浮生","title":"鲸背灯火","pal":"妖夜橙","who":"无人物","comp":"大景小人，巨兽横贯画面","motion":"兽毛起伏/楼阁灯串/云漂移","special":"巨鲸背驮亭台、双月","note":"巨兽驮着灯火楼阁浮过月夜，奇幻规模感","prompt_moss":"一头巨鲸背驮亭台楼阁与灯串浮于夜空，鲸身有蓝灰色纹路。远处有双月。主光为驮楼的灯火。","prompt_zmf":"横画幅中式幻想夜景大场景，仰视机位。画面中央偏上一头巨鲸自左向右横贯画面，鲸背驮着整片灯火楼阁，鲸身占画面宽度约七成，画面下缘是层叠的城市屋脊。\n\n巨鲸的皮肤为青灰蓝的厚重皮革质地，表面布满环状的藤壶斑块与细密的褶皱，鳃裂处的皮层层层叠开，胸鳍宽大如船帆、边缘磨损发白；鲸腹被下方的灯火映成暖橙，鲸脊的背线泛着冷蓝的湿光。\n\n鲸背之上搭着数十间中式楼阁：黑瓦飞檐、朱红立柱、层层挑出的木廊，廊檐下悬挂成串的暖橙灯笼，窗棂透出暖黄灯光，楼阁之间以木栈道相连；最高的一座三层塔楼插着红色幡旗，旗面被高空的风扯得平直。\n\n楼阁的廊道上站着极小的行人身影，抬头仰望；画面下缘的城市屋脊层层叠叠，脊上聚着成百上千的观灯人影；天空的右上方另有一轮较小的白月与主月并悬，月面边缘泛着清冷的光晕。主光为月夜的冷蓝月光，自右上方洒下，勾出鲸背楼阁的飞檐轮廓与鲸皮的边缘湿光；灯火是暖橙的次级光源，自下方与楼阁内部照亮鲸腹与廊柱，冷暖在鲸身的中线交汇。\n\n空气中漂浮着灯火的暖色烟尘与细小的火星，鲸背的灯笼在焦外化成圆光斑，远景屋脊没入雾中；青灰蓝、暖橙与正红三色对撞，整体呈厚涂油画质感的东方鲸背灯夜，恢弘而静谧。","zmf_name":"鲸背灯火","zmf_batch":42,"run":true,"image":"../images/scenes/BV126aw6vEG6/s06.webp","id":"ZS-007"},{"bv":"BV126aw6vEG6","scene":7,"series":"妖都浮生","title":"妖厨捧月饼","pal":"红金撞色","who":"人物/妖","comp":"居中特写，洞窟暖光","motion":"面团热气/火光晃/碎屑","special":"巨型月饼、洞窟厨房","note":"褐衣巨人捧起刚出炉的巨月饼","prompt_moss":"一名褐衣巨人双手捧起一个巨大的圆饼端详，洞窟内有暖光。饼面有纹路。主光为暖橙火光。","prompt_zmf":"横画幅中式神话厨房场景，画面中央一位独角牛面的巨人妖厨双手捧起一块刚出炉的巨型月饼，月饼的饼皮金黄酥脆，皮面上印着月宫桂树与玉兔的浮雕花纹，他低头端详，神情骄傲。\n\n巨人妖厨的头为褐色牛首，额头正中生着一支弯曲的独角，牛鼻穿着金环，络腮的短须根根分明；他敞着怀，露出结实的胸膛，身上披着宝蓝与朱红相间的织锦围裙与宽大的外袍，肩头搭着一条擦手的白巾，小臂的肌肉线条粗壮，皮肤上沾着面粉。他捧起的月饼直径比他的胸膛还宽，饼皮的酥皮层泛着出炉的油光，中央压出的圆形花纹里，桂树的枝叶与捣药的玉兔栩栩如生。\n\n他面前的案板上铺着白色的垫布，垫布上撒着面粉；背景为金碧辉煌的宴厨：成排的金鼎、玉盘与堆成小山的点心食盒层层排开，更远处的天窗外悬着一颗巨大的蓝白色星球与翻涌的云海，云隙间透出金光。主光为出炉月饼的暖金光与天窗的冷白天光交织，照亮饼皮的酥层纹理、妖厨的肌肉轮廓与金器的反光；厨房深处的暗部呈红褐色。\n\n空气中弥漫着面粉的白雾与饼香的光晕，前景月饼的浮雕花纹与捧饼的双手清晰，背景宴厨虚化；熔金、宝蓝与暖褐三色交织，整体呈厚涂油画质感的东方妖厨捧饼，憨厚而富足。","zmf_name":"妖厨捧月饼","zmf_batch":17,"run":true,"image":"../images/scenes/BV126aw6vEG6/s07.webp","id":"ZS-008"},{"bv":"BV126aw6vEG6","scene":8,"series":"妖都浮生","title":"玉兔捣月","pal":"红金撞色","who":"动物","comp":"环形围合，钵居中","motion":"捣杵起落/耳朵抖动/蒸汽","special":"拟人玉兔群、大石钵、巨月","note":"拟人玉兔们围着大钵赶制月饼，月下作坊","prompt_moss":"一群拟人玉兔围绕一个巨大的石钵捣药制饼，月下作坊。兔子有白色短毛，穿布衣。主光为月光。","prompt_zmf":"横画幅中式神话作坊场景，一轮巨大的满月悬在作坊的天窗外，月下一群拟人化的玉兔围着一只巨大的石钵赶制月饼馅料，一只玉兔高举着比自身还高的木杵正在捣料，月饼作坊里灯火暖融。\n\n捣料的玉兔体型比同类高出一头，通体白毛，穿着蓝棕相间的织锦小坎肩，它的长耳朵向后贴着，前爪高举一根粗大的木杵，杵头正落向石钵中央；石钵为青灰色，钵内的馅料呈乳白的泥状，被捣出细密的波纹。围着石钵的三只玉兔各司其职：左侧一只系着红色肚兜的小兔捧着竹筛筛粉，粉末在灯光下飘成白雾；右侧一位系着红袄的兔妈妈正把揉好的面团拍成饼，她长耳上挂着金色的耳坠；还有一只小兔蹲在钵沿偷吃馅料，腮帮子鼓鼓的。\n\n作坊的木梁上挂满成串的红灯笼与风干的果串，案板上摆着木质月饼模子与码好的月饼，模具里压出的花纹清晰；窗外的满月占据了天窗的大半个圆，月轮的环形山清晰可见，月光与作坊的灯光交融。主光为满月的银白月光与红灯笼的暖橙光交织，照亮玉兔们的白毛边缘、木杵的木纹与馅料的质感；作坊的暗部呈暖褐色。\n\n空气中弥漫着面粉的白雾与桂花香般的浮尘，前景捣料的动作与偷吃的小兔清晰，背景满月与灯串虚化；乳白、暖橙与织锦的蓝棕三色交织，整体呈厚涂油画质感的东方玉兔捣月，童话般温馨。","zmf_name":"玉兔捣月","zmf_batch":15,"run":true,"image":"../images/scenes/BV126aw6vEG6/s08.webp","id":"ZS-009"},{"bv":"BV126aw6vEG6","scene":9,"series":"妖都浮生","title":"老者碾香","pal":"红金撞色","who":"人物","comp":"手部+侧脸特写","motion":"手部动作/粉屑/灯焰","special":"石碾、暖橙灯","note":"白须老者灯下碾月饼馅，手部特写","prompt_moss":"一名白须老者伏案碾揉馅料，手部特写。旁边有石碾与暖橙灯。主光为烛光。","prompt_zmf":"横画幅中式幻想工艺场景，画面中央一位白须白发的老年妖匠端坐在堆满花灯的工作台前，双手正绑扎一盏鱼形花灯的竹骨，双手与花灯为画面焦点，占画面中央约一半。\n\n老者须发皆白，长发与长须披散，尖长的耳廓从发间露出，戴着骨质耳环；他面容清瘦，颧骨与皱纹在灯下清晰，神情专注。他身着藏青与暗金织锦的宽袍，肩头披着深色大氅，袖口挽起，指节分明的双手正把细竹篾弯成鱼骨的弧度，手指上缠着红线；腕上垂着一串木牌与玉坠。\n\n工作台与画面上方挂满完成的花灯：白兔灯、金鱼灯、莲花灯与成串的红色小灯笼，灯架的竹骨与糊着的暖白灯纸层次分明。背景为虚化的灯市与一轮巨大的满月，月色清辉洒在他的白发与灯纸上；更远处是暖橙色的城市灯海与金色塔楼剪影。主光为满月冷光与花灯暖橙自发光的混合，从他的侧前方照亮面部皱纹、须发的发丝与竹篾的细节；暗部呈蓝黑色，占约四成。\n\n空气中漂浮着竹屑与光尘，前景花灯的竹骨骨架清晰锐利，背景灯市与满月没入焦外；藏青、暖橙与月白三色交织，整体呈厚涂油画质感的东方上元灯匠场景，专注而温暖。","zmf_name":"灯下老匠扎灯","zmf_batch":5,"run":true,"image":"../images/scenes/BV126aw6vEG6/s09.webp","id":"ZS-010"},{"bv":"BV126aw6vEG6","scene":10,"series":"妖都浮生","title":"侍宴递盘","pal":"红金撞色","who":"人物/妖","comp":"三分侧身，洞窟景深","motion":"盘上点心颤/衣袖/灯影","special":"蓝绿锦衣、鎏金盘","note":"绿衣妖妇托盘侍立宴旁，含笑","prompt_moss":"一名蓝绿锦衣的妖妇双手托盘侍立，盘中有点心，含笑低眉。主光为暖光。","prompt_zmf":"横画幅中式幻想宴饮场景，画面的宴席台边，一位绿衣的妖妇托着朱红的食盘侍立，她含笑递盘；宴席的主位上，两位白发的老仙人相对而坐，一位执刀切着胭脂色的果糕，一位俯身观盘；他们身后的岩壁上覆着银色的鳞光，头顶的夜空挂着蓝色的巨月。\n\n绿衣妖妇的乌黑长发垂落，发间生着一对青绿色的弯角，耳尖细长；她的面容妖冶含笑，眼尾的红妆鲜明。她身着翠绿色织金的宽袖华服，衣料上织着金线的叶纹，腰间束着红色的锦带；她双手托着朱红的食盘，盘中盛着切好的胭脂果糕，果糕的红色在盘中的白瓷上鲜艳。\n\n主位的两位白发老仙：一位的白须垂落胸前，头戴金冠，手执小刀正切果糕，刀下的果糕切面细腻；另一位白发白须，俯身看向递来的食盘，他们的月白与灰蓝织锦的袍服宽大华贵。宴席的案上摆着金杯、玉盘与成串的红果；案边的灯球发光。背景的岩壁为银白色的鳞光质地，如龙鳞的岩面层层；岩壁之上，夜空为深蓝色，一轮巨大的蓝色圆月悬着，月边的星斗清晰。主光为宴席灯球的暖光与巨月的冷蓝光交织，照亮妖妇的绿衣、老仙的白须与案上的果糕；岩壁的鳞光冷艳，暗部呈蓝紫色。\n\n空气中弥漫着星河的光尘与宴席的暖雾，前景递盘的手与果糕的色彩清晰，岩壁与夜空虚化；翠绿织金、银白鳞光与蓝月星河对撞，整体呈厚涂油画质感的东方侍宴递盘，妖宴的华贵与星夜的静谧并存。","zmf_name":"侍宴递盘星河下","zmf_batch":40,"run":true,"image":"../images/scenes/BV126aw6vEG6/s10.webp","id":"ZS-011"},{"bv":"BV126aw6vEG6","scene":11,"series":"妖都浮生","title":"金甲调羹","pal":"红金撞色","who":"人物/妖","comp":"居中特写，金饰繁复","motion":"鼎内翻涌/蒸汽/金饰反光","special":"金铠胖妖将、巨鼎","note":"富丽金甲妖将掌勺大鼎，富态喜感","prompt_moss":"一名金铠胖妖将执长勺搅动大鼎，富态喜感。鼎内翻涌蒸汽。主光为暖光。","prompt_zmf":"横画幅中式幻想喜剧场景，画面中央一位身披华丽金甲的蟾蜍脸妖将伏在巨大的白玉汤鼎旁，手持一柄长柄金勺正往鼎中调制汤羹，半身入镜，神情憨态可掬。\n\n妖将为蟾蜍的面相：宽扁的嘴部紧抿，双眼圆凸而认真，皮肤呈暗金色并布满疙瘩纹理，头顶披着一袭织满红金团花纹样的锦缎披风，肩甲为鎏金的兽面吞头样式，颈间挂着数串蜜蜡色的圆珠佛链，珠子上垂下小小的金牌与玉坠。他的右手扶着长柄金勺，勺头探入鼎中，左手按在鼎沿。\n\n白玉汤鼎为圆形巨鼎，鼎内金黄色的汤面上漂着枸杞与葱花，汤面泛起细密的波纹与热气；鼎沿雕着云雷纹，鼎身映着暖光。背景为深蓝的夜空与一轮巨大的满月，月光从妖将身后上方洒下，勾亮他披风的织金纹样边缘与头顶的疙瘩；鼎边摆放着几只青瓷盖碗与红色的福字圆盒，碗盖上的金纹精致。主光为鼎中汤面的暖金上照光与月光的冷金逆光，冷暖交织；暗部呈蓝黑色。\n\n空气中漂浮着升腾的热气与细小的油光粒子，前景汤鼎边缘与金勺清晰，背景满月没入焦外形成柔和光晕；暗金、正红与月白三色交织，整体呈厚涂油画质感的东方幻想喜剧场景，富丽而诙谐。","zmf_name":"金甲掌勺","zmf_batch":4,"run":true,"image":"../images/scenes/BV126aw6vEG6/s11.webp","id":"ZS-012"},{"bv":"BV126aw6vEG6","scene":12,"series":"妖都浮生","title":"灯下喂羹","pal":"红金撞色","who":"人物","comp":"双人特写，暖光室内","motion":"热羹蒸汽/灯焰/发丝","special":"粗陶碗、油灯","note":"老妪灯下喂少年一碗热羹，烟火温情","prompt_moss":"一名老妪捧碗递到少年嘴边喂食，油灯照亮两张脸。主光为油灯暖光。","prompt_zmf":"横画幅中式温情场景，昏黄的洞窟灯光下，一位白须的猿形老翁伏在石案上缝补一件布衣，他的白毛手臂粗糙灵巧，洞窟的穹顶透下一束天光，照在他的身上；洞窟的石壁上挂满陶罐、布料与晾晒的衣物。\n\n猿翁的白须垂落胸前，须发的毛色灰白；他的面部如老猿，眉骨突出，眼窝深陷，神情专注温和；他身着红棕与灰绿相间的粗布短打，肩头披着兽皮做的披肩；他伏在石案上，左爪按着布料的褶皱，右爪捏着骨针引线，针脚细密；他的白毛手臂的毛色在灯下泛着灰金的光泽，指节粗大却灵巧。\n\n洞窟的穹顶裂开一道石缝，天光自石缝斜射而下，形成一束明亮的光柱，光柱正照在猿翁与他的针线上；石壁上挂着成串的陶罐、叠好的布衣与晾晒的葛布，布料的颜色土黄与靛蓝相间；案上摆着剪刀、针线笸箩与一碗浆糊。洞窟的深处堆着更多的陶罐与柴垛，暗处的轮廓朦胧。主光为穹顶天光柱的暖白光与洞内油灯的暖橙光交织，照亮猿翁的白毛、布料的褶皱与石壁的陈设；洞窟的暗部呈红褐色，占约四成。\n\n空气中弥漫着布屑与洞窟的尘雾，前景缝衣的手爪与针线清晰，洞窟的陈设层层虚化；灰白猿毛、暖褐布衣与天光光柱交织，整体呈厚涂油画质感的东方洞窟缝衣，苍老而温情。","zmf_name":"洞窟灯下猿翁缝衣","zmf_batch":31,"run":true,"image":"../images/scenes/BV126aw6vEG6/s12.webp","id":"ZS-013"},{"bv":"BV126aw6vEG6","scene":13,"series":"妖都浮生","title":"提灯入巷","pal":"妖夜橙","who":"人物","comp":"中心纵深一点透视","motion":"灯笼串轻晃/衣摆/薄雾","special":"灯笼长巷","note":"白衣人提灯走进挂满灯笼的妖市深巷","prompt_moss":"一名白衣人提灯独行步入挂满灯笼的深巷，巷子纵深透视。主光为灯笼串的自发光。","prompt_zmf":"横画幅中式幻想夜市场景，画面中央一位白衣人提着一盏暖黄的灯笼，正走进一条挂满灯笼的妖市深巷，满月悬在巷口上空，巷内的红灯笼层层叠叠延伸向深处，红叶铺满巷道。\n\n白衣人的乌黑长发束起，身着月白色的宽袖长袍，腰间束着深色的腰带；他右手提着一盏六角的暖黄纸灯，灯罩上的暖光映亮他的侧脸与衣缘，左手拢在袖中；他的步伐从容，背影半侧，正迈向巷子的深处。\n\n巷道两侧是层层高起的木质楼阁：楼阁的飞檐上挂满成串的红灯笼，灯笼自巷口一直延伸到巷子深处，形成一条红色的灯廊；楼阁的窗棂透出暖黄的室内光，二层的美人靠上趴着向下张望的小妖身影。巷道的地面铺着青石板，石板上落满赤红的枫叶，红叶被灯笼的光照得透亮；巷口的上方，一轮巨大的满月悬在两栋楼阁的檐角之间，月光的冷辉与灯笼的暖光在巷口交汇。巷内的深处，一位提篮的摊主正收着摊。主光为满巷灯笼的暖橙自发光，自两侧与上方包裹整个巷道，照亮白衣人的衣缘、枫叶的透光与楼阁的木纹；巷道的暗部呈红褐色。\n\n空气中弥漫着灯笼的光晕与飘落的红叶，前景提灯的手与满地红叶清晰，灯廊的深处层层虚化成光斑；暖橙、月白与赤红枫叶三色交织，整体呈厚涂油画质感的东方提灯入巷，幽静而温暖。","zmf_name":"提灯入深巷","zmf_batch":16,"run":true,"image":"../images/scenes/BV126aw6vEG6/s13.webp","id":"ZS-014"},{"bv":"BV126aw6vEG6","scene":14,"series":"妖都浮生","title":"一篙渡月","pal":"仙金蓝","who":"人物","comp":"大景小人居右，水面月路居中","motion":"水纹碎月/篙点涟漪/筏行","special":"巨月倒影、竹筏","note":"红衣人一篙撑过月光水面，剪影感","prompt_moss":"一名红衣人立于竹筏船首撑篙渡过月光水面，水面碎金倒影。主光为月光的冷白。","prompt_zmf":"横画幅中式夜渡场景，剪影感构图：画面中央一位红衣人背身立于竹筏之上，双手撑着一根长篙，正把筏子撑过洒满月光的水面，满月的倒影在水中碎成万点金鳞，他的剪影与月光同框。\n\n红衣人的乌黑长发束成高髻，发髻上插着一支素簪；他身着暗红色的宽袖长袍，袍摆被夜风与水汽掀向一侧，腰间的深色腰带垂着长长的系带；他双手握篙，篙杆斜插入水中，身体前倾撑篙的剪影在月光水面上轮廓分明，篙尖入水处溅起细小的水珠，水珠在月光下亮如碎钻。\n\n水面的月光自画面右上方洒下：满月悬在夜空，月轮的倒影落在水面，被涟漪揉碎成万点跳动的金鳞，金鳞自画面中央铺向右下的岸边；竹筏为多根竹竿捆扎，筏头挂着一盏小小的暖黄灯笼，灯笼的光在筏边的水面投下一小圈光晕。远处的岸线为暗色的芦苇与山影，几点渔火在远处明明灭灭。主光为满月的银白月光，自右上方逆射，勾勒红衣人的剪影轮廓、篙杆的线条与水面碎金的波光；夜空的暗部呈深蓝黑，占约五成。\n\n空气中安静，只有水汽的薄雾，前景撑篙的剪影与碎金月影清晰，远山与芦苇虚化；暗红剪影、银白月轮与金色碎鳞三色交织，整体呈厚涂油画质感的东方月夜独渡，静谧而诗意。","zmf_name":"一篙渡月","zmf_batch":18,"run":true,"image":"../images/scenes/BV126aw6vEG6/s14.webp","id":"ZS-015"},{"bv":"BV126aw6vEG6","scene":15,"series":"妖都浮生","title":"月下分饼","pal":"仙金蓝","who":"人物群","comp":"环形围坐，水岸横构图","motion":"月饼切开热气/水面波光/孩子们动作","special":"家宴、巨月水面","note":"一家人月下岸边分饼，环形围坐的生活感","prompt_moss":"一家人月下岸边围坐分食大月饼，环形构图。主光为月光与灯火。","prompt_zmf":"横画幅中式神话生活场景，画面为中秋月夜的湖岸石台，一家人环形围坐分食月饼：右侧一位红衣女子跪坐在石台边执刀切饼，左侧两位古装女子与一个提灯笼的孩童围拢，环形构图充满生活感。\n\n红衣女子乌黑长发垂落，发间系着红色发绳，身着朱红色织金襦裙，双手握着小刀切分一块圆形的月饼，案板上摆着切开的饼块与桂花糕；她侧脸温柔，垂目看着手中的刀。左侧一位蓝白衣衫的女子抱着琴倚坐，另一位米白衣裙的女子托腮望着孩童；孩童约莫五六岁，穿红肚兜外罩小袄，高举一盏兔子灯，灯内烛光透亮。石台中央摆着果盘：葡萄、石榴与成摞的月饼。\n\n背景是一轮巨大的暖黄色满月悬于天际，月光把湖面染成流动的银金色波纹，湖面倒映着对岸城市的万点灯火与廊桥轮廓，远处的楼阁挂满红灯笼连成光带。石台的石面纹理湿润，边缘垂着水草。主光为满月的暖银光自上方漫射，照亮人物的衣缘、石台与月饼的切面，灯笼与城市灯海补充暖橙的层次；暗部呈蓝青色，占约四成。\n\n空气中漂浮着湖面的水汽与细小光尘，前景人物围坐的姿态清晰，远景灯火城市没入焦外化作光斑；银金、朱红与蓝青三色交织，整体呈厚涂油画质感的中秋神话生活场景，团圆而温暖。","zmf_name":"月下分饼","zmf_batch":6,"run":true,"image":"../images/scenes/BV126aw6vEG6/s15.webp","id":"ZS-016"},{"bv":"BV126aw6vEG6","scene":16,"series":"妖都浮生","title":"长袖邀月","pal":"仙金蓝","who":"人物","comp":"人物中左，白袖弧占上半","motion":"长袖弧线/披帛/裙摆/人群灯影","special":"超长白水袖","note":"红衣舞者一记挥袖，白袖划出满月弧线","prompt_moss":"一名红衣舞者旋身挥出长袖弧线，白袖划过画面上半。人群围坐灯下观看。主光为暖光。","prompt_zmf":"横画幅中式幻想舞蹈场景，画面左侧一位红衣的舞者一记挥袖，她的白色长袖在空中划出一道巨大的满月弧线，弧线的末端恰好框住天上的圆月；藤蔓缠绕的楼阁与孩童们围绕在她的下方。\n\n舞者乌黑长发高束成马尾，发梢飞扬；她身着正红织金的舞衣与白色的长裙，腰间束着金色的腰封，裙摆旋开；她的一臂高举挥出，白色的长袖自袖口延展出数米，袖帛在空中划出一道完美的满月弧线，弧线的圆心恰与天上的满月重合，月轮的环形山在弧线的框中清晰；她的另一手拈着一只小灯笼，灯笼的暖光映亮她的侧脸。\n\n她身处的庭院为藤蔓缠绕的楼阁群：木质的高塔上挂满灯笼与鸟笼，藤蔓自塔顶垂落，塔楼的窗户透出暖光；庭院的下方，三个孩童仰头看着挥袖的舞者，一个提灯，一个抱着糖人，一个拍手叫好。背景的天空为深蓝的夜色，满月的月轮与长袖弧线同框，几朵薄云横过月面。主光为满月的银白光与灯笼的暖橙光交织，照亮舞者的红衣、白袖的弧线与孩童们的仰脸；夜空的暗部呈深蓝黑。\n\n空气中弥漫着夜风的花絮与光尘，前景挥袖的弧线与满月同框的构图清晰，楼阁与孩童层次分明；正红舞衣、白袖月弧与深蓝夜空对撞，整体呈厚涂油画质感的东方长袖邀月，灵动而诗意。","zmf_name":"长袖挥出满月","zmf_batch":25,"run":true,"image":"../images/scenes/BV126aw6vEG6/s16.webp","id":"ZS-017"},{"bv":"BV126aw6vEG6","scene":17,"series":"妖都浮生","title":"俯身捞月","pal":"仙金蓝","who":"人物/妖","comp":"人物右侧俯身，月居左上","motion":"倒影碎金/发丝垂落/水纹","special":"鹿角、码头、巨月","note":"鹿角妖女码头俯身，指尖搅碎一池月","prompt_moss":"一名鹿角妖女俯身向水面，指尖搅动月光倒影。码头与巨月为背景。主光为月光。","prompt_zmf":"横画幅中式幻想场景，画面中央一位生着深色鹿角的妖女俯身在码头的石台边，指尖探入水面搅碎了一池的月亮倒影，她身旁的石台上摆着供果与酒壶，身后是巨大的满月与古松。\n\n妖女头顶生着一对雄伟的深褐色鹿角，角上缠着金色的饰环与红绳；她的乌黑长发披落腰际，几缕发丝垂落颊边；她身着宝蓝与正红织锦相间的华服，衣料上绣着金色的团纹，肩头的披帛铺展在石台上；她俯身弯腰，一只手撑着石台，另一只手的指尖探入水中，涟漪自指尖荡开，池中的满月倒影被搅碎成万点金鳞，碎金的波光在她的指尖闪烁。\n\n石台上摆着一只青瓷酒壶、两只酒杯与一盘供果：苹果、柿子与点心堆成小盘；石台旁的老松树干虬曲，松枝自画面右上探入，松针在月光下透亮。背景的满月巨大而清晰，月轮的环形山分明，月光洒在水面与石台上；远处的云海上点缀着几座楼阁的剪影。主光为满月的银白月光，自上方照亮鹿角的金饰、水面的碎月与供果的色泽；石台的阴影呈青黑色。\n\n空气中弥漫着月光的水雾与松香般的光尘，前景搅碎月影的指尖与涟漪清晰，满月与古松保持整体的构图；银白月轮、宝蓝红金织锦与青黑松影对撞，整体呈厚涂油画质感的东方俯身捞月，静谧而梦幻。","zmf_name":"码头俯身捞月","zmf_batch":26,"run":true,"image":"../images/scenes/BV126aw6vEG6/s17.webp","id":"ZS-018"},{"bv":"BV126aw6vEG6","scene":18,"series":"妖都浮生","title":"倚栏啃果","pal":"妖夜橙","who":"人物","comp":"特写中景，人物左倾","motion":"咀嚼/脚尖晃/灯笼光斑","special":"竹筐灯笼、街栏","note":"少年妖倚栏啃果，翘脚晃悠，市井松弛感","prompt_moss":"一名少年妖倚栏翘腿啃果子，表情慵懒斜眼。灯笼串做前景框景。主光为暖光。","prompt_zmf":"横画幅中式幻想市井场景，画面中央一位尖耳的黑长发少年妖斜倚在木棚的栏杆上，一条腿翘着晃悠，手里捧着一只金黄的桃子大口啃咬，市井松弛感十足，头顶的木棚下挂着一盏老式马灯。\n\n少年妖乌黑的长发披落腰际，几缕发丝垂在颊侧，头顶竖着一对深色的兽耳；他身着敞怀的靛蓝色短打外衫，露出白色的中衣，腰间系着宽宽的布腰带，下身是棕色的宽腿裤，裤脚扎进绑腿里；他一条腿翘在栏杆上晃悠，另一条腿垂着，身体后仰倚着棚柱，手里的桃子已经啃了一大口，果肉的汁水顺着指缝流下，他浑然不觉，眼睛眯着，神情惬意。\n\n木棚为粗木搭建的凉棚，棚梁上挂着铜环、绳结与一盏老式的黑色马灯，灯罩的玻璃泛着暖光；棚下的木架上堆着绳索与货物。背景为晴朗的蓝天，一朵圆润的白云悬在远处，更远处是白雪覆盖的连绵峰顶与飘着云絮的山腰；棚外晒着白色的床单，随风轻扬。主光为明亮的白昼阳光，从画面右上方照亮他的发丝边缘、桃子的绒毛与棚木的纹理；阴影呈蓝灰色。\n\n空气中漂浮着果香般的浮尘与光斑，前景啃果的手部与松弛的姿态清晰，远山与云虚化；靛蓝、暖金与天蓝三色交织，整体呈厚涂油画质感的东方少年妖歇晌，松弛而鲜活。","zmf_name":"倚栏啃果","zmf_batch":14,"run":true,"image":"../images/scenes/BV126aw6vEG6/s18.webp","id":"ZS-019"},{"bv":"BV126aw6vEG6","scene":19,"series":"妖都浮生","title":"抱盒过市","pal":"妖夜橙","who":"人物/妖","comp":"人物居中行走，两侧摊位景深","motion":"衣摆/摊贩动作/灯笼流光","special":"多层食盒、夜市","note":"蓝袍妖抱食盒快步穿过灯笼集市","prompt_moss":"一名蓝袍妖抱食盒疾行穿过灯市街道。两侧摊贩与灯笼。主光为暖光。","prompt_zmf":"横画幅中式幻想夜市场景，画面中央一位背生巨大毛绒羽翼的蓝袍妖抱着一只朱红的食盒快步穿过挂满灯笼的集市，他的羽翼在夜色中半张开，集市两侧的商铺灯火通明，远处夜空一轮巨大的蓝色星球。\n\n妖人的乌黑长发束在脑后，尖长的耳朵从发间露出；他身着靛蓝色织锦的长袍与战裙式的下摆，腰间束着宽宽的革带，革带上挂着铜环、短刀与成串的铃铛，小臂缠着绑带；他的背后一对巨大的羽翼半张，翼面为蓬松的米白与棕褐相间的长绒羽，绒羽的边缘在灯下泛着暖光。他双手抱紧怀中的朱红色多层食盒，食盒的提梁上系着红绳，盒盖的缝隙里透出食物的热气；他快步行走的姿态带着急切。\n\n集市的街道两侧挂满成串的橙红灯笼与金色的饰件，摊位的棚架层层排开，摊上摆满货物，往来的人影与摊主的吆喝凝成热闹的氛围；街道的深处灯火连绵。远处的夜空呈深蓝色，一颗巨大的蓝白色星球悬在楼宇之上，星球的环带清晰。主光为集市的暖橙灯火与星球的冷蓝光交织，照亮他的羽翼边缘、蓝袍的织纹与食盒的朱红；暗部呈蓝黑色，占约四成。\n\n空气中弥漫着灯笼的光晕与浮尘，前景羽翼的绒毛与抱盒的双臂清晰，街市层层虚化；靛蓝织锦、朱红食盒与暖橙灯海对撞，背景蓝星点缀，整体呈厚涂油画质感的东方抱盒过市，急切而热闹。","zmf_name":"抱盒过市","zmf_batch":22,"run":true,"image":"../images/scenes/BV126aw6vEG6/s19.webp","id":"ZS-020"},{"bv":"BV126aw6vEG6","scene":20,"series":"妖都浮生","title":"群妖围宴","pal":"红金撞色","who":"人物群","comp":"俯视环形构图","motion":"多手取食/蒸汽/灯串","special":"大圆桌、穹顶窟","note":"俯瞰群妖围圆桌赴宴，热闹环形构图","prompt_moss":"多妖围大圆桌分食赴宴，俯视环形构图，穹顶窟内。主光为暖光。","prompt_zmf":"横画幅中式洞窟宴饮场景，略俯视的近景。画面中央是一张低矮的圆桌，桌面上摆满饼、果、碗碟与烛台，五个人影围着圆桌席地而坐，占画面高度的六成；洞窟的四壁呈乳白与浅褐，被烛火照得温润。\n\n围坐的五人中，左侧两位少女着红白与米白的衣袍，头上戴着狐耳状的发饰，其中一位伸手去取桌上的饼；右侧一位梳双髻的小童捧着碗，另一位赤红的狐耳少女捧着果子，脸上带笑；居中一人的背影对着画面，长发垂到腰际。\n\n圆桌上的食物摆得满：叠起的薄饼、切开的瓜果、盛着汤汁的粗陶碗、成串的浆果，还有几盏铜制的小烛台；桌沿搭着绣花的长巾，巾角垂到地面；洞窟的壁面雕出拱形的龛与层叠的台沿，龛里堆着陶罐、竹篮与织物。\n\n背景的右侧开着一扇拱形的大窗，窗外是深蓝的夜色与林木的剪影，冷光自窗外透入；洞窟的顶部悬着一盏灯笼形的吊灯，暖橙的光自上方洒下。主光为吊灯与烛台的暖橙火光，自画面上方与桌面照亮人物的面孔、衣料与食物；窗外的冷蓝光补在人物肩背的一侧，冷暖在同一画面里分界。\n\n空气中弥漫着食物的热气与烛火的黑烟，前景的饼与烛台清晰，窗外的林木虚化；暖橙、乳白与深蓝三色交织，整体呈厚涂油画质感的东方洞窟围宴，热闹而温暖。","zmf_name":"群妖围宴","zmf_batch":45,"run":true,"image":"../images/scenes/BV126aw6vEG6/s20.webp","id":"ZS-021"},{"bv":"BV126aw6vEG6","scene":21,"series":"妖都浮生","title":"举盏相碰","pal":"妖夜橙","who":"人物群","comp":"特写群像，灯笼串前景框","motion":"碰杯酒光/笑弯的眼/灯串","special":"琉璃盏、灯笼串","note":"妖市少女举盏相碰，暖橙特写","prompt_moss":"几名妖市少女举琉璃盏相碰，笑靥如花。灯笼串做前景框景。主光为暖光。","prompt_zmf":"横画幅中式幻想宴饮特写，画面中央一张摆满食物的圆桌旁，四位狐耳少女围着一位长角的绿衣女妖举盏相碰，四人笑得前仰后合，暖橙的灯光把整桌宴席照得热气腾腾。\n\n中央的女妖生着一对弯曲的深褐色犄角，卷曲的长发披落双肩，尖尖的耳朵从发间露出；她身着墨绿与金色织锦的宽袖华服，领口缀着一圈白色的绒毛边，她高举酒盏仰头大笑，眼睛弯成月牙。左侧的红衣少女与绿衣少女、右侧的米衣少女都生着毛茸茸的狐耳，发间编着彩绳，三人举盏相碰，杯中的酒液溅出细小的酒花，笑得眼睛眯起；她们的狐耳随着笑声抖动。\n\n圆桌上摆着一只盛满红色果实的白瓷大碗，周围散落着点心、酒壶与铜筷架；桌子中央悬着一盏发光的黄色宫灯，灯罩上绘着花纹，暖光自上而下笼罩全桌。背景为金碧辉煌的宴厅：巨大的金色龙形雕塑盘在背景墙上，雕塑的鳞片鎏金，四周挂着成串的红灯笼与圆形的钟盘装饰，红色的绸带自天花板垂落。主光为中央宫灯的暖黄光，自上而下照亮四人的面部、织锦的纹理与碗中的果实；背景的灯光层次丰富，暗部呈红褐色。\n\n空气中弥漫着酒香的光晕与浮尘，前景酒盏相碰的瞬间与四人的笑脸清晰，背景龙雕与灯饰大幅虚化；暖橙、墨绿与正红三色交织，整体呈厚涂油画质感的东方妖宴欢聚，热烈而温馨。","zmf_name":"举盏相碰","zmf_batch":12,"run":true,"image":"../images/scenes/BV126aw6vEG6/s21.webp","id":"ZS-022"},{"bv":"BV126aw6vEG6","scene":22,"series":"妖都浮生","title":"妖都月全景","pal":"妖夜橙","who":"无人物","comp":"大远景俯瞰收束","motion":"全城灯火闪烁/天灯升起/双月云移","special":"双月、天灯热气球、全城灯火","note":"收束镜头：妖都全景灯火与双月，天灯升空","prompt_moss":"俯瞰整座妖都全景：万千灯火如星河，双月悬空，天灯升空。主光为全城灯火的自发光。","prompt_zmf":"横画幅中式幻想夜景大场景，收束的全景镜头：妖都的全景在双月之下铺展——巨大的满月悬在山巅，天空中还有一轮较小的月，城中的灯火沿河道铺成金色的光河，天灯自城中升起，山体上的巨型树屋与浮空的岛屿点缀其间。\n\n主月巨大：月轮的环形山清晰，月色的银白晕染着周围的夜空；天空中偏右还有一轮较小的淡金色圆月，双月同天的奇观下，城池铺满画面的下半部：妖都的建筑依山傍水而建，朱红的楼阁与青瓦的民居沿河道层层铺开，河面倒映着两岸的灯火，灯河的金色自城中心向外蔓延；成百上千盏天灯自城中升起，天灯的暖光点点升向双月。\n\n山体上的巨型树屋为妖都的奇景：粗壮的树干中凿出亮着灯的屋舍，树冠上挂着灯笼串；浮空的岛屿自山腰的两侧探出，岛上的楼阁倒悬着垂下藤蔓与灯饰；近景的山崖上，一座雕花的树屋亮着窗，窗前的平台上摆着盆栽。河道的水面自画面中央蜿蜒穿过，水面的倒影把灯河揉成流动的金色。主光为满月的银白与灯河的暖金交织，照亮山体的树屋、浮岛的轮廓与河面的灯影；夜空的暗部呈深蓝紫，占约三成。\n\n空气中弥漫着天灯的暖光与薄雾，前景山崖的树屋与盆栽清晰，妖都全景层层铺展至双月之下；银白双月、金色灯河与朱红楼影三色交织，整体呈厚涂油画质感的东方妖都双月全景，收束而壮丽。","zmf_name":"妖都双月全景","zmf_batch":32,"run":true,"image":"../images/scenes/BV126aw6vEG6/s22.webp","id":"ZS-023"},{"bv":"BV16uYb6vECt","scene":0,"series":"妖都浮生","title":"龙舟迎客","pal":"红金撞色","who":"人物/妖","comp":"舟居左，街市右","motion":"龙须/水波/旗幡","special":"龙首龙舟","note":"龙首舟破水入港，舟头妖含笑迎客","prompt_moss":"一艘龙首龙舟破水入港，舟头妖女含笑拱手迎客。龙首有须，舟身雕花。主光为暖光。","prompt_zmf":"横画幅中式幻想水岸夜色，平视中景。画面中央一艘龙首巨舟自左向右靠岸，龙首高昂占画面左侧三分之一；舟上一位女子端坐，岸边石阶上另有一位提灯者相迎。\n\n龙首的鳞甲为青绿与金，须髯卷曲，眼窝里嵌着暖光的灯；舟身覆木板与篷布，舱内堆着箱笼、货担与卷起的毡毯，船沿挂着成串的小灯。\n\n女子身着米白与金相间的织锦长袍，外披一层薄纱，长发高挽插着金步摇，膝上搭着绣花巾；岸上的迎接者着青灰短衣，手提一盏灯笼，微微躬身。\n\n背景为层叠的木构民居与石阶码头，黑瓦檐下挂着成串红灯笼，檐角起翘；水面晃着灯影，远处山影没入夜雾，岸边的老树枝干探入画面。主光为灯笼的暖橙自舟侧照来，点亮龙首鳞片、女子衣缘与水面波纹；夜色暗部呈深蓝青，明暗对比柔和。\n\n空气中弥漫河面的水汽与灯尘，前景龙首与舱内货担清晰，远景码头与山影虚化；青绿、暖橙与米白交织，整体呈厚涂油画质感的东方龙舟迎客，温润而带奇趣。","zmf_name":"龙舟迎客","zmf_batch":47,"run":true,"image":"../images/scenes/BV16uYb6vECt/s00.webp","id":"ZS-024"},{"bv":"BV16uYb6vECt","scene":1,"series":"妖都浮生","title":"水城全景","pal":"红金撞色","who":"无人物","comp":"俯瞰水城横铺","motion":"桥上人/幡/水雾","special":"红桥水城","note":"俯瞰红桥水城，烟火气扑面","prompt_moss":"俯瞰红桥水城全景，桥上行人往来，两侧建筑红墙青瓦。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，俯瞰视角的水城全景：一位头戴巨大金凤冠的妖后立于水城中央的高台之上，她的身后，一座巨大的青蓝色凤翼雕塑展开，水城的四面环水，红桥与灯火连绵，满城的烟火气扑面。\n\n妖后的金凤冠巨大华丽：冠身的金饰层层叠叠，冠后垂着金色的流苏与红色的绢花；她的面容冷艳，朱唇微启，金色的眼瞳俯瞰全城。她身着红金相间的织锦华服，广袖的织锦上金线绣满凤凰的纹样；她立于高台之上，高台的基座为白玉的雕花，基座的边缘垂着红色的绸带。\n\n她身后的凤翼雕塑为青蓝色的巨大双翼，翼面的羽毛纹样如锦屏展开，翼下是水城的街道：朱红的骑楼与青瓦的民居沿水道层层铺开，水道上泊着游船与花舫，红桥横跨水道连接两岸，桥上与街边的灯笼成串点亮，灯火的暖橙与水面的倒影连成一片；街道上人妖往来，摊位的烟火气升腾。主光为黄昏的暖金阳光与满城灯火交织，照亮凤冠的金饰、凤翼的青蓝与水城的朱红；水面的倒影把色彩揉碎成流动的画。\n\n空气中弥漫着水汽与市井的烟火，前景妖后的凤冠与高台清晰，水城的全景层层铺展至四缘；金凤冠、青蓝凤翼与朱红水城对撞，整体呈厚涂油画质感的东方红桥水城，华贵而喧腾。","zmf_name":"红桥水城凤冠立","zmf_batch":36,"run":true,"image":"../images/scenes/BV16uYb6vECt/s01.webp","id":"ZS-025"},{"bv":"BV16uYb6vECt","scene":2,"series":"妖都浮生","title":"猫大亨坐镇","pal":"红金撞色","who":"动物","comp":"居中特写，柜上摆件","motion":"尾巴甩/胡须/算珠响","special":"拟人猫大亨","note":"猫妖掌柜倚着柜台，一脸生意经","prompt_moss":"一名锦衣猫妖倚坐柜台眯眼傲慢，柜上有摆件。主光为暖光。","prompt_zmf":"横画幅中式幻想宴市场景，画面中央一位体型硕大的虎斑猫妖掌柜倚着收银的柜台，双眼眯起，一脸生意经的悠然神情；柜台上散落着金币、酒杯与算盘，身后的宴市灯火通明。\n\n猫妖掌柜的体型如人般大，棕灰虎斑纹的长毛蓬松油亮，胸口与爪部的毛色乳白；它的双眼眯成两道缝，眼缝里透着精明，粉色的鼻头与腮边的长须根根分明，嘴角挂着一丝若有若无的笑。它身着赭红色织锦的宽大掌柜袍，衣缘滚着金边，肩头搭着一条深色的锦缎披巾，一只前爪搭在柜台上拨弄金币，另一只爪子撑着下巴。\n\n柜台上散落着成堆的金币与碎银，一只高脚杯里盛着暗红的酒液，一把黑檀的算盘横在金币旁，算珠上还沾着金粉；柜台后的博古架上摆满瓷瓶与礼盒。背景的宴市灯火通明：红色的灯笼、金色的饰件与喧闹的宾客身影层层铺开，暖光融融。主光为宴市的暖橙灯火，自上方漫射，照亮猫妖的毛绒质感、金币的金光与织锦的纹样；背景的暗部呈红褐色。\n\n空气中弥漫着酒香的光晕与金粉，前景猫妖眯眼的悠然神情与柜台的陈设清晰，背景宴市大幅虚化；赭红织锦、金光金币与虎斑灰毛三色交织，整体呈厚涂油画质感的东方猫掌柜坐镇，富态而诙谐。","zmf_name":"猫大亨坐镇","zmf_batch":19,"run":true,"image":"../images/scenes/BV16uYb6vECt/s02.webp","id":"ZS-026"},{"bv":"BV16uYb6vECt","scene":3,"series":"妖都浮生","title":"狸猫合掌","pal":"红金撞色","who":"动物","comp":"居中特写，水面倒影","motion":"水花/作揖摆动","special":"拟人狸猫","note":"狸猫妖水里合掌讨彩头，憨态可掬","prompt_moss":"一只狸猫妖立水中合掌作揖讨彩头，水面有倒影。主光为暖光。","prompt_zmf":"横画幅中式幻想场景，画面右侧一只直立行走的狸猫妖站在齐胸深的温泉水中，双爪在胸前合掌作揖讨彩头，半身入镜，神情憨态可掬；左侧远处的水中还有两只更小的狸猫妖探头嬉戏。\n\n大狸猫妖体型圆胖，全身覆盖棕灰相间的长绒毛，胸口与肚皮的毛色乳白湿润，面颊圆鼓，双眼弯起带着讨好的笑意，小小的圆耳立在头顶滴水；它合掌的双爪间捧着一枚金色的铜钱，爪上的绒毛湿成一缕一缕，颈间挂着一串被水浸湿的铜钱红绳，水珠顺着红绳滴落。\n\n温泉水面呈温润的青碧色，水面氤氲着白色的雾气，倒映着洞顶的钟乳石。背景为一座巨大的溶洞温泉宫殿：青灰与乳白相间的钟乳石自洞顶垂落，石笋丛生，洞壁上凿出层层叠叠的木质楼阁与灯笼点缀的回廊，暖黄的灯火自廊下涌出，远处还有悬空的木桥与台阶。主光为洞内灯火与天光自洞口漫射的混合光，照亮狸猫的绒毛边缘与水面雾气，绒毛边缘泛着金色轮廓光；洞顶深处呈青黑色，占约四成。\n\n空气中弥漫着浓厚的白色水雾与漂浮的水珠，前景水面波纹与狸猫合掌的爪子清晰，远处楼阁没入焦外；青碧、乳白与暖金三色交织，整体呈厚涂油画质感的东方溶洞温泉幻想，温馨而灵气十足。","zmf_name":"温泉狸猫讨彩","zmf_batch":4,"run":true,"image":"../images/scenes/BV16uYb6vECt/s03.webp","id":"ZS-027"},{"bv":"BV16uYb6vECt","scene":4,"series":"妖都浮生","title":"白蛇游街","pal":"红金撞色","who":"动物","comp":"蛇身斜贯街面","motion":"蛇行/人避让/鳞光","special":"白蛇游市","note":"白蛇当街游过，市井习以为常","prompt_moss":"一条白蛇自街心游过，行人避让，鳞片反光。主光为暖光。","prompt_zmf":"横画幅中式幻想市井场景，一条通体雪白的巨蛇昂着蛇首，当街从市集中央的水道里游过，蛇身划开水面，两岸摆摊的市井对它习以为常，蒸笼的热汽与灯火交织。\n\n白蛇的蛇身修长，通体覆盖乳白色的鳞甲，鳞甲泛着珍珠的光泽，蛇首扁圆，黑色的圆眼睛灵动，吻部的须须纤长；它自水道中昂起前半身，蛇身的后半段还在水里游动，划开的水面波纹一圈圈荡向两岸；蛇游过的水道为石砌的浅渠，渠水清亮。\n\n两岸的市集毫不惊慌：左侧的摊位上摆着成堆的青菜、萝卜与装满鲜鱼的木盆，摊主照常打理货物；右侧的蒸笼层层叠叠冒着白汽，白汽与远处飘来的油烟在街心交汇。街边的建筑为青灰瓦顶的中式楼宇，挂满青绿色的灯笼与幌子招牌，招牌上的金字清晰；远处的街市上空悬着彩球与幡旗，楼阁层层深入。主光为清晨的暖调天光，从画面右上方照亮白蛇的鳞甲、蒸笼的白汽与摊位的果蔬色彩；街市的阴影呈暖褐色。\n\n空气中弥漫着蒸汽与市井的烟火气，前景白蛇的昂首游姿与两岸的果蔬摊清晰，街市纵深虚化；乳白蛇身、青绿灯笼与果蔬的彩色三色交织，整体呈厚涂油画质感的东方白蛇游街，市井的鲜活与奇幻并存。","zmf_name":"白蛇游街","zmf_batch":23,"run":true,"image":"../images/scenes/BV16uYb6vECt/s04.webp","id":"ZS-028"},{"bv":"BV16uYb6vECt","scene":5,"series":"妖都浮生","title":"鹰妖展屏","pal":"红金撞色","who":"人物/妖","comp":"对称双翼构图","motion":"羽层翻动/雾/烟柱","special":"巨翼如孔雀开屏","note":"鹰妖城门展翼，羽纹如锦屏","prompt_moss":"一名鹰妖于城门展双翼如锦屏，羽纹清晰，雾气弥漫。主光为暖光。","prompt_zmf":"横画幅中式幻想场景，对称构图：画面中央一位白裙女子背身立于圆形石台上，她背后一对巨大的鹰翼完全展开，翼面如锦屏般铺满画面上半部，翼展占据画面宽度约九成，正前方一道细细的瀑布自高处垂落。\n\n巨翼的羽面如展开的画屏：羽毛自翼根向外分层铺排，翼根处为乳白色的细软绒羽，中段过渡为青绿色与朱红色相间的花纹羽带，羽纹如织锦般排列规整，翼缘的长羽泛着淡金的光泽，每一根羽枝都清晰可辨。白裙女子乌黑长发垂落腰际，身着月白色的广袖长裙，裙摆铺展在石台上，她双臂自然垂落，面朝瀑布与前方的水潭，身影在巨翼的尺度下显得纤细。\n\n石台为灰白色的圆形玉石，台缘的水面倒映着巨翼的色彩，涟漪微起；台后是一道自洞顶垂落的银白瀑布，水雾弥漫。背景为环形的岩窟城郭：青灰色的岩壁上凿着层层的楼阁与栈道，壁间的灯火点点，岩顶的天光自上方洒落。主光为洞顶的漫射天光与瀑布的冷白水光，照亮翼面的花纹层次与水雾；翼的背面与岩壁阴影呈青灰色，暗部占约四成。\n\n空气中弥漫着水雾与光尘，前景倒影与石台纹理清晰，翼面 层层铺展几乎占据全部背景；青绿、朱红与乳白三色如锦屏般铺陈，整体呈厚涂油画质感的东方鹰妖展翼奇观，对称而华美。","zmf_name":"鹰妖展翼为屏","zmf_batch":10,"run":true,"image":"../images/scenes/BV16uYb6vECt/s05.webp","id":"ZS-029"},{"bv":"BV16uYb6vECt","scene":6,"series":"妖都浮生","title":"老者宴客","pal":"红金撞色","who":"人物/妖","comp":"人物左，街市纵深","motion":"袖/摊贩/雾气","special":"红果满案","note":"狐面老者案前摆满红果待客","prompt_moss":"一名狐面老者坐案前候客，案上摆满红果，身后街市纵深。主光为暖光。","prompt_zmf":"横画幅中式幻想市井场景，画面中央一位狐面的老妖翁坐在食摊的案前，双手捧起一只盛满红果的海碗待客，他的蓝褐色织锦袍与蓬松的灰白须毛在晨光里鲜亮；案前摆满成盘的红果与食器，背景为热闹的牌楼街市。\n\n狐翁的头部为灰褐色的狐面：尖长的口鼻、竖立的狐耳与蓬松的灰白须毛，它的独眼炯炯有神，神情憨厚好客；他身着蓝褐色织锦的宽袍，袍面上织着云纹与补子，肩头搭着一条米白的汗巾；他的双手捧起一只巨大的青花海碗，碗中盛满鲜红的果子，红果堆得冒尖。\n\n案前的食摊摆满食器：成盘的红果、蒸笼、酒壶与青瓷的碗碟；案角的布巾上还晾着洗净的碗。背景的街市晨光温暖：一座巨大的朱红牌楼横跨街心，牌楼的彩绘与金饰鲜艳；街道两侧的摊棚连绵，幌子与灯笼成串，蒸笼的白汽与远处的行人交织；天空湛蓝。主光为清晨的暖金阳光，从画面右上方照亮狐翁的须毛、红果的饱和色与牌楼的彩绘；街市的阴影呈暖褐色。\n\n空气中弥漫着蒸笼的白汽与市井的烟火，前景狐翁捧碗待客的姿态与案上的红果清晰，牌楼街市虚化；蓝褐织锦、朱红牌楼与鲜红果盘三色交织，整体呈厚涂油画质感的东方狐翁宴客，憨厚而热闹。","zmf_name":"狐翁案前宴客","zmf_batch":35,"run":true,"image":"../images/scenes/BV16uYb6vECt/s06.webp","id":"ZS-030"},{"bv":"BV16uYb6vECt","scene":7,"series":"妖都浮生","title":"雪犀过市","pal":"红金撞色","who":"动物","comp":"巨兽横贯","motion":"毛发起伏/货物晃/街让道","special":"长毛巨犀驮货","note":"白毛巨犀驮着山一样的货过市","prompt_moss":"一头白毛巨犀驮着货物行街，街上行人让道。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，一条街道上，一只体型巨大的白色甲壳犀牛状妖兽驮着山一样高的货物缓缓走过，街道两侧的建筑与行人相对渺小，画面左前景还有一只巨大的白色螺壳状妖兽与一只蓝色的鱼形妖兽拉着货箱迎面而来。\n\n雪犀的躯体覆盖着乳白色与青灰相间的甲壳，甲壳呈板块状层层拼接，缝隙间透出粉白的光；它的头部生着一支粗壮的白角，眼睛温和低垂，四肢如殿柱般粗壮，蹄足踏在街道上；它背上的货物堆得如山峦：成捆的锦缎、木箱、酒坛与成串的灯笼层层叠起，货物顶端插着红色的旗幡，幡旗随风飘展。左前景的白色螺壳妖兽壳顶盘旋成尖，壳口探出温顺的头颈；蓝色鱼形妖兽的鳞片泛着青蓝的光，鱼尾上翘。\n\n街道两侧是层叠的白金色城楼：鎏金的飞檐、白玉的栏杆与红色的幡旗层层铺展，楼阁之间的高处还悬挂着巨大的门楼与成排的灯饰；街道上的行人小如尘点，有的驻足让路，有的挑担而行。远景的天空湛蓝，大朵白云悬在城楼上空。主光为明亮的白昼暖阳，从画面左上方照亮甲壳的受光面、货物顶端的旗幡与楼阁的金顶；楼阁的阴影呈暖褐色。\n\n空气中弥漫着行进扬起的尘土与浮絮，前景螺壳与鱼妖的甲壳细节清晰，街道纵深与楼阁层层虚化；乳白、鎏金与正红幡旗三色交织，整体呈厚涂油画质感的东方巨兽过市奇观，恢弘而热闹。","zmf_name":"雪犀驮山过市","zmf_batch":14,"run":true,"image":"../images/scenes/BV16uYb6vECt/s07.webp","id":"ZS-031"},{"bv":"BV16uYb6vECt","scene":8,"series":"妖都浮生","title":"蟹妖掰腕","pal":"红金撞色","who":"动物","comp":"环形围观","motion":"钳臂角力/蒸汽/围观喝彩","special":"蟹妖角力","note":"蟹妖围着大缸掰钳腕，围观叫好","prompt_moss":"几只蟹妖围大缸掰腕角力，围观妖群喝彩。主光为暖光。","prompt_zmf":"横画幅中式幻想喜剧场景，雪地神殿前的空地上，四五只毛绒绒的鼬鼠形小妖围着一只巨大的铜缸掰腕角力，中央一只立于缸沿的小妖高举示意，周围同伴探头围观叫好。\n\n角力的两只小妖隔着铜缸对坐：左边的棕色绒毛小妖龇牙咧嘴使劲，右边的灰白色绒毛小妖瞪圆了眼，两只小爪在缸沿上死死扣住彼此的爪子，绒毛都炸了起来；缸沿两侧还各有一只小妖探出头，一只捂着嘴偷笑，一只挥舞短棒起哄。铜缸的缸身为暗红色，缸腹绘着金色的云纹，缸口冒出滚滚的白色蒸汽，蒸汽在冷空气中升腾。\n\n它们脚下的雪地里撒落着红色的供品布匹与果盘，缸下燃着篝火，火光映红缸腹。背景为雪中的神殿遗址：巨大的石柱与鎏金的兽首雕像覆着薄雪，殿门的朱红大门半开，暖光自门内透出；两侧的石阶与石兽被积雪覆盖。主光为清冷的雪日天光自上方漫射，照亮绒毛的受光边缘、蒸汽与雪面的反光，篝火的暖橙从下方补亮绒毛的暗面；阴影呈蓝灰色。\n\n空气中弥漫着升腾的蒸汽与飘雪，前景小妖炸起的绒毛与缸沿的爪子清晰，背景神殿没入焦外；乳白、暗红与暖金三色交织，整体呈厚涂油画质感的东方雪地小妖喜剧场景，憨态热闹。","zmf_name":"雪殿掰腕","zmf_batch":6,"run":true,"image":"../images/scenes/BV16uYb6vECt/s08.webp","id":"ZS-032"},{"bv":"BV16uYb6vECt","scene":9,"series":"妖都浮生","title":"红绸灯川","pal":"红金撞色","who":"无人物","comp":"红绸纵贯满谷","motion":"红绸浪/灯串/人潮","special":"万米红绸、灯川","note":"红绸如河铺满山谷，灯串随行","prompt_moss":"万米红绸自山谷顶部垂落铺满山谷，灯串随行。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，一片山谷被一条红绸与灯串铺成的川流覆盖：红色的绸带如河自谷顶倾泻而下，在谷底铺展成绸海，灯串沿着绸河的边缘蜿蜒随行，一支白衣提灯的队伍沿绸川行进，绸川的中央站着一位白衣华服的身影。\n\n红绸的川流自画面右上的崖顶垂落：绸带的正红在暮色里如火如霞，绸面的缎光顺着绸带的褶皱流动，绸川在谷底铺展成一片红色的海，绸浪起伏的弧线如凝固的波涛；灯串沿着绸河的走向蜿蜒：成串的白灯笼与金色的灯球沿绸带排开，灯串的暖光点连成一条金色的光线，与红绸的河并行。\n\n提灯的队伍沿绸川的边缘行进：数十位白衣的执灯人排成松散的队列，每人手中的白灯笼暖暖地亮着，队伍的首端，一位白衣华服的身影立于绸川中央的高处，她的广袖与长绸向两侧铺展，如川流的源头。绸川的两岸是青黑色的山体，山脚的白雪山坡与枯树点缀；远处的山脊上，一头巨兽的剪影立在崖顶。主光为灯串的暖橙光与绸面的红光交织，照亮队伍的白衣、绸带的缎面与山坡的雪色；山谷的暗部呈青黑色，占约四成。\n\n空气中弥漫着灯晕与飘落的灯絮，前景提灯的队伍与绸浪的褶皱清晰，绸川保持自上而下的流动动势；正红绸川、暖橙灯串与青黑山谷对撞，整体呈厚涂油画质感的东方红绸灯川，壮丽而神秘。","zmf_name":"红绸灯川漫山谷","zmf_batch":38,"run":true,"image":"../images/scenes/BV16uYb6vECt/s09.webp","id":"ZS-033"},{"bv":"BV16uYb6vECt","scene":10,"series":"妖都浮生","title":"蛛网缠楼","pal":"仙金蓝","who":"动物","comp":"蛛网纵贯画面","motion":"蛛丝拉/网颤/雾","special":"巨型蛛网","note":"白蛛妖在楼阁间织出天罗网","prompt_moss":"一只白蛛妖盘踞楼阁间结出巨大的网，丝线贯穿画面。主光为冷光。","prompt_zmf":"横画幅中式幻想场景，画面中央一位白色蛛妖悬在楼阁群之间的半空，八条细长的蛛肢自她背后展开，正在织出一面巨大的天罗网，网丝缠绕着周围漂浮的楼阁与书卷，雪花在网间飞舞。\n\n蛛妖的上半身为一位乌黑长发的女子，神情专注，唇色朱红；她的腰部以下连接着乳白色的蛛腹，八条白色的蛛肢细长而优雅，肢尖各自牵着一根银白色的丝线，丝线在她周围织出几何般精确的巨网，网丝上挂着细小的水珠与雪片，在光下闪着银光。她的长发与白色的纱裙向下垂落，与丝线融为一体。\n\n被网缠绕的楼阁为木质的中式高阁，朱红的立柱与黑瓦的飞檐自画面四周伸入，楼阁之间漂浮着成卷的书册、书匣与打开的卷轴，书页在半空缓缓翻动；几座楼阁的窗口透出暖黄的灯光。背景为深邃的蓝黑色夜空，雪花与书页的碎片一同飘落。主光为楼阁灯火的暖橙自发光与雪夜的青蓝天光，从两侧照亮蛛妖的白色肢体的轮廓、丝线的高光与书页的翻飞；暗部呈深蓝黑，占约四成。\n\n空气中弥漫着雪花与书页碎屑，前景丝线的银白高光与蛛妖的肢尖清晰，远处楼阁没入焦外；银白、暖橙与青蓝三色交织，整体呈厚涂油画质感的东方蛛妖织网奇观，静谧而奇幻。","zmf_name":"蛛妖织天罗","zmf_batch":7,"run":true,"image":"../images/scenes/BV16uYb6vECt/s10.webp","id":"ZS-034"},{"bv":"BV16uYb6vECt","scene":11,"series":"妖都浮生","title":"狐女理尾","pal":"红金撞色","who":"人物/妖","comp":"侧身中景","motion":"尾毛梳顺/灯影","special":"雪白大尾","note":"狐女灯下理尾，白尾如瀑","prompt_moss":"一名狐女坐案前梳理雪白大尾，灯影暖照。主光为暖光。","prompt_zmf":"横画幅中式幻想夜市场景，画面中央的红衣狐女坐在长案的另一侧，灯下专心地理着自己蓬松的白色狐尾，白尾如瀑布般垂地铺开；她对面一位羊首的老者执卷问诊，一只白狐幼崽趴在她脚边。\n\n狐女乌黑长发披落，头顶竖着一对赤红的狐耳，耳尖的绒毛透光；她的眉眼精致，眼尾上挑，正低头理尾，神情专注中带着慵懒。她身着正红织金的广袖襦裙，领口的立缘滚着白狐毛，衣身上金线织出缠枝纹样；她的白色狐尾自身后垂落，尾毛蓬松如瀑，铺满半个案面垂到地面，尾尖在灯下泛着银白的光。\n\n她对面的羊首老者为一只人立的白色山羊：弯曲的羊角、垂着的羊须，身着茶色的织锦长袍，他一手捻须一手执着一卷竹简，正细细问询。长案上摆着一只金鱼缸、几卷医书与香炉，香炉的青烟袅袅。狐女的脚边，一只白色的小狐幼崽趴在地毯上，尾巴卷着身子打盹。背景的夜市挂满成串的灯笼与金字招牌，两侧的药柜与幌子层层排开，人影往来。主光为灯笼的暖橙光，自上方照亮狐女的侧脸、白尾的蓬松质感与老者的羊须；背景的暗部呈红褐色。\n\n空气中弥漫着灯笼的光晕与香炉的烟，前景白尾的绒毛层次与人妖对坐的构图清晰，背景夜市大幅虚化；正红织金、雪白狐尾与暖橙灯海三色交织，整体呈厚涂油画质感的东方狐女理尾，温馨而华美。","zmf_name":"灯下狐女理尾","zmf_batch":21,"run":true,"image":"../images/scenes/BV16uYb6vECt/s11.webp","id":"ZS-035"},{"bv":"BV16uYb6vECt","scene":12,"series":"妖都浮生","title":"水畔喂鹤","pal":"红金撞色","who":"人物","comp":"人物左，鹤右","motion":"鹤颈弯/水纹/发丝","special":"白鹤、青鳞水","note":"青鳞水面喂鹤，鱼影游过","prompt_moss":"一名仙娥跪坐水畔喂白鹤，青鳞水面有鱼影。主光为暖光。","prompt_zmf":"横画幅中式幻想生活场景，画面中央一位黑发白裙的女子蹲在水边，手拿竹签喂一只直立的白毛水獭，水獭捧着小钵仰头接食，人獭相对而乐，背景是水畔的红白集市与腾腾蒸汽。\n\n女子乌黑长发披落腰际，发间别着白色的花饰；她身着乳白色的广袖纱裙，裙摆挽起浸在浅水中，肩头的纱料半透明；她蹲在青鳞状的水面上，身子前倾，把竹签上的食物递向水獭，笑意盈盈。白毛水獭直立在水里，圆滚滚的身体覆着湿漉漉的白毛，两只前爪捧着一只青瓷小钵，仰着头张开嘴接食，胡须上挂着水珠。\n\n水面呈青蓝色，鳞片状的波纹一圈圈荡开，倒映着两岸的建筑；右侧的岸上是一排红白色的市集摊位：朱红的棚架、白底红字的幌子与成串的灯笼，摊位上的蒸笼冒着腾腾的白汽，汽雾在水面上漫开。背景的楼阁挂着红白相间的幡旗与彩球，街道上游人往来。主光为明亮的白昼暖阳，从画面右上方照亮人物的纱裙、獭毛的边缘与蒸汽的白色；阴影呈暖褐色。\n\n空气中弥漫着蒸汽与水汽，前景人獭互动的手部与钵清晰，背景市集大幅虚化；乳白、青蓝与朱红三色交织，整体呈厚涂油画质感的东方水畔喂獭日常，温馨而灵动。","zmf_name":"水畔喂獭","zmf_batch":12,"run":true,"image":"../images/scenes/BV16uYb6vECt/s12.webp","id":"ZS-036"},{"bv":"BV16uYb6vECt","scene":13,"series":"妖都浮生","title":"黑蟒缠柱","pal":"红金撞色","who":"动物","comp":"蟒盘居右，人左","motion":"蟒鳞滑/火盆焰/烟","special":"黑蟒座驾","note":"黑蟒为座，妖女倚蟒冷眼看戏","prompt_moss":"一条黑蟒盘柱，一名妖女倚蟒身冷眼看戏。主光为火盆光。","prompt_zmf":"横画幅中式幻想人像场景，画面中央一位黑发的妖女以一条巨大的黑绿鳞蟒为座，斜倚在盘绕的蟒身上，她冷眼望着画外的方向，蟒首昂起吐着信子，背景为夜市灯火与水面的倒影。\n\n妖女的乌黑长发垂落及腰，发间簪着金色的发饰与深色的羽饰；她的面容冷艳，朱红的唇色鲜明，金色的眼瞳斜睨画外，眼神如看戏般漠然。她身着黑绿织锦的华服，衣料上织着鳞片状的暗纹，领口与袖口的金线繁复，她的手指纤长，涂着深色的甲油，一只手搭在蟒身上，另一只手支颐；她的肩头披着深色的羽披肩。\n\n黑蟒的躯体粗壮，鳞甲为黑绿与青铜色相间，鳞片的纹理如铠甲层层分明，蟒身盘绕成三圈，妖女斜倚的正是蟒身盘起的最高一圈；蟒首自主圈探出，金色的竖瞳吐着黑色的信子，蟒尾的末梢在水中摆动，搅碎水面的灯火倒影。背景的夜市灯火连绵：橙红的灯影在水面拉成长带，远处的楼宇挂着灯笼。主光为夜市的暖橙灯火，自右侧照亮妖女的侧脸、蟒鳞的高光与水面的倒影；画面的暗部呈墨绿与黑色，占约四成。\n\n空气中弥漫着水汽与灯影的光尘，前景妖女的冷眼与蟒身的鳞甲清晰，背景灯火虚化；黑绿蟒鳞、金饰华服与暖橙灯影对撞，整体呈厚涂油画质感的东方黑蟒为座，冷艳而妖冶。","zmf_name":"黑蟒为座冷眼观","zmf_batch":25,"run":true,"image":"../images/scenes/BV16uYb6vECt/s13.webp","id":"ZS-037"},{"bv":"BV16uYb6vECt","scene":14,"series":"妖都浮生","title":"发瀑化浪","pal":"仙金蓝","who":"人物/妖","comp":"发浪占上半","motion":"发丝化浪/雾/灯火","special":"发化巨浪","note":"长发化作白浪冲天，人浮浪心","prompt_moss":"一名妖女的长发化作巨浪卷起冲天，发丝如水流。主光为冷光。","prompt_zmf":"横画幅中式幻想奇观场景，画面中央一位红衣的女子立在浪花的中心，她乌黑的长发化作一道冲天的白色浪瀑，长发与浪花在她身后卷成一个巨大的环形浪环，环中隐现一头白色的狐影，她的裙摆铺展如盛开的锦缎。\n\n发瀑的形态如冲天的白色浪柱：女子的长发自头顶向天空炸开，发丝化作卷曲的白色浪花，浪花层层卷曲成一个巨大的环形，环形的浪缘翻卷着白色的泡沫花，浪环的中央隐现一头巨大的白色狐影，狐影的眼瞳发光，与环心的女子遥遥相对；浪环的底部与她的裙摆相连，裙摆的锦缎与浪花交织。\n\n女子的乌黑长发与红衣形成强烈对比：她身着暗红与金红织锦的重工华服，衣身上绣着繁复的金色纹样，裙摆的多层锦缎铺展开来占据画面的下半部，锦缎的花纹华丽如织毯；她双手交叠在身前，神情平静地立于浪心。背景为夜晚的城郭：朱红的楼阁与金顶的殿宇沿水平线排开，城中的灯火点点，夜空为深蓝。主光为浪环的白色自发光与城灯的暖橙光交织，照亮红裙的金纹、浪花的透光与狐影的轮廓；浪环外的夜色呈深蓝黑，占约四成。\n\n空气中弥漫着水雾与飘散的发丝，前景浪心的女子与铺展的锦裙清晰，发瀑的冲天动势完整；暗红锦裙、雪白浪环与深蓝城夜对撞，整体呈厚涂油画质感的东方发瀑化浪，妖冶而磅礴。","zmf_name":"发瀑化浪冲天","zmf_batch":29,"run":true,"image":"../images/scenes/BV16uYb6vECt/s14.webp","id":"ZS-038"},{"bv":"BV16uYb6vECt","scene":15,"series":"妖都浮生","title":"崖顶巨獒","pal":"红金撞色","who":"动物","comp":"獒占上半，红绸横贯","motion":"鬃毛风/红绸/旗","special":"崖顶巨獒","note":"巨獒伏崖，红绸自它身后横过天际","prompt_moss":"一头巨獒伏于崖顶俯瞰，红绸自它身后横贯天空。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，画面右侧一座悬崖的顶端，一头体型巨大的黑褐色巨獒伏在崖沿上昂首长啸，数条红色的长绸自它的身后横过整个天际，绸带在风中舒展如极光，远景是雪山与浮空的岛城。\n\n巨獒的体型如小山：黑褐色的长毛自颈部披落如狮鬣，肩背的毛色泛着金褐的光泽，它的头部昂扬，张开的口中露出森白的獠牙，长啸的姿态充满力量；它的前爪搭在崖沿崩裂的石块上，爪下的碎石正簌簌滑落；它的颈间与背上披着古代武将的甲片与披膊，甲片的铜钉清晰，甲上还系着褪色的红缨。\n\n数条红色的长绸自巨獒的身后飘出，横过整个画面：绸带在空中舒展成绵延的红色飘带，与天际线平行，绸面上还残留着金色的织纹，绸带的中段被风卷起一个弧度，末端消失在画面的左侧远处。远景的地平线上，连绵的雪山顶着淡金色的天光，几座浮空的岛城自云中探出，岛城的楼阁挂着红色的幡旗；近景的悬崖为崩塌的古城墙遗址，砖石的残垣上还立着断裂的石柱。天空为澄澈的淡蓝，一轮圆月悬在画面左上。主光为清亮的白昼天光，从画面左侧照亮巨獒的鬣毛轮廓、红绸的透光与雪山的受光面；崖体与兽身的暗部呈深褐色。\n\n空气中弥漫着崖尘与飘絮，前景巨獒的长啸姿态与崩落的碎石清晰，红绸横贯天际的动势完整；黑褐獒身、赤红长绸与淡金雪山对撞，整体呈厚涂油画质感的东方巨獒啸天，苍凉而雄浑。","zmf_name":"崖顶巨獒长啸","zmf_batch":17,"run":true,"image":"../images/scenes/BV16uYb6vECt/s15.webp","id":"ZS-039"},{"bv":"BV16uYb6vECt","scene":16,"series":"妖都浮生","title":"长街火鼎","pal":"红金撞色","who":"无人物","comp":"长街纵深，鼎列两侧","motion":"鼎口火苗/人潮/幡","special":"街心火鼎列","note":"长街两侧火鼎齐燃，宴前仪式","prompt_moss":"长街两侧火鼎齐燃，宴前仪式排列。主光为火光。","prompt_zmf":"横画幅中式幻想宴仪大场景，俯瞰一条笔直的长街：长街的两侧齐齐燃着数十座金色的火鼎，鼎中的火焰笔直向上，长街的中央站着两列戴面具的执礼人群，街的尽头是灯火辉煌的主殿，宴前仪式庄严盛大。\n\n长街自画面的近处延伸向深处，透视纵深感强烈：街的两侧对称排列着金色的火鼎，每一座火鼎都是三足的鼎形，鼎中的火焰笔直冲天，火苗的高度整齐如仪仗，鼎身的金纹被火光映亮；街心站着两列执礼的人：他们戴着金色的面具，身着白底金纹的礼服，手持仪杖，队列笔直如尺。街的尽头是一座灯火辉煌的主殿：殿宇的重檐与金顶在火光中璀璨，殿前的广场上人群如海。\n\n长街两侧的建筑为朱红与金色的楼阁：楼阁的飞檐上挂满红灯笼与金色的饰件，楼上的窗棂里透出宾客的剪影；街边的立柱上盘着鎏金的龙雕，龙首托着灯盘。前景的两侧各有一尊巨大的兽首浮雕柱头，兽首的金纹狰狞而华丽。主光为火鼎的橙金火焰自发光，自两侧向街心汇聚，照亮执礼人群的白衣面具、街面的石板与楼阁的檐角；长街两侧的阴影呈红褐色。\n\n空气中弥漫着火焰的热浪与仪仗的旗穗，前景火鼎的火焰与面具人群清晰，长街纵深层层虚化至主殿；熔金火鼎、朱红楼阁与白金面具队列对撞，整体呈厚涂油画质感的东方宴前火鼎长街，庄严而盛大。","zmf_name":"长街火鼎宴前礼","zmf_batch":30,"run":true,"image":"../images/scenes/BV16uYb6vECt/s16.webp","id":"ZS-040"},{"bv":"BV16uYb6vECt","scene":17,"series":"妖都浮生","title":"鲛人倚阁","pal":"红金撞色","who":"人物/妖","comp":"人物右，水阁横贯","motion":"鱼尾拍水/纱幔/灯串","special":"鲛人鱼尾","note":"鲛人倚阁梳发，鱼尾拍碎一池灯影","prompt_moss":"一名鲛人倚水阁梳发，鱼尾拍碎一池灯影。主光为暖光。","prompt_zmf":"横画幅中式幻想夜景场景，画面中央一位鲛人女子倚在水阁的雕花栏杆上梳理乌黑的长发，她的鱼尾自水阁探入池水，尾鳍拍碎了一池的灯影，夜市的灯火与白纱环绕四周。\n\n鲛人女子乌黑长发如瀑垂落，发间生着一对深色的鲛角，发梢泛着水光；她的上半身为人身，身着乳白色与正红相间的织锦抹胸长裙，肩头披着白色的轻纱；她的下半身为一条巨大的青蓝色鱼尾，尾鳞层层分明泛着珠光，尾鳍宽大如裙摆，她的尾尖正拍打着池水，拍碎的水花与涟漪把一池的灯影揉成万点碎金。\n\n她倚着的水阁为朱红的木构小楼，雕花的栏杆与窗棂精致，阁内的灯串自檐角垂下；她的长发正被她一手拢起梳理，另一手拈着一枚珍珠照影。四周的夜市灯火通明：两岸的酒楼挂着红灯笼与白纱幔，白纱在水面的风里翻卷飘荡，几艘花船泊在池边，船上的灯影人影交错。主光为夜市的暖橙灯火，自四周包裹鲛人的白纱与鱼尾的珠光，水面倒影的碎金铺满池面；夜空的暗部呈深蓝黑，占约四成。\n\n空气中弥漫着水汽与灯纱的飘絮，前景梳发的手指与拍水的尾鳍清晰，灯市与白纱层层虚化；乳白纱裙、青蓝鱼尾与暖橙灯市对撞，整体呈厚涂油画质感的东方鲛人倚阁，妖冶而梦幻。","zmf_name":"鲛人倚阁梳发","zmf_batch":20,"run":true,"image":"../images/scenes/BV16uYb6vECt/s17.webp","id":"ZS-041"},{"bv":"BV16uYb6vECt","scene":18,"series":"妖都浮生","title":"浪里相拥","pal":"仙金蓝","who":"人物群","comp":"双人对角，浪满屏","motion":"浪墙/水沫/衣湿贴身","special":"巨浪救人","note":"浪里相拥，一个抱着一个往岸上挣","prompt_moss":"一名男子在巨浪中抱起昏迷的同伴往岸上挣。主光为冷光。","prompt_zmf":"横画幅中式幻想渔港场景，画面中央一位络腮胡的壮汉抱着一条红白色的大鱼妖，在渔港的浅水里奋力往岸上挣：他的双脚踩在水里，浪花拍打着他的腿，怀中的鱼妖双臂环着他的脖颈，鱼尾拍打着水面溅起水花；背景是喧腾的渔港与围观的人群。\n\n壮汉络腮胡浓黑，头发束在脑后；他身着青蓝色的粗布短打与同色的围裙，小臂的肌肉贲张，青筋清晰；他横抱着的人鱼妖上半身为少女，面容清丽，发间生着细小的鳞片与鳍饰，她的下半身为一条巨大的红白色鱼尾，鱼尾的鳞片红白相间，尾鳍如纱裙铺展，她的双手紧紧搂着壮汉的肩，神情依赖。\n\n渔港的背景喧腾：木栈桥与泊岸的渔船层层排开，船身的朱红漆色斑驳；岸上的行人探头观望，一位老渔夫拄桨立在船头，孩子们的身影在栈桥上跑动；港口的建筑为白墙与木构的骑楼，幌子与灯笼成串。主光为明亮的白昼阳光，从画面左上方照亮浪花的透光、壮汉的肌肉线条与鱼妖的鳞片反光；水面的阴影呈青绿色。\n\n空气中弥漫着海水的水汽与鱼市的咸味，前景相拥的一人一妖与飞溅的浪花清晰，渔港背景虚化；青蓝衣衫、红白鱼尾与暖金阳光三色交织，整体呈厚涂油画质感的东方浪里相拥，紧张而温情。","zmf_name":"浪里相拥救鱼妖","zmf_batch":40,"run":true,"image":"../images/scenes/BV16uYb6vECt/s18.webp","id":"ZS-042"},{"bv":"BV16uYb6vECt","scene":19,"series":"妖都浮生","title":"白蟒冲天","pal":"仙金蓝","who":"动物","comp":"蟒身纵贯","motion":"水柱/鳞光/云散","special":"白蟒腾空","note":"白蟒自潭底冲天而起，水幕随裂","prompt_moss":"一条白蟒自潭底冲天而起，水幕随裂。主光为冷光。","prompt_zmf":"横画幅中式幻想奇观场景，画面中央一条通体雪白的巨蟒自潭底冲天而起，蟒身盘旋上升，潭水的水幕随它的冲势向四周裂开，蟒身的中段上站着一位白衣黑发的女子，满月悬在她身后的夜空。\n\n白蟒的躯体粗壮如殿柱，通体覆盖着乳白色的鳞甲，每一片鳞甲都泛着珍珠般的光泽，鳞缘透着淡青；蟒首昂起，金色的竖瞳低垂，口微张露出细白的毒牙，白色的须须自吻侧飘落；蟒身在空中盘旋成三圈螺旋，盘旋的水幕自潭面向上裂开成环形的瀑布墙，水幕的边缘翻卷着白色的水花，水珠在半空凝成雨帘重新落回潭中。\n\n蟒身中段的盘旋处，一位乌黑长发垂腰的白衣女子静立，她身着月白色的广袖纱裙，赤足踏在鳞甲上，裙摆与长发随高空的罡风向一侧飘展，她单手扶着蟒身的背鳍，神情平静地俯瞰潭面。背景的满月巨大而清晰，月轮的环形山在夜空中泛着银白，月下是暗蓝色的山影与翻涌的水雾。潭水的四周溅起的水花凝成冰晶般的水珠悬在半空。主光为满月的银白月光，照亮白蟒的鳞甲、水幕的透光与女子的白衣；水幕的背光面呈淡青色，暗部呈深蓝，占约四成。\n\n空气中弥漫着浓重的水雾与飞珠，前景蟒首的鳞甲与盘旋的水幕清晰，冲天的动势完整；雪白蟒身、银白月轮与深蓝夜空对撞，整体呈厚涂油画质感的东方白蟒冲天奇观，神圣而磅礴。","zmf_name":"白蟒冲天裂水","zmf_batch":18,"run":true,"image":"../images/scenes/BV16uYb6vECt/s19.webp","id":"ZS-043"},{"bv":"BV16uYb6vECt","scene":20,"series":"妖都浮生","title":"灶王吐烟","pal":"红金撞色","who":"人物/妖","comp":"居中，蒸汽满屏","motion":"浓烟自口出/锅气/幡","special":"灶王爷式胖妖","note":"灶妖掌勺，一口浓烟喷出屋外","prompt_moss":"一名灶妖坐灶台吞吐浓烟，锅中冒气。主光为火光。","prompt_zmf":"横画幅中式幻想夜市场景，画面右侧一只粉红色的巨大猪形灶妖举着一口朱红的大锅，锅里升腾的浓烟自它的口中喷出屋外，烟柱粗大笔直；夜市的雪地上，几只小妖围着篝火烤火取暖，摊位上的蒸笼冒着白汽。\n\n灶妖的体型如两层楼高：粉红色的皮肤上布满深色的斑点，口鼻前突如猪，两支弯月状的白牙自嘴角上翘；它头顶披着一块赭红色的布巾，身上围着深色的围裙，围裙上沾满油渍与面粉；它一只前爪高举朱红的大锅，锅沿倾侧，锅里滚烫的浓烟冲天而起，烟柱的根部为白色，升到半空染上夜的深蓝；它的另一只爪子拄着一把巨大的铜勺。\n\n雪地的夜市上：几只毛绒绒的小妖围着一堆篝火而坐，篝火的火焰舔着串架上的食物，一只獾形小妖抱着食盒站在摊边；摊位的木架上挂着成串的灯笼与幌子，蒸笼的白汽与灶妖的烟在半空交汇。背景的夜市楼宇层层挂灯，红金相间的幌子在雪夜里鲜艳；更远的夜空深蓝，雪片的反光点点。主光为篝火的暖橙光与灯笼的暖光交织，自下方照亮灶妖的粉红皮肤、雪地的反光与烟柱的根部；烟柱升入夜空渐变成蓝黑。\n\n空气中弥漫着浓烟、蒸汽与雪花，前景灶妖举锅的姿态与小妖烤火清晰，烟柱的升腾动势完整；粉红灶妖、朱红大锅与雪夜蓝黑对撞，整体呈厚涂油画质感的东方灶王吐烟，诙谐而热闹。","zmf_name":"灶王掌勺吐烟","zmf_batch":22,"run":true,"image":"../images/scenes/BV16uYb6vECt/s20.webp","id":"ZS-044"},{"bv":"BV16uYb6vECt","scene":21,"series":"妖都浮生","title":"破门望楼","pal":"红金撞色","who":"无人物","comp":"破门框景，楼在雾中","motion":"雾涌/灯影/尘落","special":"残门框景","note":"残破门框里望见雾中金楼","prompt_moss":"一扇残破的门框框住雾中的金色楼阁。主光为冷光。","prompt_zmf":"横画幅中式幻想奇观场景，画面中央一座残破的朱红大门敞开着，门内一位青衣人的背影正走入雾中；门的四周是如珊瑚般堆叠的白色废墟与雪浪，门框的缝隙间游动着成群的金鱼，门外的深处一座雾中金楼若隐若现。\n\n朱红的大门高耸：门框的漆色斑驳剥落，门楣上的雕花被岁月磨平，门轴的铜环锈迹斑斑；两扇门板向内敞开，门板上的兽首铺首still可见；门内深处，青色的雾气弥漫，雾中一座金色的楼阁轮廓若隐若现，楼阁的飞檐在雾中发光。青衣人的背影立于门槛之内，他的衣摆被门内的风掀起，正缓步走入雾中。\n\n门的四周堆叠着白色的废墟：如珊瑚礁般层叠的白色石块与断柱，废墟的缝隙间游动着成群的金色小鱼，鱼群自门框的缝隙穿进穿出，鱼鳞的金光在废墟间闪烁；废墟的顶端垂挂着白色的纱幔与藤蔓。背景的天空为青蓝色，大朵的白云悬在废墟之上。主光为明亮的白昼天光，从画面右上方照亮废墟的白、门框的朱红残漆与金鱼的鳞光；门内的雾中金楼保持朦胧的整体轮廓。\n\n空气中弥漫着水汽与游鱼的银光，前景残破的门框与走入雾中的背影清晰，雾中金楼朦胧；朱红门框、雪白废墟与雾中金楼对撞，整体呈厚涂油画质感的东方破门望楼，超现实而梦幻。","zmf_name":"破门望雾中金楼","zmf_batch":27,"run":true,"image":"../images/scenes/BV16uYb6vECt/s21.webp","id":"ZS-045"},{"bv":"BV16uYb6vECt","scene":22,"series":"妖都浮生","title":"水下宫阙","pal":"仙金蓝","who":"无人物","comp":"俯瞰水下城","motion":"水草摆/鱼群/光柱","special":"沉水宫阙","note":"清澈水下沉着一座宫阙，鱼群穿行","prompt_moss":"俯瞰清澈水底沉着一座宫阙，鱼群穿行。主光为冷光。","prompt_zmf":"横画幅中式妖市夜景，平视中景。画面中央偏左一只巨大的蟾妖立在铺面的柜台后，头与前肢探出柜台，占据画面高度约六成；柜台下层的水盆里还蹲着一只小蟾，画面右后方是灯火连片的街市。\n\n蟾妖的皮肤为暗绿与赭褐相间，背面覆着成排的疣粒与深浅不一的斑纹，喉部鼓动，皮膜湿润反光；眼睛大而外凸，眼睑低垂，嘴缘宽扁；一只前爪搭在柜台边缘，指尖的肉垫压在木板上。\n\n柜台为厚重的木台，台面摆着陶盆、竹筐与成串的干果；铺面的上方横挂着一排成串的大蒜、干辣椒与草编的药包，绳结垂到檐下；右侧的灶上架着一口黑锅，热气自锅口升起。\n\n街市沿画面纵深铺开：两侧是木构的铺面与白墙的檐角，檐下挂着成串的暖橙灯笼与白底黑字的布幌，招牌的木框被油烟熏得发黑；街面为湿滑的灰石，石缝间积着水，远处有极小的人形与妖影走动。主光为铺面内外的暖橙灯火，自柜台的下方与上方同时照亮蟾妖的皮膜与干果的纤维，勾出湿润的高光；街巷深处的暗部呈暖褐与墨绿。\n\n空气中弥漫着蒸腾的热气与油烟，前景的陶盆与蒜串清晰，远景灯笼化成暖橙的光斑；赭褐、暖橙与墨绿三色交织，整体呈厚涂油画质感的东方妖市夜肆，市井而诡谲。","zmf_name":"蟾肆夜灶","zmf_batch":43,"run":true,"image":"../images/scenes/BV16uYb6vECt/s22.webp","id":"ZS-046"},{"bv":"BV16uYb6vECt","scene":23,"series":"妖都浮生","title":"灯市长廊","pal":"妖夜橙","who":"人物群","comp":"前景灯笼串框景","motion":"灯串晃/人群/白影飘过","special":"灯笼长廊、白影","note":"灯市长廊里一缕白影自她身后飘过","prompt_moss":"一名少女提灯走过灯笼长廊，一缕白影自她身后飘过。主光为暖光。","prompt_zmf":"横画幅中式幻想夜景场景，灯市长廊的桥面上，一位执灯的古装女子侧身立于栏杆边，一缕巨大的白色凤羽状光影自她身后掠过飘起，光影与满廊的灯笼交叠，画面华丽而幽秘。\n\n女子乌黑长发挽成繁复的高髻，发间插着银饰与绢花；她身着藕荷色与月白相间的织锦襦裙，腰间束着青绿色的宽腰带，宽袖垂落；她侧身倚着廊桥的朱红栏杆，一手提起一盏六角的白色纱灯，纱灯的暖光映亮她的下颌与指尖，她微微仰头，目光追随着掠过的白影。\n\n白影为一对巨大的凤羽状光带，自她身后的空中飘掠而过：光带的根部为乳白色，羽面上晕着淡蓝与淡粉的流光，羽尖拖出长长的白色光尾，如凤凰的尾羽在夜风中舒展；光带掠过的位置，灯笼的光晕被搅动成漩涡状。\n\n长廊的桥面为深色木质，两侧与头顶挂满层层叠叠的灯笼：白玉色的纱灯、朱红的圆灯与金色的宫灯自廊顶垂串而下，灯海一直延伸向廊桥深处；廊柱的朱红漆面与彩绘的枋梁在灯下鲜艳。背景的夜空呈深蓝色，廊外的城楼灯火连绵。主光为满廊灯笼的暖橙自发光与白影的冷白流光交织，照亮女子的侧脸、织锦的纹样与廊柱的漆色；暗部呈蓝紫色，占约三成。\n\n空气中弥漫着灯穗的流苏与光尘，前景执灯的手与白影的飘掠动感清晰，灯海深处层层虚化；暖橙、藕荷与冷白光影对撞，整体呈厚涂油画质感的东方灯市幽影，华丽而幽秘。","zmf_name":"灯市白影掠过","zmf_batch":16,"run":true,"image":"../images/scenes/BV16uYb6vECt/s23.webp","id":"ZS-047"},{"bv":"BV16uYb6vECt","scene":24,"series":"妖都浮生","title":"白鹿神树","pal":"仙金蓝","who":"动物","comp":"鹿左，红树右满","motion":"签串轻响/红叶落/水镜","special":"神树签串、白鹿","note":"白鹿在红神树下系愿签，水面如镜","prompt_moss":"一只白鹿立于红神树下系愿签，水面如镜。主光为冷光。","prompt_zmf":"横画幅中式幻想场景，画面左侧一头通体雪白的神鹿低头在镜面般的水畔饮水，它的鹿角巨大如树枝，角上系满了白色的愿签与红绳；它身旁矗立着一棵赤红的神树，树冠的红叶如燃烧的云，远景一位红衣人立于树下仰望。\n\n白鹿的通体羽毛般的长毛为乳白色，颈部的鬃毛蓬松，它的鹿角自头顶向两侧生长出繁复的枝杈，每一根枝杈上都系着写满文字的白色木签与红色的绳结，签串在角上层层叠叠如挂满愿望的树；它的眼睛温润低垂，长睫毛清晰，饮水时水面荡开一圈圈细小的涟漪，倒影完整映出白鹿与神树。\n\n赤红的神树立于水畔，树干粗壮，枝干如手臂般伸展，满树的红叶透亮如燃烧的云霞，红叶间飘落着几片叶子落在水面；远景的红衣人立于树下的花丛边，仰头望着白鹿，身影渺小。四周的红叶林铺满背景，林间的雾气泛着淡红。主光为明亮的白昼偏暖天光，从画面右上方照亮白鹿的长毛、鹿角上的签串与红叶的透光；水面倒影与林间暗部呈红褐色。\n\n空气中弥漫着红色的花瓣与雾气，前景白鹿的饮水倒影与愿签细节清晰，红树林层层虚化；雪白、赤红与水面的青碧三色对撞，整体呈厚涂油画质感的东方白鹿神树，神圣而静谧。","zmf_name":"白鹿神树愿签","zmf_batch":15,"run":true,"image":"../images/scenes/BV16uYb6vECt/s24.webp","id":"ZS-048"},{"bv":"BV16uYb6vECt","scene":25,"series":"妖都浮生","title":"雪魔烈焰","pal":"仙金蓝","who":"人物/妖","comp":"居中特写，冰焰环","motion":"冰甲碎裂/焰舌/长发狂舞","special":"冰火同体","note":"雪原黑袍魔，冰与火在他周身交战","prompt_moss":"一名黑袍魔立于雪原，周身冰焰交缠，直视观者。主光为冷光。","prompt_zmf":"横画幅中式奇幻人物场景，画面中央一位黑袍黑发的魔头半身入镜，正面朝向镜头，占画面高度约七成，周身被冰与火对撞的能量包裹。\n\n魔头乌黑的长发狂乱地向后飞扬，几缕发丝横过面颊；面容苍白俊美，眉心与眼尾蔓延着鲜红色的妖纹，双目锐利，嘴角噙着冷冽的笑意。他身着玄黑色重袍，肩部覆着厚重的黑色长毛领，胸前银灰的铠甲链环清晰，衣料的织物肌理粗粝。\n\n他的右侧一条由蓝色冰晶构成的长龙盘旋而上，冰龙的鳞甲、鬃须与利爪晶莹剔透，龙首在他肩后昂起；左侧与下方翻卷着橙红色的火焰，火舌与火星沿袍角升腾，冰与火在他周身交汇却互不相融。背景为灰白色的雪原与远处的城郭轮廓，天空呈青灰的冷调。\n\n主光为冰龙的冷蓝自发光与火焰的暖橙自发光，从两侧分别照亮他的左右脸颊与衣料，形成强烈的冷暖分割；雪原反射的灰白环境光补亮轮廓，暗部呈墨黑，占约三成。空气中弥漫着飘雪与火星，前景冰甲与火焰边缘清晰锐利，远景雪原没入焦外；冰蓝与烈焰橙红对撞，玄黑主导，整体呈厚涂油画质感的东方魔幻人物立绘，邪魅而压迫。","zmf_name":"雪原魔焰冰龙","zmf_batch":2,"run":true,"image":"../images/scenes/BV16uYb6vECt/s25.webp","id":"ZS-049"},{"bv":"BV1NiNQ6MEDq","scene":0,"series":"妖都浮生","title":"红裙弄线","pal":"红金撞色","who":"人物/妖","comp":"人物右，溪谷横贯","motion":"线头飘/水纹/发丝","special":"金纹红裙、幽谷","note":"远古妖神坐在幽谷里绣一件红裙","prompt_moss":"一名红裙妖神坐幽谷岩上绣红裙，溪谷与红叶环绕。主光为暖光。","prompt_zmf":"横画幅中式幻想林景，平视中景。画面右侧一位红衣女子坐在巨石上，右手抬起捏着一根细线，头微侧低垂看向线端，占画面高度约六成；左侧是溪流与红叶铺就的山径。\n\n女子面容清丽，眼睑低垂，唇色朱红；乌黑长发半挽，发间插着金饰与红绳，几缕垂在胸前；神情沉静，指尖捻线的动作轻。\n\n她身着朱红印花的长袍，衣面布满金红的花纹，前襟开合露出内衬的白纱，腰束深色宽带；袖口宽大垂落，手背与指节清晰；赤足垂在石面上，脚踝的白与裙色相接。\n\n巨石为深褐岩体，表面覆着苔与落叶；左侧溪流被红叶映成暗红，水面漂着叶片；背景为密集的秋林，树干与枝桠交错，红叶层层堆叠，小径沿溪伸向远处。主光为侧逆的暖橙夕光，自左上方穿过林隙，照亮她的发丝、肩线与裙面花纹，勾出一圈亮边；林下的暗部呈墨绿与深褐。\n\n空气中飘着细碎红叶与光尘，前景的手指与细线清晰，远处的林径虚化；朱红、墨绿与暖金交织，整体呈厚涂油画质感的东方林间人物，静谧而浓烈。","zmf_name":"红裙弄线","zmf_batch":47,"run":true,"image":"../images/scenes/BV1NiNQ6MEDq/s00.webp","id":"ZS-050"},{"bv":"BV1NiNQ6MEDq","scene":1,"series":"妖都浮生","title":"蛇缠青丝","pal":"红金撞色","who":"人物/妖","comp":"大特写，蛇与发交织","motion":"蛇信/红鳞滑/睫毛","special":"红蛇为饰","note":"红蛇是她的首饰，缠过发缠过腕","prompt_moss":"一名妖女唇衔红蛇，蛇自发间游出缠上指尖，直视观者。主光为暖光。","prompt_zmf":"横画幅中式古典人像特写，画面中央一位乌黑长发如瀑的女子，两条赤红色的灵蛇是她的首饰：一条红蛇缠过她的发间自肩头垂落，另一条红蛇缠着她的手腕，蛇身与她的红金织锦华服同色，她的金瞳斜睨，妖冶而华贵。\n\n女子的乌黑长发铺满画面，发丝如墨绸般垂落及腰，发间簪着金色的花饰；她的眼尾画着赤红色的上挑妆纹，金色的眼瞳斜睨画外，唇色朱红，面容冷艳。她身着正红织金的宽袖华服：衣料上金线织出繁复的纹样，领缘与袖口滚金边；两条赤红色的灵蛇为她的首饰：一条红蛇自她的发间蜿蜒而下，蛇身缠过她的肩头，蛇首悬在锁骨；另一条红蛇缠着她的腕间，蛇信轻吐；蛇鳞的赤红与金纹和她衣料的织金相映。\n\n背景为暗色的鎏金屏风与飘散的金箔，金箔的碎屑自空中飘落；她的身后，大片乌黑的绸缎般的发影与红色的衣袂铺满画面的下半部。主光为暖金的室内光，自画面右前方照亮她的面容、蛇鳞的红与织金的纹样；背景的暗部呈暗红与金褐。\n\n空气中弥漫着金箔的碎屑与红雾，前景蛇缠青丝的细节与她的金瞳清晰，背景鎏金虚化；赤红蛇身、鎏金纹样与墨色长发对撞，整体呈厚涂油画质感的东方红蛇首饰，妖冶而华贵。","zmf_name":"红蛇缠青丝","zmf_batch":36,"run":true,"image":"../images/scenes/BV1NiNQ6MEDq/s01.webp","id":"ZS-051"},{"bv":"BV1NiNQ6MEDq","scene":2,"series":"妖都浮生","title":"狮祖守桥","pal":"红金撞色","who":"动物","comp":"兽首占左，桥纵深右","motion":"鬃毛浮/桥灯/雾","special":"狮首祖妖、悬灯古桥","note":"狮祖伏在桥头，看一茬又一茬的过客","prompt_moss":"一头狮首祖妖伏守古桥，桥有悬灯。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，画面中央一头红金色的巨狮祖伏在石桥的桥头，它的体型如殿宇，蓬松的红金鬃毛如火焰披落，巨爪搭在桥头的石阶上，看着桥上一茬又一茬走过的过客；背景为青蓝色的城与塔楼。\n\n狮祖的鬃毛为正红与鎏金相间的长毛，毛色如燃烧的火焰自颈后披落，鬃毛间点缀着红宝石般的结晶羽饰；它的面部为狮首，金色的双目半阖，神态威严而温和，獠牙隐现；它的躯体覆盖着红金相间的甲羽状长毛，前肢的巨爪如树根般搭在石阶上，爪尖弯曲有力。它的身下压着的桥头石阶为青灰的石砌，石阶上的行人小如尘点，或挑担或牵马，络绎过桥。\n\n背景的城为青蓝色调：青瓦的楼阁与白墙的民居层层铺开，几座高塔的塔尖挂着红灯笼，远处的城郭没入青蓝色的雾霭；桥的桥身为青灰的石砌，桥拱下的河水反光。天空中悬着一轮巨大的金色圆环装饰与成串的铜铃。主光为明亮的暖金阳光，从画面右上方照亮狮祖的鬃毛、甲羽的层次与石桥的受光面；城郭的阴影呈青蓝色，冷暖对撞。\n\n空气中弥漫着桥上的尘土与浮絮，前景狮祖的鬃毛与巨爪清晰，城郭与桥上的过客层层虚化；红金鬃毛、青蓝城郭与朱红灯笼对撞，整体呈厚涂油画质感的东方狮祖守桥，威严而慈和。","zmf_name":"狮祖守桥","zmf_batch":24,"run":true,"image":"../images/scenes/BV1NiNQ6MEDq/s02.webp","id":"ZS-052"},{"bv":"BV1NiNQ6MEDq","scene":3,"series":"妖都浮生","title":"鹤友同栖","pal":"红金撞色","who":"动物","comp":"人鹤同框，蓝羽占半","motion":"鹤羽/穗子/树影","special":"蓝金巨鹤","note":"她和巨鹤像老友，一坐就是千年","prompt_moss":"一名妖女与巨鹤并肩坐枝头，鹤羽蓝金。主光为暖光。","prompt_zmf":"横画幅中式幻想人物场景，画面中央一位背着行囊的长发人物与一只巨大的蓝金色羽鹤并肩蹲坐在丛林的一块巨岩上，人鹤相伴如老友，整体色调沉静浓郁。\n\n人物的乌黑长发披落，发间编着红色的发绳；他身着旅人的装束：米白色的宽袖外衫与深褐色的坎肩，肩上背着塞得鼓鼓的行囊，行囊上挂着葫芦与卷起的草席；他侧身坐着，手肘搭在膝上，神情平静地望着画面前方。身旁的巨鹤体型比人还高：颈羽为乳白色，背羽与翼羽为宝蓝、墨绿与橙红交织的浓艳羽纹，翼羽的末端垂着长长的饰羽；橙色的长喙微微收拢，金色的眼睛平静望向前方，与人物的神态如出一辙。\n\n他们栖息的巨岩覆盖着青苔，岩边垂着暗红色的藤蔓与藤萝；岩下的林间弥漫着青蓝色的雾气，远处的树影层层没入黑暗的虚化中。几缕橙红色的光自林隙斜射进来，照亮人物的肩头、行囊的纹理与鹤羽的金属光泽；暗部呈墨绿与深蓝，占约五成。\n\n空气中弥漫着林间的雾气与飘落的光羽，前景人与鹤的羽毛、发丝细节清晰，背景丛林层层虚化；宝蓝、橙金与墨绿三色浓郁交织，整体呈厚涂油画质感的东方人鹤同栖，宁静而深情。","zmf_name":"鹤友同栖","zmf_batch":11,"run":true,"image":"../images/scenes/BV1NiNQ6MEDq/s03.webp","id":"ZS-053"},{"bv":"BV1NiNQ6MEDq","scene":4,"series":"妖都浮生","title":"龙脊游云","pal":"红金撞色","who":"动物","comp":"龙身横贯上半","motion":"龙游/云裂/城灯","special":"金龙、古城云海","note":"金龙游过云脊，古城在它腹下亮灯","prompt_moss":"一条金龙游过云脊，古城在它腹下亮灯。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，画面中央一条青绿色的巨龙低空游过海面，龙背上驮着一整座灯火通明的古城楼群，龙首朝向画面左侧，长长的白须飘扬，龙身在云雾中起伏。\n\n巨龙的鳞片呈青绿色与金色相间，每片鳞甲清晰分明，鳞缘泛着水光；龙首生有鹿角与飘扬的乳白色长须，须丝在海风中舒展，龙眼温和低垂；龙背的脊甲上驮着层层叠叠的城楼：金顶的殿宇、悬空的栈桥与成串的红灯笼沿龙脊排布，楼阁的窗内透出暖黄的灯光，最高的塔楼挂着红色的幡旗，整座龙城在暮色中灯火璀璨。\n\n下方是暗青色的海面，海浪翻涌着白色的泡沫，礁石嶙峋的岛屿点缀海面，几缕低云自龙腹下掠过；远景的海天交界处泛着金红色的晚霞，霞光把云层染成暖金。主光为龙城灯火的暖金自发光与晚霞的余晖，从画面右侧照亮龙鳞的受光边缘、楼阁的飞檐与海面的波光；龙腹与海面的暗部呈青黑色，占约四成。\n\n空气中弥漫着海雾与灯火的光尘，前景龙首的鳞甲与长须清晰，龙身与城市向画面右侧层层虚化；青绿、熔金与朱红点缀三色交织，整体呈厚涂油画质感的东方龙城游海奇观，壮丽而祥和。","zmf_name":"龙脊驮城游云","zmf_batch":7,"run":true,"image":"../images/scenes/BV1NiNQ6MEDq/s04.webp","id":"ZS-054"},{"bv":"BV1NiNQ6MEDq","scene":5,"series":"妖都浮生","title":"羊角妖提灯","pal":"红金撞色","who":"人物/妖","comp":"人物居中，灯笼串背景","motion":"锁链/灯焰/毛领","special":"羊角、锁链灯","note":"羊角妖提着锁链灯巡夜，回头一瞪","prompt_moss":"一名羊角妖提锁链灯巡夜，回头怒瞪。主光为火光。","prompt_zmf":"横画幅中式暗黑幻想人像，画面中央一位生着巨大弯角的羊角妖蹲踞在夜巷的石阶上，他一手拄着一条挂满灯笼的粗铁链，铁链上的红灯笼明明灭灭，他回头向镜头方向狠狠一瞪，眼神凶悍。\n\n羊角妖的双角为巨大的弯角，角身的纹理如古木的年轮层层盘曲，角尖锋利；他的面容如羊如魔，金色的竖瞳怒瞪镜头，獠牙自唇边露出，下颌的胡须纠结成缕。他身披破旧的深色斗篷，斗篷的边缘撕裂成条，肩甲为锈蚀的铁片，胸前的旧袍上还系着褪色的红绳；他的一只爪手拄着粗大的铁链，铁链自他的爪中延伸到画面的两侧，链上每隔一环就挂着一盏点亮的红灯笼，灯笼的暖光在青蓝色的夜巷里明明灭灭。\n\n夜巷的石阶与矮墙为青灰的石砌，墙头上爬着枯藤；巷子的深处挂着一盏更大的红灯笼，灯笼的金字招牌半明半暗；地面的石板上落着红色的花瓣与枯叶。主光为铁链灯笼的暖橙红光，自下而上照亮羊角妖的双角轮廓、獠牙与斗篷的破旧质感；巷子的暗部呈深蓝青色，占约四成。\n\n空气中弥漫着灯笼的烟气与夜雾，前景羊角妖的怒瞪与铁链灯笼清晰，巷子纵深虚化；暖橙红灯笼、青蓝夜巷与墨色妖躯对撞，整体呈厚涂油画质感的东方羊角妖巡夜，凶悍而神秘。","zmf_name":"羊角妖提灯巡夜","zmf_batch":26,"run":true,"image":"../images/scenes/BV1NiNQ6MEDq/s05.webp","id":"ZS-055"},{"bv":"BV1b9eV6VEqW","scene":0,"series":"妖都浮生","title":"开场糖葫芦","pal":"红金撞色","who":"POV","comp":"黑底暖光特写","motion":"糖衣反光流动/指尖","special":"糖葫芦","note":"第一人称举糖葫芦开场，糖壳亮得像灯笼","prompt_moss":"第一人称视角手举糖葫芦，糖壳亮得像灯笼。主光为暖光。","prompt_zmf":"横画幅中式市井特写，第一人称近距。画面中央一串四颗糖葫芦被两根手指捏着签子举在眼前，另一只手伸指轻触最左的糖壳；背景为深暗的暖褐虚影。\n\n糖壳裹得透亮，表面在暖光下像一层琉璃，高光点圆润，边缘挂着细密的糖丝；签子是浅褐竹木，末端磨得发亮。\n\n举签的手自画面下缘伸入，指节与指腹的纹路清晰，指甲边缘泛白；另一只手的食指自左下方探来，指尖即将触到糖壳，接触处透出蜜色的光。\n\n背景为大幅虚化的夜市：暖橙灯影、深色木构与模糊人影融成色块，光斑如星散布。主光为夜市的暖橙灯火，自画面右上照来，点亮糖壳的透亮与手指轮廓；背景暗部呈深褐。\n\n空气中弥漫着糖霜的细尘与暖雾，前景的糖壳与指尖清晰锐利，背景完全虚化；糖壳的暗红、暖橙与深褐对撞，整体呈厚涂油画质感的东方市井特写，甜蜜而温热。","zmf_name":"开场糖葫芦","zmf_batch":48,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s00.webp","id":"ZS-056"},{"bv":"BV1b9eV6VEqW","scene":1,"series":"妖都浮生","title":"嗔问","pal":"妖夜橙","who":"人物/妖","comp":"居中特写，集市虚化","motion":"狐耳绒颤/碎发/背景人流","special":"狐耳、字幕","note":"狐女抬眼直视观者嗔问——全库罕见直视镜头的一帧","prompt_moss":"一名狐耳少女正面抬眼直视观者嗔问，集市虚化。主光为暖光。","prompt_zmf":"横画幅中式幻想人像特写，画面中央一位生着赤红色狐耳的少女蹲坐在冬日的市集街道上，抬眼直视镜头，嘴唇轻抿微嘟，眼神嗔怪，半身入镜。\n\n少女的狐耳为赤红色，耳缘乳白，耳内的绒毛清晰；她乌黑长发挽成松散的发髻，鬓边垂落几缕碎发与细小的发辫，额间点着一枚红色的花钿；她的眼型圆润，深棕色的眼瞳直视镜头，眼尾微微上挑，眉毛轻蹙，抿起的唇形饱满，嗔怪的甘美神情栩栩如生。她身着蓝白织锦的短袄，领缘滚着白色的绒毛边，衣身上织满金银缠枝纹样，肩上披着一件织着暗纹的厚披肩，双手拢在袖中抱膝。\n\n背景为大幅虚化的冬日市集：两侧挂着红色的幡旗与幌子，摊位的暖光朦胧，几位行人的身影在光晕中往来，地面泛着湿润的反光。主光为白昼的暖调天光，从画面右前方照亮她的面部、狐耳的绒毛边缘与织锦的织纹；背景虚化成暖橙与灰蓝交错的色块。\n\n空气中漂浮着细小的浮尘，前景人物的狐耳与面部表情清晰锐利，背景街道大幅虚化；宝蓝、赤红与暖橙三色交织，整体呈厚涂油画质感的东方狐女嗔问，鲜活灵动。","zmf_name":"狐女嗔问","zmf_batch":14,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s01.webp","id":"ZS-057"},{"bv":"BV1b9eV6VEqW","scene":2,"series":"妖都浮生","title":"妖市俯瞰","pal":"妖夜橙","who":"无人物","comp":"大远景俯瞰","motion":"人流/车轿/红绸飘","special":"俯瞰妖市全景","note":"俯瞰妖市大街：蓬车、狮群、满街红绸","prompt_moss":"俯瞰妖市大街全景：蓬车、狮群、满街红绸。主光为暖光。","prompt_zmf":"横画幅中式幻想市井大场景，高角度俯瞰妖市的长街：街道上人流如织，白毛的狮妖与兽形的行人在街心穿行，一辆朱红的蓬车自街心驶过，满街的红绸与幡旗自楼阁间垂挂，夏日阳光下的妖市喧腾鲜活。\n\n街道的两侧是鳞次栉比的木质骑楼：骑楼的檐下挂满红色的灯笼、幌子与红绸，绸带自楼顶垂落横过街道；街心的蓬车为朱红的轿式大车，车的帷幔绣着金纹，车顶插着红色的伞盖与雉羽；拉车的是一队白色的狮群，狮妖的鬃毛在阳光下雪白蓬松，狮群步伐整齐；街边的行人们形态各异：鹿角的青年、兔耳的少女、胖胖的狸猫掌柜，他们或购物或观望，热闹非凡。\n\n前景的两侧，几位大个头的兽形行人的后脑与肩背自画面的边缘入画，形成围观的第一人称视角；街道的地面上铺着红色的绸毯，绸毯自蓬车的脚下铺向街的深处。背景的街市深处，一座彩绘的门楼横跨街道，门楼的彩绘与金饰在阳光下鲜艳。主光为明亮的夏日阳光，从画面上方漫射，照亮狮群的雪毛、红绸的饱和色与骑楼的木纹；骑楼的阴影呈暖褐色。\n\n空气中弥漫着市集的浮尘与欢声，前景狮群与蓬车的行进清晰，街市纵深虚化；雪白狮群、朱红蓬车与满街红绸三色交织，整体呈厚涂油画质感的东方妖市俯瞰，喧腾而鲜活。","zmf_name":"俯瞰妖市长街","zmf_batch":33,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s02.webp","id":"ZS-058"},{"bv":"BV1b9eV6VEqW","scene":3,"series":"妖都浮生","title":"回身嗔怪","pal":"妖夜橙","who":"人物/妖","comp":"居中中景，身后小妖抬轿","motion":"狐尾扫/轿幔/人群","special":"字幕、随行小妖","note":"狐女转身摊手嗔怪，身后仪仗跟上","prompt_moss":"一名狐女转身摊手嗔怪，身后仪仗跟上。主光为暖光。","prompt_zmf":"横画幅中式街市场景，平视机位略带俯角。画面中央一位狐耳少女正回身向前看，左手向前伸出，右臂垂落，占画面高度约七成；她的身后右侧，四名赤膊的小妖正抬着一座朱红的箱笼沿街走过。\n\n少女为圆润的鹅蛋脸，眉形细长，眼尾上挑，眼瞳为琥珀色，唇色朱红，眉心一点红钿；乌黑长发中分挽成高髻，两侧别着赤红的绒花与金步摇，头顶一对赤红的狐耳竖起，耳尖的绒毛在光下透亮。\n\n她身着米白的交领内衫，外罩一件青绿与靛蓝相间的织金长袍，袍面布满细密的金色纹样，领缘与袖口镶红锦；左臂前伸时广袖垂落成筒状，袖口的金纹被光照亮；腰间束红锦带，垂着长绦，衣摆随回身的动作掀起。\n\n她的身后为热闹街市：两侧是两层的木构铺面，黑瓦檐、赭红木柱，檐下挂着成串的红灯笼与白底黑字的布幌，街边有摊贩与挑担的行人；右侧四名小妖赤着上身、皮肤呈灰褐色，肩扛木杠，抬着一座朱红的雕花箱笼，箱笼四角悬着铜铃；街面为灰白的石板，石缝间散落着碎叶。主光为白昼的暖阳，自画面左上方斜射，照亮少女的面颊、狐耳边缘与青绿袍面的金纹，勾出明亮的轮廓光；她的面部受光均匀，暗部呈暖褐。\n\n空气中漂浮着被阳光点亮的浮尘与细小的绒絮，前景少女的衣袖清晰，远景街市与行人的身影层层虚化；米白、青绿与朱红撞色，整体呈厚涂油画质感的东方妖市回身，明媚而生动。","zmf_name":"回身嗔怪","zmf_batch":42,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s03.webp","id":"ZS-059"},{"bv":"BV1b9eV6VEqW","scene":4,"series":"妖都浮生","title":"疾行过市","pal":"妖夜橙","who":"人物/妖","comp":"背影居中，POV 跟随","motion":"裙摆/狐尾/摊位掠过","special":"跟拍运镜","note":"镜头跟着红裙背影快步穿过集市","prompt_moss":"一名红裙妖女背影疾行穿过集市，跟拍视角。主光为暖光。","prompt_zmf":"横画幅中式妖市街景，背影跟随机位，略带仰角。画面中央偏左一位狐耳少女背身快步向前，巨大的赤红尾巴自腰后扬起，占画面高度约七成；她的右侧稍后是抬着朱红箱笼的妖仆队伍。\n\n少女乌黑长发挽成高髻，发间别着朱红的绒花与金步摇，头顶一对赤红的狐耳竖起，耳背的绒毛被光打亮；她的腰背挺直，肩线窄，行走时衣摆向后甩开。\n\n她身着蓝白相间的织花长袍，袍面满布细密的花纹，领缘与袖口镶红锦，腰间束着红带，带尾随步伐甩动；赤红的大尾自腰后拖曳，尾尖的绒毛在光下透亮；她的右臂自然摆动，袖口翻出一截白衬。\n\n街市的两侧是层叠的木构铺面：黑瓦檐、赭红柱、成串的红灯笼与白底黑字的布幌，摊贩的货担与竹筐挤在檐下；右侧的妖仆队伍赤着上身、皮肤呈灰褐，肩扛木杠抬着一座朱红的雕花箱笼，箱笼四角垂着铜铃；街面为灰白的石板，石缝间积着水光。主光为夜市摊档的暖橙火光与天顶的冷蓝余光交织，自她的右前方照来，把发髻、衣料的花纹与尾巴的绒尖勾出亮边；街巷深处沉入暖褐与墨蓝。\n\n空气中弥漫着摊档的油烟与水汽，前景的衣摆与尾尖清晰，远处的灯笼化成暖橙的光斑；宝蓝、赤红与暖橙三色撞色，整体呈厚涂油画质感的东方妖市疾行，鲜活而急促。","zmf_name":"疾行过市","zmf_batch":45,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s04.webp","id":"ZS-060"},{"bv":"BV1b9eV6VEqW","scene":5,"series":"妖都浮生","title":"鹊桥赴宴","pal":"妖夜橙","who":"无人物","comp":"大景，巨桥横贯","motion":"桥上人往来/花轿/绸幔","special":"跨城巨桥","note":"巨桥连起两座妖城，赴宴的队伍络绎","prompt_moss":"一座巨桥连接两座妖城，赴宴队伍络绎不绝。主光为暖光。","prompt_zmf":"横画幅中式幻想大场景，一座巨大的朱红金顶长桥横贯画面，连接起左右两座金碧辉煌的妖城：桥面上赴宴的队伍络绎不绝，桥下的广场上摆开千桌宴席，红绸飞舞，白牛的巨雕立在城门口。\n\n长桥为朱红色的桥身，桥栏上每隔数步就立着一座金色的灯柱，灯柱间拉起成串的红灯笼与杏黄的幡旗；桥面上的赴宴队伍络绎：抬着礼盒的仆从、乘轿的贵客、牵着瑞兽的侍者沿桥缓行，队伍的色彩缤纷。桥的两端各连着一座妖城：城门为多层的鎏金门楼，门楼上的飞檐层层叠起，城内的楼阁高矮错落，朱红的立柱与青灰的瓦顶铺满画面两侧，最高的塔楼挂着巨大的幡旗。\n\n桥下的广场上宴席如海：数百张宴桌铺满广场，桌上的灯火与食物连成一片暖色的人海，宴客的身影密密麻麻；广场的中央立着一座巨大的白色神牛雕像，牛首昂扬，雕像的基座上缠着红绸。数条巨大的红色绸带自城楼间飞舞横过画面，绸带的弧线在空中翻卷。主光为明亮的白昼天光与宴席灯火的暖光交织，照亮桥身的朱红、城楼的金顶与宴席的人海；城楼间的阴影呈暖褐色。\n\n空气中弥漫着庆典的彩带与浮尘，前景桥栏与赴宴队伍清晰，两城与宴席大海层层虚化；朱红、鎏金与青灰瓦顶三色交织，整体呈厚涂油画质感的东方双城宴庆奇观，盛大而热烈。","zmf_name":"鹊桥赴宴","zmf_batch":15,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s05.webp","id":"ZS-061"},{"bv":"BV1b9eV6VEqW","scene":6,"series":"妖都浮生","title":"红绸相理","pal":"红金撞色","who":"人物群","comp":"双人对坐，孔雀羽屏背景","motion":"红绸缠绕/羽屏微颤","special":"孔雀羽屏、红帐","note":"对坐理红绸的一对妖，羽屏如画","prompt_moss":"两名妖对坐互理红绸，孔雀羽屏为背景。主光为暖光。","prompt_zmf":"横画幅中式幻想人像场景，画面中央一对古装妖侣对坐，正在共同整理一条缠绕两人的正红色长绸：左侧一位头顶鹿角的男妖执绸的一端，右侧一位背生鎏金羽屏的女妖执另一端，两人相视而笑。\n\n男妖乌黑长发束成高髻，发间生出一对雄伟的灰褐色鹿角，角上挂着几枚小小的铜铃；他身着宝蓝与月白织锦的宽袖长袍，衣缘滚金边，指节分明的双手正捋平绸面，笑意爽朗。女妖乌黑长发挽成古典发髻，鬓边垂着金饰；她身着乳白与正红相间的织锦襦裙，身后一对巨大的鎏金羽屏展开如画屏：羽面上是孔雀翎般的眼状斑纹，蓝绿与金色相间，羽缘的金属光泽流转；她低头含笑，指尖捻着绸带的一角。\n\n红绸自男妖的手中蜿蜒绕过两人的膝间，再穿入女妖的指间，绸面在光下泛着缎面的流光。背景为上元灯节的庙会：成排的红灯笼、杏黄的幡旗与彩灯自街道上空垂挂，人群的虚影往来，暖光融融。主光为庙会灯火的暖橙光与羽屏的金属反光，照亮两人的面部、绸面的缎光与羽纹的层次；暗部呈暖褐色。\n\n空气中漂浮着灯穗的流苏与光尘，前景红绸的缎面纹理与两人交叠的手清晰，背景灯会没入焦外化作光斑；正红、宝蓝与鎏金三色交织，整体呈厚涂油画质感的东方妖侣日常，亲昵而华美。","zmf_name":"对坐理红绸","zmf_batch":10,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s06.webp","id":"ZS-062"},{"bv":"BV1b9eV6VEqW","scene":7,"series":"妖都浮生","title":"狼父喂崽","pal":"红金撞色","who":"动物","comp":"帐内双人互动","motion":"蒸汽/崽扑食/须发","special":"白狼妖父子","note":"白狼妖帐中喂崽，凶相温柔","prompt_moss":"一名白狼妖帐中喂崽，凶相温柔。主光为暖光。","prompt_zmf":"横画幅中式幻想温情场景，帐幕之内，一位白毛狼首的狼父坐在铺着红毯的座榻上，双手端着一只巨大的陶碗，低头喂一只站在小凳上的狼崽，狼崽前爪扒着碗沿仰头够食，凶悍的狼首透着温柔。\n\n狼父的头部为白色的狼首，口鼻修长，唇边微微咧开露出温柔的弧度，金色的眼睛低垂着注视狼崽；他的头顶戴着一顶鎏金的冠冕，颈间围着蓝色的织锦领巾，身上披着红蓝织锦的宽袍，袍面上织满金色的团花纹样；他的双臂覆着蓬松的白色长毛，毛尖在灯光下泛着暖光，两只巨大的毛爪稳稳托着碗。\n\n狼崽只有狼父的手掌大，浑身覆盖着奶白色的绒毛，尖尖的耳朵竖起，黑色的鼻头湿润；它站在一只矮小的木凳上，前爪扒住碗沿，仰着头把脸凑进碗里，尾巴兴奋地翘起。碗中的肉汤冒着热气，汤面的油光映着灯影。\n\n帐内的陈设温暖：铺着红色织锦的座榻与地毯，矮桌上摆着陶壶、碗盏与一盘果子，帐顶垂着流苏的帷幔；背景的帐帘半开，帘外隐约可见帐营的篝火光。主光为帐内灯火与篝火的暖橙光，自左侧照亮狼父的白毛、狼崽的绒毛与织锦的纹样，毛发的边缘泛着金色的轮廓光；帐内深处暗部呈暗红褐色，占约三成。\n\n空气中弥漫着汤的热气与帐内的浮尘，前景狼崽扒碗的姿态与父狼低垂的眼神清晰，背景陈设虚化；乳白、暖橙与织锦的红蓝三色交织，整体呈厚涂油画质感的东方狼帐喂崽，凶萌与温柔并存。","zmf_name":"狼父喂崽","zmf_batch":13,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s07.webp","id":"ZS-063"},{"bv":"BV1b9eV6VEqW","scene":8,"series":"妖都浮生","title":"火中举杯","pal":"红金撞色","who":"人物","comp":"人物居中，火环包裹","motion":"火舌环绕不伤身/围观妖影/杯中酒光","special":"浴火不侵","note":"少女坐在火里举杯，火是她的披风","prompt_moss":"一名少女盘坐火焰中央举杯自若饮酒，火如披风。主光为火光。","prompt_zmf":"横画幅中式幻想宴饮场景，画面中央一位华服的少女坐在火焰的中央举杯畅饮，火焰如她的披风自她的肩头升起环绕她的周身；她的四周，群妖围坐宴席：羊角的老妖举箸、熊形的巨妖捧碗、狸猫的小妖偷嘴，宴席的桌上摆满金器与佳肴。\n\n少女乌黑长发垂落，发间的金饰与红绳鲜亮，她的双目轻阖，仰头举杯的姿态豪迈，杯中的酒液泼洒出几滴；她身着金红织锦的华服，衣料上金线的纹样华丽，肩头的白色纱披自肩后铺展在宴席上；环绕她的火焰为橙金色的火裙：火苗自她的肩头与裙摆升起，火焰的形态如披风般环绕她的周身，火焰的中心炽白，外缘橙红，火星自火裙的边缘飞散。\n\n她四周的群妖宴席热闹：左侧的羊角老妖身着红袍举箸夹菜，神情陶醉；右侧的熊形巨妖捧着海碗畅饮，它的绒毛在火光下泛着金褐；狸猫的小妖趴在桌沿偷吃盘中的点心；桌上的金器与菜肴堆成小山：金杯、玉盘与成串的果子。宴席的背景为朱红的殿宇与彩绘的梁柱，梁柱间挂着金色的装饰与灯笼。主光为环绕火焰的橙金光与宴席的灯火交织，照亮少女的举杯、群妖的毛绒与金器的反光；宴席的暗部呈红褐色。\n\n空气中弥漫着火星与酒气，前景火中举杯的少女与四周的群妖宴席层次分明；橙金火裙、金红织锦与群妖的斑斓毛色对撞，整体呈厚涂油画质感的东方火中举杯，豪迈而奇幻。","zmf_name":"火中举杯宴群妖","zmf_batch":36,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s08.webp","id":"ZS-064"},{"bv":"BV1b9eV6VEqW","scene":9,"series":"妖都浮生","title":"酣宴横陈","pal":"红金撞色","who":"人物群","comp":"大景横构图群像","motion":"酒壶传递/鼾起肚伏/灯串","special":"宴席全景","note":"宴至酣处，群妖横七竖八躺满一地","prompt_moss":"宴至酣处群妖横七竖八躺满一地。主光为暖光。","prompt_zmf":"横画幅中式幻想宴饮大场景，宴至酣处，满堂的群妖横七竖八地躺卧在大堂的各处酣笑：有的趴在桌上，有的躺在长凳，有的抱酒坛而眠，一位白狐妖举着酒碗大笑，中央的虎妖抱着酒坛醉卧，堂上的宾客们拍案叫好。\n\n大堂为妖宴的华丽殿宇：朱红的立柱与金色的藻井高阔，藻井的中央垂着巨大的红色纱幔，纱幔自殿顶如瀑垂落；堂中的宴桌上摆满酒坛、金杯与成盘的菜肴，酒坛的封泥被拍开，酒液泼洒在案上。群妖的姿态各异：白狐妖立在桌旁举碗豪饮，狐狸的脸笑得见牙不见眼；虎形的巨妖抱着酒坛醉卧在长凳上，四肢摊开，鼾声与笑声齐飞；兔耳的小妖趴在桌沿打盹；其余的妖宾客或拍案、或起哄、或相互灌酒，满堂的笑浪此起彼伏。\n\n堂内的陈设华丽：金色的烛台与宫灯沿立柱排开，烛光与灯影交织；堂侧的 window 透进天光，光柱照亮浮动的酒气与尘埃。主光为宴堂的暖金灯火，自上方与四壁漫射，照亮群妖的毛绒质感、酒坛的陶光与纱幔的红色；堂内的暗部呈红褐色。\n\n空气中弥漫着酒气与大笑的热浪，前景白狐妖举碗的大笑与醉卧的虎妖清晰，满堂的群妖层次分明；正红纱幔、鎏金烛台与群妖的斑斓毛色对撞，整体呈厚涂油画质感的东方酣宴横陈，欢乐而豪迈。","zmf_name":"酣宴横陈笑满堂","zmf_batch":34,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s09.webp","id":"ZS-065"},{"bv":"BV1b9eV6VEqW","scene":10,"series":"妖都浮生","title":"穿灯引线","pal":"红金撞色","who":"人物","comp":"前景框(糖球串)+纵深","motion":"糖球串晃/灯影/裙摆","special":"糖球灯串棚","note":"穿行在糖球与灯串搭成的长廊里","prompt_moss":"一名少女穿行糖球与灯串搭成的长廊。主光为暖光。","prompt_zmf":"横画幅中式幻想宴庆场景，画面中央一位白裙的少女手执一只盛着蜜酒的高脚琉璃盏，正穿行在一条由糖葫芦串与灯串搭成的长廊里，长廊的顶上悬着成串的彩色花球灯，灯球如花树般垂落。\n\n少女乌黑长发挽成双环的髻，发间插着白色的绢花；她身着月白色与鹅黄相间的广袖纱裙，肩头的披帛垂落，裙摆铺展在长廊的地面上；她微微低头，唇角含笑，右手执着的琉璃盏中蜜酒的金黄映着灯光，盏壁的气泡清晰；她的左手提着裙摆，姿态轻盈地穿过长廊。\n\n长廊的两侧与顶部由无数串糖葫芦与灯串交织搭成：一串串鲜红的糖葫芦自廊顶垂下，糖壳在光下亮晶晶的；灯串间点缀着拳头大的彩色花球灯，花球为粉、青、橙、白多色的绢花扎成，花球灯自廊顶层层垂落如倒挂的花树，灯球的光把整条长廊照得通明。长廊的地面上铺着红毯，廊柱上缠着金色的绸带。背景为宴会的广场：金色的龙形雕塑盘在背景中央，四周的宴桌摆满食物，宾客的身影在灯海中往来，正红与金的装饰铺满视野。主光为花球灯的多彩自发光与宴场的暖金光，自上方照亮少女的白裙、糖壳的亮泽与花球的花瓣层次；长廊尽头的暗部呈暖褐色。\n\n空气中弥漫着糖霜的甜雾与灯球的流苏，前景少女执盏穿行的姿态与垂落的糖串清晰，长廊纵深层层虚化；乳白裙身、多彩花球灯与正红糖串对撞，整体呈厚涂油画质感的东方糖灯长廊，甜暖而梦幻。","zmf_name":"糖灯长廊","zmf_batch":17,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s10.webp","id":"ZS-066"},{"bv":"BV1b9eV6VEqW","scene":11,"series":"妖都浮生","title":"鼠妖鼓腮","pal":"红金撞色","who":"动物","comp":"特写居中","motion":"腮帮咀嚼/耳朵抖","special":"仓鼠妖","note":"仓鼠妖塞了满腮点心，呆萌看镜头","prompt_moss":"一只仓鼠妖塞满腮帮点心呆萌看镜头。主光为暖光。","prompt_zmf":"横画幅中式幻想市井大场景，画面右侧一只体型巨大的花背仓鼠妖趴在楼台的木栏杆上，两腮塞得鼓鼓的，嘴里还叼着一条小鱼干，圆眼睛直望镜头，呆萌憨态；它的下方是喧腾鼎沸的妖市宴席。\n\n仓鼠妖的体型比楼下的人类大出数倍：灰黑白三色相间的长绒毛蓬松油亮，圆耳朵支棱着，腮帮鼓成两个球，把整张脸撑得圆圆的；它的黑亮小眼睛直视镜头，嘴边叼着的小鱼干还垂着尾巴；两只前爪搭在朱红的栏杆上，把栏杆压得微微下弯，爪下还踩着一碟没吃完的点心。\n\n楼下的宴市铺满画面下半部：成群的妖物围坐在长案边大快朵颐，有举杯的、划拳的、抢食的，桌上的果盘与酒坛琳琅满目；市井的屋顶上红绸与灯笼层层垂挂，幡旗上的金字在灯下闪亮。远处街市人潮如织，纵深里灯火连绵。主光为宴市的暖橙灯火与白昼天光交织，照亮仓鼠妖的绒毛边缘、红栏杆的漆色与宴席的菜色；画面的暗部呈暖褐色。\n\n空气中弥漫着食物的香气与喧闹的光斑，前景仓鼠妖的鼓腮与直视镜头的神态清晰，宴席人海层层虚化；灰黑绒毛、朱红栏杆与满目灯彩三色交织，整体呈厚涂油画质感的东方鼠妖看市，憨萌而鼎沸。","zmf_name":"鼠妖鼓腮看市","zmf_batch":37,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s11.webp","id":"ZS-067"},{"bv":"BV1b9eV6VEqW","scene":12,"series":"妖都浮生","title":"阶前回望","pal":"红金撞色","who":"人物/妖","comp":"人物居中，殿门背景","motion":"巨尾扫/裙摆/阶上人","special":"字幕、大狐尾","note":"上阶回望一声「好」，狐尾扫过镜头前","prompt_moss":"一名狐女上台阶回望，大尾扫过镜头前。主光为暖光。","prompt_zmf":"横画幅中式幻想人像场景，画面中央一位蓝白织锦华服的狐妖少女沿金色的台阶上阶而行，行至半途回望镜头方向，笑容明媚，一条橙红色的巨大狐尾自她的身后扫过镜头前景，狐尾的绒毛虚化成一片暖色的前景。\n\n少女乌黑长发挽成古典的髻，发间插着金色的步摇与赤红的狐耳竖立在发间；她回眸的笑意明亮，眼尾弯起，唇色朱红，眼神里带着一声轻快的应答。她身着蓝白织金的广袖华服：衣身的宝蓝织锦上金线的团纹华丽，乳白色的裙摆层叠，腰间束着红色的锦带垂着长穗；她一手提着裙摆上阶，一手向后轻扬，身后的橙红色狐尾蓬松巨大，自她身后向镜头的方向扫来，尾毛的绒感在前景虚化成一片暖橙的色海。\n\n金色的台阶为鎏金的石阶，石阶的两侧立着鎏金的栏杆与兽首柱头，台阶的顶端是一座巨大的朱红宫门，门楼的金顶与彩绘的枋梁华丽；台阶的两侧挂满金色的幡旗与红灯笼，幡旗上的金字鲜艳。远景的城郭沿台阶向上铺展，人影往来如织。主光为明亮的白昼暖阳，从画面右上方照亮台阶的鎏金、她的织锦与狐尾的绒毛边缘；台阶的阴影呈暖褐色。\n\n空气中弥漫着庆典的浮絮与光尘，前景扫过镜头的狐尾虚化与回望的笑颜形成虚实对比，台阶纵深层层递进；宝蓝织金、橙红狐尾与鎏金台阶对撞，整体呈厚涂油画质感的东方金阶回望，明媚而华丽。","zmf_name":"金阶回望狐尾扫镜","zmf_batch":28,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s12.webp","id":"ZS-068"},{"bv":"BV1b9eV6VEqW","scene":13,"series":"妖都浮生","title":"入殿","pal":"红金撞色","who":"人物/妖","comp":"背影纵深，POV 跟拍","motion":"殿内人影/绸幔","special":"跟拍","note":"跟拍背影步入大殿","prompt_moss":"一名妖女背影拾级步入大殿。主光为暖光。","prompt_zmf":"横画幅中式幻想宫殿场景，跟拍视角：画面中央一位狐妖少女的背影正沿白玉台阶走向朱红大殿的殿门，全身背影入镜，人物居中，台阶自画面下缘向上延伸，透视纵深感强烈。\n\n少女乌黑长发挽成双环发髻，发间插着赤红色发饰；她身着月白与宝蓝织锦的宽袖长裙，裙摆上织满金银缠枝纹样，外披朱红色长帛，腰后一条巨大蓬松的橙红色狐尾垂拖至台阶，尾尖的乳白绒毛格外醒目。\n\n朱红大殿的殿门高敞，门内悬挂一盏巨大的圆形红灯笼，暖光从门内涌出，照亮台阶与她的裙摆边缘。台阶两侧是金色的雕花栏杆与成排的烛台，烛火点点。殿外广场上人群密集成海：数不清的小小行人身影涌动，上空挂满红灯笼与写着书法的杏黄色幡旗，幡旗成排延伸向画面两侧远处，左侧远处隐约可见另一座宫殿的金顶。\n\n主光为殿门内透出的暖橙光与广场灯笼光，自前方照亮她的背影轮廓与栏杆的金色雕花，人物边缘泛起金色轮廓光；广场两侧的廊柱阴影深沉，暗部呈暖褐色。空气中弥漫着浮动的人声光粒与尘埃，前景台阶的白玉纹理清晰，远景人群与幡旗没入焦外形成暖色的光斑海；朱红、织金与月白三色主导，整体呈厚涂油画质感的东方宫殿盛会，恢弘而喧闹。","zmf_name":"狐尾入殿","zmf_batch":3,"run":true,"image":"../images/scenes/BV1b9eV6VEqW/s13.webp","id":"ZS-069"},{"bv":"BV1b9eV6VEqW","scene":14,"series":"妖都浮生","title":"推门","pal":"红金撞色","who":"无人物","comp":"门缝推近","motion":"金门开启/光泄出","special":"鎏金大门","note":"鎏金大门推开，光从缝里涌出","prompt_moss":"鎏金大门推开，光从门缝涌出。主光为金光。","prompt_zmf":"横画幅中式幻想场景，跟拍视角：画面中央一位狐妖少女的背影正推开两扇巨大的鎏金大门，门缝中涌出明亮的白光，她站在门槛上正要迈入，人物居中，大门的宏伟尺度包裹全画。\n\n少女乌黑长发挽成繁复的高髻，发间插着银白与朱红的发饰；她身着宝蓝与月白织锦的宽袖长裙，裙摆的织金纹样华丽，肩后一条巨大蓬松的橙红色狐尾垂拖至地面，尾尖的乳白绒毛格外醒目。她双手前伸，正抵在左右两扇门板上，手臂用力，裙摆与狐尾被门槛内的风微微吹动。\n\n两扇大门为深褐色的木质门板，门板上鎏金的云雷纹与兽面铺首雕工繁复，金纹在暗处泛着沉沉的光；门轴上方悬挂着一盏巨大的圆形宫灯，暖光低垂。门缝中涌出的白光自中央放射，照亮她裙摆的边缘、狐尾的绒毛轮廓与门槛的石面；门外的广场白玉地面与远处的栏杆
